# spring-dotenv'in ayarları — YALNIZCA testlerde geçerli.
#
# Uygulama açılırken proje klasöründeki .env dosyasını okur (pom.xml'deki
# spring-dotenv). Testler de aynı klasörde çalıştığı için geliştiricinin .env'i
# testlere sızıyordu: MAIL_PROVIDER=brevo yazılınca testler sahte posta kutusu
# yerine gerçek Brevo'ya yöneldi ve kırıldı. Testler kimsenin kişisel ayarına
# bağlı olmamalı; olmayan bir dosya adı veriyoruz ki .env hiç okunmasın.
filename=.env.testlerde-okunmaz
ignoreIfMissing=true
