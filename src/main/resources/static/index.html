/** Doğrulama postasını yeniden ister. */
async function resendVerification() {
  const email = S.pendingEmail || $("em")?.value.trim();
  if (!email) { S.authError = msgKey("auth.err.emailFirst"); return renderAuth(); }

  S.busy = true; S.authError = ""; S.authOk = ""; renderAuth();
  try {
    const r = await api.resendVerification(email);
    S.authOk = r.message;
  } catch (e) {
    S.authError = e.message || msgKey("auth.err.sendFailed");
  }
  S.busy = false;
  renderAuth();
}

/**
 * Postadaki bağlantıyla gelindiyse jetonu karşılar.
 *
 * Bağlantı "/?verify=..." biçiminde; ayrı bir sayfa yerine giriş ekranının
 * kendisi karşılıyor, çünkü kullanıcının bir sonraki adımı zaten giriş yapmak.
 * Jeton işlendikten sonra adres çubuğundan siliniyor: sayfa yenilenince ikinci
 * kez gönderilmesin ve geçmişte kalmasın.
 */
async function consumeVerifyLink(token) {
  history.replaceState(null, "", location.pathname);
  S.authMode = "login"; S.busy = true; renderAuth();
  try {
    const r = await api.verifyEmail(token);
    S.authOk = r.message;
  } catch (e) {
    S.authError = e.message || msgKey("auth.err.verifyFailed");
    S.showResend = true;
  }
  S.busy = false;
  renderAuth();
}

async function submitAuth() {
  const reg = S.authMode === "register";
  // Değerler DOM'dan değil durumdan okunur. Aşağıdaki "bekleniyor" çizimi formu
  // yeniden kurar; ondan sonra alanlara bakmak boş değer okumak demekti — kayıt,
  // doldurulmuş ad ve soyadı sunucuya boş gönderiyordu.
  // İlk iş alanları bir kez daha okumak: tarayıcının otomatik doldurduğu değer
  // her zaman "input" olayı tetiklemez.
  ["fn", "ln", "em", "pw"].forEach((id) => { const el = $(id); if (el) S.form[id] = el.value; });
  const f = S.form;
  const firstName = f.fn.trim(), lastName = f.ln.trim();
  const email = f.em.trim(), password = f.pw;

  if (reg && (!firstName || !lastName)) { S.authError = msgKey("auth.err.nameRequired"); return renderAuth(); }
  if (!email || !password) { S.authError = msgKey("auth.err.credentialsRequired"); return renderAuth(); }
  if (reg && password.length < 8) { S.authError = msgKey("auth.err.passwordShort"); return renderAuth(); }

  S.busy = true; S.authError = ""; S.authOk = ""; S.showResend = false; renderAuth();
  try {
    if (reg) {
      // Kayıt oturum açmaz: hesap doğrulanana kadar pasif.
      await api.register({ firstName, lastName, email, password });
      track("signup");   // yalnızca olayın adı; e-posta ya da ad gönderilmez
      S.pendingEmail = email; S.authMode = "sent"; S.busy = false;
      S.form = { fn: "", ln: "", em: email, pw: "" };
      return renderAuth();
    }

    signedIn(await api.login(email, password));
  } catch (e) {
    S.busy = false;
    S.authError = e.message || msgKey("auth.err.loginFailed");
    // Doğrulanmamış hesap: kullanıcıyı çıkmazda bırakmayalım, yeni bağlantı sunalım.
    if (e.status === 403) { S.pendingEmail = email; S.showResend = true; }
    renderAuth();
  }
}

/**
 * Giriş yanıtı geldi (şifreyle ya da Google'la): oturumu kur, ana ekrana geç.
 *
 * Dil: hesabın kayıtlı tercihi. Kişi giriş yapmadan önce bu sekmede dil
 * düğmesine bastıysa o seçim daha yeni: hesaba yazılır (ADR 0020).
 */
function signedIn(r) {
  setTokens({ accessToken: r.accessToken, refreshToken: r.refreshToken });
  S.me = r.user;
  const picked = takePickedLocale();
  if (picked && picked !== S.me.locale) {
    S.me = { ...S.me, locale: picked };
    api.updateProfile({ locale: picked }).catch(() => { /* bir sonraki seçimde yeniden denenir */ });
  }
  if (S.me.locale) setLocale(S.me.locale);
  persistSession();
  S.busy = false; S.authError = ""; S.authOk = "";
  S.form = { fn: "", ln: "", em: "", pw: "" };   // şifre bellekte kalmasın
  startInbox();
  goHome().then(openPendingTarget);   // postadaki kart bağlantısıyla gelindiyse kartı aç
}

/** Google dönüşündeki hata anahtarı (cancelled / email_unverified / failed) → ekrandaki mesaj. */
const oauthError = (code) => msgKey(has("auth.oauth." + code) ? "auth.oauth." + code : "auth.oauth.failed");

/**
 * Google'dan dönüş. Sunucu jetonları adres çubuğuna koymaz: tek kullanımlık,
 * 60 saniyelik bir kod verir; kod burada jetonlarla değiştirilir ve adresten silinir.
 */
async function finishOAuth(code) {
  S.view = "auth"; S.authMode = "login"; S.busy = true; renderAuth();
  try {
    signedIn(await api.oauthExchange(code));
  } catch (e) {
    S.busy = false; S.authError = e.message || oauthError("failed");
    renderAuth();
  }
}

/** Sunucuda açık olan dış giriş yolları; giriş ekranındaki Google düğmesi buna göre çıkar. */
async function loadProviders() {
  if (typeof api.authProviders !== "function") return;
  try {
    const r = await api.authProviders();
    S.providers = (r.providers || []).map((p) => p.id);
    if (S.providers.length && S.view === "auth" && (S.authMode === "login" || S.authMode === "register")) renderAuth();
  } catch (_) { /* ikincil: düğme çıkmaz, e-postayla giriş çalışır */ }
}

/**
 * Kişinin kendi "Çıkış yap"ı (ADR 0025). Oturum SUNUCUDA da kapanır: yalnızca
 * tarayıcıdaki depo silinseydi, refresh token'ı daha önce kopyalamış biri 30 gün
 * boyunca girmeye devam ederdi. Sunucuya ulaşılamazsa da yerel çıkış yapılır.
 * logout() ayrıca oturum zaten bitmişken (başka sekmede çıkış, süre dolması)
 * çağrılır; o durumlarda sunucuya gidecek bir şey yok.
 */
function signOut() {
  const { refreshToken } = getTokens();
  if (refreshToken) api.logout(refreshToken).catch(() => {});
  logout();
}

function logout() {
  closePops(); closePalette();
  stopInbox();
  S.me = null;   // önce: jeton temizliği oturumu yeniden kalıcı depoya yazmasın
  ADM.owner = null; ADM.data = null;   // yönetim panelinin e-posta listesi bellekte kalmasın
  localStorage.removeItem("cb_session");
  setTokens({ accessToken: null, refreshToken: null });
  S.rt && S.rt.close(); S.rt = null;
  S.me = null; S.view = "auth"; S.authError = "";
  renderAuth();
}

/* ── Tema ── */
const isLight = () => document.documentElement.dataset.theme === "light";

/**
 * Koyu tema varsayılan; seçim tarayıcıda saklanır. Bileşenler yalnızca renk
 * değişkenlerini kullandığı için tema değişince ekran yeniden çizilmez.
 */
function toggleTheme() {
  const light = !isLight();
  if (light) document.documentElement.dataset.theme = "light";
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("cb_theme", light ? "light" : "dark"); } catch (_) {}
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", light ? "#f2f6fb" : "#0A0C10");
  const b = $("themeBtn");
  if (b) { b.innerHTML = light ? I.moon : I.sun; b.setAttribute("aria-label", t(light ? "theme.toDark" : "theme.toLight")); }
}

/* ── Dil (ADR 0020) ──
 * TR / EN düğmesi giriş ekranında, hesap menüsünde ve profilde. Tanıtım
 * sayfasındakini landing.js kendisi dinler. Seçim o anki ekranı yeniden çizer:
 * sayfa yenilenmez, yazılmış alanlar yerinde kalır. Giriş yapılmışsa tercih
 * hesaba kaydedilir; postalar da bundan sonra bu dilde gider. */
document.addEventListener("click", (e) => {
  const b = e.target.closest(".lang-sw [data-lang]");
  if (b && !b.closest(".lp")) changeLocale(b.dataset.lang, !!b.closest(".pop"));
});

async function changeLocale(next, fromMenu = false) {
  if (next === locale()) return;
  closePops(); closePalette();
  const signedIn = !!S.me;
  setLocale(next, { pick: !signedIn });
  rerender();
  // Klavyeyle gelen kişi kaldığı yerden devam etsin.
  (fromMenu ? $("userBtn") : document.querySelector(`.lang-sw [data-lang="${next}"]`))?.focus();
  if (!signedIn) return;
  S.me = { ...S.me, locale: next }; persistSession();
  try {
    S.me = await api.updateProfile({ locale: next });
    persistSession();
  } catch (err) { toast(t("lang.saveFailed"), err.message, "err"); }
}

/** O anki ekranı yeni dille yeniden çizer; yazılmış alanlar ve odak korunur. */
function rerender() {
  const fields = [...document.querySelectorAll("#app input[id], #app textarea[id], #app select[id]")]
    .filter((el) => el.type !== "file").map((el) => [el.id, el.value]);
  const focused = document.activeElement?.id;
  if (S.view === "auth") renderAuth();
  else if (S.view === "home") renderHome();
  else if (S.view === "profile") renderProfile();
  else if (S.view === "admin") renderAdmin();
  else if (S.view === "board") renderBoard();
  else return;
  for (const [id, value] of fields) {
    const el = document.getElementById(id);
    if (el && el.value !== value) { el.value = value; el.dispatchEvent(new Event("input", { bubbles: true })); }
  }
  if (focused) document.getElementById(focused)?.focus();
}

/* ── Alan seçici ve "+ Yeni" menüsü ── */

function renderOnlinePill() {
  const box = $("onlinePill"); if (!box) return;
  const d = ovData();
  if (!d) { box.innerHTML = ""; return; }
  const people = onlinePeople(d);
  box.innerHTML = people.length
    ? `<div class="online-pill" title="${esc(t("topbar.onlineTitle", { names: people.map((p) => p.name).join(", ") }))}">
        <span class="av-stack">${people.slice(0, 3).map((p) => avatar(p.name, 24, "", p.avatarUrl)).join("")}</span>${t("topbar.online", { count: people.length })}</div>`
    : "";

function onlinePeople(d) {
  const seen = new Map();
  (d.liveBoards || []).forEach((b) => b.people.forEach((p) => seen.set(p.userId, p)));
  (d.team || []).filter((t) => t.online && !seen.has(t.userId)).forEach((p) => seen.set(p.userId, p));
  return [...seen.values()];
}

/** Açılır pencere: düğmenin altına (sağ ya da sol kenarına) hizalanır, dışarı tıklanınca kapanır. */
function openPop(anchor, cls, html, align = "right") {
  closePops();
  const r = anchor.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "pop " + cls;
  el.style.top = (r.bottom + 8) + "px";
  if (align === "left") el.style.left = Math.max(12, r.left) + "px";
  else el.style.right = Math.max(12, innerWidth - r.right) + "px";
  el.innerHTML = html;
  document.body.appendChild(el);
  const outside = (e) => { if (!el.contains(e.target) && !anchor.contains(e.target)) closePops(); };
  setTimeout(() => document.addEventListener("mousedown", outside), 0);
  S.popCleanup = () => document.removeEventListener("mousedown", outside);
  return el;
}
function closePops() {
  document.querySelectorAll(".pop").forEach((n) => n.remove());
  S.popCleanup && S.popCleanup(); S.popCleanup = null;
}

/* ── Bildirimler ─────────────────────────────────────────────────────── */

/** Bildirim cümlesi: türünden, arayüzün dilinde. Kişi, pano ve kart adı koyu ve kaçışlanmış. */
function notifText(n) {
  const strong = (s) => `<strong>${esc(s)}</strong>`;
  if (!has("notif." + n.type)) return "";
  return t("notif." + n.type, {
    who: strong(n.actorName || t("common.someone")),
    board: strong(n.boardName || t("common.deletedBoard")),
    card: strong(n.cardTitle || t("common.deletedCard")),
    role: strong(n.role ? roleAs(n.role) : ""),
    detail: strong(n.detail || ""),
  });
}

/** Yorum bildirimi: tıklanınca pano ve kart açılır. */
const isCardNotif = (n) => n.type === "COMMENT_MENTION" || n.type === "CARD_COMMENT";

/** Kanal bildirimi durdu (ADR 0023): tıklanınca pano ve kanal ayarları açılır. */
const isHookNotif = (n) => n.type === "CHAT_HOOK_DISABLED";

async function openHooksFromNotif(n) {
  closePops();
  if (!n.boardId) return toast(t("notif.boardMissing"), t("notif.maybeDeleted"), "warn");
  await openBoard(n.boardId);
  if (S.view === "board" && S.board?.id === n.boardId && isOwner()) openChatHooks();
}

/** Bildirimden karta git: panoyu açar, kartın penceresini yorumlara kaydırarak açar. */
function openCardFromNotif(n) {
  closePops();
  if (!n.boardId) return toast(t("notif.boardMissing"), t("notif.maybeDeleted"), "warn");
  if (!n.cardId) toast(t("notif.cardDeleted"), n.cardTitle || "", "warn");
  openBoard(n.boardId, { openCard: n.cardId });
}

function toggleNotifPanel() {
  if (document.querySelector(".notif-pop")) return closePops();
  openPop($("bellBtn"), "notif-pop", "");
  renderNotifPanel();
  if (!S.notif.loaded) loadNotifications();
  // Bilgi bildirimleri görülünce okundu sayılır; davetler ise yanıtlanana kadar bekler.
  S.notif.items.filter((n) => !n.read && n.type !== "BOARD_INVITE").forEach((n) => {
    n.read = true; S.notif.unread = Math.max(0, S.notif.unread - 1);
    api.markNotificationRead(n.id).catch(() => {});
  });
  updateBell();
}

function renderNotifPanel() {
  const el = document.querySelector(".notif-pop"); if (!el) return;
  const items = S.notif.items;
  el.innerHTML = `<div class="notif-head"><b>${t("common.notifications")}</b>${S.notif.unread ? `<a id="readAll">${t("notif.markAllRead")}</a>` : ""}</div>
    <div class="notif-list">${S.notif.error ? `<div class="notif-empty">${I.warnCircle}<b>${t("notif.loadFailed")}</b>
        ${t("notif.checkConnection")} <a id="notifRetry">${t("common.retry")}</a></div>`
      : !S.notif.loaded ? `<div class="notif-empty">${t("common.loading")}</div>`
      : items.length ? items.map(notifRow).join("")
      : `<div class="notif-empty">${I.bellBig}<b>${t("notif.empty")}</b>${t("notif.emptyHint")}</div>`}</div>`;

  el.querySelector("#readAll")?.addEventListener("click", async () => {
    S.notif.items.forEach((n) => { n.read = true; }); S.notif.unread = 0;
    updateBell(); renderNotifPanel();
    api.markAllNotificationsRead().catch(() => {});
  });
  el.querySelector("#notifRetry")?.addEventListener("click", () => { S.notif.error = false; renderNotifPanel(); loadNotifications(); });
  el.querySelectorAll("[data-inv]").forEach((b) => b.addEventListener("click", () =>
    respondInvite(Number(b.dataset.inv), b.dataset.a === "ok")));
  el.querySelectorAll("[data-open]").forEach((a) => a.addEventListener("click", () => {
    closePops(); openBoard(Number(a.dataset.open));
  }));
  el.querySelectorAll("[data-nid]").forEach((row) => {
    const go = () => {
      const n = S.notif.items.find((x) => x.id === Number(row.dataset.nid));
      if (n) (isHookNotif(n) ? openHooksFromNotif(n) : openCardFromNotif(n));
    };
    row.addEventListener("click", go);
    row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

function notifRow(n) {
  let extra = "";
  if (n.type === "BOARD_INVITE") {
    if (n.invitationStatus === "PENDING") {
      extra = `<div class="acts">
        <button class="btn btn-primary btn-sm" data-inv="${n.invitationId}" data-a="ok">${I.check} ${t("common.accept")}</button>
        <button class="btn-ghost btn-sm" data-inv="${n.invitationId}" data-a="no">${t("common.decline")}</button></div>`;
    } else if (n.invitationStatus === "ACCEPTED") {
      extra = `<div class="done">${t("notif.accepted")}${n.boardId ? ` · <a data-open="${n.boardId}">${t("notif.goToBoard")}</a>` : ""}</div>`;
    } else if (n.invitationStatus === "DECLINED") {
      extra = `<div class="done">${t("notif.declined")}</div>`;
    } else if (n.invitationStatus === "CANCELLED") {
      extra = `<div class="done">${t("notif.withdrawn")}</div>`;
    }
  }
  // Yorum bildirimi satırın tamamıyla tıklanır; altında pano adı. Kanal bildirimi kanal ayarlarını açar.
  const card = isCardNotif(n), link = card || isHookNotif(n);
  const attrs = link ? ` data-nid="${n.id}" role="button" tabindex="0"` : "";
  const where = card && n.boardName ? `${esc(n.boardName)} · ` : "";
  const face = isHookNotif(n) ? `<span class="notif-sys" aria-hidden="true">${I.hook}</span>`
    : avatar(n.actorName || "?", 32, "", n.actorAvatarUrl);
  return `<div class="notif${n.read ? "" : " unread"}${link ? " link" : ""}"${attrs}>${face}
    <div style="min-width:0;flex:1"><div class="tx">${notifText(n)}</div><div class="tm">${where}${relTime(n.createdAt)}</div>${extra}</div></div>`;
}

async function loadNotifications(showPending = false) {
  S.notif.error = false;
  try {
    const r = await api.notifications(30);
    S.notif = { items: r.items, unread: r.unreadCount, loaded: true };
    updateBell(); renderNotifPanel();
    // Ana ekrandaysa bekleyen davetleri tepedeki şerit zaten gösteriyor; köşe kutusu tekrar olurdu.
    if (showPending && S.view !== "home") {
      r.items.filter((n) => n.type === "BOARD_INVITE" && n.invitationStatus === "PENDING").forEach(showInviteToast);
    }
  } catch (_) {
    // Bildirimler ikincil: ekran bozulmaz, hata yalnızca panelin içinde söylenir.
    S.notif.error = true; renderNotifPanel();
  }
}

/**
 * Davet kutusu (sağ alt). Bilgi toast'larından farklı olarak kendiliğinden
 * kapanmaz: davet bir karar bekliyor. Kapatılırsa zilde beklemeye devam eder.
 */
function showInviteToast(n) {
  if (S.dismissedInvites.has(n.invitationId)) return;
  if (document.querySelector(`.toast.invite[data-inv="${n.invitationId}"]`)) return;
  if (document.querySelectorAll(".toast.invite").length >= 3) return;   // fazlası zilde

  const el = document.createElement("div");
  el.className = "toast invite"; el.dataset.inv = n.invitationId;
  el.innerHTML = `<div class="row">${avatar(n.actorName || "?", 30, "", n.actorAvatarUrl)}
      <div style="min-width:0"><b>${t("notif.inviteTitle")}</b><span>${notifText(n)}</span></div>
      <button class="icon-btn x" title="${t("notif.decideLater")}">${I.close}</button></div>
    <div class="acts">
      <button class="btn btn-primary btn-sm" data-a="ok">${I.check} ${t("common.accept")}</button>
      <button class="btn-ghost btn-sm" data-a="no">${t("common.decline")}</button></div>`;
  el.querySelector(".x").onclick = () => { S.dismissedInvites.add(n.invitationId); el.remove(); };
  el.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => {
    el.querySelectorAll("button").forEach((x) => { x.disabled = true; });
    respondInvite(n.invitationId, b.dataset.a === "ok");
  }));
  $("toasts").appendChild(el);
}
const removeInviteToast = (id) =>
  document.querySelectorAll(`.toast.invite[data-inv="${id}"]`).forEach((n) => n.remove());

async function respondInvite(invitationId, accept) {
  try {
    if (accept) {
      const r = await api.acceptInvitation(invitationId);
      setInviteStatus(invitationId, "ACCEPTED", r.boardId);
      toast(t("notif.joined"), `${r.boardName} · ${roleName(r.role)}`, "ok",
        { label: t("notif.openBoard"), fn: () => openBoard(r.boardId) });
      refreshBoardList();
    } else {
      await api.declineInvitation(invitationId);
      setInviteStatus(invitationId, "DECLINED");
      toast(t("notif.inviteDeclined"));
    }
  } catch (e) {
    removeInviteToast(invitationId);
    toast(t("notif.answerFailed"), e.message, "err");
    loadNotifications();   // durum değişmiş olabilir (ör. gönderen geri çekmiş)
  }
}

/** Bir davetin durumunu her yerde günceller: zil listesi, rozet, sağ alttaki kutu. */
function setInviteStatus(invitationId, status, boardId) {
  S.notif.items.forEach((n) => {
    if (n.invitationId !== invitationId || n.type !== "BOARD_INVITE") return;
    if (!n.read) { n.read = true; S.notif.unread = Math.max(0, S.notif.unread - 1); }
    n.invitationStatus = status;
    if (boardId) n.boardId = boardId;
  });
  removeInviteToast(invitationId);
  updateBell(); renderNotifPanel();
}

/** Kişisel kanaldan gelen olay. */
function onInboxEvent(ev) {
  if (ev.type === "INVITATION_RESOLVED") { setInviteStatus(ev.invitationId, ev.status); return; }
  if (ev.type !== "NOTIFICATION") return;
  const n = ev.notification;
  S.notif.items = [n, ...S.notif.items.filter((x) => x.id !== n.id)];
  if (!n.read) S.notif.unread++;
  updateBell(); renderNotifPanel();

  const who = n.actorName || t("common.someone"), board = n.boardName || "";
  if (n.type === "BOARD_INVITE") showInviteToast(n);
  else if (n.type === "INVITE_CANCELLED") {
    setInviteStatus(n.invitationId, "CANCELLED");
    toast(t("notif.withdrawn"), `${who} · ${board}`, "warn");
  } else if (n.type === "INVITE_ACCEPTED") toast(t("notif.inviteAccepted"), `${who} · ${board}`, "ok");
  else if (n.type === "INVITE_DECLINED") toast(t("notif.inviteDeclined"), `${who} · ${board}`);
  else if (isHookNotif(n)) toast(t("notif.hookStopped"), `${n.detail || ""} · ${board}`, "warn",
    { label: t("notif.reviewHooks"), fn: () => openHooksFromNotif(n) });
  else if (isCardNotif(n) && S.detail?.cardId !== n.cardId) {
    // O kartın penceresi zaten açıksa yorum gözünün önünde; ayrıca haber vermeye gerek yok.
    const open = { label: t("notif.openCard"), fn: () => openCardFromNotif(n) };
    if (n.type === "COMMENT_MENTION") toast(t("notif.mentionedYou", { who }), `${n.cardTitle || ""} · ${board}`, "", open);
    else toast(t("notif.commentOnAssigned"), `${who} · ${n.cardTitle || ""}`, "", open);
  }
}

function startInbox() {
  if (S.inbox) return;
  // Her (yeniden) bağlanmada liste tazelenir: kopukken gelen davetler kaçmasın.
  S.inbox = connectInbox({
    onEvent: onInboxEvent,
    onConnect: () => loadNotifications(true),
    onAuthLost: () => { logout(); toast(t("session.expired"), t("session.signInAgain"), "warn"); },
  });
}
function stopInbox() {
  S.inbox && S.inbox.close(); S.inbox = null;
  S.notif = { items: [], unread: 0, loaded: false };
  S.dismissedInvites.clear();
  document.querySelectorAll(".toast.invite").forEach((n) => n.remove());
}

        <div class="form-acts"><button class="btn btn-primary" id="pwSave">${t(noPw ? "profile.setPassword" : "profile.changePassword")}</button></div>
      </div></div>

    </div></div>
  </div>`;

  bindTopbar();
  $("back").onclick = goHome;
  renderProfileHero();

  const fn = $("pfFn"), ln = $("pfLn"), save = $("pfSave");
  const dirty = () => {
    const a = fn.value.trim(), b = ln.value.trim();
    save.disabled = !a || !b || (a === S.me.firstName && b === S.me.lastName);
  };
  fn.oninput = dirty; ln.oninput = dirty;
  save.onclick = async () => {
    save.disabled = true;
    try {
      S.me = await api.updateProfile({ firstName: fn.value.trim(), lastName: ln.value.trim() });
      persistSession();
      toast(t("profile.updated"), "", "ok");
      refreshMeEverywhere(); dirty();
    } catch (e) { toast(t("profile.saveFailed"), e.message, "err"); dirty(); }
  };

  $("pwSave").onclick = changePasswordFlow;
  ["pwCur", "pwNew", "pwNew2"].forEach((id) => $(id)?.addEventListener("keydown", (e) => { if (e.key === "Enter") changePasswordFlow(); }));

}

async function changePasswordFlow() {
  const noPw = S.me?.hasPassword === false;
  const cur = $("pwCur")?.value || "", nw = $("pwNew").value, nw2 = $("pwNew2").value;
  // Hata yerinde gösterilir; sayfa yeniden çizilmez (adda kaydedilmemiş değişiklik olabilir).
  const fail = (m) => {
    $("pwErr").innerHTML = `<div class="auth-err" style="margin-top:14px">${I.warnCircle}<span>${esc(m)}</span></div>`;
    $("pwSave").disabled = false;
  };
  if (!cur && !noPw) return fail(t("profile.err.currentRequired"));
  if (nw.length < 8) return fail(t("profile.err.newShort"));
  if (nw !== nw2) return fail(t("profile.err.mismatch"));
  if (cur && nw === cur) return fail(t("profile.err.same"));
  $("pwSave").disabled = true;
  try {
    await api.changePassword(cur, nw);   // yeni jeton çifti setTokens → persistSession ile kaydedilir
    if (noPw) {
      S.me = { ...S.me, hasPassword: true }; persistSession();
      toast(t("profile.passwordSet"), t("profile.passwordSetHint"), "ok");
      return renderProfile();
    }
    ["pwCur", "pwNew", "pwNew2"].forEach((id) => { $(id).value = ""; });
    $("pwErr").innerHTML = ""; $("pwSave").disabled = false;
    toast(t("profile.passwordChanged"), t("profile.passwordChangedHint"), "ok");
  } catch (e) { fail(e.message || t("profile.err.changeFailed")); }
}

/* ── Fotoğraf kırpma ── */

function openCropper(file) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return toast(t("photo.unsupported"), t("photo.pickType"), "err");
  if (file.size > 5 * 1024 * 1024) return toast(t("photo.tooLarge"), t("photo.max"), "err");
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => mountCropper(img, url);
  img.onerror = () => { URL.revokeObjectURL(url); toast(t("photo.openFailed"), t("photo.corrupt"), "err"); };
  img.src = url;
}

/**
 * Kare kırpma. Görsel sürüklenir ve yakınlaştırılır; yuvarlak maske, avatarın
 * nasıl görüneceğini gösterir. Sunucuya ham dosya değil, 256×256'lık sonuç
 * gider — hem küçük hem her yerde aynı oranda.
 */
function mountCropper(img, url) {
  const STAGE = 280, OUT = 256;
  const base = Math.max(STAGE / img.width, STAGE / img.height);   // kısa kenar sahneyi doldursun
  const st = { zoom: 1, x: 0, y: 0 };

  openModal(`<div class="modal" style="width:560px">
      <h3>${t("photo.title")}</h3>
      <p class="sub">${t("photo.hint")}</p>
      <div class="crop-wrap">
        <div>
          <div class="crop-stage" id="cropStage"><canvas id="cropCv" width="${STAGE}" height="${STAGE}"></canvas><div class="crop-mask"></div></div>
          <input type="range" class="zoom" id="cropZoom" min="1" max="3" step="0.01" value="1">
        </div>
        <div class="crop-side">
          <canvas id="pv96" width="96" height="96"></canvas>
          <canvas id="pv30" width="30" height="30"></canvas>
          <small style="color:var(--ink-3);text-align:center;max-width:120px">${t("photo.preview")}</small>
        </div>
      </div>
      <div class="acts">
        <button class="btn btn-primary" id="cropSave">${t("common.save")}</button>
        <button class="btn btn-ghost" id="close">${t("common.cancel")}</button>
      </div></div>`, (o) => {
    const cv = o.querySelector("#cropCv"), zoom = o.querySelector("#cropZoom");
    const close = () => { URL.revokeObjectURL(url); closeModal(); };

    const clamp = () => {
      const w = img.width * base * st.zoom, h = img.height * base * st.zoom;
      const mx = Math.max(0, (w - STAGE) / 2), my = Math.max(0, (h - STAGE) / 2);
      st.x = Math.min(mx, Math.max(-mx, st.x)); st.y = Math.min(my, Math.max(-my, st.y));
    };
    // Aynı dönüşüm her boyuttaki tuvale: sahne, önizlemeler ve çıktı birebir aynı kareyi gösterir.
    const paint = (canvas, size) => {
      const k = size / STAGE, s2 = base * st.zoom * k;
      const w = img.width * s2, h = img.height * s2;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (size - w) / 2 + st.x * k, (size - h) / 2 + st.y * k, w, h);
    };
    const redraw = () => { clamp(); paint(cv, STAGE); paint(o.querySelector("#pv96"), 96); paint(o.querySelector("#pv30"), 30); };

    let drag = null;
    const stage = o.querySelector("#cropStage");
    stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX - st.x, y: e.clientY - st.y }; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener("pointermove", (e) => { if (!drag) return; st.x = e.clientX - drag.x; st.y = e.clientY - drag.y; redraw(); });
    stage.addEventListener("pointerup", () => { drag = null; });
    stage.addEventListener("wheel", (e) => {
      e.preventDefault();
      st.zoom = Math.min(3, Math.max(1, st.zoom - e.deltaY * 0.0015)); zoom.value = st.zoom; redraw();
    }, { passive: false });
    zoom.oninput = () => { st.zoom = Number(zoom.value); redraw(); };

    o.querySelector("#close").onclick = close;
    o.querySelector("#cropSave").onclick = async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      const out = document.createElement("canvas"); out.width = OUT; out.height = OUT;
      paint(out, OUT);
      const blob = await toImageBlob(out);
      try {
        S.me = await api.uploadAvatar(blob); persistSession();
        close(); toast(t("photo.updated"), "", "ok");
        refreshMeEverywhere();
      } catch (err) { btn.disabled = false; toast(t("photo.uploadFailed"), err.message, "err"); }
    };
    redraw();
  });
}

/** WebP en küçüğü; tarayıcı WebP kodlayamıyorsa (PNG'ye düşer) JPEG'e geçilir. */
function toImageBlob(canvas) {
  return new Promise((resolve) => canvas.toBlob((b) => {
    if (b && b.type === "image/webp") return resolve(b);
    canvas.toBlob(resolve, "image/jpeg", 0.9);
  }, "image/webp", 0.9));
}

// Yalnızca site sahipleri (APP_ADMIN_EMAILS) görür: hesap menüsündeki giriş
// S.me.platformOwner'a bağlı, sunucu diğer herkese 404 der. Sayılar sunucuda
// hesaplanır, burada yalnızca çizilir. Veri hesaba bağlı bellekte durur ve
// çıkışta silinir (içinde kullanıcıların e-postaları var).

const ADM = { owner: null, data: null, loading: false, failed: false };
const admData = () => (ADM.owner === S.me?.email ? ADM.data : null);
const num = (n) => fmtNumber(Number(n) || 0);
const pct = (part, whole) => fmtNumber(whole ? part / whole : 0, { style: "percent", maximumFractionDigits: 0 });
/** "2026-10-26" → o günün yerel tarihi (new Date("2026-10-26") UTC sayar ve bir gün kayabilirdi). */
const admDay = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };

function goAdmin() {
  closePops(); closePalette();
  S.rt && S.rt.close(); S.rt = null;
  S.view = "admin";
  renderAdmin();
  loadAdmin();
}

async function loadAdmin() {
  const owner = S.me?.email;
  if (ADM.owner !== owner) { ADM.owner = owner; ADM.data = null; }
  ADM.loading = true; ADM.failed = false;
  renderAdminBody();
  try {
    const data = await api.adminDashboard();
    if (ADM.owner === owner) ADM.data = data;
  } catch (e) {
    ADM.loading = false;
    if (e.status === 401) return logout();
    if (e.status === 404) {
      // Artık site sahibi değil (liste değişti): menüden de kalksın.
      const { platformOwner, ...rest } = S.me || {};
      S.me = rest; persistSession();
      if (S.view === "admin") goHome();
      return;
    }
    ADM.failed = true;
    if (admData() && S.view === "admin") toast(t("admin.loadFailed"), e.message, "err");
  }
  ADM.loading = false;
  if (S.view === "admin") renderAdminBody();
}

function renderAdmin() {
  app.innerHTML = `
  <div id="home">

    <main class="adm-body" id="admMain"><div class="adm-col">
      <header class="adm-head">
        <div class="ttl"><button class="btn-line" id="back">${I.back} ${t("common.home")}</button><h1>${t("admin.title")}</h1></div>
        <div class="tools"><span class="when" id="admWhen"></span>

function renderAdminBody() {
  const box = $("admContent"); if (!box) return;
  const d = admData();
  let zone = d?.timeZone;
  if (!zone) { try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (_) { zone = "UTC"; } }
  $("admSub").textContent = t("admin.sub", { zone });

  $("admRefresh").disabled = ADM.loading;

}

/**
 * Günlük kayıt grafiği: tek seri, sütun. Genişlik değişince yeniden çizilir;
 * viewBox ile germek telefonda yazıları okunmaz hâle küçültürdü. Fareyle, dokunarak
 * ya da ok tuşlarıyla bir gün seçilince değeri ipucunda görünür; aynı veri ekran
 * okuyucu için gizli bir tabloda da var.
 */
function mountAdminChart(el, days) {
  if (!el) return;
  const n = days.length;
  const max = Math.max(...days.map((x) => x.count));
  // Üst sınır yuvarlak bir sayı; ortadaki çizgi de tam sayıya düşsün diye çift.
  let top = max <= 1 ? 1 : max + (max % 2);
  if (max > 10) {
    const m = 10 ** Math.floor(Math.log10(max));
    top = [1, 2, 5, 10].map((k) => k * m).find((v) => v >= max);
  }
  // Yalnızca en yüksek gün etiketlenir (eşitse en yenisi).
  const peak = days.reduce((best, x, i) => (x.count >= days[best].count ? i : best), 0);
  const dayLabel = (i, opts) => fmtDate(admDay(days[i].date), opts);
  let geo = null, active = -1;

  const draw = () => {
    const W = Math.max(260, Math.floor(el.clientWidth));
    const H = W < 560 ? 170 : 210;
    const padL = 34, padR = 4, padT = 22, padB = 24;
    const plotW = W - padL - padR, plotH = H - padT - padB, base = padT + plotH;
    const slot = plotW / n;
    const bw = Math.min(24, Math.max(3, slot - Math.max(2, slot * 0.28)));
    const y = (v) => padT + plotH - (v / top) * plotH;
    const f = (v) => v.toFixed(1);
    const parts = [];
    (top === 1 ? [0, 1] : [0, top / 2, top]).forEach((v) => {
      const ty = Math.round(y(v)) + 0.5;
      parts.push(`<line class="${v ? "grid" : "base"}" x1="${padL}" x2="${W - padR}" y1="${ty}" y2="${ty}"/>`,
        `<text x="${padL - 8}" y="${ty + 4}" text-anchor="end">${num(v)}</text>`);
    });
    days.forEach((x, i) => {
      parts.push(`<rect class="band" data-i="${i}" x="${f(padL + slot * i)}" y="${padT}" width="${f(slot)}" height="${plotH}" rx="3"/>`);
      if (!x.count) return;
      // Sütunun ucu 4 px yuvarlak, tabanı düz.
      const h = Math.max(2, base - y(x.count)), x0 = padL + slot * i + (slot - bw) / 2, x1 = x0 + bw;
      const tY = base - h, r = Math.min(4, bw / 2, h);
      parts.push(`<path class="bar" data-i="${i}" d="M${f(x0)} ${base}V${f(tY + r)}Q${f(x0)} ${f(tY)} ${f(x0 + r)} ${f(tY)}H${f(x1 - r)}Q${f(x1)} ${f(tY)} ${f(x1)} ${f(tY + r)}V${base}Z"/>`);
    });
    parts.push(`<text class="val" x="${f(padL + slot * peak + slot / 2)}" y="${f(y(days[peak].count) - 6)}" text-anchor="middle">${num(days[peak].count)}</text>`);
    // Gün etiketleri: ilk gün, ortası ve bugün.
    [[0, "start"], [Math.floor((n - 1) / 2), "middle"], [n - 1, "end"]].forEach(([i, anchor]) => {
      const tx = anchor === "start" ? padL + slot * i + 1 : anchor === "end" ? padL + slot * (i + 1) - 1 : padL + slot * i + slot / 2;
      const label = i === n - 1 ? t("time.today") : dayLabel(i, { day: "numeric", month: "short" });
      parts.push(`<text x="${f(tx)}" y="${H - 6}" text-anchor="${anchor}">${esc(label)}</text>`);
    });
    const desc = t("admin.chart.desc", {
      total: num(days.reduce((s, x) => s + x.count, 0)),
      day: dayLabel(peak, { day: "numeric", month: "long" }), max: num(days[peak].count),
    });
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="admChartT admChartD">
      <title id="admChartT">${esc(t("admin.chart.title"))}</title><desc id="admChartD">${esc(desc)}</desc>${parts.join("")}</svg>
      <div class="adm-tip" hidden></div>`;
    geo = { W, padL, slot, y, base };
    if (active >= 0) show(active);
  };

  function show(i) {
    active = i;
    el.querySelectorAll(".on").forEach((node) => node.classList.remove("on"));
    const tip = el.querySelector(".adm-tip");
    if (!tip || !geo) return;
    if (i < 0) { tip.hidden = true; return; }
    el.querySelectorAll(`[data-i="${i}"]`).forEach((node) => node.classList.add("on"));
    const x = days[i];
    const label = dayLabel(i, { weekday: "short", day: "numeric", month: "long" });
    const value = t("admin.chart.tip", { count: x.count, n: num(x.count) });
    // Değer önde ve koyu, gün ikinci planda. Metin textContent ile (HTML değil).
    tip.replaceChildren(Object.assign(document.createElement("b"), { textContent: value }), document.createTextNode(label));
    tip.hidden = false;
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.min(geo.W - half, Math.max(half, geo.padL + geo.slot * i + geo.slot / 2)) + "px";
    tip.style.top = Math.min(geo.y(x.count), geo.base) + "px";
    if (document.activeElement === el) $("admChartLive").textContent = `${label}: ${value}`;
  }

  const pick = (clientX) => {
    const r = el.getBoundingClientRect();
    return Math.max(0, Math.min(n - 1, Math.floor((clientX - r.left - geo.padL) / geo.slot)));
  };
  el.addEventListener("pointermove", (e) => geo && show(pick(e.clientX)));
  el.addEventListener("pointerdown", (e) => geo && show(pick(e.clientX)));   // dokunmatik ekran
  el.addEventListener("pointerleave", () => { if (document.activeElement !== el) show(-1); });
  el.addEventListener("focus", () => show(active >= 0 ? active : n - 1));
  el.addEventListener("blur", () => show(-1));
  el.addEventListener("keydown", (e) => {
    const next = { ArrowLeft: active - 1, ArrowRight: active + 1, Home: 0, End: n - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    show(Math.max(0, Math.min(n - 1, next)));
  });

  // Genişlik değişince (pencere, telefonu yan çevirme) yeniden çiz.
  let lastW = Math.floor(el.clientWidth);
  const ro = new ResizeObserver(() => {
    if (!el.isConnected) return ro.disconnect();
    const w = Math.floor(el.clientWidth);
    if (w && w !== lastW) { lastW = w; draw(); }
  });
  ro.observe(el);
  draw();
}

function admActivity(d) {
  const a = d.activity;
  const online = a.onlineNow == null
    ? admTile(t("admin.activity.online"), t("admin.activity.unknown"), t("admin.activity.onlineHint"), true)
    : admTile(t("admin.activity.online"), num(a.onlineNow), t("admin.activity.onlineHint"));
  return `<section class="adm-sec" aria-labelledby="admActH"><h2 class="adm-h" id="admActH">${t("admin.activity.h")}</h2>
    <div class="ov-stats">${online}
      ${admTile(t("admin.activity.today"), num(a.today))}
      ${admTile(t("admin.activity.last7"), num(a.last7Days))}
      ${admTile(t("admin.activity.last30"), num(a.last30Days))}
    </div>
    <p class="adm-note">${t("admin.activity.note")}</p></section>`;
}

/** Dağılım satırları: ad, sayı, yüzde ve oranı gösteren ince çubuk (tek renk; büyüklük, kimlik değil). */
function admRows(rows) {
  const total = rows.reduce((s, [, c]) => s + c, 0);
  return `<div class="adm-rows">${rows.map(([label, c]) => `<div class="adm-row">
      <span class="nm" title="${esc(label)}">${esc(label)}</span>
      <span class="v">${num(c)}<small>${pct(c, total)}</small></span>
      <span class="adm-meter" aria-hidden="true"><i style="width:${total ? (c / total) * 100 : 0}%"></i></span>
    </div>`).join("")}</div>`;
}

function admSplits(d) {
  const r = d.retention, m = d.methods, u = d.users;
  const localeName = (code) => (has("admin.locales.name." + code) ? t("admin.locales.name." + code) : String(code || "").toUpperCase());
  const card = (id, title, body) => `<section class="ov-card" aria-labelledby="${id}"><h2 id="${id}">${title}</h2>${body}</section>`;
  const retention = r.cohort
    ? `<p class="adm-big">${pct(r.returned, r.cohort)}<small>${t("admin.retention.of", { returned: num(r.returned), cohort: num(r.cohort) })}</small></p>
       <p class="adm-note">${t("admin.retention.hint")}</p>`
    : `<p class="adm-big" style="color:var(--ink-3)">${t("common.noValue")}</p>
       <p class="adm-note">${t("admin.retention.none")} ${t("admin.retention.hint")}</p>`;
  return `<div class="adm-grid">
    ${card("admRetH", t("admin.retention.title"), retention)}
    ${card("admMethH", t("admin.methods.title"), admRows([[t("admin.methods.password"), m.password],
      [t("admin.methods.google"), m.google], [t("admin.methods.both"), m.both]]))}
    ${card("admVerH", t("admin.verify.title"), admRows([[t("admin.verify.verified"), u.verified],
      [t("admin.verify.unverified"), u.unverified]]))}
    ${card("admLangH", t("admin.locales.title"), admRows(d.locales.map((l) => [localeName(l.locale), l.count])))}
  </div>`;
}

function admContentSec(d) {
  const c = d.content;
  const tile = (key) => admTile(t("admin.content." + key), num(c[key].total), t("admin.content.last7", { n: num(c[key].last7Days) }));
  return `<section class="adm-sec" aria-labelledby="admContH"><h2 class="adm-h" id="admContH">${t("admin.content.h")}</h2>

    <p class="adm-note">${t("admin.content.note")}</p></section>`;
}

function admRecent(d) {
  const rows = d.recentSignups;
  const when = (iso) => fmtDate(iso, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const head = ["name", "email", "joined", "method", "status", "lastSeen", "boards"]

      <td class="who" title="${esc(u.name)}">${esc(u.name)}</td>
      <td class="mail" title="${esc(u.email)}">${esc(u.email)}</td>
      <td>${esc(when(u.createdAt))}</td>
      <td><span class="chip">${t("admin.recent.methodShort." + u.method)}</span></td>
      <td><span class="adm-st${u.verified ? "" : " wait"}"><i></i>${t(u.verified ? "admin.recent.verified" : "admin.recent.pending")}</span></td>
      <td${u.lastSeenAt ? ` title="${esc(when(u.lastSeenAt))}"` : ""}>${u.lastSeenAt ? esc(relTime(u.lastSeenAt)) : t("admin.recent.never")}</td>

    ${rows.length

function admTop(d) {
  const rows = d.topBoards;
  return `<section class="ov-card" aria-labelledby="admTopH">
    <div class="hd"><h2 id="admTopH">${t("admin.top.title")}</h2><span class="adm-note">${t("admin.top.sub")}</span></div>
    ${rows.length
      ? `<div class="adm-scroll" role="region" aria-labelledby="admTopH" tabindex="0">
          <table class="adm-table narrow"><thead><tr><th scope="col">${t("admin.top.board")}</th>
            <th scope="col" class="num">${t("admin.top.members")}</th><th scope="col" class="num">${t("admin.top.activity")}</th></tr></thead>
          <tbody>${rows.map((b) => `<tr><td class="who" title="${esc(b.name)}">${esc(b.name)}</td>
            <td class="num">${num(b.members)}</td><td class="num">${num(b.activity)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="ov-empty"><div class="ei" style="background:var(--acc-soft);color:var(--acc-ink)">${I.kanbanSm}</div>
          <b>${t("admin.top.empty")}</b></div>`}
    <p class="adm-note adm-foot">${t("admin.top.note")}</p>

}

/* ══════════════════ 2) Home ══════════════════ */

/**
 * Kenar çubuğundaki "Benimle paylaşılanlar" görünümünün kimliği.
 *
 * Bir panoya yalnızca pano düzeyinde davet edilen kişi o panonun çalışma
 * alanına üye değildir. Sunucu panoyu ona veriyor (GET /api/boards), ama ana
 * ekran panoları çalışma alanına göre süzdüğü için hiçbir alanın altında
 * görünmüyordu — davet edilen kişi panoyu bulamıyordu.
 */
const SHARED = "shared";
const sharedBoards = () => S.boards.filter((b) => !S.workspaces.some((w) => w.id === b.workspaceId));

async function goHome() {
  closePops(); closePalette();
  S.view = "home"; S.homeLoading = true;
  S.rt && S.rt.close(); S.rt = null;
  renderHome();
  loadOverview();   // beklenmez: özet geç gelse de pano listesi hemen çizilir
  try {
    const [ws, bs] = await Promise.all([api.workspaces(), api.boards()]);
    S.workspaces = ws; S.boards = bs;
    if (!validScope(S.activeWs)) S.activeWs = "all";
  } catch (e) {
    if (e.status === 401 || e.status === 403) return logout();
    toast(t("home.loadFailed"), e.message, "err");
  }
  S.homeLoading = false;
  if (S.view === "home") renderHome();
}

/**
 * Ana ekranda hangi panolar listelensin: "all" (hepsi), "mine" (üyesi olduğum
 * alanlardakiler), SHARED (yalnızca panoya davet edildiklerim) ya da bir alan kimliği.
 */
const validScope = (k) => k === "all" || k === "mine" || (k === SHARED && sharedBoards().length > 0)
  || S.workspaces.some((w) => w.id === k);

function renderHome() {
  if (!validScope(S.activeWs)) S.activeWs = "all";
  app.innerHTML = `
  <div id="home">
    ${homeTopbar()}
    <div class="home-body">
      <nav class="side-nav" aria-label="${t("home.sideNav")}">
        <div class="sn-recent" id="recentBox"></div>
        <div class="sn-ws">
          <p class="side-h">${t("home.workspaces")}</p>
          <div id="wsList"></div>
          <button class="ws-new" id="wsNew">${t("home.newWorkspace")}</button>
        </div>
      </nav>
      <main class="home-main" id="homeMain">
        <section class="ov" id="overview" aria-label="${t("home.overview")}"></section>
        <section id="boardsSec" aria-label="${t("home.boards")}"></section>
        <section id="teamSec" aria-label="${t("home.team")}"></section>
      </main>
    </div>
  </div>`;

  bindTopbar();
  $("wsNew").onclick = () => createModal("workspace");
  renderWsList(); renderRecent(); renderOverview(); renderBoardsSection(); renderTeam();
}

/** Özet verisine bağlı her parça: özet geldiğinde ya da tazelendiğinde birlikte çizilir. */
function renderHomeData() {
  renderOverview(); renderBoardsSection(); renderTeam(); renderRecent(); renderOnlinePill();
}

/* ── Kenar menüsü ── */

const pendingInvites = () => S.notif.items.filter((n) => n.type === "BOARD_INVITE" && n.invitationStatus === "PENDING");


/* Son açılan panolar: bu tarayıcıda, hesap başına saklanır (en fazla 5). */
const recentKey = () => "cb_recent_" + (S.me?.id ?? S.me?.email ?? "");
function recentBoards() {
  try { return JSON.parse(localStorage.getItem(recentKey())) || []; } catch (_) { return []; }
}
function rememberBoard(b) {
  const list = [{ id: b.id, name: b.name }, ...recentBoards().filter((x) => x.id !== b.id)].slice(0, 5);
  try { localStorage.setItem(recentKey(), JSON.stringify(list)); } catch (_) {}
}

function renderRecent() {
  const box = $("recentBox"); if (!box) return;
  const known = new Map(S.boards.map((b) => [b.id, b]));
  // Pano listesi gelmeden önce hepsi gösterilir; geldikten sonra artık erişilemeyenler düşer.
  const list = recentBoards().filter((r) => S.homeLoading || known.has(r.id)).slice(0, 4);
  if (!list.length) { box.innerHTML = ""; box.hidden = true; return; }
  box.hidden = false;
  const live = new Map((ovData()?.liveBoards || []).map((l) => [l.boardId, l.people.length]));
  box.innerHTML = `<p class="side-h">${t("home.recent")}</p>` + list.map((r) => {
    const name = known.get(r.id)?.name || r.name;
    return `<button class="nav-a rec" data-board="${r.id}"><span class="sq" style="background:${colorOf(name)}"></span>
      <span class="nm">${esc(name)}</span>${live.get(r.id) ? `<span class="live-n" title="${t("home.hereNow")}">● ${live.get(r.id)}</span>` : ""}</button>`;
  }).join("");
  box.onclick = (e) => { const b = e.target.closest("[data-board]"); if (b) openBoard(Number(b.dataset.board)); };
}

function renderWsList() {
  const list = $("wsList"); if (!list) return;
  list.innerHTML = "";
  S.workspaces.forEach((w) => {
    const count = S.boards.filter((b) => b.workspaceId === w.id).length;
    const row = document.createElement("div");
    row.className = "ws-row" + (w.id === S.activeWs ? " active" : "");
    row.innerHTML = `${wsIni(w.name)}<div class="ws-name">${esc(w.name)}</div>
      ${(w.role === "OWNER" || w.role === "ADMIN") ? `<div class="ws-actions">
        <button class="icon-btn edit" title="${t("common.rename")}">${I.pencil}</button>
        <button class="icon-btn del" title="${t("common.delete")}">${I.trash}</button></div>` : ""}
      <span class="ws-count">${count}</span>`;
    row.onclick = (e) => { if (e.target.closest(".ws-actions")) return; selectWs(w.id); };
    row.querySelector(".edit")?.addEventListener("click", () => inlineRename(row, w));
    row.querySelector(".del")?.addEventListener("click", () => confirmDeleteWs(w));
    list.appendChild(row);
  });
  const shared = sharedBoards();
  if (shared.length) {
    const row = document.createElement("div");
    row.className = "ws-row" + (S.activeWs === SHARED ? " active" : "");
    row.id = "sharedRow";
    row.innerHTML = `<span class="ws-ini shared">↗</span><div class="ws-name">${t("topbar.sharedWithMe")}</div><span class="ws-count">${shared.length}</span>`;
    row.onclick = () => selectWs(SHARED);
    list.appendChild(row);
  }
}

/** Alan seçimi yalnızca pano listesini süzer; özet her zaman bütün panoları anlatır. */
function selectWs(key) {
  S.activeWs = key;
  if (S.view !== "home") return goHome();
  renderWsList(); renderBoardsSection();
  const sw = $("wsSwitch"); if (sw) sw.innerHTML = wsSwitchInner();
  $("boardsSec")?.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
}

function emptyState(ws) {
  if (ws && ws.role === "GUEST") {
    return `<div class="empty"><div class="ico">${I.kanban}</div><h3>${t("home.guestTitle")}</h3>
      <p>${t("home.guestHint")}</p></div>`;
  }
  return `<div class="empty"><div class="ico">${I.kanban}</div><h3>${t("home.noBoards")}</h3>
    <p>${t("home.noBoardsHint")}</p>
    <button class="btn btn-primary" id="firstBoard">${t("home.firstBoard")}</button></div>`;
}

/* ── Ana ekran özeti ── */

/**
 * Özet, ana ekranın geri kalanından AYRI yüklenir ve çizilir: yavaş gelirse
 * pano listesini bekletmez; çalışma alanı değişince yeniden istenmez, bellekteki
 * hâli çizilir. Ana ekrana her dönüşte ve ana ekrandayken dakikada bir tazelenir.
 * Bellek hesaba bağlı: aynı sekmede başka bir hesapla girilirse öncekinin
 * kartları bir an bile görünmesin.
 */
const OV = { owner: null, data: null, loading: false, failed: false, fresh: false };
const ovData = () => (OV.owner === S.me?.email ? OV.data : null);


async function loadOverview() {
  const owner = S.me?.email;
  if (OV.owner !== owner) { OV.owner = owner; OV.data = null; }
  OV.loading = !OV.data; OV.failed = false;
  renderOverview();
  try {
    const data = await api.overview();
    if (OV.owner === owner) { OV.fresh = !OV.data; OV.data = data; }
  } catch (_) {
    // Özet ikincil: hata pano listesini bozmasın, yerinde "tekrar dene" çıksın.
    if (!OV.data) OV.failed = true;
  }
  OV.loading = false;
  renderHomeData();
}

// Ana ekran açık kaldıkça "şu an canlı" ve sayaçlar bayatlamasın.
setInterval(() => { if (S.view === "home" && !document.hidden) loadOverview(); }, 60000);

function greeting() {
  const h = new Date().getHours();
  return t(h >= 5 && h < 12 ? "home.greet.morning" : h >= 12 && h < 18 ? "home.greet.day" : "home.greet.evening");
}

const daysUntil = (iso) => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(iso + "T00:00:00") - today) / 86400000);
};

function overviewHead(d) {
  const date = fmtDate(new Date(), { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const bits = [];
  if (d) {
    const today = d.assignedCards.filter((c) => c.dueDate && daysUntil(c.dueDate) === 0).length;
    if (d.overdueCount) bits.push(`<span class="late">${t("home.lateCards", { count: d.overdueCount })}</span>`);
    if (today) bits.push(`<span class="soon">${t("home.dueToday", { count: today })}</span>`);
  }
  return `<div class="ov-head">
    <div><h1>${greeting()}${S.me?.firstName ? ", " + esc(S.me.firstName) : ""}</h1>
      <p class="sub">${esc(date)}${bits.length ? " · " + bits.join(", ") : d && d.assignedOpenCount ? " · " + t("home.nothingUrgent") : ""}</p></div>
  </div><div id="invBanner"></div>`;
}

function renderOverview() {
  const box = $("overview"); if (!box) return;
  const d = ovData();

  if (!d) {
    box.innerHTML = overviewHead(null) + (OV.failed
      ? `<div class="ov-fail">${I.warnCircle}<span>${t("home.overviewFailed")}</span><a id="ovRetry">${t("common.retry")}</a></div>`
      : `<div class="ov-split"><div class="skel ov-skel-list" style="flex:2 1 420px"></div><div class="skel ov-skel-list" style="flex:1 1 300px"></div></div>`);
  } else {
    box.classList.toggle("fresh", OV.fresh);
    OV.fresh = false;
    box.innerHTML = overviewHead(d) + `
      <div class="ov-split">${overviewAssigned(d)}<div class="aside">${overviewLive(d)}${overviewAging(d)}</div></div>`;
  }
  renderInviteBanner();

  // Satırlar düğme: tıklama (ya da Enter) o panoyu, varsa o kartı açar.
  box.onclick = (e) => {
    const f = e.target.closest("[data-ovf]");
    if (f) { S.ovFilter = f.dataset.ovf; return renderOverview(); }
    const row = e.target.closest("[data-board]");
    if (row) openBoard(Number(row.dataset.board), { focusCard: Number(row.dataset.card) || null });
  };
  $("ovRetry")?.addEventListener("click", loadOverview);
}


function overviewAssigned(d) {
  const f = S.ovFilter || "all";
  const list = d.assignedCards.filter((c) => f === "all" ? true
    : f === "late" ? c.dueDate && daysUntil(c.dueDate) < 0
    : c.dueDate && daysUntil(c.dueDate) >= 0 && daysUntil(c.dueDate) <= 6);
  const rows = list.map((c) => `
    <button class="ov-row" data-board="${c.boardId}" data-card="${c.cardId}" title="${esc(t("home.openOnBoard", { board: c.boardName }))}">
      <span class="box"></span>
      <span class="tx"><span class="tt">${esc(c.title)}</span>
        <span class="mt"><i style="background:${colorOf(c.boardName)}"></i><span>${esc(c.boardName)} · ${esc(c.columnName)}</span></span></span>
      ${c.dueDate ? `<span class="ov-due ${dueState(c.dueDate)}">${esc(dueLabel(c.dueDate))}</span>` : `<span class="ov-due none">${t("home.noDate")}</span>`}
    </button>`).join("");
  const more = d.assignedOpenCount - d.assignedCards.length;
  const chip = (k) => `<button class="${f === k ? "on" : ""}" data-ovf="${k}" aria-pressed="${f === k}">${t("home.filter." + k)}</button>`;
  return `<section class="ov-card ov-list mine" id="ovAssigned">
    <div class="hd"><h2>${t("home.assigned")}</h2><span class="cnt">${t("home.openCount", { count: d.assignedOpenCount })}</span>
      <div class="seg">${chip("all")}${chip("week")}${chip("late")}</div></div>
    ${rows ? `<div class="ov-body">${rows}</div>${more > 0 && f === "all" ? `<div class="ov-more">${t("home.moreCards", { count: more })}</div>` : ""}`
      : d.assignedOpenCount && f !== "all"
        ? `<div class="ov-empty"><b>${t("home.noMatch")}</b>${t(f === "late" ? "home.noLate" : "home.noWeek")}</div>`
        : `<div class="ov-empty"><div class="ei" style="background:var(--ok-soft);color:var(--ok-ink)">${I.check}</div><b>${t("home.noAssigned")}</b>
          ${t("home.noAssignedHint")}</div>`}
  </section>`;
}

function overviewLive(d) {
  const live = d.liveBoards || [];
  return `<section class="ov-card pad"><h2><span class="live-dot"></span>${t("home.liveNow")}</h2>
    ${live.length ? `<div class="live-list">${live.map((l) => `
      <button class="live-row" data-board="${l.boardId}" title="${esc(l.people.map((p) => p.name).join(", "))}">
        <span class="sq" style="background:${colorOf(l.boardName)}"></span><span class="nm">${esc(l.boardName)}</span>
        <span class="av-stack on-card">${l.people.slice(0, 4).map((p) => avatar(p.name, 22, "", p.avatarUrl)).join("")}</span>
      </button>`).join("")}</div>`
      : `<p class="ov-note">${t("home.liveEmpty")}</p>`}
  </section>`;
}


/** Bir panonun kolon dağılımı tek çubukta: gri başlangıç, mavi süren iş, yeşil biten; darboğaz kırmızı, dolu WIP sarı. */
function segbar(cols, bottleneck, wipFull) {
  const total = cols.reduce((n, c) => n + c.count, 0);
  if (!total) return `<span class="segbar none"></span>`;
  const color = (c, i) => i === cols.length - 1 ? "var(--ok)" : c.name === bottleneck ? "var(--err-ink)"
    : c.name === wipFull ? "var(--warn)" : i === 0 ? "var(--ink-4)" : "var(--blue)";
  return `<span class="segbar" title="${esc(cols.map((c) => `${c.name}: ${c.count}`).join(" · "))}">${cols.map((c, i) =>
    c.count ? `<i style="flex:${c.count};background:${color(c, i)}"></i>` : "").join("")}</span>`;
}


function overviewAging(d) {
  const ag = d.aging || [];
  return `<section class="ov-card pad"><h2>${t("home.aging")}</h2>
    ${ag.length ? `<div class="ag-list">${ag.map((g) => {
      const tone = g.ageSeconds >= 7 * DAY ? "hot" : g.ageSeconds >= 3 * DAY ? "warm" : "";
      return `<button class="ag-row" data-board="${g.boardId}" data-card="${g.cardId}" title="${t(g.estimated ? "home.agingEstimated" : "home.agingWaiting")}">
        <span class="tx"><span class="tt">${esc(g.title)}</span><span class="wh">${esc(g.boardName)} · ${esc(g.columnName)}</span></span>
        <span class="age ${tone}">${humanDuration(g.ageSeconds)}${g.estimated ? "~" : ""}</span></button>`; }).join("")}</div>`
      : `<p class="ov-note">${t("home.agingEmpty")}</p>`}
  </section>`;
}

function overviewFeed(d) {
  const rows = d.recentActivity.slice(0, 6).map((a) => `
    <button class="feed-row" data-board="${a.boardId}" title="${esc(t("home.openBoard", { board: a.boardName }))}">
      ${avatar(a.actorName, 24, "", a.actorAvatarUrl)}
      <span><b>${esc(a.actorName)}</b> ${esc(activityText(a))}<small>${esc(a.boardName)} · ${relTime(a.createdAt)}</small></span>
    </button>`).join("");
  return `<section class="ov-card pad ov-list feed"><h2>${t("home.recentActivity")}</h2>
    ${rows ? `<div class="feed">${rows}</div>` : `<p class="ov-note">${t("home.activityEmpty")}</p>`}
  </section>`;
}

/** Bekleyen ilk davet, ana ekranın tepesinde kararını bekler (fazlası zilde). */
function renderInviteBanner() {
  const box = $("invBanner"); if (!box) return;
  const list = pendingInvites();
  if (!list.length) { box.innerHTML = ""; return; }
  const n = list[0];
  box.innerHTML = `<div class="inv-banner">${avatar(n.actorName || "?", 32, "", n.actorAvatarUrl)}
    <p>${notifText(n)} · ${relTime(n.createdAt)}${list.length > 1 ? `<a class="more" id="invMore">${t("home.moreInvites", { count: list.length - 1 })}</a>` : ""}</p>
    <div class="acts"><button class="btn btn-primary btn-sm" data-inv="${n.invitationId}" data-a="ok">${I.check} ${t("common.accept")}</button>
      <button class="btn-ghost btn-sm" data-inv="${n.invitationId}" data-a="no">${t("common.decline")}</button></div></div>`;
  box.querySelectorAll("[data-inv]").forEach((b) => b.addEventListener("click", () => {
    box.querySelectorAll("button").forEach((x) => { x.disabled = true; });
    respondInvite(Number(b.dataset.inv), b.dataset.a === "ok");
  }));
  $("invMore")?.addEventListener("click", (e) => { e.stopPropagation(); toggleNotifPanel(); });
}

/* ── Panolar ── */
function renderBoardsSection() {
  const box = $("boardsSec"); if (!box) return;
  const key = S.activeWs;
  const ws = typeof key === "number" ? S.workspaces.find((w) => w.id === key) : null;
  const shared = sharedBoards();
  const list = key === "all" ? S.boards : key === "mine" ? S.boards.filter((b) => !shared.includes(b))
    : key === SHARED ? shared : S.boards.filter((b) => b.workspaceId === key);
  const chip = (k) => `<button class="${key === k ? "on" : ""}" data-scope="${k}" aria-pressed="${key === k}">${t("home.scope." + k)}</button>`;

  let body;
  if (S.homeLoading && !S.boards.length) body = `<div class="board-grid">${'<div class="skel"></div>'.repeat(3)}</div>`;
  else if (!S.boards.length) body = emptyState(null);
  else if (ws && ws.role === "GUEST" && !list.length) body = emptyState(ws);
  else body = `<div class="board-grid" id="grid">${list.map((b) => boardCard(b, shared.includes(b))).join("")}
      <button class="board-new" id="newBoard2">${t("home.newBoardTile")}</button></div>`;

  box.innerHTML = `<div class="boards-head"><h2>${esc(ws ? ws.name : key === SHARED ? t("topbar.sharedWithMe") : t("home.yourBoards"))}</h2>
      <span class="cnt">${list.length}</span>${ws ? `<span class="badge ${ws.role}">${roleLabel(ws.role)}</span>` : ""}
      <div class="seg">${chip("all")}${chip("mine")}${shared.length ? chip(SHARED) : ""}</div></div>${body}`;

  box.onclick = (e) => {
    const s = e.target.closest("[data-scope]");

function inlineRename(row, w) {

  nameEl.replaceWith(input); input.focus(); input.select();
  let done = false;
  const save = async () => {
    if (done) return; done = true;
    const name = input.value.trim();
    if (!name || name === w.name) return renderHome();
    try { await api.renameWorkspace(w.id, name); w.name = name; toast(t("home.renamed"), name, "ok"); }
    catch (e) { toast(t("home.updateFailed"), e.message, "err"); }
    renderHome();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") { done = true; renderHome(); }
  });
  input.addEventListener("blur", save);
}

function createModal(kind) {
  const isWs = kind === "workspace";
  // Pano hangi alana açılsın: seçili alan (izin varsa), yoksa ilk uygun alan.
  // Hiç alanı olmayan kişi de pano açabilir; sunucu ona kişisel alan kurar.

    ${isWs ? "" : `<div class="label" id="tplLbl">${t("create.template")}</div>
      <div class="tpl-list" id="tplList" role="radiogroup" aria-labelledby="tplLbl">${`<div class="tpl-skel"></div>`.repeat(3)}</div>`}

/* ══════════════════ 3) Pano ══════════════════ */
/**
 * Panoyu açar. focusCard verilirse (aramadan, özetten) kart gösterilir: süzgeç
 * temizlenir, karta kaydırılır ve kısa bir parlamayla işaretlenir. openCard
 * verilirse (yorum bildirimi, postadaki bağlantı) kartın penceresi yorumlarıyla açılır.
 */
async function openBoard(id, { focusCard = null, openCard = null } = {}) {
  closePops(); closePalette();
  if (S.view === "board" && S.board?.id === id) {   // zaten bu panodayız: yeniden yükleme
    if (focusCard) showCard(focusCard);
    if (openCard) openCardDetail(openCard);
    return;
  }
  S.view = "board"; S.conn = "connecting"; S.board = null; S.tab = "board"; S.opening = id;
  S.history = { active: false, timeline: [], index: 0 }; S.flow = null;
  S.members = []; S.activity = []; S.presence = []; S.pending = []; S.memberRows = new Set();
  if (focusCard) S.filter = { q: "", mine: false, overdue: false, assignee: "" };
  renderBoard();
  try {
    const [board, members, activity] = await Promise.all([api.board(id), api.members(id), api.activity(id)]);
    S.board = board;
    S.members = members;
    S.activity = activity;
    const mine = members.find((m) => m.email === S.me?.email);
    // Rol pano listesinden de gelebilir (şirket rolünden türeyen durumlar için).
    S.boardRole = mine?.role || S.boards.find((b) => b.id === id)?.role || "VIEWER";
  } catch (e) {
    if (e.status === 403) { toast(t("board.noAccess"), t("board.noAccessBody"), "err"); return goHome(); }
    toast(t("board.loadFailed"), e.message, "err"); return goHome();
  }
  // Yüklenirken başka yere geçildiyse (ana ekran, başka pano) o ekranın üstüne çizme.
  if (S.view !== "board" || S.opening !== id) return;
  rememberBoard(S.board);
  renderBoard();
  connect(id);
  loadFlow();
  loadPending();
  if (focusCard) focusCardEl(focusCard);
  if (openCard) openCardDetail(openCard);
}

/** Kartın penceresini yorumlara kaydırarak açar; geçmişe ya da Akış'a bakılıyorsa önce panoya döner. */
async function openCardDetail(cardId) {
  if (S.tab !== "board" || S.history.active) await setTab("board");
  const col = S.board?.columns.find((c) => c.cards.some((k) => k.id === cardId));
  if (!col) return toast(t("board.cardMissing"), t("board.cardMissingBody"), "warn");
  focusCardEl(cardId);
  openDetail(col.cards.find((k) => k.id === cardId), col, { toComments: true });
}

function connect(boardId) {
  S.rt && S.rt.close();
  S.rt = connectRealtime(boardId, {
    onStatus: (s) => {
      const was = S.conn; S.conn = s;
      updateConn();
      if (s === "down" && was === "up") toast(t("board.disconnected"), t("board.reconnecting"), "err");
      if (s === "up" && was === "down") { toast(t("board.reconnected"), t("board.refreshed"), "ok"); refreshBoard(); }
    },
    onOp: applyEvent,
    onPresence: (users) => { S.presence = users; renderPresence(); pruneCursors(); },
    onCursor: onRemoteCursor,
    onReject: (r) => {
      // WIP limiti bir çakışma değil, kuralın kasten çalışmasıdır — mesajı da
      // ona göre. Tazeleme yine şart: sürükleme yerel durumu çoktan değiştirdi,
      // sunucu reddettiğine göre kartın eski yerine dönmesi gerekiyor.
      // Mesaj sunucudan, kişinin kayıtlı dilinde gelir; gelmezse arayüzün kendi metni.
      if (r.reason === "WIP_LIMIT") {
        toast(t("board.columnFull"), r.message || t("board.columnFullBody"), "warn");
        refreshBoard();
        return;
      }
      // Geçersiz girdi de bir çakışma değil: sunucuya hiçbir şey yazılmadı,
      // kullanıcının tek yapması gereken girdiyi düzeltmek.
      if (r.reason === "INVALID") {
        toast(t("board.invalid"), r.message || t("board.invalidBody"), "warn");
        return;
      }
      toast(t("board.conflict"), r.message || t("board.conflictBody"), "err");
      refreshBoard();
    },
    onFatal: () => { logout(); toast(t("session.expired"), t("session.signInAgain"), "warn"); },
  });
}

async function refreshBoard() {
  if (!S.board) return;
  try {
    const [board, activity] = await Promise.all([api.board(S.board.id), api.activity(S.board.id)]);
    S.board = board; S.activity = activity;
    renderColumns(); renderActivity();
    if (S.ck) { renderDetailLabels(); loadChecklists(); }   // açık kart penceresi de bugünkü hâle gelsin
  } catch (_) {}
}

/**
 * Görünüm sekmeleri. "Geçmiş" ayrı bir ekran değil, panonun salt okunur
 * geçmiş hâlidir (zaman çubuğu); "Akış" ise kolon yerine ölçümleri gösterir.
 */
async function setTab(t) {
  if (t === "hist") {
    S.tab = "board"; syncTabs();
    if (!S.history.active) await toggleHistory();
    return syncTabs();
  }
  if (S.history.active) await exitHistory();
  S.tab = t; syncTabs();
  if (t === "flow") renderFlowView();
}

function syncTabs() {
  const now = tabNow();
  [["tabBoard", "board"], ["histBtn", "hist"], ["tabFlow", "flow"]].forEach(([id, k]) => $(id)?.setAttribute("aria-selected", String(now === k)));
  const flow = S.tab === "flow";
  $("colsWrap")?.classList.toggle("hidden", flow);
  $("flowView")?.classList.toggle("hidden", !flow);
  $("filters")?.classList.toggle("hidden", flow);
}

  $("fassignee").onchange = (e) => { f.assignee = e.target.value; if (f.assignee) f.mine = false; renderFilters(); renderColumns(); };

    S.filter = { q: "", mine: false, overdue: false, assignee: "" };

const activeFilter = () => {

  return !!(f.q.trim() || f.mine || f.overdue || f.assignee || f.labels?.length);
