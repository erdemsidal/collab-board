function syncChecklistSummary(snap) {
  const hit = cardById(snap.cardId);
  if (!hit || S.history.active || CK_DELETED.has(snap.id)) return;
  const list = (hit.card.checklists ||= []);
  const next = { id: snap.id, done: snap.items.filter((i) => i.done).length, total: snap.items.length, revision: snap.revision };
  const s = list.find((x) => x.id === snap.id);
  if (s && snap.revision <= s.revision) return;
  if (s) Object.assign(s, next); else { list.push(next); list.sort((a, b) => a.id - b.id); }
  refreshCardMeta(snap.cardId);
}

function removeChecklistLocal(cardId, id) {
  CK_DELETED.add(id);
  const hit = cardById(cardId);
  if (hit?.card.checklists?.some((c) => c.id === id)) {
    hit.card.checklists = hit.card.checklists.filter((c) => c.id !== id);
    refreshCardMeta(cardId);
  }
  const ck = S.ck;
  if (ck && ck.cardId === cardId && ck.lists.some((l) => l.id === id)) {
    ck.lists = ck.lists.filter((l) => l.id !== id);
    ck.ui.delete(id);
    renderChecklists();
  }
}

/** Canlı liste olayı; kart penceresi yükleniyorsa sıraya alınır. */
function applyChecklistEvent(ev) {
  if (!S.board || S.history.active) return;
  if (ev.logged) loadActivity();   // liste eklendi, tamamlandı ya da silindi: "Son hareketler"e düştü
  const ck = S.ck;
  if (ck && ck.cardId === ev.cardId && (ck.status === "loading" || ck.status === "refreshing")) {
    ck.queued.push({ ...ev, logged: false });
    if (ev.type === "CHECKLIST_UPDATED") syncChecklistSummary(ev.checklist);
    return;
  }
  if (ev.type === "CHECKLIST_UPDATED") mergeChecklist(ev.checklist);
  else if (ev.type === "CHECKLIST_DELETED") removeChecklistLocal(ev.cardId, ev.checklistId);
}

async function createChecklist() {
  const ck = S.ck; if (!ck) return;
  const title = ck.newTitle.trim();
  if (!title) return;
  ck.newOpen = false;
  renderChecklists();
  try {
    const list = await api.createChecklist(ck.boardId, ck.cardId, title);
    if (S.ck !== ck) return syncChecklistSummary(list);
    ckUi(list.id).adding = true;   // yeni listede madde yazmaya hazır
    mergeChecklist(list);
    // Kendi olayımız yanıttan önce geldiyse liste çizilmiş ama yazma kutusu kapalıdır.
    if ($("ckBody").querySelector(`.ck[data-ck="${list.id}"]`)) renderChecklistBlock(list.id);
    $("ckBody").querySelector(`.ck[data-ck="${list.id}"] [data-k="add"]`)?.focus();
  } catch (e) {
    toast(t("checklist.saveFailed"), e.message, "err");
    if (S.ck === ck) { ck.newOpen = true; ck.newTitle = title; renderChecklists(); }
  }
}

function renameChecklist(list) {
  const ui = ckUi(list.id), title = ui.title.trim();
  if (!title) return;
  ui.renaming = false;
  if (title !== list.title) {
    list.title = title;
    sendChecklist(list.id, () => api.renameChecklist(S.ck.boardId, S.ck.cardId, list.id, title));
  }
  renderChecklistBlock(list.id);
  $("ckBody").querySelector(`.ck[data-ck="${list.id}"] [data-k="title-btn"]`)?.focus();
}

async function deleteChecklist(list) {
  const ck = S.ck;
  try {
    await api.deleteChecklist(ck.boardId, ck.cardId, list.id);
    removeChecklistLocal(ck.cardId, list.id);
    $("ckNew")?.focus();
  } catch (e) {
    toast(t("checklist.saveFailed"), e.message, "err");
    if (S.ck === ck) { ckUi(list.id).confirm = false; renderChecklistBlock(list.id); }
  }
}

function addChecklistItem(list) {
  const ui = ckUi(list.id), text = ui.addText.trim();
  if (!text) return;
  ui.addText = "";   // kutu açık kalır: art arda madde yazılabilir
  renderChecklistBlock(list.id);
  $("ckBody").querySelector(`.ck[data-ck="${list.id}"] [data-k="add"]`)?.focus();
  sendChecklist(list.id, () => api.addChecklistItem(S.ck.boardId, S.ck.cardId, list.id, text));
}

function saveChecklistItemText(list) {
  const ui = ckUi(list.id), it = list.items.find((i) => i.id === ui.editId), text = ui.editText.trim();
  if (!it) { ui.editId = null; return renderChecklistBlock(list.id); }
  if (!text) return toast(t("checklist.itemRequired"), "", "err");
  ui.editId = null;
  if (text !== it.text) {
    it.text = text;
    sendChecklist(list.id, () => api.updateChecklistItem(S.ck.boardId, S.ck.cardId, list.id, it.id, { text }));
  }
  renderChecklistBlock(list.id);
  $("ckBody").querySelector(`.ck[data-ck="${list.id}"] [data-k="tx-${it.id}"]`)?.focus();
}

function deleteChecklistItem(list, itemId) {
  const i = list.items.findIndex((x) => x.id === itemId); if (i < 0) return;
  list.items.splice(i, 1);
  list.items.forEach((x, n) => { x.position = n; });
  renderChecklistBlock(list.id);
  // Odak bir sonraki maddeye (yoksa öncekine, o da yoksa "Madde ekle"ye) geçer.
  const next = list.items[i] || list.items[i - 1];
  $("ckBody").querySelector(`.ck[data-ck="${list.id}"] [data-k="${next ? "cb-" + next.id : "add-btn"}"]`)?.focus();
  sendChecklist(list.id, () => api.deleteChecklistItem(S.ck.boardId, S.ck.cardId, list.id, itemId));
}

/** Yukarı/aşağı: gizli (tamamlanmış) maddelerin üstünden atlayarak görünen komşunun yerine. */
function stepChecklistItem(id, itemId, dir) {
  const list = ckList(id); if (!list) return;
  const hide = CK_HIDE.has(id);
  let j = list.items.findIndex((i) => i.id === itemId) + dir;
  while (hide && j >= 0 && j < list.items.length && list.items[j].done) j += dir;
  if (j < 0 || j >= list.items.length) return;
  moveChecklistItem(id, itemId, j);
}

function moveChecklistItem(id, itemId, to) {
  const list = ckList(id); if (!list) return;
  const from = list.items.findIndex((i) => i.id === itemId);
  to = Math.max(0, Math.min(to, list.items.length - 1));
  if (from < 0 || from === to) return renderChecklistBlock(id);
  const [it] = list.items.splice(from, 1);
  list.items.splice(to, 0, it);
  list.items.forEach((x, n) => { x.position = n; });
  renderChecklistBlock(id);
  sendChecklist(id, () => api.updateChecklistItem(S.ck.boardId, S.ck.cardId, id, itemId, { position: to }));
}

/* ── Sürükle-bırak ── */
function initSortables() {
  S.sortables.forEach((s) => { try { s.destroy(); } catch (_) {} });
  S.sortables = [];
  const wrap = $("cols"); if (!wrap) return;

  wrap.querySelectorAll(".col-cards").forEach((el) => {
    S.sortables.push(new Sortable(el, {
      group: "cards", ...DRAG, disabled: !canEdit() || activeFilter(),
      ghostClass: "card-ghost", dragClass: "card-drag", filter: ".del,.col-empty", preventOnFilter: false,
      onStart: (evt) => startDrag(Number(evt.item.dataset.cardId) || null),
      onEnd: (evt) => {
        try {
          const item = evt.item; if (!item.dataset.cardId) return;
          sendOp({
            type: "MOVE_CARD",
            cardId: Number(item.dataset.cardId),
            toColumnId: Number(evt.to.dataset.colId),
            position: evt.newIndex,
            baseVersion: Number(item.dataset.version),
          });
          syncLocalFromDom();
        } finally { endDrag(); }
      },
    }));
  });

  S.sortables.push(new Sortable(wrap, {
    group: "columns", ...DRAG, draggable: ".col", handle: ".col-head",
    filter: ".col-menu,.chip.wip.editable,input.rename", preventOnFilter: false,
    disabled: !canEdit() || activeFilter(), ghostClass: "card-ghost",
    onStart: () => startDrag(null),
    onEnd: (evt) => {
      try {
        if (evt.oldIndex === evt.newIndex) return;
        sendOp({ type: "MOVE_COLUMN", columnId: Number(evt.item.dataset.colId), position: evt.newIndex });
        syncLocalFromDom();
      } finally { endDrag(); }
    },
  }));
}

/**
 * Sürüklemenin ortak ayarları.
 *
 * forceFallback: tarayıcının kendi yarı saydam sürükleme resmi yerine SortableJS
 * kartın gerçek bir kopyasını farenin altında taşır — biçimlendirilebilir
 * (.sortable-fallback) ve her tarayıcıda aynı görünür.
 * delayOnTouchOnly: telefonda parmak önce sayfayı kaydırır; karta 150 ms basılı
 * tutunca sürükleme başlar. Yoksa panoyu kaydırmaya çalışan her dokunuş kart taşırdı.
 */
const DRAG = {
  animation: 220, easing: "cubic-bezier(.2,.8,.2,1)",
  forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4,
  delay: 150, delayOnTouchOnly: true,
};

/**
 * Sürükleme sürerken gelen canlı olaylar bekletilir.
 *
 * Her olay panoyu baştan çizer; sürüklenen kart da o çizimde yok olur ve
 * sürükleme elde kalırdı. Olaylar sırayla saklanır, bırakınca uygulanır.
 */
function startDrag(cardId) {
  S.dragging = true; S.dragCardId = cardId;
  if (lastCursorPos) queueCursor(lastCursorPos, true);   // karşı taraf hangi kartın taşındığını hemen görsün
}

function endDrag() {
  S.dragging = false; S.dragCardId = null;
  if (lastCursorPos) queueCursor(lastCursorPos, true);
  const queued = S.queuedEvents; S.queuedEvents = [];
  queued.forEach(applyEvent);
}

/** DOM'daki sırayı yerel duruma yansıt (iyimser arayüz). */
function syncLocalFromDom() {
  if (!S.board) return;
  const byId = new Map();
  S.board.columns.forEach((c) => c.cards.forEach((k) => byId.set(String(k.id), k)));
  const cols = [];
  $("cols").querySelectorAll(".col").forEach((colEl, i) => {
    const id = Number(colEl.dataset.colId);
    const old = S.board.columns.find((c) => c.id === id);
    const cards = [...colEl.querySelectorAll(".card")].map((el) => byId.get(el.dataset.cardId)).filter(Boolean);
    cols.push({ ...old, position: i, cards });
  });
  S.board.columns = cols;
}

function removeCardLocal(cardId) {
  if (!S.board) return;
  S.board.columns.forEach((c) => { c.cards = c.cards.filter((k) => k.id !== cardId); });
  renderColumns();
}

function sendOp(op) {
  if (!S.rt) return;
  S.opsSent++; updateConn();
  S.rt.send(op);
}

/* ── Canlı olaylar ── */
function applyEvent(ev) {
  if (!S.board) return;
  if (S.dragging) { S.queuedEvents.push(ev); return; }
  // İçeriksiz sinyaller: veri olayın içinde değil, yetki kontrollü REST ucundan çekilir.
  if (ev.type === "MEMBERS_CHANGED") { reloadMembers(); return; }
  if (ev.type === "INVITATIONS_CHANGED") { loadPending(); return; }
  // Etiket ve kontrol listesi olayları da kartın sürümüne dokunmaz (ADR 0022).
  if (ev.type?.startsWith("LABEL_") || ev.type?.startsWith("CARD_LABEL_")) { applyLabelEvent(ev); return; }
  if (ev.type?.startsWith("CHECKLIST_")) { applyChecklistEvent(ev); return; }
  // Yorum olayları kartın sürümüne dokunmaz; pano yeniden çizilmez, yalnızca sayı ve açık pencere.
  if (ev.type?.startsWith("COMMENT_")) {
    applyCommentEvent(ev);
    if (ev.type === "COMMENT_ADDED") loadActivity();   // "Son hareketler"e düşer
    return;
  }
  const cols = S.board.columns;
  if (ev.type === "ADD_CARD") {
    const col = cols.find((c) => c.id === ev.columnId);
    if (col && !col.cards.some((k) => k.id === ev.card.id)) {
      col.cards.splice(ev.card.position, 0, ev.card);
      renderColumns(); flash(ev.card.id);
    }
  } else if (ev.type === "MOVE_CARD") {
    let card = null;
    cols.forEach((c) => { const i = c.cards.findIndex((k) => k.id === ev.cardId); if (i >= 0) card = c.cards.splice(i, 1)[0]; });
    const target = cols.find((c) => c.id === ev.toColumnId);
    if (card && target) { card.version = ev.version; target.cards.splice(ev.position, 0, card); renderColumns(); flash(ev.cardId); }
  } else if (ev.type === "EDIT_CARD") {
    cols.forEach((c) => c.cards.forEach((k) => {
      if (k.id === ev.cardId) {
        k.title = ev.title; k.description = ev.description;
        k.assigneeId = ev.assigneeId; k.dueDate = ev.dueDate; k.version = ev.version;
      }
    }));
    renderColumns(); flash(ev.cardId);
  } else if (ev.type === "DELETE_CARD") {
    cols.forEach((c) => { c.cards = c.cards.filter((k) => k.id !== ev.cardId); });
    renderColumns();
  } else if (ev.type === "ADD_COLUMN") {
    if (!cols.some((c) => c.id === ev.column.id)) { cols.push(ev.column); renderColumns(); }
  } else if (ev.type === "RENAME_COLUMN") {
    const col = cols.find((c) => c.id === ev.columnId);
    if (col) { col.name = ev.name; renderColumns(); }
  } else if (ev.type === "DELETE_COLUMN") {
    S.board.columns = cols.filter((c) => c.id !== ev.columnId);
    renderColumns();
  } else if (ev.type === "SET_WIP_LIMIT") {
    const col = cols.find((c) => c.id === ev.columnId);
    if (col) { col.wipLimit = ev.wipLimit; renderColumns(); }
  } else if (ev.type === "MOVE_COLUMN") {
    const i = cols.findIndex((c) => c.id === ev.columnId);
    if (i >= 0) { const [c] = cols.splice(i, 1); cols.splice(ev.position, 0, c); renderColumns(); }
  }
  loadActivity();
}

/* ── Akıcı yeniden çizim (FLIP) ──
 * Pano her değişiklikte baştan çiziliyor. Önceden bütün kartlar yeniden belirme
 * animasyonu oynuyor, taşınan kart da yeni yerine ışınlanıyordu. Şimdi çizmeden
 * önce her kartın ve kolonun ekrandaki yeri ölçülür (First), yeni yer bulunur
 * (Last), kart eski yerine geri itilir (Invert) ve oradan yenisine kaydırılır
 * (Play). Yalnızca gerçekten yeni olan kart belirme animasyonu oynar. */
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function captureRects(wrap) {
  const rects = new Map();
  wrap.querySelectorAll(".col[data-col-id]").forEach((el) => rects.set("k" + el.dataset.colId, el.getBoundingClientRect()));
  wrap.querySelectorAll(".card[data-card-id]").forEach((el) => rects.set("c" + el.dataset.cardId, el.getBoundingClientRect()));
  return rects;
}

function playFlip(wrap, before) {
  const still = reduceMotion();
  const slide = (el, dx, dy) => {
    if (still || Math.abs(dx) + Math.abs(dy) < 1) return;
    el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
      { duration: 300, easing: "cubic-bezier(.2,.8,.2,1)" });
  };
  // Kolon kayarsa içindeki kartlar da onunla birlikte kayar; kartın kendi
  // hareketinden kolonunkini düşmezsek kart iki kat yol alırdı.
  const colShift = new Map();
  wrap.querySelectorAll(".col[data-col-id]").forEach((el) => {
    const old = before.get("k" + el.dataset.colId); if (!old) return;
    const now = el.getBoundingClientRect();
    const d = { dx: old.left - now.left, dy: old.top - now.top };
    colShift.set(el.dataset.colId, d);
    slide(el, d.dx, d.dy);
  });
  wrap.querySelectorAll(".card[data-card-id]").forEach((el) => {
    const old = before.get("c" + el.dataset.cardId);
    if (!old) { if (!still) el.classList.add("fresh"); return; }
    const now = el.getBoundingClientRect();
    const parent = colShift.get(el.closest(".col")?.dataset.colId) || { dx: 0, dy: 0 };
    slide(el, old.left - now.left - parent.dx, old.top - now.top - parent.dy);
  });
}

/* ── Canlı imleçler ──
 * Konum kolonların kaydırılabilir alanına göre gönderilir: herkeste kolonlar
 * aynı sırada ve genişlikte olduğu için imleç karşıda da aynı karta denk gelir.
 * Saniyede en fazla 20 konum gider; aradaki hareketi CSS geçişi doldurur. */
const CURSOR_EVERY_MS = 50;
const CURSOR_IDLE_MS = 6000;   // hareketsiz imleç soluklaşır
let lastCursorPos = null, cursorPending = null, cursorTimer = null, cursorSentAt = 0;

function bindCursorTracking() {
  const cols = $("cols"); if (!cols) return;
  cols.addEventListener("pointermove", (e) => {
    const r = cols.getBoundingClientRect();
    queueCursor({ x: Math.round(e.clientX - r.left + cols.scrollLeft), y: Math.round(e.clientY - r.top + cols.scrollTop) });
  });
  cols.addEventListener("pointerleave", () => { if (!S.dragging) sendCursorGone(); });
  cols.addEventListener("scroll", () => S.cursors.forEach(placeCursor), { passive: true });
}

function queueCursor(pos, now = false) {
  lastCursorPos = pos; cursorPending = pos;
  const wait = CURSOR_EVERY_MS - (Date.now() - cursorSentAt);
  if (now || wait <= 0) flushCursor();
  else if (!cursorTimer) cursorTimer = setTimeout(flushCursor, wait);
}

function flushCursor() {
  clearTimeout(cursorTimer); cursorTimer = null;
  if (!cursorPending || !S.rt || !S.rt.cursor) return;
  S.rt.cursor({ x: cursorPending.x, y: cursorPending.y, cardId: S.dragCardId, gone: false });
  cursorSentAt = Date.now(); cursorPending = null;
}

function sendCursorGone() {
  clearTimeout(cursorTimer); cursorTimer = null; cursorPending = null; lastCursorPos = null;
  S.rt && S.rt.cursor && S.rt.cursor({ gone: true });
}

// Sekme arka plana geçince imlecimiz karşıda asılı kalmasın.
document.addEventListener("visibilitychange", () => { if (document.hidden && S.view === "board") sendCursorGone(); });

const CURSOR_ARROW = `<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M1.5 1.5 16 10.2 9.4 11.7 6.2 18.2Z" fill="var(--rc)" stroke="#0A0C10" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

function onRemoteCursor(ev) {
  // Kendi imlecim (başka sekmem) gösterilmez.
  if (!S.me || ev.userId === S.me.id) return;
  const layer = $("cursorLayer"); if (!layer) return;
  let c = S.cursors.get(ev.userId);
  if (ev.gone) {
    if (c) { clearTimeout(c.idle); c.el.remove(); S.cursors.delete(ev.userId); refreshRemoteDrags(); }
    return;
  }
  if (!c) {
    const el = document.createElement("div");
    el.className = "rcursor";
    el.innerHTML = `${CURSOR_ARROW}<span class="lbl"></span><span class="carry" hidden></span>`;
    c = { el, x: ev.x, y: ev.y, cardId: null, idle: null };
    placeCursor(c);              // ilk konumu geçişsiz ver: imleç köşeden süzülerek gelmesin
    layer.appendChild(el);
    S.cursors.set(ev.userId, c);
  }
  c.el.style.setProperty("--rc", ev.color);
  c.el.querySelector(".lbl").textContent = (ev.name || "").split(" ")[0];
  c.x = ev.x; c.y = ev.y;
  const wasCarrying = c.cardId;
  c.cardId = ev.cardId || null;
  const card = c.cardId ? findCard(c.cardId) : null;
  const carry = c.el.querySelector(".carry");
  carry.hidden = !card;
  if (card) carry.textContent = card.title;
  c.el.classList.remove("idle");
  clearTimeout(c.idle);
  c.idle = setTimeout(() => c.el.classList.add("idle"), CURSOR_IDLE_MS);
  placeCursor(c);
  if (wasCarrying !== c.cardId) refreshRemoteDrags();
}

function placeCursor(c) {
  const cols = $("cols"); if (!cols) return;
  c.el.style.transform = `translate3d(${c.x - cols.scrollLeft}px, ${c.y - cols.scrollTop}px, 0)`;
}

function findCard(cardId) {
  for (const col of S.board?.columns || []) {
    const card = col.cards.find((k) => k.id === cardId);
    if (card) return card;
  }
  return null;
}

/** Panodan ayrılan kişinin imleci de kalksın. */
function pruneCursors() {
  const here = new Set(S.presence.map((u) => u.id));
  S.cursors.forEach((c, id) => { if (!here.has(id)) { clearTimeout(c.idle); c.el.remove(); S.cursors.delete(id); } });
  refreshRemoteDrags();
}

/** Başkasının şu an taşıdığı kart: bizde soluk ve onun renginde kesik çerçeveli. */
function refreshRemoteDrags() {
  document.querySelectorAll(".card.remote-drag").forEach((el) => { el.classList.remove("remote-drag"); el.style.removeProperty("--rc"); });
  S.cursors.forEach((c) => {
    if (!c.cardId) return;
    const el = document.querySelector(`.card[data-card-id="${c.cardId}"]`);
    if (el) { el.classList.add("remote-drag"); el.style.setProperty("--rc", c.el.style.getPropertyValue("--rc")); }
  });
}

function flash(cardId) {
  const el = document.querySelector(`.card[data-card-id="${cardId}"]`);
  if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 950); }
}

let actTimer = null;
/**
 * Bir olay olduğunda hareket listesini ve akış ölçümünü tazeler.
 * Kısa bekleme (debounce), art arda gelen olaylarda tek istek atılmasını sağlar.
 * Geçmiş modundayken atlanır: orada pano şimdiki zamanı göstermiyor.
 */
function loadActivity() {
  clearTimeout(actTimer);
  actTimer = setTimeout(async () => {
    if (!S.board || S.history.active) return;
    try { S.activity = await api.activity(S.board.id); renderActivity(); } catch (_) {}
    loadFlow();
  }, 350);
}

/* ── Üyeler ── */
function renderMembers() {
  const box = $("memList"); if (!box) return;

  // Bu çizimde YENİ olan satırlar: yalnızca onlar belirme animasyonu alır. İlk
  // çizimde (hafıza boşken) hiçbiri animasyon almaz — pano açılışı sakin kalsın.
  const seen = S.memberRows, now = new Set();
  const fresh = (key) => { now.add(key); return seen.size && !seen.has(key) ? " fresh" : ""; };
  const here = new Set(S.presence.map((u) => u.id));   // yeşil nokta: şu an bu panoda

  box.innerHTML = "";
  S.members.forEach((m) => {
    const name = `${m.firstName || ""} ${m.lastName || ""}`.trim() || m.email;
    const isMe = m.email === S.me?.email;
    const row = document.createElement("div");
    row.className = "mem" + fresh("m" + m.id);
    const on = here.has(m.id);
    row.innerHTML = `<span class="av-dot${on ? " on" : ""}" title="${t(on ? "members.here" : "members.notHere")}">${avatar(name, 28, "", m.avatarUrl)}</span>
      <div class="n"><b>${esc(name)}${isMe ? t("members.you") : ""}</b><small>${esc(m.email)}</small></div>
      <span class="badge ${m.role}">${roleLabel(m.role)}</span>
      ${isOwner() && !isMe ? `<button class="icon-btn rm" title="${t("members.remove")}">${I.close}</button>` : ""}`;
    row.querySelector(".rm")?.addEventListener("click", async () => {
      try {
        await api.removeMember(S.board.id, m.id);
        toast(t("members.removed"), name, "ok");
        S.members = await api.members(S.board.id); renderMembers(); updateConn();
      } catch (e) { toast(t("members.removeFailed"), e.message, "err"); }
    });
    box.appendChild(row);
  });

  // Bekleyen davetler — e-posta adresleri içerdiği için yalnızca yönetici görür.
  if (isOwner() && S.pending.length) {
    box.insertAdjacentHTML("beforeend", `<div class="pending-title">${t("members.pending", { count: S.pending.length })}</div>`);
    S.pending.forEach((p) => {
      const row = document.createElement("div");
      row.className = "mem" + fresh("p" + p.id);
      const label = p.inviteeName || p.email;
      row.innerHTML = `${avatar(label, 30, p.hasAccount ? "" : "opacity:.55", p.inviteeAvatarUrl)}
        <div class="n"><b>${esc(label)}</b><small>${p.hasAccount ? esc(p.email) : t("members.noAccount")}</small></div>
        <div class="badges"><span class="badge ${p.role}">${roleLabel(p.role)}</span><span class="badge PENDING">${t("members.pendingBadge")}</span></div>
        <button class="icon-btn rm" title="${t("members.withdraw")}">${I.close}</button>`;
      row.querySelector(".rm").addEventListener("click", async () => {
        try {
          await api.cancelInvitation(S.board.id, p.id);
          toast(t("members.withdrawn"), p.email);
          loadPending();
        } catch (e) { toast(t("members.withdrawFailed"), e.message, "err"); }
      });
      box.appendChild(row);
    });
  }
  S.memberRows = now;
  const mc = $("memCount"); if (mc) mc.textContent = S.members.length;
}

async function loadPending() {
  if (!S.board || !isOwner()) { S.pending = []; return; }
  try { S.pending = await api.pendingInvitations(S.board.id); } catch (_) { S.pending = []; }
  renderMembers();
}

/**
 * Üye listesi değişti (biri katıldı, çıkarıldı, rolü değişti) — kendi rolümü de
 * yeniden hesaplarım: çıkarıldıysam panodan çıkarım, rolüm değiştiyse ekran
 * yeni yetkiyle yeniden çizilir.
 */
async function reloadMembers() {
  if (!S.board) return;
  const id = S.board.id;
  try {
    S.members = await api.members(id);
  } catch (e) {
    if (e.status === 403) { toast(t("members.removedYou"), S.board.name, "warn"); goHome(); }
    return;
  }
  const mine = S.members.find((m) => m.email === S.me?.email);
  if (mine && mine.role !== S.boardRole) {
    S.boardRole = mine.role;
    toast(t("members.roleChanged"), t("members.roleChangedBody", { board: S.board.name, role: roleAs(mine.role) }));
    renderBoard(); loadPending();
  } else {
    renderMembers(); updateConn();
  }
  loadActivity();
}

/* ══════════════════ Zaman yolculuğu ══════════════════ */
// Geçmiş modundayken pano SALT OKUNUR olur: geçmişe kart eklemek anlamsız
// olurdu ve iyimser arayüz o anı "şimdi" sanardı.
async function toggleHistory() {
  if (S.history.active) return exitHistory();
  try {
    S.history.timeline = await api.timeline(S.board.id);
  } catch (e) { return toast(t("history.loadFailed"), e.message, "err"); }

  if (!S.history.timeline.length) {
    return toast(t("history.empty"), t("history.emptyBody"));
  }
  S.history.active = true;
  S.history.index = S.history.timeline.length - 1;   // en yeni andan başla
  $("timebar").classList.remove("hidden");
  $("timebar").classList.add("on");
  $("board")?.classList.add("past");
  renderTimebar(); syncTabs();
  jumpTo(S.history.index);
}

async function exitHistory() {
  S.history.active = false;
  $("timebar").classList.add("hidden");
  $("board")?.classList.remove("past");
  syncTabs();
  await refreshBoard();          // bugüne dön
  renderColumns();
}

function renderTimebar() {
  const line = S.history.timeline;
  const cur = line[S.history.index];
  $("timebar").innerHTML = `
    <span class="hist-pill">${I.clockBig} ${t("history.pill")}</span>
    <input type="range" min="0" max="${line.length - 1}" value="${S.history.index}" id="timeSlider">
    <div class="moment">
      <div><b>${esc(cur.actorName)}</b> ${esc(activityText(cur))}</div>
      <div class="when">${fmtDateTime(cur.createdAt)} · ${S.history.index + 1}/${line.length}</div>
    </div>
    <button class="btn btn-primary" id="histExit" style="padding:8px 14px;font-size:13px">${t("history.backToNow")}</button>`;
  $("timeSlider").addEventListener("input", (e) => jumpTo(Number(e.target.value)));
  $("histExit").onclick = exitHistory;
}

let jumpTimer = null;
/** Kaydırıcı hareket ederken her adımda istek atmamak için kısa bekleme. */
function jumpTo(index) {
  S.history.index = index;
  renderTimebar();
  clearTimeout(jumpTimer);
  jumpTimer = setTimeout(async () => {
    const moment = S.history.timeline[index];
    try {
      S.board = await api.history(S.board.id, moment.id);
      renderColumns();
    } catch (e) { toast(t("history.jumpFailed"), e.message, "err"); }
  }, 120);
}

/* ══════════════════ Akış sağlığı ══════════════════ */
async function loadFlow() {
  if (!S.board) return;
  try { S.flow = await api.flow(S.board.id); renderFlow(); }
  catch (_) { /* akış ölçümü ikincil: hata panoyu bozmasın */ }
}

// Saniyeyi okunur süreye çeviren humanDuration i18n.js'ten gelir (duration): 45 sn / 12 dk / 3,5 sa / 2,0 gün.
const DAY = 86400;

/**
 * Kolon çubuğunun rengi: ilk kolon (bekleyen iş) gri, son kolon (biten) yeşil,
 * darboğaz kırmızı, arası mavi. Ana ekrandaki pano çubuğuyla aynı dil.
 */
function flowColor(f, c, i) {
  if (c.columnId === f.bottleneckColumnId) return "var(--err-ink)";
  if (i === f.columns.length - 1) return "var(--ok)";
  return i === 0 ? "var(--ink-4)" : "var(--blue)";
}

/** Akış ölçümü geldi: araç çubuğundaki sayılar ve (açıksa) Akış sekmesi tazelenir. */
function renderFlow() {
  renderBoardStats();
  if (S.tab === "flow") renderFlowView();
}


/** Akış sekmesi: aynı ölçüm, panonun tam genişliğinde ve açıklamalı. */
function renderFlowView() {
  const box = $("flowView"); if (!box) return;
  const f = S.flow;
  if (!f) {
    box.innerHTML = `<div class="ov-stats three">${'<div class="skel ov-skel-stat"></div>'.repeat(3)}</div><div class="skel ov-skel-list"></div>`;
    return;
  }
  const bn = f.columns.find((c) => c.columnId === f.bottleneckColumnId);
  const open = S.board ? S.board.columns.slice(0, -1).reduce((n, c) => n + c.cards.length, 0) : 0;
  const max = Math.max(1, ...f.columns.map((c) => c.avgDwellSeconds || 0));
  const wip = (id) => S.board?.columns.find((c) => c.id === id)?.wipLimit;
  const stat = (label, n, hint, cls = "", word = false) => `<div class="ov-stat ${cls}"><p class="k">${label}</p>
    <div class="row"><p class="n${word ? " word" : ""}">${n}</p></div><p class="hn">${hint}</p></div>`;

  box.innerHTML = `
    <div class="fv-head"><h2>${t("flow.title")}</h2>
      <p>${t("flow.sub")}</p></div>
    <div class="ov-stats three">
      ${stat(t("flow.cycle"), humanDuration(f.averageCycleTimeSeconds), t("flow.cycleHint"), "", true)}
      ${stat(t("flow.bottleneck"), bn ? esc(bn.name) : t("flow.none"), bn ? t("flow.bottleneckHint", { duration: humanDuration(bn.avgDwellSeconds) }) : t("flow.noBottleneck"), bn ? "alert" : "", true)}
      ${stat(t("flow.open"), open, t("flow.openHint"))}
    </div>
    <div class="fv-grid">
      <section class="ov-card pad"><h2>${t("flow.dwell")}</h2>
        <div style="margin-top:8px">${f.columns.map((c, i) => `
          <div class="fv-row ${c.columnId === f.bottleneckColumnId ? "bottleneck" : ""}">
            <span class="nm" title="${esc(c.name)}">${esc(c.name)}</span>
            <span class="c">${wip(c.columnId) ? t("flow.cardsWip", { count: c.cardCount, wip: wip(c.columnId) }) : t("flow.cards", { count: c.cardCount })}</span>
            <span class="bar"><i style="width:${c.avgDwellSeconds ? Math.max(3, Math.round((c.avgDwellSeconds / max) * 100)) : 0}%;background:${flowColor(f, c, i)}"></i></span>
            <span class="v">${humanDuration(c.avgDwellSeconds)}</span>
          </div>`).join("")}</div>
        <p class="ov-note">${t("flow.redNote")}</p>
      </section>
      <section class="ov-card pad" id="fvAging"><h2>${t("flow.aging")} <span class="cnt">${(f.aging || []).length}</span></h2></section>
    </div>`;
  const ag = $("fvAging");
  const list = (f.aging || []).slice(0, 15);
  ag.insertAdjacentHTML("beforeend", list.length ? `<div class="ag-list">${list.map((g) => {
      const tone = g.ageSeconds >= 7 * DAY ? "hot" : g.ageSeconds >= 3 * DAY ? "warm" : "";
      const who = g.assigneeId ? memberById(g.assigneeId) : null;
      return `<button class="ag-row" data-card="${g.cardId}"><span class="tx"><span class="tt">${esc(g.title)}</span>
        <span class="wh">${esc(g.columnName)}${who ? " · " + esc(memberName(who)) : ""}</span></span>
        <span class="age ${tone}">${humanDuration(g.ageSeconds)}${g.estimated ? "~" : ""}</span></button>`;
    }).join("")}</div>`
    : `<p class="ov-note">${t("flow.agingEmpty")}</p>`);
  ag.querySelectorAll("[data-card]").forEach((r) => r.addEventListener("click", () => showCard(Number(r.dataset.card))));
}

/** Kartı panoda göster: Pano sekmesine geç, karta kaydır ve kısa bir parlamayla işaretle. */
async function showCard(cardId) {
  if (S.tab !== "board" || S.history.active) await setTab("board");
  if (activeFilter()) { S.filter = { q: "", mine: false, overdue: false, assignee: "" }; renderFilters(); renderColumns(); }
  focusCardEl(cardId);
}

function focusCardEl(cardId) {
  requestAnimationFrame(() => {
    const el = document.querySelector(`.card[data-card-id="${cardId}"]`);
    if (!el) return;
    el.scrollIntoView({ block: "center", inline: "center", behavior: reduceMotion() ? "auto" : "smooth" });
    flash(cardId);
  });
}

/* ── Hareketler ── */

/**
 * Geçmiş satırının cümlesi, arayüzün dilinde. Sunucu türü ve cümlenin parçalarını
 * (params: kart, kolon, rol...) verir; params'ı olmayan eski satırda ya da
 * tanınmayan türde sunucunun Türkçe açıklaması gösterilir (ADR 0020).
 */
function activityText(a) {
  const p = a.params;
  if (!p) return a.description || "";
  if (a.type === "EDIT_CARD" && p.from != null) return t("activity.EDIT_CARD_TITLE", p);
  if (a.type === "SET_WIP_LIMIT" && p.limit == null) return t("activity.SET_WIP_LIMIT_OFF", p);
  if (a.type === "MEMBER_JOINED") return t("activity.MEMBER_JOINED", { role: roleAs(p.role) });
  // Adsız etiket adıyla değil rengiyle anılır: "yeşil etiketi ekledi".
  if (/^(ADD|REMOVE|DELETE)_LABEL$/.test(a.type) && p.label == null && p.color) {
    return t("activity." + a.type + "_COLOR", { ...p, color: colorWord(p.color) });
  }
  return has("activity." + a.type) ? t("activity." + a.type, p) : a.description || "";
}

function renderActivity() {
  const box = $("actList"); if (!box) return;
  if (!S.activity.length) {
    box.innerHTML = `<div class="side-empty"><div style="margin-bottom:8px">${I.clockBig}</div>
      <b style="display:block;color:var(--ink-2)">${t("activity.empty")}</b>
      <div style="margin-top:3px">${t("activity.emptyHint")}</div></div>`;
    return;
  }
  box.innerHTML = "";
  groupActivity(S.activity).forEach((g, i) => {
    const row = document.createElement("div");
    row.className = "act";
    const open = S.openGroups.has(i);

    row.innerHTML = `${avatar(g.actorName, 24, "", g.actorAvatarUrl)}
      <div style="min-width:0;flex:1">
        <div class="b"><b>${esc(g.actorName)}</b> ${esc(activityText(g))}</div>
        <div class="t">${relTime(g.createdAt)}${g.items.length > 1 ? ` · ${t("activity.count", { count: g.items.length })}` : ""}</div>
        ${open ? `<div class="act-detail">${g.items.map((a) =>
            `<div><span>${esc(activityText(a))}</span><i>${relTime(a.createdAt)}</i></div>`).join("")}</div>` : ""}
      </div>
      ${g.items.length > 1 ? `<button class="act-toggle" title="${t(open ? "activity.hide" : "activity.showAll")}">
          ${open ? t("activity.hide") : g.items.length + " ▾"}</button>` : ""}`;

    row.querySelector(".act-toggle")?.addEventListener("click", () => {
      if (S.openGroups.has(i)) S.openGroups.delete(i); else S.openGroups.add(i);
      renderActivity();
    });
    box.appendChild(row);
  });
}

/**
 * Art arda gelen benzer hareketleri tek satırda toplar.
 *
 * Bir kartı ileri geri taşımak akışta onlarca satır üretir ve liste okunamaz hâle
 * gelir. Aynı kişinin peş peşe yaptığı aynı türden hareketler tek satırda, sayısıyla
 * gösterilir; en son yaptığı görünür. Tam döküm zaman çizelgesinde durmaya devam eder.
 */
function groupActivity(items) {
  const out = [];
  for (const a of items) {
    const prev = out[out.length - 1];
    if (prev && prev.actorName === a.actorName && prev.type === a.type) {
      prev.items.push(a);   // grubun altında saklanır; düğmeyle açılabilir
      continue;             // liste en yeniden eskiye geldiği için ilki en günceli
    }
    out.push({ ...a, items: [a] });
  }
  return out;
}

/* ══════════════════ Komut paleti (Ctrl K) ══════════════════ */
/**
 * Her yerden arama: panolar anında (bellekteki listeden), kartlar sunucudan
 * (GET /api/search — yalnızca erişebildiğin panolarda), komutlar da aynı listede.
 * Yazdıkça eski istek sonuçları gelirse atılır (seq): ekranda hep son sorgu kalır.
 */
const PAL = { items: [], idx: 0, seq: 0, timer: null, remote: null, q: "" };

function openPalette() {
  if (!S.me || document.querySelector(".pal-ov")) return;
  closePops();
  const ov = document.createElement("div");
  ov.className = "pal-ov";
  ov.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="${t("palette.label")}">
    <div class="pal-in">${I.search}<input id="palQ" placeholder="${t("palette.placeholder")}" autocomplete="off" spellcheck="false"
      role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list"><span class="kbd">Esc</span></div>
    <div class="pal-list" id="palList" role="listbox"></div>
    <div class="pal-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> ${t("palette.move")}</span><span><span class="kbd">Enter</span> ${t("palette.open")}</span>
      <span><span class="kbd">Esc</span> ${t("palette.close")}</span></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) closePalette(); });
  const input = ov.querySelector("#palQ");
  input.addEventListener("input", () => palQuery(input.value));
  input.addEventListener("keydown", palKey);
  PAL.remote = null; PAL.idx = 0;
  palQuery("");
  input.focus();
}

function closePalette() {
  clearTimeout(PAL.timer); PAL.seq++;
  document.querySelector(".pal-ov")?.remove();
}

function palCommands() {
  const onBoard = S.view === "board" && S.board;
  const list = [
    { label: t("palette.goHome"), hint: "G H", icon: I.home, run: goHome },
    { label: t("palette.newBoard"), hint: S.view === "home" ? "N" : "", icon: I.kanbanSm, run: () => createModal("board") },
    { label: t("palette.newWorkspace"), icon: I.grid, run: () => createModal("workspace") },
    { label: t("palette.invite"), icon: I.userPlus, run: () => inviteModal(onBoard && isOwner() ? S.board.id : null) },
  ];
  if (onBoard) {
    if (canEdit()) list.push({ label: t("palette.newCard"), hint: "N", icon: I.plus, run: newCardShortcut });
    list.push({ label: t("palette.history"), icon: I.clockSm, run: () => setTab("hist") });
    list.push({ label: t("palette.flow"), icon: I.pulse, run: () => setTab("flow") });
    if (isOwner()) list.push({ label: t("palette.hooks"), icon: I.hook, run: openChatHooks });
  }
  list.push(
    { label: t(isLight() ? "theme.toDark" : "theme.toLight"), icon: isLight() ? I.moon : I.sun, run: toggleTheme },
    { label: t("common.profile"), icon: I.user, run: goProfile },
    { label: t("common.signOut"), icon: I.logout, run: logout },
  );
  return list;
}

/** Eşleşen kısmı vurgular; önce kaçışlanır, sonra işaretlenir (HTML enjeksiyonu olmaz). */
function hl(text, q) {
  const s = String(text ?? "");
  if (!q) return esc(s);
  const i = fold(s).indexOf(q);
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length));
}

function palQuery(raw) {
  const q = fold(raw.trim());
  PAL.q = q;
  const hit = (s) => fold(s || "").includes(q);

  // Panolar: bellekteki liste anında; sunucu sonucu gelince ona eklenir.
  const boards = q ? S.boards.filter((b) => hit(b.name)) : [];
  const recent = q ? [] : recentBoards().map((r) => S.boards.find((b) => b.id === r.id) || r).slice(0, 4);
  const cmds = palCommands().filter((c) => !q || hit(c.label));
  const remote = PAL.remote && PAL.remote.q === q ? PAL.remote : null;
  if (remote) remote.boards.forEach((b) => { if (!boards.some((x) => x.id === b.id)) boards.push(b); });
  // "STR-42" ya da "42": kartın anahtarı (ADR 0021). Sunucu o kartı listenin başına koyar.
  const keyId = parseCardKey(raw);
  // Sunucu araması yoksa (eski sürüm) ya da henüz gelmediyse açık panonun kartlarında ara.
  let cards = remote ? remote.cards : [];
  if (!remote && q && S.view === "board" && S.board) {
    cards = S.board.columns.flatMap((col) => col.cards.filter((c) => c.id === keyId || hit(c.title) || hit(c.description))
      .map((c) => ({ cardId: c.id, title: c.title, boardId: S.board.id, boardName: S.board.name, columnName: col.name })))
      .sort((a, b) => (b.cardId === keyId) - (a.cardId === keyId)).slice(0, 8);
  }
  // Açık panoda etiket adı da aranır: "acil" yazınca Acil etiketli kartlar gelir.
  if (q && S.view === "board" && S.board?.labels?.length) {
    const named = new Map(S.board.labels.filter((l) => l.name && hit(l.name)).map((l) => [l.id, l.name]));
    if (named.size) {
      const extra = S.board.columns.flatMap((col) => col.cards
        .filter((c) => !cards.some((x) => x.cardId === c.id) && (c.labelIds || []).some((id) => named.has(id)))
        .map((c) => ({ cardId: c.id, title: c.title, boardId: S.board.id, boardName: S.board.name,
          columnName: col.name + " · " + named.get(c.labelIds.find((id) => named.has(id))) })));
      cards = cards.concat(extra).slice(0, 8);
    }
  }
  const keyHit = keyId !== null && cards[0]?.cardId === keyId;

  const items = [];
  const sec = (title, list, map) => { if (list.length) items.push({ sec: title }, ...list.map(map)); };
  const cardSec = () => sec(t("palette.cards"), cards, (c) => {
    const exact = keyHit && c.cardId === keyId;
    return { icon: I.cardSm, label: c.title, sub: `${c.boardName} · ${c.columnName}`, key: c.key || cardKey(c.cardId), exact,
      // Anahtarla aranan kart doğrudan açılır; başlıkla bulunan panoda gösterilir.
      run: () => openBoard(c.boardId, exact ? { openCard: c.cardId } : { focusCard: c.cardId }) };
  });
  if (keyHit) cardSec();
  sec(t("palette.recent"), recent, (b) => ({ icon: `<span class="sq" style="background:${colorOf(b.name)}"></span>`, label: b.name, sub: b.workspaceName || "", run: () => openBoard(b.id) }));
  sec(t("palette.boards"), boards.slice(0, 8), (b) => ({ icon: `<span class="sq" style="background:${colorOf(b.name)}"></span>`, label: b.name,
    sub: [b.workspaceName, b.role ? roleName(b.role).toLocaleLowerCase(locale()) : ""].filter(Boolean).join(" · "), run: () => openBoard(b.id) }));
  if (!keyHit) cardSec();
  sec(t("palette.commands"), cmds.slice(0, q ? 6 : 12), (c) => ({ icon: c.icon, label: c.label, hint: c.hint, run: c.run }));

  PAL.items = items;
  PAL.idx = items.findIndex((x) => !x.sec);
  // Anahtar tek rakam da olabilir ("7"); metin araması ise en az 2 karakter.
  const ask = (q.length >= 2 || keyId !== null) && typeof api.search === "function" && !remote;
  renderPalette(q, ask);

  // Sunucu araması: kısa bekleme, art arda tuşlarda tek istek.
  clearTimeout(PAL.timer);
  if (ask) {
    const seq = ++PAL.seq;
    PAL.timer = setTimeout(async () => {
      try {
        const r = await api.search(raw.trim());
        if (seq !== PAL.seq || !document.querySelector(".pal-ov")) return;
        PAL.remote = { q, boards: r.boards || [], cards: r.cards || [] };
        palQuery($("palQ").value);
      } catch (_) { /* arama ikincil: yerel sonuçlar kalır */ }
    }, 160);
  }
}

function renderPalette(q, searching) {
  const box = $("palList"); if (!box) return;
  const rows = PAL.items.map((it, i) => it.sec
    ? `<div class="pal-sec">${it.sec}</div>`
    : `<button class="pal-it${i === PAL.idx ? " on" : ""}" role="option" aria-selected="${i === PAL.idx}" data-i="${i}">${it.icon || ""}
        <span class="tx"><span class="tt">${hl(it.label, q)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</span>
        ${it.key ? `<span class="pal-key${it.exact ? " hit" : ""}">${esc(it.key)}</span>` : ""}
        ${it.hint ? `<span class="kbd">${esc(it.hint)}</span>` : ""}</button>`).join("");
  box.innerHTML = rows || `<div class="pal-empty">${searching ? t("palette.searching") : t("palette.noResults", { q: esc(q) })}</div>`;
  if (rows && searching) box.insertAdjacentHTML("beforeend", `<div class="pal-empty" style="padding:10px">${t("palette.searchingCards")}</div>`);
  box.querySelectorAll("[data-i]").forEach((b) => {
    b.addEventListener("mousemove", () => { if (PAL.idx !== Number(b.dataset.i)) { PAL.idx = Number(b.dataset.i); markPalette(); } });
    b.addEventListener("click", () => runPalette(Number(b.dataset.i)));
  });
}

function markPalette() {
  document.querySelectorAll(".pal-it").forEach((el) => {
    const on = Number(el.dataset.i) === PAL.idx;
    el.classList.toggle("on", on); el.setAttribute("aria-selected", String(on));
    if (on) el.scrollIntoView({ block: "nearest" });
  });
}

function palKey(e) {
  const step = (d) => {
    const n = PAL.items.length; if (!n) return;
    let i = PAL.idx;
    do { i = (i + d + n) % n; } while (PAL.items[i].sec && i !== PAL.idx);
    PAL.idx = i; markPalette();
  };
  if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (e.key === "Enter") { e.preventDefault(); if (PAL.idx >= 0) runPalette(PAL.idx); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
}

function runPalette(i) {
  const it = PAL.items[i]; if (!it || it.sec) return;
  closePalette();
  it.run();
}

/* ── Klavye kısayolları ──
 * Ctrl/⌘ K her yerde (yazarken bile) paleti açar. Tek tuşlu kısayollar ise yalnızca
 * bir alana yazılmıyorken ve pencere açık değilken çalışır; yoksa kart başlığına
 * "n" yazan kişi her seferinde yeni kart açardı. */
let gPressedAt = 0;
document.addEventListener("keydown", (e) => {
  if (!S.me || S.view === "auth" || S.view === "landing") return;
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.querySelector(".pal-ov") ? closePalette() : openPalette();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.target.closest?.("input, textarea, select, [contenteditable='true']")) return;
  if ($("modal-root").firstElementChild || document.querySelector(".pal-ov, .pop")) return;
  const k = e.key.toLocaleLowerCase("tr");
  if (k === "g") { gPressedAt = Date.now(); return; }
  if (k === "h" && Date.now() - gPressedAt < 1200) { gPressedAt = 0; e.preventDefault(); goHome(); return; }
  if (k === "n") { e.preventDefault(); newCardShortcut(); }
});

/** N: panodaysa ilk kolona kart yazma kutusu açar; ana ekrandaysa yeni pano. */
function newCardShortcut() {
  if (S.view === "home") return createModal("board");
  if (S.view !== "board" || !S.board || !canEdit()) return;
  if (S.tab !== "board") setTab("board");
  const col = S.board.columns[0]; if (!col) return;
  const foot = document.querySelector(`.col[data-col-id="${col.id}"] .col-foot`); if (!foot) return;
  openComposer(foot, col.id);
  foot.scrollIntoView({ block: "nearest", inline: "nearest" });
}

/* ══════════════════ Davet penceresi ══════════════════ */
/**
 * Ekibini davet et: pano içinden açılırsa o panoya, ana ekrandan açılırsa
 * yöneticisi olduğun panolardan seçilene. Davet doğrudan üyelik açmaz; kişi
 * kabul edince üye listesine canlı olarak geçer.
 */
/* ══════════════════ Kanal bildirimleri (ADR 0023) ══════════════════ */
// Panoda seçilen olaylar Slack, Microsoft Teams ya da Discord kanalına kısa bir mesaj
// olarak gider. Yalnızca pano yöneticisi görür ve değiştirir. Adres sunucuda şifreli;
// tarayıcı onu bir kez gönderir, sonra yalnızca son 4 karakterini (urlHint) görür.
const HOOK_APPS = { SLACK: "Slack", TEAMS: "Microsoft Teams", DISCORD: "Discord" };
const HOOK_EVENTS = ["CARD_CREATED", "CARD_DONE", "COMMENT_ADDED", "CARD_ASSIGNED"];
const HOOK_MARK = { SLACK: "#", TEAMS: "T", DISCORD: "D" };
const hookIcon = (p, cls = "") => `<span class="hk-ico ${p} ${cls}" aria-hidden="true">${HOOK_MARK[p] || "?"}</span>`;
const hookName = (h) => h.label || HOOK_APPS[h.provider] || h.provider;
/** Kanalın cevabı: "Kanal mesajı reddetti. (HTTP 403)". */
const hookOutcome = (r) => t("hooks.outcome." + r.outcome) + (r.status ? ` (HTTP ${r.status})` : "");

function openChatHooks() {
  if (!S.board || !isOwner()) return;
  closePops(); closePalette();
  // Pencerenin durumu: liste, açık form (ekleme ya da düzenleme), silme onayı bekleyen satır.
  const H = { boardId: S.board.id, hooks: [], max: 5, status: "loading", message: "", form: null, confirm: null };
  openModal(`<div class="modal hk" role="dialog" aria-modal="true" aria-labelledby="hkTitle">
    <h3 id="hkTitle">${t("hooks.title")}</h3>
    <p class="sub">${t("hooks.sub")}</p>
    <div id="hkBody"></div>
    <div class="acts"><div class="spacer"></div><button class="btn btn-ghost" id="hkClose">${t("common.close")}</button></div>
  </div>`, (o) => {
    const body = o.querySelector("#hkBody");
    const alive = () => document.body.contains(o);
    o.querySelector("#hkClose").onclick = closeModal;

    const blankForm = () => ({ id: null, provider: "SLACK", url: "", label: "", locale: locale(),
      events: new Set(["CARD_CREATED", "CARD_DONE"]), guide: false, note: null });
    const editForm = (h) => ({ id: h.id, provider: h.provider, url: "", label: h.label || "", locale: h.locale,
      events: new Set(h.events), guide: false, note: null });
    const focus = (sel) => (o.querySelector(sel) || o.querySelector("#hkClose"))?.focus();

    async function load(then) {
      try {
        const r = await api.chatHooks(H.boardId);
        H.hooks = r.hooks; H.max = r.maxHooks; H.status = "ready";
        // Düzenlenen bağlantı bu arada silinmişse (başka bir yönetici) formu kapat.
        if (H.form?.id != null && !H.hooks.some((h) => h.id === H.form.id)) H.form = null;
        if (!H.hooks.length && !H.form) H.form = blankForm();
      } catch (e) {
        // 503: sunucuda şifreleme anahtarları yok. Mesaj sunucudan, isteğin dilinde.
        H.status = e.status === 503 ? "off" : "failed"; H.message = e.message;
      }
      if (!alive()) return;
      render();
      focus(then || (H.form ? "#hkUrl" : "#hkAdd"));
    }

    function render() {
      if (H.status === "loading") { body.innerHTML = `<div class="hk-empty">${t("common.loading")}</div>`; return; }
      if (H.status !== "ready") {
        body.innerHTML = `<div class="hk-off" role="alert">${I.warnCircle}<div>
          <b>${t(H.status === "off" ? "hooks.unavailable" : "hooks.loadFailed")}</b>${esc(H.message)}
          ${H.status === "failed" ? `<div><button class="btn-ghost btn-sm" id="hkRetry">${t("common.retry")}</button></div>` : ""}</div></div>`;
        o.querySelector("#hkRetry")?.addEventListener("click", () => { H.status = "loading"; render(); load(); });
        return;
      }
      body.innerHTML = `<p class="hk-warn">${I.eye}<span>${t("hooks.warn")}</span></p>
        ${H.hooks.length ? `<ul class="hk-list" aria-label="${t("hooks.list")}">${H.hooks.map(rowHtml).join("")}</ul>`
          : H.form ? "" : `<div class="hk-empty">${t("hooks.empty")}</div>`}
        ${H.form ? formHtml()
          : H.hooks.length >= H.max ? `<p class="hint hk-full">${t("hooks.limit", { max: H.max })}</p>`
          : `<button class="btn btn-ghost hk-add" id="hkAdd">${I.plus} ${t("hooks.add")}</button>`}`;
      bind();
    }

    function rowHtml(h) {
      const name = esc(hookName(h));
      const status = !h.active ? `<span class="hk-st off"><i></i>${t("hooks.off")}</span>`
        : h.failureCount ? `<span class="hk-st warn"><i></i>${t("hooks.failing", { count: h.failureCount })}</span>`
        : `<span class="hk-st on"><i></i>${t("hooks.on")}</span>`;
      const when = h.lastSentAt ? t("hooks.lastSent", { time: relTime(h.lastSentAt) }) : t("hooks.neverSent");
      const meta = [h.label ? HOOK_APPS[h.provider] : "", when, t("hooks.langName." + h.locale)].filter(Boolean).join(" · ");
      const acts = H.confirm === h.id
        ? `<span class="q">${t("hooks.confirmRemove")}</span>
           <button class="btn btn-danger btn-sm" data-a="del-yes" data-id="${h.id}">${t("hooks.remove")}</button>
           <button class="btn-ghost btn-sm" data-a="del-no" data-id="${h.id}">${t("common.cancel")}</button>`
        : `<button class="btn-ghost btn-sm" data-a="test" data-id="${h.id}" aria-label="${t("hooks.testOf", { name })}">${t("hooks.testShort")}</button>
           <button class="btn-ghost btn-sm" data-a="edit" data-id="${h.id}" aria-label="${t("hooks.editOf", { name })}">${t("hooks.edit")}</button>
           <button class="btn-ghost btn-sm" data-a="del" data-id="${h.id}" aria-label="${t("hooks.removeOf", { name })}">${t("hooks.remove")}</button>`;
      return `<li class="hk-row${H.form?.id === h.id ? " editing" : ""}" data-hook="${h.id}">
        ${hookIcon(h.provider)}
        <div class="hk-main">
          <div class="hk-top"><b>${name}</b><span class="hk-hint" title="${t("hooks.hint")}">…${esc(h.urlHint)}</span>${status}</div>
          <div class="hk-ev">${HOOK_EVENTS.filter((e) => h.events.includes(e)).map((e) => `<span class="chip">${t("hooks.chip." + e)}</span>`).join("")}</div>
          <div class="hk-meta">${esc(meta)}</div>
          ${h.active ? "" : `<div class="hk-why">${t("hooks.reason." + h.disabledReason)}</div>
            <button class="btn btn-primary btn-sm hk-reopen" data-a="reopen" data-id="${h.id}">${t("hooks.reopen")}</button>`}
        </div>
        <div class="hk-acts">${acts}</div>
      </li>`;
    }

    function formHtml() {
      const f = H.form, edit = f.id != null, cur = edit ? H.hooks.find((h) => h.id === f.id) : null;
      // "Bitti" panonun son kolonu; adı neyse onu söyle (tek kolonlu panoda son kolon "bitti" sayılmaz).
      const cols = S.board?.columns || [];
      const last = cols.length > 1 ? cols[cols.length - 1].name : null;
      const evText = (e) => e !== "CARD_DONE" ? t("hooks.ev." + e)
        : last ? `${t("hooks.ev.CARD_DONE", { column: `<b>${esc(last)}</b>` })} <small>(${t("hooks.doneHint")})</small>`
        : t("hooks.ev.CARD_DONE_ANY");
      const steps = [1, 2, 3, 4].filter((n) => has(`hooks.steps.${f.provider}.${n}`))
        .map((n) => `<li>${t(`hooks.steps.${f.provider}.${n}`)}</li>`).join("");
      return `<form class="hk-form" id="hkForm" novalidate aria-labelledby="hkFormTitle">
        <h4 id="hkFormTitle">${edit ? t("hooks.editTitle", { name: esc(hookName(cur)) }) : t("hooks.addTitle")}</h4>
        <span class="label" id="hkAppLabel">${t("hooks.app")}</span>
        <div class="hk-seg" role="radiogroup" aria-labelledby="hkAppLabel">
          ${Object.keys(HOOK_APPS).map((p) => `<label class="${f.provider === p ? "on" : ""}">
            <input type="radio" name="hkApp" value="${p}" ${f.provider === p ? "checked" : ""} ${edit ? "disabled" : ""}>
            ${hookIcon(p, "sm")}<span>${HOOK_APPS[p]}</span></label>`).join("")}
        </div>
        <label class="label" for="hkUrl">${t("hooks.url")}</label>
        <input class="field hk-url" id="hkUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" value="${esc(f.url)}"
          placeholder="${esc(edit ? t("hooks.urlNewPh") : t("hooks.urlPh." + f.provider))}" aria-describedby="hkUrlHint">
        <div class="hint" id="hkUrlHint">${edit ? t("hooks.urlKeep", { hint: esc(cur.urlHint) }) : t("hooks.urlHint")}</div>
        <details class="hk-guide" id="hkGuide" ${f.guide ? "open" : ""}>
          <summary>${t("hooks.guide." + f.provider)}</summary><ol>${steps}</ol></details>
        <div class="hk-two">
          <div><label class="label" for="hkLabel">${t("hooks.label")}</label>
            <input class="field" id="hkLabel" maxlength="60" autocomplete="off" value="${esc(f.label)}" placeholder="${t("hooks.labelPh")}"></div>
          <div><label class="label" for="hkLang">${t("hooks.lang")}</label>
            <select class="field" id="hkLang">${["tr", "en"].map((l) =>
              `<option value="${l}" ${f.locale === l ? "selected" : ""}>${t("hooks.langName." + l)}</option>`).join("")}</select></div>
        </div>
        <fieldset class="hk-checks"><legend class="label">${t("hooks.events")}</legend>
          ${HOOK_EVENTS.map((e) => `<label class="hk-check"><input type="checkbox" value="${e}" ${f.events.has(e) ? "checked" : ""}>
            <span>${evText(e)}</span></label>`).join("")}
        </fieldset>
        <div class="hk-note" id="hkNote" role="status" aria-live="polite"></div>
        <div class="acts">
          <button type="button" class="btn btn-ghost" id="hkTest">${t("hooks.test")}</button>
          <div class="spacer"></div>
          ${H.hooks.length ? `<button type="button" class="btn btn-ghost" id="hkCancel">${t("common.cancel")}</button>` : ""}
          <button type="submit" class="btn btn-primary" id="hkSave">${t("hooks.save")}</button>
        </div>
      </form>`;
    }

    /** Formun altındaki tek satır: deneme sonucu ya da hata. */
    function paintNote() {
      const el = o.querySelector("#hkNote"), n = H.form?.note;
      if (!el) return;
      el.className = "hk-note" + (n ? (n.ok ? " ok" : " err") : "");
      el.innerHTML = n ? esc(n.text) + (n.code ? `<small>${esc(n.code)}</small>` : "") : "";
    }

    function bind() {
      o.querySelector("#hkAdd")?.addEventListener("click", () => {
        H.form = blankForm(); H.confirm = null; render(); focus("#hkUrl");
      });
      o.querySelector(".hk-list")?.addEventListener("click", onListClick);
      const form = o.querySelector("#hkForm"); if (!form) return;
      const f = H.form;
      paintNote();
      // Yazılanlar formun durumunda yaşar: uygulama değişince form yeniden çizilir, değerler kalır.
      form.querySelectorAll('input[name="hkApp"]').forEach((r) => r.addEventListener("change", () => {
        f.provider = r.value; f.note = null; render(); focus(`input[name="hkApp"][value="${r.value}"]`);
      }));
      form.querySelector("#hkUrl").addEventListener("input", (e) => { f.url = e.target.value; });
      form.querySelector("#hkLabel").addEventListener("input", (e) => { f.label = e.target.value; });
      form.querySelector("#hkLang").addEventListener("change", (e) => { f.locale = e.target.value; });
      form.querySelector("#hkGuide").addEventListener("toggle", (e) => { f.guide = e.target.open; });
      form.querySelectorAll(".hk-check input").forEach((c) => c.addEventListener("change", () => {
        if (c.checked) f.events.add(c.value); else f.events.delete(c.value);
      }));
      form.querySelector("#hkCancel")?.addEventListener("click", () => { H.form = null; render(); focus("#hkAdd"); });
      form.querySelector("#hkTest").addEventListener("click", (e) => testForm(e.currentTarget));
      form.addEventListener("submit", (e) => { e.preventDefault(); save(); });
    }

    /** Kaydetmeden önce formdaki adres; düzenlemede adres boşsa kayıtlı olan denenir. */
    async function testForm(btn) {
      const f = H.form, url = f.url.trim();
      if (!url && f.id == null) { f.note = { ok: false, text: t("hooks.urlRequired") }; paintNote(); return focus("#hkUrl"); }
      btn.disabled = true; btn.textContent = t("hooks.testing");
      try {
        const r = url ? await api.testChatUrl(H.boardId, f.provider, url, f.locale) : await api.testChatHook(H.boardId, f.id);
        f.note = r.delivered ? { ok: true, text: t("hooks.testOk") }
          : { ok: false, text: t("hooks.outcome." + r.outcome), code: r.status ? `HTTP ${r.status}` : "" };
      } catch (e) { f.note = { ok: false, text: e.message }; }
      if (!alive() || H.form !== f) return;
      btn.disabled = false; btn.textContent = t("hooks.test");
      paintNote();
    }

    async function save() {
      const f = H.form, edit = f.id != null, url = f.url.trim();
      const fail = (text, sel) => { f.note = { ok: false, text }; paintNote(); if (sel) focus(sel); };
      if (!edit && !url) return fail(t("hooks.urlRequired"), "#hkUrl");
      if (!f.events.size) return fail(t("hooks.eventsRequired"), ".hk-check input");
      const fields = { label: f.label.trim(), locale: f.locale, events: HOOK_EVENTS.filter((e) => f.events.has(e)) };
      if (url) fields.url = url;
      if (!edit) fields.provider = f.provider;
      const btn = o.querySelector("#hkSave"); btn.disabled = true;
      try {
        const saved = edit ? await api.updateChatHook(H.boardId, f.id, fields) : await api.addChatHook(H.boardId, fields);
        toast(t(edit ? "hooks.saved" : "hooks.added"), `${hookName(saved)} · …${saved.urlHint}`, "ok");
        if (!alive()) return;
        H.form = null;
        await load(`[data-hook="${saved.id}"] [data-a="test"]`);
      } catch (e) {
        if (!alive() || H.form !== f) return;
        btn.disabled = false; fail(e.message);
      }
    }

    async function onListClick(e) {
      const b = e.target.closest("button[data-a]"); if (!b) return;
      const id = Number(b.dataset.id), h = H.hooks.find((x) => x.id === id), a = b.dataset.a;
      if (!h) return;
      if (a === "edit") {
        H.form = editForm(h); H.confirm = null; render();
        o.querySelector("#hkForm")?.scrollIntoView({ block: "nearest" });
        return focus("#hkLabel");
      }
      if (a === "del") { H.confirm = id; render(); return focus(`[data-hook="${id}"] [data-a="del-no"]`); }
      if (a === "del-no") { H.confirm = null; render(); return focus(`[data-hook="${id}"] [data-a="del"]`); }
      b.disabled = true;
      try {
        if (a === "test") {
          const r = await api.testChatHook(H.boardId, id);
          if (r.delivered) toast(t("hooks.testSent"), hookName(h), "ok");
          else toast(t("hooks.testFailed"), `${hookName(h)} · ${hookOutcome(r)}`, "err");
        } else if (a === "reopen") {
          await api.updateChatHook(H.boardId, id, { active: true });
          toast(t("hooks.reopened"), hookName(h), "ok");
          if (alive()) await load(`[data-hook="${id}"] [data-a="test"]`);
        } else if (a === "del-yes") {
          await api.deleteChatHook(H.boardId, id);
          toast(t("hooks.removed"), hookName(h), "ok");
          if (H.form?.id === id) H.form = null;
          H.confirm = null;
          if (alive()) await load("#hkAdd");
        }
      } catch (err) {
        toast(t(a === "test" ? "hooks.testFailed" : a === "reopen" ? "hooks.reopenFailed" : "hooks.removeFailed"), err.message, "err");
      } finally {
        if (b.isConnected) b.disabled = false;
      }
    }

    render();
    load();
  });
}

function inviteModal(boardId = null) {
  const owned = S.boards.filter((b) => b.role === "OWNER");
  const fixed = boardId ? (S.board?.id === boardId ? S.board : S.boards.find((b) => b.id === boardId)) : null;
  if (!fixed && !owned.length) {
    return openModal(`<div class="modal"><h3>${t("invite.needBoard")}</h3>
      <p class="sub">${t("invite.needBoardBody")}</p>
      <div class="acts"><button class="btn btn-primary" id="mk">${t("invite.createBoard")}</button><button class="btn btn-ghost" id="close">${t("common.close")}</button></div></div>`, (o) => {
      o.querySelector("#close").onclick = closeModal;
      o.querySelector("#mk").onclick = () => { closeModal(); createModal("board"); };
    });
  }
  openModal(`<div class="modal">
    <h3>${t("invite.title")}</h3>
    <p class="sub">${fixed ? t("invite.toBoard", { board: esc(fixed.name) }) : t("invite.toPicked")}
      ${t("invite.howItWorks")}</p>
    ${fixed ? "" : `<label class="label" for="invBoard">${t("invite.board")}</label>
      <select class="field" id="invBoard">${owned.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select>`}
    <label class="label" for="invEmail">${t("common.email")}</label>
    <input class="field" id="invEmail" type="email" placeholder="${t("common.emailPlaceholder")}" autocomplete="off">
    <label class="label" for="invRole">${t("invite.role")}</label>
    <select class="field" id="invRole">
      <option value="EDITOR">${t("invite.roleEditor")}</option>
      <option value="VIEWER">${t("invite.roleViewer")}</option>
      <option value="OWNER">${t("invite.roleOwner")}</option></select>
    <div class="acts"><button class="btn btn-primary" id="invBtn">${t("invite.send")}</button><button class="btn btn-ghost" id="close">${t("common.cancel")}</button></div>
  </div>`, (o) => {
    const email = o.querySelector("#invEmail"); email.focus();
    o.querySelector("#close").onclick = closeModal;
    const send = async () => {
      const to = email.value.trim(), role = o.querySelector("#invRole").value;
      const id = fixed ? fixed.id : Number(o.querySelector("#invBoard").value);
      if (!to) return email.focus();
      const btn = o.querySelector("#invBtn"); btn.disabled = true;
      try {
        const sent = await api.invite(id, to, role);
        closeModal();
        toast(t("invite.sent"), `${to} · ${roleName(role)}${sent.hasAccount ? "" : t("invite.noAccount")}`, "ok");
        if (S.board?.id === id) loadPending();
      } catch (e) { btn.disabled = false; toast(t("invite.failed"), e.message, "err"); }
    };
    o.querySelector("#invBtn").onclick = send;
    email.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  });
}

/*
 * Giriş sonrası açılacak kart (postadaki bağlantıdan). Sekmede (sessionStorage)
 * saklanır: Google girişi sayfadan ayrılıp geri döndüğü için bellek yetmezdi.
 * Başlangıçtan önce tanımlı olmalı; start() bunları hemen kullanıyor.
 */
const TARGET_KEY = "cb_open";
/** Hedef: { board, card } (postadaki bağlantı) ya da { key: "STR-42" } (kartın kısa bağlantısı). */
function rememberTarget(board, card, key = null) {
  try { sessionStorage.setItem(TARGET_KEY, JSON.stringify(key ? { key } : { board, card })); } catch (_) {}
}
function pendingTarget() {
  try { return JSON.parse(sessionStorage.getItem(TARGET_KEY)); } catch (_) { return null; }
}
/** Bekleyen hedef varsa açar ve unutur. Oturum yoksa (süresi dolmuş) girişten sonraya kalır. */
function openPendingTarget() {
  const t = S.me && pendingTarget();
  if (!t || !(t.board || t.key)) return;
  try { sessionStorage.removeItem(TARGET_KEY); } catch (_) {}
  if (t.key) return openCardByKey(t.key);
  openBoard(t.board, { openCard: t.card });
}
/**
 * Kısa bağlantının anahtarını çözer ve kartı penceresiyle açar. Panoya erişimi
 * olmayan, kart hiç yokmuş gibi aynı uyarıyı görür (sunucu ikisine de 404 der).
 */
async function openCardByKey(key) {
  try {
    const c = await api.cardByKey(key);
    await openBoard(c.boardId, { openCard: c.cardId });
  } catch (e) {
    toast(t("board.cardMissing"), t("cardKey.notFoundBody", { key }), "warn");
  }
}

/* ══════════════════ Başlangıç ══════════════════ */
(function start() {
  // Doğrulama bağlantısı her şeyden önce gelir: oturum açıkken bile başka
  // birinin hesabını doğrulamak için tıklanmış olabilir.
  const params = new URLSearchParams(location.search);
  const verifyToken = params.get("verify");
  if (verifyToken) {
    return consumeVerifyLink(verifyToken);
  }

  // Sıfırlama bağlantısı: jeton adres çubuğundan hemen silinir — tarayıcı
  // geçmişinde kalırsa, bilgisayarı sonradan kullanan biri hesabı ele geçirebilir.
  // Açık bir oturum varsa kapatılır; başka bir hesap adına şifre değiştirmek
  // karışıklıktan başka bir şey üretmez.
  const resetToken = params.get("reset");
  if (resetToken) {
    history.replaceState(null, "", location.pathname);
    localStorage.removeItem("cb_session");
    S.resetToken = resetToken; S.authMode = "reset";
    return renderAuth();
  }

  loadProviders();

  const oauthCode = params.get("oauth"), oauthErrorCode = params.get("oauth_error");
  if (oauthCode || oauthErrorCode) {
    history.replaceState(null, "", location.pathname);
    if (oauthCode) return finishOAuth(oauthCode);
    S.view = "auth"; S.authMode = "login"; S.authError = oauthError(oauthErrorCode);
    return renderAuth();
  }

  const signup = params.get("signup");
  if (signup) {
    history.replaceState(null, "", location.pathname);
    S.authMode = "register"; S.form.em = signup;
    return renderAuth();
  }

  // Kartın bağlantısı (bahsetme postası): /?board=<id>&card=<id>. Adres çubuğundan
  // hemen silinir; hedef oturum açılınca açılır.
  if (params.has("board")) {
    history.replaceState(null, "", location.pathname);
    const board = Number(params.get("board")), card = Number(params.get("card"));
    if (board > 0) rememberTarget(board, card > 0 ? card : null);
  } else if (params.has("card")) {
    // Kartın kısa bağlantısı: /?card=STR-42 (ADR 0021). Pano numarası yok; anahtar
    // oturum açılınca sunucuda çözülür, erişim de orada denetlenir.
    history.replaceState(null, "", location.pathname);
    const id = parseCardKey(params.get("card"));
    if (id) rememberTarget(null, null, cardKey(id));
  }

  const saved = localStorage.getItem("cb_session");
  if (saved) {
    try {
      const s = JSON.parse(saved);
      S.me = s.user;
      if (S.me?.locale) setLocale(S.me.locale);   // kayıtlı tercih, tarayıcının dilinden önce gelir
      setTokens({ accessToken: s.accessToken, refreshToken: s.refreshToken }, { restored: true });
      startInbox();
      // Kayıtlı kullanıcı bilgisi eski olabilir (başka cihazda ad, fotoğraf ya da dil değişmiş).
      api.me().then((u) => {
        S.me = u; persistSession();
        if (u.locale && setLocale(u.locale)) rerender();
        else if (S.view === "home") renderHome();
      }).catch(() => {});
      return goHome().then(openPendingTarget);
    } catch (_) {}
  }
  // Bağlantıyla gelen kişinin hesabı var: tanıtım sayfası yerine doğrudan giriş.
  if (pendingTarget()) { S.view = "auth"; S.authMode = "login"; return renderAuth(); }
  showLanding();
})();

/**
 * Oturumu olmayan ziyaretçinin ilk ekranı: tanıtım sayfası (landing.js).
 *
 * Modül ancak gerektiğinde yüklenir: oturumu açık kullanıcı onu hiç indirmez,
 * ve yüklenemezse (ağ, eski önbellek) ziyaretçi boş sayfada kalmaz, giriş
 * ekranını görür.
 */
function showLanding() {
  S.view = "landing"; S.authError = ""; S.authOk = ""; S.showResend = false;
  const toAuth = (mode) => () => { S.view = "auth"; S.authMode = mode; renderAuth(); };
  import("./landing.js")
    .then((m) => { if (S.view === "landing") m.renderLanding(app, { onLogin: toAuth("login"), onRegister: toAuth("register"), onForgot: toAuth("forgot") }); })
    .catch(() => { if (S.view === "landing") toAuth("login")(); });
}
</script>
