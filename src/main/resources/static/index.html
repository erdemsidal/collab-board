<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CollabBoard — Canlı Kanban</title>
    <style>
        :root {
            --accent: #f5871f; --accent-soft: #fff1e2;
            --bg: #eef3f8; --col: #f1f4f8; --col-head: #e2e9f2;
            --ink: #1f2d3d; --muted: #6b7a90; --line: #e1e7ef;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; color: var(--ink); background: var(--bg); }

        header { display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: #fff; border-bottom: 1px solid var(--line); }
        header h1 { font-size: 17px; font-weight: 800; }
        header h1 .a { color: var(--accent); }
        header .board-name { color: var(--muted); font-weight: 500; font-size: 14px; }

        .presence { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .avatars { display: flex; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; border: 2px solid #fff;
            margin-left: -8px; box-shadow: 0 1px 3px rgba(31,45,61,.25); animation: pop .18s ease-out;
        }
        .avatar:first-child { margin-left: 0; }
        .presence-count { font-size: 13px; color: var(--muted); font-weight: 600; }

        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #e05b49; transition: background .3s; }
        .dot.connected { background: #35b37e; }
        .logout { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 11px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .logout:hover { border-color: var(--accent); color: var(--accent); }

        .board { display: flex; gap: 14px; padding: 20px; overflow-x: auto; align-items: flex-start; }
        .column { width: 292px; flex-shrink: 0; background: var(--col); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; max-height: calc(100vh - 132px); }
        .column-header { padding: 12px 14px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: grab; user-select: none; }
        .column-header:active { cursor: grabbing; }
        .column-header .count { margin-left: auto; background: var(--col-head); color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 20px; padding: 1px 9px; }
        .column.col-ghost { opacity: .5; }
        .cards { padding: 4px 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; min-height: 20px; }

        .card { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 32px 11px 13px; font-size: 14px; cursor: grab; box-shadow: 0 1px 2px rgba(31,45,61,.06); transition: box-shadow .1s, border-color .1s; }
        .card:hover { box-shadow: 0 3px 10px rgba(31,45,61,.13); border-color: #cdd6e2; }
        .card-title { word-break: break-word; line-height: 1.4; }
        .card-del { position: absolute; top: 7px; right: 7px; background: transparent; border: none; cursor: pointer; color: var(--muted); padding: 3px; border-radius: 6px; display: inline-flex; opacity: 0; transition: opacity .1s, background .1s, color .1s; }
        .card:hover .card-del { opacity: 1; }
        .card-del:hover { background: #fdecec; color: #e05b49; }
        .card-ghost { opacity: 1; background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
        .card-ghost * { visibility: hidden; }
        .card-drag { transform: rotate(2deg); box-shadow: 0 8px 20px rgba(31,45,61,.25); }

        .column-footer { padding: 8px; }
        .add-row { display: flex; gap: 8px; }
        .add-row input { flex: 1; background: #fff; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 9px 11px; font-size: 13px; outline: none; }
        .add-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .add-row button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; font-weight: 700; }
        .add-row button:hover { filter: brightness(.96); }

        /* ── Ana yerleşim: pano + sağda geçmiş paneli ── */
        .main { display: flex; align-items: flex-start; }
        .board { flex: 1; min-width: 0; }

        /* ── Son hareketler (audit) ── */
        .activity { width: 300px; flex-shrink: 0; margin: 20px 20px 20px 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; max-height: calc(100vh - 132px); display: flex; flex-direction: column; }
        .activity-head { padding: 12px 14px; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
        .activity-head .live { margin-left: auto; font-size: 10px; font-weight: 700; color: #35b37e; background: #e7f7f0; border-radius: 20px; padding: 2px 7px; }
        .activity-list { overflow-y: auto; padding: 6px; }
        .activity-item { display: flex; gap: 9px; padding: 9px 8px; border-radius: 8px; }
        .activity-item:hover { background: #f7f9fc; }
        .act-dot { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .act-body { font-size: 12.5px; line-height: 1.4; }
        .act-actor { font-weight: 700; }
        .act-time { color: var(--muted); font-size: 11px; margin-top: 2px; }
        .activity-empty { color: var(--muted); font-size: 12.5px; padding: 14px 10px; }

        /* ── Metrik şeridi (görsel gösterge paneli) ── */
        .metrics { position: fixed; bottom: 14px; left: 14px; display: flex; gap: 8px; z-index: 40; }
        .metric {
            background: #fff; border: 1px solid var(--line); border-radius: 10px;
            padding: 7px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(31,45,61,.08);
            display: flex; align-items: center; gap: 7px;
        }
        .metric .val { font-weight: 800; font-size: 15px; }
        .metric .lbl { color: var(--muted); }
        .metric.live .val { color: #35b37e; }
        .metric.ops .val { color: #0079bf; }
        .metric.rej .val { color: var(--accent); }

        #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; }
        .toast { background: #2b3b4e; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(31,45,61,.3); border-left: 4px solid var(--accent); animation: pop .18s ease-out; }
        @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ── Giriş ekranı (ADR 0005) ── */
        #auth { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
        #auth.hidden, #app.hidden { display: none; }
        .auth-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: 360px; box-shadow: 0 10px 40px rgba(31,45,61,.10); }
        .auth-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .auth-card h2 .a { color: var(--accent); }
        .auth-card p.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
        .auth-card label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
        .auth-card input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
        .auth-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .auth-card button.primary { width: 100%; margin-top: 18px; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .auth-card button.primary:hover { filter: brightness(.96); }
        .auth-card .switch { margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted); }
        .auth-card .switch a { color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: none; }
        .auth-error { margin-top: 12px; background: #fdecec; color: #b3261e; border-radius: 8px; padding: 9px 12px; font-size: 13px; display: none; }
        .row2 { display: flex; gap: 10px; }
        .row2 > div { flex: 1; }
    </style>
</head>
<body>
    <!-- ═══ GİRİŞ EKRANI ═══ -->
    <div id="auth">
        <div class="auth-card">
            <h2>Collab<span class="a">Board</span></h2>
            <p class="sub" id="authSub">Panoya girmek için oturum aç.</p>

            <div id="nameFields" style="display:none">
                <div class="row2">
                    <div><label>Ad</label><input id="firstName" type="text" placeholder="Erdem"/></div>
                    <div><label>Soyad</label><input id="lastName" type="text" placeholder="Sidal"/></div>
                </div>
            </div>
            <label>E-posta</label>
            <input id="email" type="email" placeholder="ornek@mail.com" autocomplete="username"/>
            <label>Şifre</label>
            <input id="password" type="password" placeholder="en az 8 karakter" autocomplete="current-password"/>

            <div class="auth-error" id="authError"></div>
            <button class="primary" id="authSubmit">Giriş yap</button>
            <div class="switch" id="authSwitch">Hesabın yok mu? <a>Kayıt ol</a></div>
        </div>
    </div>

    <!-- ═══ UYGULAMA ═══ -->
    <div id="app" class="hidden">
        <header>
            <h1>Collab<span class="a">Board</span> <span class="board-name" id="boardName"></span></h1>
            <div class="presence">
                <span class="presence-count" id="presenceCount"></span>
                <div class="avatars" id="avatars"></div>
            </div>
            <div class="status"><span id="statusText">bağlanıyor…</span><span class="dot" id="statusDot"></span></div>
            <button class="logout" id="logoutBtn">Çıkış</button>
        </header>

        <div class="main">
            <div class="board" id="board"></div>
            <aside class="activity">
                <div class="activity-head">Son hareketler <span class="live">CANLI</span></div>
                <div class="activity-list" id="activityList"></div>
            </aside>
        </div>

        <!-- Metrikler: /actuator/metrics'ten canlı okunur (JSON yerine gösterge) -->
        <div class="metrics">
            <div class="metric live"><span class="val" id="mConn">–</span><span class="lbl">bağlı</span></div>
            <div class="metric ops"><span class="val" id="mOps">–</span><span class="lbl">işlem</span></div>
            <div class="metric rej"><span class="val" id="mRej">–</span><span class="lbl">çakışma reddi</span></div>
        </div>
    </div>

    <div id="toasts"></div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script>
        // ═══════════════════════════════════════════════════════════
        // 0) KİMLİK (ADR 0005)
        // ═══════════════════════════════════════════════════════════
        let token = localStorage.getItem("cb_token");
        let refreshToken = localStorage.getItem("cb_refresh");
        let refreshInFlight = null;      // aynı anda birden çok yenileme olmasın
        let isRegisterMode = false;

        /**
         * Token çiftini sakla. Backend "rotation" yapıyor: her yenilemede ESKİ refresh
         * token geçersiz olur ve YENİSİ döner — o yüzden ikisini birlikte güncelliyoruz.
         */
        function storeTokens(accessToken, newRefreshToken) {
            token = accessToken;
            localStorage.setItem("cb_token", token);
            if (newRefreshToken) {
                refreshToken = newRefreshToken;
                localStorage.setItem("cb_refresh", refreshToken);
            }
            // Açık STOMP istemcisi varsa, sonraki yeniden bağlanmada yeni token'ı kullansın.
            if (stompClient) stompClient.connectHeaders = { "Authorization": "Bearer " + token };
        }

        /**
         * Access token'ı (15 dk ömürlü) refresh token ile yenile.
         *
         * TEK UÇUŞ (single-flight): Sayfada aynı anda birkaç istek 401 alabilir.
         * Her biri ayrı ayrı yenileme denerse, rotation yüzünden ilki dışındakiler
         * geçersiz token kullanır ve hepsi düşer. Bu yüzden devam eden bir yenileme
         * varsa yenisini başlatmıyor, aynı sözü (promise) paylaşıyoruz.
         */
        function refreshTokens() {
            if (!refreshToken) return Promise.resolve(false);
            if (refreshInFlight) return refreshInFlight;
            refreshInFlight = (async () => {
                try {
                    const res = await fetch("/api/auth/refresh", {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ refreshToken })
                    });
                    if (!res.ok) return false;
                    const d = await res.json();
                    storeTokens(d.accessToken, d.refreshToken);
                    return true;
                } catch (e) {
                    return false;
                } finally {
                    refreshInFlight = null;
                }
            })();
            return refreshInFlight;
        }

        const authEl = document.getElementById("auth");
        const appEl = document.getElementById("app");
        const errEl = document.getElementById("authError");

        document.getElementById("authSwitch").onclick = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById("nameFields").style.display = isRegisterMode ? "block" : "none";
            document.getElementById("authSubmit").textContent = isRegisterMode ? "Kayıt ol ve gir" : "Giriş yap";
            document.getElementById("authSub").textContent = isRegisterMode
                ? "Yeni bir hesap oluştur." : "Panoya girmek için oturum aç.";
            document.getElementById("authSwitch").innerHTML = isRegisterMode
                ? 'Hesabın var mı? <a>Giriş yap</a>' : 'Hesabın yok mu? <a>Kayıt ol</a>';
            errEl.style.display = "none";
        };

        document.getElementById("authSubmit").onclick = doAuth;
        document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });

        async function doAuth() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            errEl.style.display = "none";
            try {
                if (isRegisterMode) {
                    await postJson("/api/auth/register", {
                        firstName: document.getElementById("firstName").value.trim(),
                        lastName: document.getElementById("lastName").value.trim(),
                        email, password
                    });
                }
                // Kayıt token döndürmüyor → her durumda login ile token alıyoruz.
                const res = await postJson("/api/auth/login", { email, password });
                storeTokens(res.accessToken, res.refreshToken);
                startApp();
            } catch (e) {
                errEl.textContent = e.message;
                errEl.style.display = "block";
            }
        }

        async function postJson(path, body) {
            const res = await fetch(path, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const field = data.fieldErrors && data.fieldErrors[0];
                throw new Error(field ? field.message : (data.message || "İşlem başarısız"));
            }
            return data;
        }

        /**
         * Token'lı fetch. Access token süresi dolmuşsa (401/403) SESSİZCE yeniler ve
         * isteği bir kez tekrar dener — kullanıcı hiçbir şey fark etmez.
         * Yenileme de başarısızsa (refresh token da ölmüş) giriş ekranına döner.
         */
        async function authFetch(path, options = {}, allowRetry = true) {
            const res = await fetch(path, {
                ...options,
                headers: { ...(options.headers || {}), "Authorization": "Bearer " + token }
            });
            if ((res.status === 401 || res.status === 403) && allowRetry) {
                if (await refreshTokens()) return authFetch(path, options, false);
                logout();
                throw new Error("Oturum süresi doldu");
            }
            return res;
        }

        function logout() {
            localStorage.removeItem("cb_token");
            localStorage.removeItem("cb_refresh");
            token = null;
            refreshToken = null;
            if (stompClient) { try { stompClient.deactivate(); } catch (e) {} }
            appEl.classList.add("hidden");
            authEl.classList.remove("hidden");
        }
        document.getElementById("logoutBtn").onclick = logout;

        // ═══════════════════════════════════════════════════════════
        // 1) UYGULAMA
        // ═══════════════════════════════════════════════════════════
        const boardEl = document.getElementById("board");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        let stompClient = null;
        let hasConnectedBefore = false;
        let boardId = new URLSearchParams(location.search).get("board");

        async function startApp() {
            authEl.classList.add("hidden");
            appEl.classList.remove("hidden");
            if (!boardId) {
                // Pano yoksa oluştur ve URL'ye yaz (artık kimlikli bir istek).
                const res = await authFetch("/api/boards", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: "Demo Board" })
                });
                const b = await res.json();
                location.search = "?board=" + b.id;
                return;
            }
            loadBoard();
        }

        // ── BAŞLANGIÇ FOTOĞRAFI (REST) ──
        async function loadBoard() {
            const board = await fetchBoard();
            if (!board) return;
            document.getElementById("boardName").textContent = "· " + board.name + " (#" + board.id + ")";
            renderBoard(board);
            connect();
            refreshActivity(0);
            refreshMetrics();
            setInterval(refreshMetrics, 3000);   // gösterge paneli canlı kalsın

            // ÖNDEN YENİLEME: access token 15 dk ömürlü; 12 dakikada bir tazeliyoruz.
            // Böylece bir istek/yeniden bağlanma "süresi dolmuş" token'a hiç denk gelmez.
            // (Süreyi uzatmak yerine bunu yapıyoruz: kısa ömürlü access token + yenileme,
            //  token çalınırsa zararı sınırlayan standart yaklaşımdır.)
            setInterval(refreshTokens, 12 * 60 * 1000);
        }

        async function fetchBoard() {
            const res = await authFetch("/api/boards/" + boardId);
            if (!res.ok) { boardEl.textContent = "Pano bulunamadı: " + boardId; return null; }
            return res.json();
        }

        /** SNAPSHOT RESYNC (ADR 0003 / 0004): ekranı sunucudaki gerçekle hizala. */
        async function resync() {
            const board = await fetchBoard();
            if (board) renderBoard(board);
        }

        function renderBoard(board) {
            boardEl.innerHTML = "";
            board.columns.forEach(col => boardEl.appendChild(createColumnEl(col)));
            initSortables();
            updateCounts();
        }

        function createColumnEl(col) {
            const colEl = document.createElement("div");
            colEl.className = "column";
            colEl.dataset.columnId = col.id;
            colEl.innerHTML = `
                <div class="column-header"><span>${escapeHtml(col.name)}</span><span class="count" data-count></span></div>
                <div class="cards" data-column-id="${col.id}"></div>
                <div class="column-footer"><div class="add-row">
                    <input type="text" placeholder="+ Kart ekle…"/><button>Ekle</button>
                </div></div>`;
            const cardsEl = colEl.querySelector(".cards");
            col.cards.forEach(card => cardsEl.appendChild(createCardEl(card)));

            const input = colEl.querySelector(".add-row input");
            const addCard = () => {
                const title = input.value.trim();
                if (!title) return;
                sendOp({ type: "ADD_CARD", columnId: col.id, title });
                input.value = "";
            };
            colEl.querySelector(".add-row button").onclick = addCard;
            input.addEventListener("keydown", e => { if (e.key === "Enter") addCard(); });
            return colEl;
        }

        function createCardEl(card) {
            const el = document.createElement("div");
            el.className = "card";
            el.dataset.cardId = card.id;
            el.dataset.version = card.version;
            el.title = "Çift tıkla: düzenle";
            el.innerHTML = `
                <div class="card-title"></div>
                <button class="card-del" title="Sil">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>`;
            el.querySelector(".card-title").textContent = card.title;
            el.querySelector(".card-del").addEventListener("click", e => {
                e.stopPropagation();
                sendOp({ type: "DELETE_CARD", cardId: card.id });
            });
            el.addEventListener("dblclick", () => {
                const cur = el.querySelector(".card-title").textContent;
                const t = prompt("Kart başlığı:", cur);
                if (t && t.trim() && t.trim() !== cur) sendOp({
                    type: "EDIT_CARD", cardId: card.id, title: t.trim(),
                    baseVersion: Number(el.dataset.version)
                });
            });
            return el;
        }

        // ── SÜRÜKLEME (SortableJS) ──
        function initSortables() {
            document.querySelectorAll(".cards").forEach(cardsEl => {
                new Sortable(cardsEl, {
                    group: "cards", animation: 150,
                    ghostClass: "card-ghost", dragClass: "card-drag",
                    filter: ".card-del", preventOnFilter: false,
                    onEnd: evt => {
                        if (evt.from === evt.to && evt.oldIndex === evt.newIndex) return;
                        sendOp({
                            type: "MOVE_CARD",
                            cardId: Number(evt.item.dataset.cardId),
                            toColumnId: Number(evt.to.dataset.columnId),
                            position: evt.newIndex,
                            baseVersion: Number(evt.item.dataset.version)
                        });
                        updateCounts();
                    }
                });
            });
            new Sortable(boardEl, {
                group: "columns", animation: 150, draggable: ".column",
                handle: ".column-header", ghostClass: "col-ghost",
                onEnd: evt => {
                    if (evt.oldIndex === evt.newIndex) return;
                    sendOp({ type: "MOVE_COLUMN", columnId: Number(evt.item.dataset.columnId), position: evt.newIndex });
                }
            });
        }

        // ═══ CANLI YAYIN (WebSocket/STOMP) ═══
        function connect() {
            stompClient = new StompJs.Client({
                brokerURL: "ws://" + location.host + "/ws",
                // ADR 0005: token'ı CONNECT frame başlığında yolluyoruz — tarayıcı
                // el sıkışmaya özel başlık ekleyemediği için URL'ye KOYMUYORUZ.
                connectHeaders: { "Authorization": "Bearer " + token },
                reconnectDelay: 3000,
                onConnect: () => {
                    setStatus(true);
                    if (hasConnectedBefore) { toast("Bağlantı geri geldi, pano yenilendi."); resync(); }
                    hasConnectedBefore = true;

                    stompClient.subscribe("/topic/board." + boardId, m => handleEvent(JSON.parse(m.body)));
                    stompClient.subscribe("/user/queue/errors", m => handleRejection(JSON.parse(m.body)));
                    stompClient.subscribe("/topic/board." + boardId + "/presence",
                        m => renderPresence(JSON.parse(m.body).users));
                    stompClient.publish({ destination: "/app/board/" + boardId + "/presence/join" });
                },
                onWebSocketClose: () => setStatus(false),
                onStompError: async frame => {
                    // CONNECT reddedildi — büyük olasılıkla access token'ın süresi doldu.
                    // Önce yenilemeyi dene: başarılıysa istemci zaten yeniden bağlanacak
                    // (connectHeaders güncellendi), kullanıcı hiçbir şey yapmaz.
                    console.error("STOMP hatası:", frame.headers, frame.body);
                    if (await refreshTokens()) {
                        toast("Oturum yenilendi, tekrar bağlanılıyor…");
                    } else {
                        toast("Oturum doğrulanamadı, tekrar giriş yapın.");
                        logout();
                    }
                }
            });
            stompClient.activate();
        }

        function sendOp(op) {
            stompClient.publish({
                destination: "/app/board/" + boardId + "/ops",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(op)
            });
        }

        function handleEvent(ev) {
            if (ev.type === "ADD_CARD") {
                const c = document.querySelector(`.cards[data-column-id="${ev.columnId}"]`);
                if (c && !document.querySelector(`.card[data-card-id="${ev.card.id}"]`))
                    insertAt(c, ".card", createCardEl(ev.card), ev.card.position);
            } else if (ev.type === "MOVE_CARD") {
                const card = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                const target = document.querySelector(`.cards[data-column-id="${ev.toColumnId}"]`);
                if (card && target) { card.dataset.version = ev.version; insertAt(target, ".card", card, ev.position); }
            } else if (ev.type === "EDIT_CARD") {
                const card = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                if (card) { card.querySelector(".card-title").textContent = ev.title; card.dataset.version = ev.version; }
            } else if (ev.type === "DELETE_CARD") {
                const card = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                if (card) card.remove();
            } else if (ev.type === "MOVE_COLUMN") {
                const col = document.querySelector(`.column[data-column-id="${ev.columnId}"]`);
                if (col) insertAt(boardEl, ".column", col, ev.position);
            }
            updateCounts();
            // Her olay panonun geçmişine bir satır eklemiş demektir → paneli tazele.
            refreshActivity();
        }

        function handleRejection(ev) {
            toast(ev.message || "İşlem reddedildi, ekran güncellendi.");
            resync();
        }

        /** Çevrimiçi kullanıcıları başlıktaki avatarlara çiz (gerçek isimler — ADR 0005). */
        function renderPresence(users) {
            const box = document.getElementById("avatars");
            box.innerHTML = "";
            users.forEach(u => {
                const el = document.createElement("div");
                el.className = "avatar";
                el.style.background = u.color;
                el.textContent = u.initials;
                el.title = u.name;
                box.appendChild(el);
            });
            document.getElementById("presenceCount").textContent =
                users.length ? users.length + " kişi çevrimiçi" : "";
        }

        // ═══ GEÇMİŞ (audit) ═══
        let activityTimer = null;
        /** Sunucudan son hareketleri çek. Her olayda çağrılır ama kısa süre kısılır
         *  (debounce): 10 kart üst üste taşınırsa 10 istek atmayalım. */
        function refreshActivity(delay = 300) {
            clearTimeout(activityTimer);
            activityTimer = setTimeout(async () => {
                try {
                    const res = await authFetch(`/api/boards/${boardId}/activity?limit=25`);
                    if (res.ok) renderActivity(await res.json());
                } catch (e) { /* oturum düşmüşse authFetch zaten yönlendirir */ }
            }, delay);
        }

        function renderActivity(items) {
            const list = document.getElementById("activityList");
            if (!items.length) {
                list.innerHTML = '<div class="activity-empty">Henüz hareket yok. Bir kart ekleyip taşı 🙂</div>';
                return;
            }
            list.innerHTML = "";
            items.forEach(a => {
                const el = document.createElement("div");
                el.className = "activity-item";
                el.innerHTML = `
                    <div class="act-dot"></div>
                    <div class="act-body">
                        <span class="act-actor"></span> <span class="act-desc"></span>
                        <div class="act-time"></div>
                    </div>`;
                const dot = el.querySelector(".act-dot");
                dot.textContent = initialsOf(a.actorName);
                dot.style.background = colorOf(a.actorName);
                el.querySelector(".act-actor").textContent = a.actorName;
                el.querySelector(".act-desc").textContent = a.description;
                el.querySelector(".act-time").textContent = relativeTime(a.createdAt);
                list.appendChild(el);
            });
        }

        function initialsOf(name) {
            return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
        }
        /** İsimden sabit renk üret (aynı isim → hep aynı renk). */
        function colorOf(name) {
            const palette = ["#e05b49", "#f5871f", "#35b37e", "#0079bf", "#8777d9", "#00b8d9", "#ff8f73", "#6554c0"];
            let h = 0;
            for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 997;
            return palette[h % palette.length];
        }
        function relativeTime(iso) {
            const diff = (Date.now() - new Date(iso).getTime()) / 1000;
            if (diff < 60) return "az önce";
            if (diff < 3600) return Math.floor(diff / 60) + " dk önce";
            if (diff < 86400) return Math.floor(diff / 3600) + " saat önce";
            return Math.floor(diff / 86400) + " gün önce";
        }

        // ═══ METRİKLER (görsel gösterge) ═══
        async function readMetric(name) {
            try {
                const res = await fetch("/actuator/metrics/" + name);
                if (!res.ok) return null;
                const d = await res.json();
                return d.measurements[0].value;
            } catch (e) { return null; }
        }
        async function refreshMetrics() {
            const [conn, ops, rej] = await Promise.all([
                readMetric("collabboard.ws.connections"),
                readMetric("collabboard.operations"),
                readMetric("collabboard.operations.rejected")
            ]);
            const fmt = v => v === null ? "–" : Math.round(v);
            document.getElementById("mConn").textContent = fmt(conn);
            document.getElementById("mOps").textContent = fmt(ops);
            document.getElementById("mRej").textContent = fmt(rej);
        }

        function toast(text) {
            const el = document.createElement("div");
            el.className = "toast";
            el.textContent = text;
            document.getElementById("toasts").appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        function insertAt(container, sel, el, index) {
            const items = [...container.querySelectorAll(sel)].filter(c => c !== el);
            if (index >= items.length) container.appendChild(el);
            else container.insertBefore(el, items[index]);
        }
        function updateCounts() {
            document.querySelectorAll(".column").forEach(col =>
                col.querySelector("[data-count]").textContent = col.querySelectorAll(".card").length);
        }
        function setStatus(c) {
            statusDot.classList.toggle("connected", c);
            statusText.textContent = c ? "bağlı" : "bağlantı kesildi";
        }
        function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

        // Token varsa doğrudan uygulamaya gir, yoksa giriş ekranı görünür kalır.
        if (token) startApp();
    </script>
</body>
</html>
