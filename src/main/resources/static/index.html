<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CollabBoard — Canlı Kanban</title>
    <style>
        :root {
            --accent: #f5871f;         /* turuncu vurgu */
            --accent-soft: #fff1e2;
            --bg: #eef5fb;
            --col-head: #d7e9fb;
            --ink: #1f2d3d;
            --muted: #6b7a90;
            --line: #e3e8ef;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; color: var(--ink); background: var(--bg);
        }
        header {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 22px; background: #fff; border-bottom: 1px solid var(--line);
        }
        header h1 { font-size: 17px; font-weight: 800; }
        header h1 span.accent { color: var(--accent); }
        header .board-name { color: var(--muted); font-weight: 500; font-size: 14px; }
        .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #e05b49; transition: background .3s; }
        .dot.connected { background: #35b37e; }

        .board { display: flex; gap: 14px; padding: 20px; overflow-x: auto; align-items: flex-start; }

        .column { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; max-height: calc(100vh - 130px); }
        .column.dragging { opacity: .4; }
        .column-header {
            padding: 11px 14px; font-weight: 700; font-size: 14px; color: var(--ink);
            background: var(--col-head); border-radius: 10px;
            display: flex; align-items: center; gap: 8px; cursor: grab; user-select: none;
        }
        .column-header:active { cursor: grabbing; }
        .column-header .count {
            background: rgba(255,255,255,.7); color: var(--muted); font-size: 12px; font-weight: 700;
            border-radius: 20px; padding: 1px 9px;
        }
        .column.drag-over-col .column-header { outline: 2px solid var(--accent); }

        .cards { padding: 10px 2px 6px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 20px; }
        .cards.drag-over { background: #e2edf7; border-radius: 10px; }

        .card {
            background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 8px;
            font-size: 14px; cursor: grab; box-shadow: 0 1px 2px rgba(31,45,61,.06);
            transition: box-shadow .1s, border-color .1s;
        }
        .card:hover { box-shadow: 0 3px 10px rgba(31,45,61,.12); border-color: #cdd6e2; }
        .card.dragging { opacity: .4; }
        .card-title { word-break: break-word; line-height: 1.35; margin-bottom: 10px; }

        .card-foot { display: flex; align-items: center; gap: 8px; }
        .chip {
            display: inline-flex; align-items: center; gap: 5px;
            background: #f1f5f9; color: var(--muted); font-size: 12px; font-weight: 600;
            border-radius: 6px; padding: 2px 7px;
        }
        .chip.accent { background: var(--accent-soft); color: var(--accent); }
        .card-spacer { flex: 1; }
        .icon-btn {
            background: transparent; border: none; cursor: pointer; color: var(--muted);
            padding: 3px; border-radius: 6px; display: inline-flex; align-items: center;
            opacity: .5; transition: opacity .1s, background .1s, color .1s;
        }
        .card:hover .icon-btn { opacity: 1; }
        .icon-btn:hover { background: #fdecec; color: #e05b49; }

        .column-footer { padding: 10px 2px 4px; }
        .add-row { display: flex; gap: 8px; }
        .add-row input {
            flex: 1; background: #fff; border: 1px solid var(--line); color: var(--ink);
            border-radius: 8px; padding: 9px 11px; font-size: 13px; outline: none;
        }
        .add-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .add-row button {
            background: var(--accent); color: #fff; border: none; border-radius: 8px;
            padding: 9px 14px; font-size: 13px; cursor: pointer; font-weight: 700;
        }
        .add-row button:hover { filter: brightness(.95); }
    </style>
</head>
<body>
    <header>
        <h1>Collab<span class="accent">Board</span> <span class="board-name" id="boardName"></span></h1>
        <div class="status">
            <span id="statusText">bağlanıyor…</span>
            <span class="dot" id="statusDot"></span>
        </div>
    </header>

    <div class="board" id="board"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script>
        const boardId = new URLSearchParams(location.search).get("board");
        if (!boardId) {
            fetch("/api/boards", { method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: "Demo Board" }) })
                .then(r => r.json()).then(b => { location.search = "?board=" + b.id; });
        }

        const boardEl = document.getElementById("board");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        let stompClient = null;
        let dragKind = null;   // "card" | "column"

        // ═══ 1) BAŞLANGIÇ FOTOĞRAFI (REST) ═══
        async function loadBoard() {
            const res = await fetch("/api/boards/" + boardId);
            if (!res.ok) { boardEl.textContent = "Pano bulunamadı: " + boardId; return; }
            const board = await res.json();
            document.getElementById("boardName").textContent = "· " + board.name + " (#" + board.id + ")";
            renderBoard(board);
            connect();
        }

        function renderBoard(board) {
            boardEl.innerHTML = "";
            board.columns.forEach(col => boardEl.appendChild(createColumnEl(col)));
            setupBoardDropZone();
            updateCounts();
        }

        function createColumnEl(col) {
            const colEl = document.createElement("div");
            colEl.className = "column";
            colEl.dataset.columnId = col.id;
            colEl.draggable = true;
            colEl.innerHTML = `
                <div class="column-header">
                    <span>${escapeHtml(col.name)}</span>
                    <span class="count" data-count></span>
                </div>
                <div class="cards" data-column-id="${col.id}"></div>
                <div class="column-footer">
                    <div class="add-row">
                        <input type="text" placeholder="+ Kart ekle…"/>
                        <button>Ekle</button>
                    </div>
                </div>`;

            const cardsEl = colEl.querySelector(".cards");
            col.cards.forEach(card => cardsEl.appendChild(createCardEl(card)));

            const input = colEl.querySelector("input");
            const addCard = () => {
                const title = input.value.trim();
                if (!title) return;
                sendOp({ type: "ADD_CARD", columnId: col.id, title });
                input.value = "";
            };
            colEl.querySelector("button").onclick = addCard;
            input.addEventListener("keydown", e => { if (e.key === "Enter") addCard(); });

            colEl.addEventListener("dragstart", e => {
                if (e.target.classList.contains("card")) return;
                dragKind = "column"; colEl.classList.add("dragging");
                e.dataTransfer.setData("text/plain", "col:" + col.id);
                e.dataTransfer.effectAllowed = "move";
            });
            colEl.addEventListener("dragend", () => { colEl.classList.remove("dragging"); dragKind = null; });

            setupCardDropZone(cardsEl);
            return colEl;
        }

        function createCardEl(card) {
            const el = document.createElement("div");
            el.className = "card";
            el.draggable = true;
            el.dataset.cardId = card.id;
            el.dataset.version = card.version;
            el.title = "Çift tıkla: düzenle";

            // Başlık + alt ikon satırı (#id rozeti, öncelik, sil)
            el.innerHTML = `
                <div class="card-title"></div>
                <div class="card-foot">
                    <span class="chip">#${card.id}</span>
                    <span class="chip accent" title="öncelik">◆</span>
                    <span class="card-spacer"></span>
                    <button class="icon-btn" data-del title="Sil">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>`;
            const titleEl = el.querySelector(".card-title");
            titleEl.textContent = card.title;

            el.querySelector("[data-del]").addEventListener("click", e => {
                e.stopPropagation();
                sendOp({ type: "DELETE_CARD", cardId: card.id });
            });

            el.addEventListener("dblclick", () => {
                const current = titleEl.textContent;
                const t = prompt("Kart başlığı:", current);
                if (t && t.trim() && t.trim() !== current) sendOp({ type: "EDIT_CARD", cardId: card.id, title: t.trim() });
            });
            el.addEventListener("dragstart", e => {
                e.stopPropagation(); dragKind = "card"; el.classList.add("dragging");
                e.dataTransfer.setData("text/plain", card.id);
                e.dataTransfer.effectAllowed = "move";
            });
            el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragKind = null; });
            return el;
        }

        function setupCardDropZone(cardsEl) {
            cardsEl.addEventListener("dragover", e => {
                if (dragKind !== "card") return;
                e.preventDefault(); cardsEl.classList.add("drag-over");
            });
            cardsEl.addEventListener("dragleave", () => cardsEl.classList.remove("drag-over"));
            cardsEl.addEventListener("drop", e => {
                if (dragKind !== "card") return;
                e.preventDefault(); e.stopPropagation();
                cardsEl.classList.remove("drag-over");
                const cardId = Number(e.dataTransfer.getData("text/plain"));
                const toColumnId = Number(cardsEl.dataset.columnId);
                const position = indexByY(cardsEl, ".card", e.clientY);
                const cardEl = document.querySelector(`.card[data-card-id="${cardId}"]`);
                const baseVersion = cardEl ? Number(cardEl.dataset.version) : null;
                sendOp({ type: "MOVE_CARD", cardId, toColumnId, position, baseVersion });
            });
        }

        function setupBoardDropZone() {
            boardEl.addEventListener("dragover", e => { if (dragKind === "column") e.preventDefault(); });
            boardEl.addEventListener("drop", e => {
                if (dragKind !== "column") return;
                e.preventDefault();
                const raw = e.dataTransfer.getData("text/plain");
                if (!raw.startsWith("col:")) return;
                const columnId = Number(raw.slice(4));
                const position = indexByX(boardEl, ".column", e.clientX);
                sendOp({ type: "MOVE_COLUMN", columnId, position });
            });
        }

        function indexByY(c, sel, y) {
            const items = [...c.querySelectorAll(sel + ":not(.dragging)")];
            for (let i = 0; i < items.length; i++) { const r = items[i].getBoundingClientRect(); if (y < r.top + r.height / 2) return i; }
            return items.length;
        }
        function indexByX(c, sel, x) {
            const items = [...c.querySelectorAll(sel + ":not(.dragging)")];
            for (let i = 0; i < items.length; i++) { const r = items[i].getBoundingClientRect(); if (x < r.left + r.width / 2) return i; }
            return items.length;
        }

        // ═══ 2) CANLI YAYIN (WebSocket/STOMP) ═══
        function connect() {
            stompClient = new StompJs.Client({
                brokerURL: "ws://" + location.host + "/ws",
                reconnectDelay: 3000,
                onConnect: () => {
                    setStatus(true);
                    stompClient.subscribe("/topic/board." + boardId, msg => handleEvent(JSON.parse(msg.body)));
                },
                onWebSocketClose: () => setStatus(false)
            });
            stompClient.activate();
        }

        function sendOp(op) {
            stompClient.publish({
                destination: "/app/board/" + boardId + "/ops",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(op)
            });
        }

        function handleEvent(ev) {
            if (ev.type === "ADD_CARD") {
                const cardsEl = document.querySelector(`.cards[data-column-id="${ev.columnId}"]`);
                if (cardsEl && !document.querySelector(`.card[data-card-id="${ev.card.id}"]`))
                    insertAt(cardsEl, ".card", createCardEl(ev.card), ev.card.position);
            } else if (ev.type === "MOVE_CARD") {
                const cardEl = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                const targetEl = document.querySelector(`.cards[data-column-id="${ev.toColumnId}"]`);
                if (cardEl && targetEl) { cardEl.dataset.version = ev.version; insertAt(targetEl, ".card", cardEl, ev.position); }
            } else if (ev.type === "EDIT_CARD") {
                const cardEl = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                if (cardEl) { cardEl.querySelector(".card-title").textContent = ev.title; cardEl.dataset.version = ev.version; }
            } else if (ev.type === "DELETE_CARD") {
                const cardEl = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                if (cardEl) cardEl.remove();
            } else if (ev.type === "MOVE_COLUMN") {
                const colEl = document.querySelector(`.column[data-column-id="${ev.columnId}"]`);
                if (colEl) insertAt(boardEl, ".column", colEl, ev.position);
            }
            updateCounts();
        }

        function insertAt(container, sel, el, index) {
            const items = [...container.querySelectorAll(sel)].filter(c => c !== el);
            if (index >= items.length) container.appendChild(el);
            else container.insertBefore(el, items[index]);
        }
        function updateCounts() {
            document.querySelectorAll(".column").forEach(col =>
                col.querySelector("[data-count]").textContent = col.querySelectorAll(".card").length);
        }
        function setStatus(c) {
            statusDot.classList.toggle("connected", c);
            statusText.textContent = c ? "bağlı" : "bağlantı kesildi";
        }
        function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

        if (boardId) loadBoard();
    </script>
</body>
</html>
