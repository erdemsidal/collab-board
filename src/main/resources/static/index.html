    <button class="menu-item" data-a="logout">${I.logout} Çıkış yap</button>`);
  el.onclick = (e) => {
    const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
    closePops();
    if (a === "profile") goProfile();
    if (a === "theme") toggleTheme();
    if (a === "search") openPalette();
    if (a === "notif") toggleNotifPanel();
    if (a === "logout") logout();
  };
}

/* ── Bildirimler ─────────────────────────────────────────────────────── */

function notifText(n) {
  const who = `<strong>${esc(n.actorName || "Biri")}</strong>`;
  const board = `<strong>${esc(n.boardName || "silinmiş bir pano")}</strong>`;
  switch (n.type) {
    case "BOARD_INVITE": return `${who} seni ${board} panosuna <strong>${ROLE_NAME[n.role] || ""}</strong> olarak davet etti`;
    case "INVITE_ACCEPTED": return `${who} davetini kabul etti · ${board}`;
    case "INVITE_DECLINED": return `${who} davetini reddetti · ${board}`;
    case "INVITE_CANCELLED": return `${who} davetini geri çekti · ${board}`;
    default: return "";
  }
}

function toggleNotifPanel() {
  if (document.querySelector(".notif-pop")) return closePops();
  openPop($("bellBtn"), "notif-pop", "");
  renderNotifPanel();
  if (!S.notif.loaded) loadNotifications();
  // Bilgi bildirimleri görülünce okundu sayılır; davetler ise yanıtlanana kadar bekler.
  S.notif.items.filter((n) => !n.read && n.type !== "BOARD_INVITE").forEach((n) => {
    n.read = true; S.notif.unread = Math.max(0, S.notif.unread - 1);
    api.markNotificationRead(n.id).catch(() => {});
  });
  updateBell();
}

function renderNotifPanel() {
  const el = document.querySelector(".notif-pop"); if (!el) return;
  const items = S.notif.items;
  el.innerHTML = `<div class="notif-head"><b>Bildirimler</b>${S.notif.unread ? `<a id="readAll">Tümünü okundu say</a>` : ""}</div>
    <div class="notif-list">${S.notif.error ? `<div class="notif-empty">${I.warnCircle}<b>Bildirimler yüklenemedi</b>
        Bağlantını kontrol et. <a id="notifRetry">Tekrar dene</a></div>`
      : !S.notif.loaded ? `<div class="notif-empty">Yükleniyor…</div>`
      : items.length ? items.map(notifRow).join("")
      : `<div class="notif-empty">${I.bellBig}<b>Bildirimin yok</b>Biri seni bir panoya davet ettiğinde burada görünür.</div>`}</div>`;

  el.querySelector("#readAll")?.addEventListener("click", async () => {
    S.notif.items.forEach((n) => { n.read = true; }); S.notif.unread = 0;
    updateBell(); renderNotifPanel();
    api.markAllNotificationsRead().catch(() => {});
  });
  el.querySelector("#notifRetry")?.addEventListener("click", () => { S.notif.error = false; renderNotifPanel(); loadNotifications(); });
  el.querySelectorAll("[data-inv]").forEach((b) => b.addEventListener("click", () =>
    respondInvite(Number(b.dataset.inv), b.dataset.a === "ok")));
  el.querySelectorAll("[data-open]").forEach((a) => a.addEventListener("click", () => {
    closePops(); openBoard(Number(a.dataset.open));
  }));
}

function notifRow(n) {
  let extra = "";
  if (n.type === "BOARD_INVITE") {
    if (n.invitationStatus === "PENDING") {
      extra = `<div class="acts">
        <button class="btn btn-primary btn-sm" data-inv="${n.invitationId}" data-a="ok">${I.check} Kabul et</button>
        <button class="btn-ghost btn-sm" data-inv="${n.invitationId}" data-a="no">Reddet</button></div>`;
    } else if (n.invitationStatus === "ACCEPTED") {
      extra = `<div class="done">Kabul ettin${n.boardId ? ` · <a data-open="${n.boardId}">Panoya git →</a>` : ""}</div>`;
    } else if (n.invitationStatus === "DECLINED") {
      extra = `<div class="done">Reddettin</div>`;
    } else if (n.invitationStatus === "CANCELLED") {
      extra = `<div class="done">Davet geri çekildi</div>`;
    }
  }
  return `<div class="notif${n.read ? "" : " unread"}">${avatar(n.actorName || "?", 32, "", n.actorAvatarUrl)}
    <div style="min-width:0;flex:1"><div class="tx">${notifText(n)}</div><div class="tm">${relTime(n.createdAt)}</div>${extra}</div></div>`;
}

async function loadNotifications(showPending = false) {
  S.notif.error = false;
  try {
    const r = await api.notifications(30);
    S.notif = { items: r.items, unread: r.unreadCount, loaded: true };
    updateBell(); renderNotifPanel();
    // Ana ekrandaysa bekleyen davetleri tepedeki şerit zaten gösteriyor; köşe kutusu tekrar olurdu.
    if (showPending && S.view !== "home") {
      r.items.filter((n) => n.type === "BOARD_INVITE" && n.invitationStatus === "PENDING").forEach(showInviteToast);
    }
  } catch (_) {
    // Bildirimler ikincil: ekran bozulmaz, hata yalnızca panelin içinde söylenir.
    S.notif.error = true; renderNotifPanel();
  }
}

/**
 * Davet kutusu (sağ alt). Bilgi toast'larından farklı olarak kendiliğinden
 * kapanmaz: davet bir karar bekliyor. Kapatılırsa zilde beklemeye devam eder.
 */
function showInviteToast(n) {
  if (S.dismissedInvites.has(n.invitationId)) return;
  if (document.querySelector(`.toast.invite[data-inv="${n.invitationId}"]`)) return;
  if (document.querySelectorAll(".toast.invite").length >= 3) return;   // fazlası zilde

  const el = document.createElement("div");
  el.className = "toast invite"; el.dataset.inv = n.invitationId;
  el.innerHTML = `<div class="row">${avatar(n.actorName || "?", 30, "", n.actorAvatarUrl)}
      <div style="min-width:0"><b>Pano daveti</b><span>${notifText(n)}</span></div>
      <button class="icon-btn x" title="Sonra karar ver">${I.close}</button></div>
    <div class="acts">
      <button class="btn btn-primary btn-sm" data-a="ok">${I.check} Kabul et</button>
      <button class="btn-ghost btn-sm" data-a="no">Reddet</button></div>`;
  el.querySelector(".x").onclick = () => { S.dismissedInvites.add(n.invitationId); el.remove(); };
  el.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => {
    el.querySelectorAll("button").forEach((x) => { x.disabled = true; });
    respondInvite(n.invitationId, b.dataset.a === "ok");
  }));
  $("toasts").appendChild(el);
}
const removeInviteToast = (id) =>
  document.querySelectorAll(`.toast.invite[data-inv="${id}"]`).forEach((n) => n.remove());

async function respondInvite(invitationId, accept) {
  try {
    if (accept) {
      const r = await api.acceptInvitation(invitationId);
      setInviteStatus(invitationId, "ACCEPTED", r.boardId);
      toast("Panoya katıldın", `${r.boardName} · ${ROLE_NAME[r.role]}`, "ok",
        { label: "Panoyu aç →", fn: () => openBoard(r.boardId) });
      refreshBoardList();
    } else {
      await api.declineInvitation(invitationId);
      setInviteStatus(invitationId, "DECLINED");
      toast("Davet reddedildi");
    }
  } catch (e) {
    removeInviteToast(invitationId);
    toast("Yanıtlanamadı", e.message, "err");
    loadNotifications();   // durum değişmiş olabilir (ör. gönderen geri çekmiş)
  }
}

/** Bir davetin durumunu her yerde günceller: zil listesi, rozet, sağ alttaki kutu. */
function setInviteStatus(invitationId, status, boardId) {
  S.notif.items.forEach((n) => {
    if (n.invitationId !== invitationId || n.type !== "BOARD_INVITE") return;
    if (!n.read) { n.read = true; S.notif.unread = Math.max(0, S.notif.unread - 1); }
    n.invitationStatus = status;
    if (boardId) n.boardId = boardId;
  });
  removeInviteToast(invitationId);
  updateBell(); renderNotifPanel();
}

/** Kişisel kanaldan gelen olay. */
function onInboxEvent(ev) {
  if (ev.type === "INVITATION_RESOLVED") { setInviteStatus(ev.invitationId, ev.status); return; }
  if (ev.type !== "NOTIFICATION") return;
  const n = ev.notification;
  S.notif.items = [n, ...S.notif.items.filter((x) => x.id !== n.id)];
  if (!n.read) S.notif.unread++;
  updateBell(); renderNotifPanel();

  const who = n.actorName || "Biri", board = n.boardName || "";
  if (n.type === "BOARD_INVITE") showInviteToast(n);
  else if (n.type === "INVITE_CANCELLED") {
    setInviteStatus(n.invitationId, "CANCELLED");
    toast("Davet geri çekildi", `${who} · ${board}`, "warn");
  } else if (n.type === "INVITE_ACCEPTED") toast("Davet kabul edildi", `${who} · ${board}`, "ok");
  else if (n.type === "INVITE_DECLINED") toast("Davet reddedildi", `${who} · ${board}`);
}

function startInbox() {
  if (S.inbox) return;
  // Her (yeniden) bağlanmada liste tazelenir: kopukken gelen davetler kaçmasın.
  S.inbox = connectInbox({
    onEvent: onInboxEvent,
    onConnect: () => loadNotifications(true),
    onAuthLost: () => { logout(); toast("Oturumun sona erdi", "Tekrar giriş yap.", "warn"); },
  });
}
function stopInbox() {
  S.inbox && S.inbox.close(); S.inbox = null;
  S.notif = { items: [], unread: 0, loaded: false };
  S.dismissedInvites.clear();
  document.querySelectorAll(".toast.invite").forEach((n) => n.remove());
}

/* ── Fotoğraf kırpma ── */

function openCropper(file) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return toast("Desteklenmeyen dosya", "PNG, JPEG ya da WebP seç.", "err");
  if (file.size > 5 * 1024 * 1024) return toast("Dosya çok büyük", "En fazla 5 MB.", "err");
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => mountCropper(img, url);
  img.onerror = () => { URL.revokeObjectURL(url); toast("Görsel açılamadı", "Dosya bozuk olabilir.", "err"); };
  img.src = url;
}

/**
 * Kare kırpma. Görsel sürüklenir ve yakınlaştırılır; yuvarlak maske, avatarın
 * nasıl görüneceğini gösterir. Sunucuya ham dosya değil, 256×256'lık sonuç
 * gider — hem küçük hem her yerde aynı oranda.
 */
function mountCropper(img, url) {
  const STAGE = 280, OUT = 256;
  const base = Math.max(STAGE / img.width, STAGE / img.height);   // kısa kenar sahneyi doldursun
  const st = { zoom: 1, x: 0, y: 0 };

  openModal(`<div class="modal" style="width:560px">
      <h3>Profil fotoğrafı</h3>
      <p class="sub">Sürükleyerek konumla, kaydırıcıyla yakınlaştır.</p>
      <div class="crop-wrap">
        <div>
          <div class="crop-stage" id="cropStage"><canvas id="cropCv" width="${STAGE}" height="${STAGE}"></canvas><div class="crop-mask"></div></div>
          <input type="range" class="zoom" id="cropZoom" min="1" max="3" step="0.01" value="1">
        </div>
        <div class="crop-side">
          <canvas id="pv96" width="96" height="96"></canvas>
          <canvas id="pv30" width="30" height="30"></canvas>
          <small style="color:var(--ink-3);text-align:center;max-width:120px">Profilde ve üye listesinde böyle görünecek</small>
        </div>
      </div>
      <div class="acts">
        <button class="btn btn-primary" id="cropSave">Kaydet</button>
        <button class="btn btn-ghost" id="close">Vazgeç</button>
      </div></div>`, (o) => {
    const cv = o.querySelector("#cropCv"), zoom = o.querySelector("#cropZoom");
    const close = () => { URL.revokeObjectURL(url); closeModal(); };

    const clamp = () => {
      const w = img.width * base * st.zoom, h = img.height * base * st.zoom;
      const mx = Math.max(0, (w - STAGE) / 2), my = Math.max(0, (h - STAGE) / 2);
      st.x = Math.min(mx, Math.max(-mx, st.x)); st.y = Math.min(my, Math.max(-my, st.y));
    };
    // Aynı dönüşüm her boyuttaki tuvale: sahne, önizlemeler ve çıktı birebir aynı kareyi gösterir.
    const paint = (canvas, size) => {
      const k = size / STAGE, s2 = base * st.zoom * k;
      const w = img.width * s2, h = img.height * s2;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (size - w) / 2 + st.x * k, (size - h) / 2 + st.y * k, w, h);
    };
    const redraw = () => { clamp(); paint(cv, STAGE); paint(o.querySelector("#pv96"), 96); paint(o.querySelector("#pv30"), 30); };

    let drag = null;
    const stage = o.querySelector("#cropStage");
    stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX - st.x, y: e.clientY - st.y }; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener("pointermove", (e) => { if (!drag) return; st.x = e.clientX - drag.x; st.y = e.clientY - drag.y; redraw(); });
    stage.addEventListener("pointerup", () => { drag = null; });
    stage.addEventListener("wheel", (e) => {
      e.preventDefault();
      st.zoom = Math.min(3, Math.max(1, st.zoom - e.deltaY * 0.0015)); zoom.value = st.zoom; redraw();
    }, { passive: false });
    zoom.oninput = () => { st.zoom = Number(zoom.value); redraw(); };

    o.querySelector("#close").onclick = close;
    o.querySelector("#cropSave").onclick = async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      const out = document.createElement("canvas"); out.width = OUT; out.height = OUT;
      paint(out, OUT);
      const blob = await toImageBlob(out);
      try {
        S.me = await api.uploadAvatar(blob); persistSession();
        close(); toast("Fotoğraf güncellendi", "", "ok");
        refreshMeEverywhere();
      } catch (err) { btn.disabled = false; toast("Yüklenemedi", err.message, "err"); }
    };
    redraw();
  });
}

/** WebP en küçüğü; tarayıcı WebP kodlayamıyorsa (PNG'ye düşer) JPEG'e geçilir. */
function toImageBlob(canvas) {
  return new Promise((resolve) => canvas.toBlob((b) => {
    if (b && b.type === "image/webp") return resolve(b);
    canvas.toBlob(resolve, "image/jpeg", 0.9);
  }, "image/webp", 0.9));
}

async function goHome() {

  if (S.view === "home") renderHome();
}

/**
 * Ana ekranda hangi panolar listelensin: "all" (hepsi), "mine" (üyesi olduğum
 * alanlardakiler), SHARED (yalnızca panoya davet edildiklerim) ya da bir alan kimliği.
 */
const validScope = (k) => k === "all" || k === "mine" || (k === SHARED && sharedBoards().length > 0)
  || S.workspaces.some((w) => w.id === k);

function renderHome() {
  if (!validScope(S.activeWs)) S.activeWs = "all";
  app.innerHTML = `
  <div id="home">
    ${homeTopbar()}
    <div class="home-body">
      <nav class="side-nav" aria-label="Yan menü">
        <div class="sn-recent" id="recentBox"></div>
        <div class="sn-ws">
          <p class="side-h">Çalışma alanları</p>
          <div id="wsList"></div>
          <button class="ws-new" id="wsNew">+ Yeni çalışma alanı</button>
        </div>
      </nav>
      <main class="home-main" id="homeMain">
        <section class="ov" id="overview" aria-label="Özet"></section>
        <section id="boardsSec" aria-label="Panolar"></section>
        <section id="teamSec" aria-label="Ekip"></section>
      </main>
    </div>
  </div>`;

  bindTopbar();
  $("wsNew").onclick = () => createModal("workspace");
  renderWsList(); renderRecent(); renderOverview(); renderBoardsSection(); renderTeam();
}

/** Özet verisine bağlı her parça: özet geldiğinde ya da tazelendiğinde birlikte çizilir. */
function renderHomeData() {
  renderOverview(); renderBoardsSection(); renderTeam(); renderRecent(); renderOnlinePill();
}

/* ── Kenar menüsü ── */

const pendingInvites = () => S.notif.items.filter((n) => n.type === "BOARD_INVITE" && n.invitationStatus === "PENDING");


/* Son açılan panolar: bu tarayıcıda, hesap başına saklanır (en fazla 5). */
const recentKey = () => "cb_recent_" + (S.me?.id ?? S.me?.email ?? "");
function recentBoards() {
  try { return JSON.parse(localStorage.getItem(recentKey())) || []; } catch (_) { return []; }
}
function rememberBoard(b) {
  const list = [{ id: b.id, name: b.name }, ...recentBoards().filter((x) => x.id !== b.id)].slice(0, 5);
  try { localStorage.setItem(recentKey(), JSON.stringify(list)); } catch (_) {}
}

function renderRecent() {
  const box = $("recentBox"); if (!box) return;
  const known = new Map(S.boards.map((b) => [b.id, b]));
  // Pano listesi gelmeden önce hepsi gösterilir; geldikten sonra artık erişilemeyenler düşer.
  const list = recentBoards().filter((r) => S.homeLoading || known.has(r.id)).slice(0, 4);
  if (!list.length) { box.innerHTML = ""; box.hidden = true; return; }
  box.hidden = false;
  const live = new Map((ovData()?.liveBoards || []).map((l) => [l.boardId, l.people.length]));
  box.innerHTML = `<p class="side-h">Son açılanlar</p>` + list.map((r) => {
    const name = known.get(r.id)?.name || r.name;
    return `<button class="nav-a rec" data-board="${r.id}"><span class="sq" style="background:${colorOf(name)}"></span>
      <span class="nm">${esc(name)}</span>${live.get(r.id) ? `<span class="live-n" title="Şu an panoda olan kişi">● ${live.get(r.id)}</span>` : ""}</button>`;
  }).join("");
  box.onclick = (e) => { const b = e.target.closest("[data-board]"); if (b) openBoard(Number(b.dataset.board)); };
}

function renderWsList() {
  const list = $("wsList"); if (!list) return;
  list.innerHTML = "";
  S.workspaces.forEach((w) => {
    const count = S.boards.filter((b) => b.workspaceId === w.id).length;
    const row = document.createElement("div");
    row.className = "ws-row" + (w.id === S.activeWs ? " active" : "");
    row.innerHTML = `${wsIni(w.name)}<div class="ws-name">${esc(w.name)}</div>
      ${(w.role === "OWNER" || w.role === "ADMIN") ? `<div class="ws-actions">
        <button class="icon-btn edit" title="Yeniden adlandır">${I.pencil}</button>
        <button class="icon-btn del" title="Sil">${I.trash}</button></div>` : ""}
      <span class="ws-count">${count}</span>`;
    row.onclick = (e) => { if (e.target.closest(".ws-actions")) return; selectWs(w.id); };
    row.querySelector(".edit")?.addEventListener("click", () => inlineRename(row, w));
    row.querySelector(".del")?.addEventListener("click", () => confirmDeleteWs(w));
    list.appendChild(row);
  });
  const shared = sharedBoards();
  if (shared.length) {
    const row = document.createElement("div");
    row.className = "ws-row" + (S.activeWs === SHARED ? " active" : "");
    row.id = "sharedRow";
    row.innerHTML = `<span class="ws-ini shared">↗</span><div class="ws-name">Benimle paylaşılanlar</div><span class="ws-count">${shared.length}</span>`;
    row.onclick = () => selectWs(SHARED);
    list.appendChild(row);
  }
}

/** Alan seçimi yalnızca pano listesini süzer; özet her zaman bütün panoları anlatır. */
function selectWs(key) {
  S.activeWs = key;
  if (S.view !== "home") return goHome();
  renderWsList(); renderBoardsSection();
  const sw = $("wsSwitch"); if (sw) sw.innerHTML = wsSwitchInner();
  $("boardsSec")?.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
}

function emptyState(ws) {
  if (ws && ws.role === "GUEST") {
    return `<div class="empty"><div class="ico">${I.kanban}</div><h3>Bu alana erişimin yok</h3>
      <p>Misafir rolündesin; yalnızca ayrıca davet edildiğin panoları görebilirsin.</p></div>`;
  }
  return `<div class="empty"><div class="ico">${I.kanban}</div><h3>Henüz pano yok</h3>
    <p>İlk panonu oluştur ya da bir panoya davet edilmeyi bekle.</p>
    <button class="btn btn-primary" id="firstBoard">İlk panoyu oluştur</button></div>`;
}

/* ── Ana ekran özeti ── */

/**
 * Özet, ana ekranın geri kalanından AYRI yüklenir ve çizilir: yavaş gelirse
 * pano listesini bekletmez; çalışma alanı değişince yeniden istenmez, bellekteki
 * hâli çizilir. Ana ekrana her dönüşte ve ana ekrandayken dakikada bir tazelenir.
 * Bellek hesaba bağlı: aynı sekmede başka bir hesapla girilirse öncekinin
 * kartları bir an bile görünmesin.
 */
const OV = { owner: null, data: null, loading: false, failed: false, fresh: false };
const ovData = () => (OV.owner === S.me?.email ? OV.data : null);


async function loadOverview() {
  const owner = S.me?.email;
  if (OV.owner !== owner) { OV.owner = owner; OV.data = null; }
  OV.loading = !OV.data; OV.failed = false;
  renderOverview();
  try {
    const data = await api.overview();
    if (OV.owner === owner) { OV.fresh = !OV.data; OV.data = data; }
  } catch (_) {
    // Özet ikincil: hata pano listesini bozmasın, yerinde "tekrar dene" çıksın.
    if (!OV.data) OV.failed = true;
  }
  OV.loading = false;
  renderHomeData();
}

// Ana ekran açık kaldıkça "şu an canlı" ve sayaçlar bayatlamasın.
setInterval(() => { if (S.view === "home" && !document.hidden) loadOverview(); }, 60000);

function greeting() {
  const h = new Date().getHours();
  return h >= 5 && h < 12 ? "Günaydın" : h >= 12 && h < 18 ? "İyi günler" : "İyi akşamlar";
}

const daysUntil = (iso) => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(iso + "T00:00:00") - today) / 86400000);
};

function overviewHead(d) {
  const date = new Date().toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const bits = [];
  if (d) {
    const today = d.assignedCards.filter((c) => c.dueDate && daysUntil(c.dueDate) === 0).length;
    if (d.overdueCount) bits.push(`<span class="late">${d.overdueCount} kartın gecikti</span>`);
    if (today) bits.push(`<span class="soon">${today} kartın bugün bitiyor</span>`);
  }
  return `<div class="ov-head">
    <div><h1>${greeting()}${S.me?.firstName ? ", " + esc(S.me.firstName) : ""}</h1>
      <p class="sub">${esc(date)}${bits.length ? " · " + bits.join(", ") : d && d.assignedOpenCount ? " · acil bir işin yok" : ""}</p></div>
  </div><div id="invBanner"></div>`;
}

function renderOverview() {
  const box = $("overview"); if (!box) return;
  const d = ovData();

  if (!d) {
    box.innerHTML = overviewHead(null) + (OV.failed
      ? `<div class="ov-fail">${I.warnCircle}<span>Özet yüklenemedi.</span><a id="ovRetry">Tekrar dene</a></div>`
      : `<div class="ov-split"><div class="skel ov-skel-list" style="flex:2 1 420px"></div><div class="skel ov-skel-list" style="flex:1 1 300px"></div></div>`);
  } else {
    box.classList.toggle("fresh", OV.fresh);
    OV.fresh = false;
    box.innerHTML = overviewHead(d) + `
      <div class="ov-split">${overviewAssigned(d)}<div class="aside">${overviewLive(d)}${overviewAging(d)}</div></div>`;
  }
  renderInviteBanner();

  // Satırlar düğme: tıklama (ya da Enter) o panoyu, varsa o kartı açar.
  box.onclick = (e) => {
    const f = e.target.closest("[data-ovf]");
    if (f) { S.ovFilter = f.dataset.ovf; return renderOverview(); }
    const row = e.target.closest("[data-board]");
    if (row) openBoard(Number(row.dataset.board), { focusCard: Number(row.dataset.card) || null });
  };
  $("ovRetry")?.addEventListener("click", loadOverview);
}


function overviewAssigned(d) {
  const f = S.ovFilter || "all";
  const list = d.assignedCards.filter((c) => f === "all" ? true
    : f === "late" ? c.dueDate && daysUntil(c.dueDate) < 0
    : c.dueDate && daysUntil(c.dueDate) >= 0 && daysUntil(c.dueDate) <= 6);
  const rows = list.map((c) => `
    <button class="ov-row" data-board="${c.boardId}" data-card="${c.cardId}" title="${esc(c.boardName)} panosunda aç">
      <span class="box"></span>
      <span class="tx"><span class="tt">${esc(c.title)}</span>
        <span class="mt"><i style="background:${colorOf(c.boardName)}"></i><span>${esc(c.boardName)} · ${esc(c.columnName)}</span></span></span>
      ${c.dueDate ? `<span class="ov-due ${dueState(c.dueDate)}">${esc(dueLabel(c.dueDate))}</span>` : `<span class="ov-due none">Tarih yok</span>`}
    </button>`).join("");
  const more = d.assignedOpenCount - d.assignedCards.length;
  const chip = (k, label) => `<button class="${f === k ? "on" : ""}" data-ovf="${k}" aria-pressed="${f === k}">${label}</button>`;
  return `<section class="ov-card ov-list mine" id="ovAssigned">
    <div class="hd"><h2>Bana atanan kartlar</h2><span class="cnt">${d.assignedOpenCount} açık</span>
      <div class="seg">${chip("all", "Tümü")}${chip("week", "Bu hafta")}${chip("late", "Geciken")}</div></div>
    ${rows ? `<div class="ov-body">${rows}</div>${more > 0 && f === "all" ? `<div class="ov-more">+${more} kart daha · son tarihi en yakın olanlar gösteriliyor</div>` : ""}`
      : d.assignedOpenCount && f !== "all"
        ? `<div class="ov-empty"><b>Bu süzgece uyan kart yok</b>${f === "late" ? "Gecikmiş kartın yok." : "Önümüzdeki 7 günde bitmesi gereken kartın yok."}</div>`
        : `<div class="ov-empty"><div class="ei" style="background:var(--ok-soft);color:var(--ok-ink)">${I.check}</div><b>Sana atanmış açık kart yok</b>
          Bir kart sana atandığında burada, son tarihine göre sıralı görünür.</div>`}
  </section>`;
}

function overviewLive(d) {
  const live = d.liveBoards || [];
  return `<section class="ov-card pad"><h2><span class="live-dot"></span>Şu an canlı</h2>
    ${live.length ? `<div class="live-list">${live.map((l) => `
      <button class="live-row" data-board="${l.boardId}" title="${esc(l.people.map((p) => p.name).join(", "))}">
        <span class="sq" style="background:${colorOf(l.boardName)}"></span><span class="nm">${esc(l.boardName)}</span>
        <span class="av-stack on-card">${l.people.slice(0, 4).map((p) => avatar(p.name, 22, "", p.avatarUrl)).join("")}</span>
      </button>`).join("")}</div>`
      : `<p class="ov-note">Şu an panolarında senden başka kimse yok. Biri bir panoyu açtığında burada canlı görünür.</p>`}
  </section>`;
}


/** Bir panonun kolon dağılımı tek çubukta: gri başlangıç, mavi süren iş, yeşil biten; darboğaz kırmızı, dolu WIP sarı. */
function segbar(cols, bottleneck, wipFull) {
  const total = cols.reduce((n, c) => n + c.count, 0);
  if (!total) return `<span class="segbar none"></span>`;
  const color = (c, i) => i === cols.length - 1 ? "var(--ok)" : c.name === bottleneck ? "var(--err-ink)"
    : c.name === wipFull ? "var(--warn)" : i === 0 ? "var(--ink-4)" : "var(--blue)";
  return `<span class="segbar" title="${esc(cols.map((c) => `${c.name}: ${c.count}`).join(" · "))}">${cols.map((c, i) =>
    c.count ? `<i style="flex:${c.count};background:${color(c, i)}"></i>` : "").join("")}</span>`;
}


function overviewAging(d) {
  const ag = d.aging || [];
  return `<section class="ov-card pad"><h2>Yaşlanan işler</h2>
    ${ag.length ? `<div class="ag-list">${ag.map((g) => {
      const tone = g.ageSeconds >= 7 * DAY ? "hot" : g.ageSeconds >= 3 * DAY ? "warm" : "";
      return `<button class="ag-row" data-board="${g.boardId}" data-card="${g.cardId}" title="${g.estimated ? "Kolona giriş anı kayıtta yok; süre en az bu kadar" : "Bu kolonda bekliyor"}">
        <span class="tx"><span class="tt">${esc(g.title)}</span><span class="wh">${esc(g.boardName)} · ${esc(g.columnName)}</span></span>
        <span class="age ${tone}">${humanDuration(g.ageSeconds)}${g.estimated ? "~" : ""}</span></button>`; }).join("")}</div>`
      : `<p class="ov-note">Açık kartın yok ya da hiçbiri bir kolonda uzun süredir beklemiyor.</p>`}
  </section>`;
}

function overviewFeed(d) {
  const rows = d.recentActivity.slice(0, 6).map((a) => `
    <button class="feed-row" data-board="${a.boardId}" title="${esc(a.boardName)} panosunu aç">
      ${avatar(a.actorName, 24, "", a.actorAvatarUrl)}
      <span><b>${esc(a.actorName)}</b> ${esc(a.description)}<small>${esc(a.boardName)} · ${relTime(a.createdAt)}</small></span>
    </button>`).join("");
  return `<section class="ov-card pad ov-list feed"><h2>Son hareketler</h2>
    ${rows ? `<div class="feed">${rows}</div>` : `<p class="ov-note">Panolarında kart eklendiğinde ya da taşındığında burada görünür.</p>`}
  </section>`;
}

/** Bekleyen ilk davet, ana ekranın tepesinde kararını bekler (fazlası zilde). */
function renderInviteBanner() {
  const box = $("invBanner"); if (!box) return;
  const list = pendingInvites();
  if (!list.length) { box.innerHTML = ""; return; }
  const n = list[0];
  box.innerHTML = `<div class="inv-banner">${avatar(n.actorName || "?", 32, "", n.actorAvatarUrl)}
    <p>${notifText(n)} · ${relTime(n.createdAt)}${list.length > 1 ? `<a class="more" id="invMore">+${list.length - 1} davet daha</a>` : ""}</p>
    <div class="acts"><button class="btn btn-primary btn-sm" data-inv="${n.invitationId}" data-a="ok">${I.check} Kabul et</button>
      <button class="btn-ghost btn-sm" data-inv="${n.invitationId}" data-a="no">Reddet</button></div></div>`;
  box.querySelectorAll("[data-inv]").forEach((b) => b.addEventListener("click", () => {
    box.querySelectorAll("button").forEach((x) => { x.disabled = true; });
    respondInvite(Number(b.dataset.inv), b.dataset.a === "ok");
  }));
  $("invMore")?.addEventListener("click", (e) => { e.stopPropagation(); toggleNotifPanel(); });
}

/* ── Panolar ── */
function renderBoardsSection() {
  const box = $("boardsSec"); if (!box) return;
  const key = S.activeWs;
  const ws = typeof key === "number" ? S.workspaces.find((w) => w.id === key) : null;
  const shared = sharedBoards();
  const list = key === "all" ? S.boards : key === "mine" ? S.boards.filter((b) => !shared.includes(b))
    : key === SHARED ? shared : S.boards.filter((b) => b.workspaceId === key);
  const chip = (k, label) => `<button class="${key === k ? "on" : ""}" data-scope="${k}" aria-pressed="${key === k}">${label}</button>`;

  let body;
  if (S.homeLoading && !S.boards.length) body = `<div class="board-grid">${'<div class="skel"></div>'.repeat(3)}</div>`;
  else if (!S.boards.length) body = emptyState(null);
  else if (ws && ws.role === "GUEST" && !list.length) body = emptyState(ws);
  else body = `<div class="board-grid" id="grid">${list.map((b) => boardCard(b, shared.includes(b))).join("")}
      <button class="board-new" id="newBoard2">+ Yeni pano</button></div>`;

  box.innerHTML = `<div class="boards-head"><h2>${esc(ws ? ws.name : key === SHARED ? "Benimle paylaşılanlar" : "Panoların")}</h2>
      <span class="cnt">${list.length}</span>${ws ? `<span class="badge ${ws.role}">${roleLabel(ws.role)}</span>` : ""}
      <div class="seg">${chip("all", "Tümü")}${chip("mine", "Benim")}${shared.length ? chip(SHARED, "Paylaşılan") : ""}</div></div>${body}`;

  box.onclick = (e) => {
    const s = e.target.closest("[data-scope]");
    if (s) { S.activeWs = s.dataset.scope; renderWsList(); renderBoardsSection(); const sw = $("wsSwitch"); if (sw) sw.innerHTML = wsSwitchInner(); return; }
    const b = e.target.closest("[data-board]");
    if (b) openBoard(Number(b.dataset.board));
  };
  $("newBoard2")?.addEventListener("click", () => createModal("board"));
  $("firstBoard")?.addEventListener("click", () => createModal("board"));
}

function boardCard(b, isShared) {
  const d = ovData();
  const h = (d?.boardsHealth || []).find((x) => x.boardId === b.id);
  const live = (d?.liveBoards || []).find((x) => x.boardId === b.id);
  const space = isShared ? (b.workspaceName ? `${b.workspaceName} · seninle paylaşıldı` : "Seninle paylaşıldı") : b.workspaceName || "";
  return `<button class="board-card" data-board="${b.id}">
    <span class="t"><span class="sq" style="background:${colorOf(b.name)}"></span><span class="nm">${esc(b.name)}</span>
      <span class="badge ${b.role}">${roleLabel(b.role)}</span></span>
    <span class="sp">${esc(space)}</span>
    ${h ? segbar(h.columns, h.bottleneck, h.wipFull) : `<span class="segbar none"></span>`}
    <span class="m">${b.cardCount} kart · ${b.memberCount} üye${live ? `<span class="live-n">● ${live.people.length} kişi burada</span>` : ""}</span>
  </button>`;
}

/* ── Ekip ── */
function renderTeam() {
  const box = $("teamSec"); if (!box) return;
  const d = ovData();
  if (!d) { box.innerHTML = ""; return; }
  const team = d.team || [];
  box.innerHTML = `<div class="ov-2">${overviewFeed(d)}<div class="ov-card pad"><div class="hd2"><h2>Ekibin</h2><span class="cnt">${team.length}</span>
      <button class="link-btn" id="teamInvite">Davet et →</button></div>
    ${team.length ? `<div class="team">${team.map((m) => `<div class="tm">
        <span class="av-dot${m.online ? " on" : ""}" title="${m.online ? "Çevrimiçi" : "Çevrimdışı"}">${avatar(m.name, 34, "", m.avatarUrl)}</span>
        <span class="who"><b>${esc(m.name)}</b><small>${m.online ? (m.where ? `${esc(m.where)} panosunda` : "çevrimiçi") : "çevrimdışı"}</small></span></div>`).join("")}</div>`
      : `<p class="ov-note">Henüz kimseyle pano paylaşmıyorsun. Davet ettiğin kişiler burada görünür.</p>`}
  </div></div>`;
  $("teamInvite").onclick = () => inviteModal();
  box.onclick = (e) => { const r = e.target.closest("[data-board]"); if (r) openBoard(Number(r.dataset.board)); };
}

function inlineRename(row, w) {
  const nameEl = row.querySelector(".ws-name");
  const input = document.createElement("input");
  input.className = "field"; input.value = w.name;
  input.style.cssText = "padding:4px 7px;font-size:13px;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)";
  nameEl.replaceWith(input); input.focus(); input.select();
  let done = false;
  const save = async () => {
    if (done) return; done = true;
    const name = input.value.trim();
    if (!name || name === w.name) return renderHome();
    try { await api.renameWorkspace(w.id, name); w.name = name; toast("Ad güncellendi", name, "ok"); }
    catch (e) { toast("Güncellenemedi", e.message, "err"); }
    renderHome();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") { done = true; renderHome(); }
  });
  input.addEventListener("blur", save);
}

function confirmDeleteWs(w) {
  const count = S.boards.filter((b) => b.workspaceId === w.id).length;
  openModal(`<div class="modal">
    <div class="warn-ico">${I.warnTri}</div>
    <h3>“${esc(w.name)}” silinsin mi?</h3>
    <p class="sub">İçindeki ${count} pano, kartlar ve geçmiş kalıcı olarak silinir. Bu işlem geri alınamaz.</p>
    <div class="acts"><button class="btn btn-danger" id="yes">Sil</button>
      <button class="btn btn-ghost" id="no">Vazgeç</button></div></div>`, (o) => {
    o.querySelector("#no").onclick = closeModal;
    o.querySelector("#yes").onclick = async () => {
      try {
        await api.deleteWorkspace(w.id);
        toast("Çalışma alanı silindi", `${w.name} ve içindeki panolar kaldırıldı`, "ok");
        closeModal(); S.activeWs = null; goHome();
      } catch (e) { toast("Silinemedi", e.message, "err"); }
    };
  });
}

function createModal(kind) {
  const isWs = kind === "workspace";
  // Pano hangi alana açılsın: seçili alan (izin varsa), yoksa ilk uygun alan.
  // Hiç alanı olmayan kişi de pano açabilir; sunucu ona kişisel alan kurar.
  const spaces = S.workspaces.filter((w) => w.role !== "GUEST");
  const pre = spaces.some((w) => w.id === S.activeWs) ? S.activeWs : spaces[0]?.id ?? null;
  openModal(`<div class="modal">
    <h3>${isWs ? "Yeni çalışma alanı" : "Yeni pano"}</h3>
    <p class="sub">${isWs ? "Ekibin için ortak bir alan oluştur." : "To Do, In Progress ve Done kolonlarıyla açılır. Adlarını sonra değiştirebilirsin."}</p>
    <input class="field" id="nm" placeholder="${isWs ? "ör. Acme Yazılım" : "ör. Ürün Yol Haritası"}" aria-label="Ad">
    ${!isWs && spaces.length > 1 ? `<label class="label" for="wsSel">Çalışma alanı</label>
      <select class="field" id="wsSel">${spaces.map((w) => `<option value="${w.id}" ${w.id === pre ? "selected" : ""}>${esc(w.name)}</option>`).join("")}</select>` : ""}
    <div class="acts"><button class="btn btn-primary" id="ok">Oluştur</button>
      <button class="btn btn-ghost" id="cancel">Vazgeç</button></div></div>`, (o) => {
    const input = o.querySelector("#nm"); input.focus();
    const submit = async () => {
      const name = input.value.trim(); if (!name) return;
      try {
        if (isWs) { const w = await api.createWorkspace(name); closeModal(); S.activeWs = w.id; await goHome(); }
        else {
          const sel = o.querySelector("#wsSel");
          const b = await api.createBoard(name, sel ? Number(sel.value) : pre);
          closeModal(); openBoard(b.id);
        }
      } catch (e) { toast("Oluşturulamadı", e.message, "err"); }
    };
    o.querySelector("#ok").onclick = submit;
    o.querySelector("#cancel").onclick = closeModal;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  });
}

/* ══════════════════ 3) Pano ══════════════════ */
/**
 * Panoyu açar. focusCard verilirse (aramadan, özetten) kart gösterilir: süzgeç
 * temizlenir, karta kaydırılır ve kısa bir parlamayla işaretlenir.
 */
async function openBoard(id, { focusCard = null } = {}) {
  closePops(); closePalette();
  if (S.view === "board" && S.board?.id === id) {   // zaten bu panodayız: yeniden yükleme
    if (focusCard) showCard(focusCard);
    return;
  }
  S.view = "board"; S.conn = "connecting"; S.board = null; S.tab = "board"; S.opening = id;
  S.history = { active: false, timeline: [], index: 0 }; S.flow = null;
  S.members = []; S.activity = []; S.presence = []; S.pending = []; S.memberRows = new Set();
  if (focusCard) S.filter = { q: "", mine: false, overdue: false, assignee: "" };
  renderBoard();
  try {
    const [board, members, activity] = await Promise.all([api.board(id), api.members(id), api.activity(id)]);
    S.board = board;
    S.members = members;
    S.activity = activity;
    const mine = members.find((m) => m.email === S.me?.email);
    // Rol pano listesinden de gelebilir (şirket rolünden türeyen durumlar için).
    S.boardRole = mine?.role || S.boards.find((b) => b.id === id)?.role || "VIEWER";
  } catch (e) {
    if (e.status === 403) { toast("Erişim yok", "Bu panoya erişim yetkin yok.", "err"); return goHome(); }
    toast("Pano yüklenemedi", e.message, "err"); return goHome();
  }
  // Yüklenirken başka yere geçildiyse (ana ekran, başka pano) o ekranın üstüne çizme.
  if (S.view !== "board" || S.opening !== id) return;
  rememberBoard(S.board);
  renderBoard();
  connect(id);
  loadFlow();
  loadPending();
  if (focusCard) focusCardEl(focusCard);
}

function connect(boardId) {
  S.rt && S.rt.close();
  S.rt = connectRealtime(boardId, {
    onStatus: (s) => {
      const was = S.conn; S.conn = s;
      updateConn();
      if (s === "down" && was === "up") toast("Bağlantı koptu", "Yeniden bağlanmaya çalışılıyor…", "err");
      if (s === "up" && was === "down") { toast("Yeniden bağlandı", "Pano tazelendi.", "ok"); refreshBoard(); }
    },
    onOp: applyEvent,
    onPresence: (users) => { S.presence = users; renderPresence(); pruneCursors(); },
    onCursor: onRemoteCursor,
    onReject: (r) => {
      // WIP limiti bir çakışma değil, kuralın kasten çalışmasıdır — mesajı da
      // ona göre. Tazeleme yine şart: sürükleme yerel durumu çoktan değiştirdi,
      // sunucu reddettiğine göre kartın eski yerine dönmesi gerekiyor.
      if (r.reason === "WIP_LIMIT") {
        toast("Kolon dolu", r.message || "Bu kolon WIP limitine ulaştı.", "warn");
        refreshBoard();
        return;
      }
      // Geçersiz girdi de bir çakışma değil: sunucuya hiçbir şey yazılmadı,
      // kullanıcının tek yapması gereken girdiyi düzeltmek.
      if (r.reason === "INVALID") {
        toast("Geçersiz", r.message || "Girdi kabul edilmedi.", "warn");
        return;
      }
      toast("Çakışma", r.message || "İşlemin reddedildi.", "err");
      refreshBoard();
    },
    onFatal: () => { logout(); toast("Oturumun sona erdi", "Tekrar giriş yap.", "warn"); },
  });
}

async function refreshBoard() {
  if (!S.board) return;
  try {
    const [board, activity] = await Promise.all([api.board(S.board.id), api.activity(S.board.id)]);
    S.board = board; S.activity = activity;
    renderColumns(); renderActivity();
  } catch (_) {}
}

/** Pano üst çubuğu: nerede olduğun, hangi görünümde olduğun, kimin burada olduğu. */
function boardTopbar() {
  const b = S.board;
  const ws = S.workspaces.find((w) => w.id === b?.workspaceId);
  const wsName = ws?.name || S.boards.find((x) => x.id === b?.id)?.workspaceName || "";
  const tab = (id, label, key) => `<button role="tab" id="${id}" aria-selected="${tabNow() === key}">${label}</button>`;
  return `<div class="topbar btop">
    <button class="mark-btn" id="back" title="Ana ekrana dön" aria-label="Ana ekrana dön">${I.mark}</button>
    <nav class="crumb" aria-label="Konum">
      ${wsName ? `<a id="crumbWs" title="${esc(wsName)} alanının panoları">${esc(wsName)}</a><span class="sl">/</span>` : ""}
      <button class="board-switch" id="boardSwitch" aria-haspopup="menu" title="Başka panoya geç">
        <span class="sq" style="background:${colorOf(b?.name || "")}"></span><span class="nm">${esc(b?.name || "Yükleniyor…")}</span>${I.chevron}</button>
      ${b ? `<span class="badge ${S.boardRole}">${roleLabel(S.boardRole)}</span>` : ""}
    </nav>
    <div class="tabs" role="tablist" aria-label="Görünüm">
      ${tab("tabBoard", "Pano", "board")}${tab("histBtn", "Geçmiş", "hist")}${tab("tabFlow", "Akış", "flow")}
    </div>
    <div class="tb-right">
      <div class="online-pill wait solo" id="connBox" title="Bu panoda şu an olanlar"><span class="av-stack" id="presence"></span><span id="connLabel">Bağlanıyor…</span></div>
      ${b && isOwner() ? `<button class="btn-new" id="inviteBtn" title="Bu panoya davet et">${I.userPlus}<span class="lbl">Davet et</span></button>` : ""}
      ${topbarRight()}
    </div>
  </div>`;
}

const tabNow = () => (S.history.active ? "hist" : S.tab);

function renderBoard() {
  const b = S.board;
  app.innerHTML = `
  <div id="board">
    ${boardTopbar()}
    <div class="filters" id="filters"></div>
    <div class="board-body">
      <div class="cols-wrap" id="colsWrap"><div class="cols" id="cols"></div><div class="cursor-layer" id="cursorLayer"></div></div>
      <div class="flow-view hidden" id="flowView" role="tabpanel" aria-label="Akış"></div>
      <aside class="side ${S.panelOpen ? "" : "hidden"}" id="side" aria-label="Pano paneli">
        <div class="pcard members">
          <div class="h"><span class="t">Üyeler</span><span class="cnt" id="memCount"></span>
            ${b && isOwner() ? `<button class="link-btn" id="sideInvite">+ Davet et</button>` : ""}</div>
          <div id="memList"></div>
        </div>
        <div class="pcard activity">
          <div class="h"><span class="t">Son hareketler</span><div class="spacer"></div><span id="livePill"></span></div>
          <div id="actList"></div>
        </div>
      </aside>
    </div>
    <div class="timebar hidden" id="timebar"></div>
  </div>`;

  $("back").onclick = goHome;
  $("crumbWs")?.addEventListener("click", () => {
    S.activeWs = S.workspaces.some((w) => w.id === b?.workspaceId) ? b.workspaceId : SHARED;
    goHome();
  });
  $("boardSwitch").onclick = (e) => { e.stopPropagation(); toggleBoardMenu(); };
  $("tabBoard").onclick = () => setTab("board");
  $("histBtn").onclick = () => setTab("hist");
  $("tabFlow").onclick = () => setTab("flow");
  $("inviteBtn")?.addEventListener("click", () => inviteModal(b.id));
  $("sideInvite")?.addEventListener("click", () => inviteModal(b.id));
  bindTopbar();

  S.cursors.clear(); bindCursorTracking();
  updateConn(); renderPresence(); renderFilters(); renderColumns(); renderMembers(); renderActivity(); renderFlow();
  syncTabs();
  // Rol değişince ekran yeniden kurulur; geçmişte geziliyorsa çubuk kaybolmasın.
  if (S.history.active && S.history.timeline.length) {
    $("timebar").classList.remove("hidden"); $("timebar").classList.add("on");
    $("board").classList.add("past");
    renderTimebar();
  }
}

/**
 * Görünüm sekmeleri. "Geçmiş" ayrı bir ekran değil, panonun salt okunur
 * geçmiş hâlidir (zaman çubuğu); "Akış" ise kolon yerine ölçümleri gösterir.
 */
async function setTab(t) {
  if (t === "hist") {
    S.tab = "board"; syncTabs();
    if (!S.history.active) await toggleHistory();
    return syncTabs();
  }
  if (S.history.active) await exitHistory();
  S.tab = t; syncTabs();
  if (t === "flow") renderFlowView();
}

function syncTabs() {
  const now = tabNow();
  [["tabBoard", "board"], ["histBtn", "hist"], ["tabFlow", "flow"]].forEach(([id, k]) => $(id)?.setAttribute("aria-selected", String(now === k)));
  const flow = S.tab === "flow";
  $("colsWrap")?.classList.toggle("hidden", flow);
  $("flowView")?.classList.toggle("hidden", !flow);
  $("filters")?.classList.toggle("hidden", flow);
}

/** Başka panoya geçiş: ana ekrana dönmeden. */
function toggleBoardMenu() {
  if (document.querySelector(".bsw-pop")) return closePops();
  const cur = S.board?.id;
  const el = openPop($("boardSwitch"), "menu-pop bsw-pop", `
    ${S.boards.map((b) => `<button class="menu-item${b.id === cur ? " on" : ""}" data-b="${b.id}">
      <span class="sq" style="background:${colorOf(b.name)}"></span><span class="mi-nm">${esc(b.name)}</span><span class="mi-n">${b.cardCount}</span></button>`).join("")
      || `<div class="notif-empty">Pano listesi yükleniyor…</div>`}
    <div class="menu-sep"></div>
    <button class="menu-item" data-b="home">${I.home} Tüm panolar</button>`, "left");
  el.onclick = (e) => {
    const k = e.target.closest("[data-b]")?.dataset.b; if (!k) return;
    closePops();
    if (k === "home") return goHome();
    if (Number(k) !== cur) openBoard(Number(k));
  };
}

/**
 * Arama ve süzme çubuğu.
 *
 * Süzme tamamen istemcide yapılıyor: pano zaten bütünüyle yüklü olduğu için
 * sunucuya gitmek gecikme ekler, bilgi eklemez. Kart sayısı bir panoda binlere
 * çıkmadığı sürece bu doğru denge.
 */
function renderFilters() {
  const box = $("filters"); if (!box) return;
  const f = S.filter;
  const opts = [`<option value="">Herkes</option>`]
    .concat(S.members.map((m) => `<option value="${m.id}" ${String(f.assignee) === String(m.id) ? "selected" : ""}>${esc(memberName(m))}</option>`))
    .join("");

  box.innerHTML = `
    <div class="fsearch">${I.search}<input type="search" id="fq" placeholder="Bu panoda ara…" aria-label="Bu panoda ara" value="${esc(f.q)}"></div>
    <button class="fchip ${f.mine ? "on" : ""}" id="fmine" aria-pressed="${f.mine}">Bana atananlar</button>
    <button class="fchip ${f.overdue ? "on" : ""}" id="fover" aria-pressed="${f.overdue}" title="Son tarihi geçmiş, henüz bitmemiş kartlar">Geciken</button>
    <label class="fsel" title="Atanan kişiye göre süz">Kişi:<select id="fassignee">${opts}</select>${I.chevron}</label>
    ${activeFilter() ? `<button class="fchip" id="fclear">Temizle</button>` : ""}
    <span class="fcount" id="fcount"></span>
    <div class="bstats" id="bstats"></div>
    <button class="tb-btn sm" id="togglePanel" title="Yan paneli gizle / göster" aria-pressed="${S.panelOpen}">${I.panel}</button>`;

  const q = $("fq");
  q.oninput = () => { f.q = q.value; renderColumns(); };
  $("fmine").onclick = () => { f.mine = !f.mine; if (f.mine) f.assignee = ""; renderFilters(); renderColumns(); };
  $("fover").onclick = () => { f.overdue = !f.overdue; renderFilters(); renderColumns(); };
  $("fassignee").onchange = (e) => { f.assignee = e.target.value; if (f.assignee) f.mine = false; renderFilters(); renderColumns(); };
  $("fclear")?.addEventListener("click", () => {
    S.filter = { q: "", mine: false, overdue: false, assignee: "" };
    renderFilters(); renderColumns();
  });
  $("togglePanel").onclick = (e) => {
    S.panelOpen = !S.panelOpen;
    $("side").classList.toggle("hidden", !S.panelOpen);
    e.currentTarget.setAttribute("aria-pressed", String(S.panelOpen));
  };
  renderBoardStats();
}

const activeFilter = () => {
  const f = S.filter;
  return !!(f.q.trim() || f.mine || f.overdue || f.assignee);
};

/** Son kolon "bitti" sayılır (özet ve akış ölçümüyle aynı kural): oradaki kart gecikmiş değildir. */
const isLastCol = (col) => !!S.board && S.board.columns[S.board.columns.length - 1]?.id === col.id;
const isLate = (card, col) => !!card.dueDate && dueState(card.dueDate) === "due-over" && !isLastCol(col);

/** Kart süzgeçten geçiyor mu? Ölçütler VE ile birleşir. */
function cardMatches(card, col) {
  const f = S.filter;
  const q = f.q.trim().toLocaleLowerCase("tr");
  if (q) {
    const hay = `${card.title} ${card.description || ""}`.toLocaleLowerCase("tr");
    if (!hay.includes(q)) return false;
  }
  if (f.mine) {
    const me = S.members.find((m) => m.email === S.me?.email);
    if (!me || card.assigneeId !== me.id) return false;
  }
  if (f.assignee && String(card.assigneeId) !== String(f.assignee)) return false;
  if (f.overdue && !isLate(card, col)) return false;
  return true;
}

/** Araç çubuğunun sağındaki özet sayılar; kartlar ya da akış ölçümü değişince tazelenir. */
function renderBoardStats() {
  const b = S.board;
  const late = b ? b.columns.reduce((n, col) => n + col.cards.filter((c) => isLate(c, col)).length, 0) : 0;
  const fo = $("fover");
  if (fo) { fo.textContent = late ? `Geciken · ${late}` : "Geciken"; fo.classList.toggle("late", !!late && !S.filter.overdue); }
  const el = $("bstats"); if (!el) return;
  if (!b) { el.innerHTML = ""; return; }
  const total = b.columns.reduce((n, c) => n + c.cards.length, 0);
  const f = S.history.active ? null : S.flow;
  const bn = f?.bottleneckColumnId ? f.columns.find((c) => c.columnId === f.bottleneckColumnId) : null;
  el.innerHTML = [`<span><b>${total}</b> kart</span>`,
    bn ? `<span title="Kartların en uzun beklediği kolon">Darboğaz: <b class="bad">${esc(bn.name)}</b></span>` : "",
    f?.averageCycleTimeSeconds != null ? `<span title="Bir kartın ilk kolondan son kolona ortalama yolculuğu">Ort. çevrim: <b>${humanDuration(f.averageCycleTimeSeconds)}</b></span>` : "",
  ].join("");
}

/** Panoda şu an kaç farklı kişi var (aynı kişinin iki sekmesi bir sayılır). */
const onlineHere = () => new Set(S.presence.map((u) => u.id)).size;

function updateConn() {
  const box = $("connBox");
  if (box) {
    const n = onlineHere();
    box.className = "online-pill" + (S.conn === "up" ? "" : S.conn === "down" ? " down" : " wait") + (n && S.conn === "up" ? "" : " solo");
    $("connLabel").textContent = S.conn === "up" ? (n ? `● Canlı · ${n} kişi` : "● Canlı")
      : S.conn === "down" ? "Bağlantı kesildi" : "Bağlanıyor…";
  }
  const pill = $("livePill");
  if (pill) pill.innerHTML = S.conn === "up"
    ? `<span class="live-pill"><i></i>CANLI</span>`
    : `<span class="live-pill off"><i></i>${S.conn === "down" ? "KAPALI" : "BAĞLANIYOR"}</span>`;
}


function renderPresence() {
  const box = $("presence"); if (!box) return;
  const seen = new Set();
  const uniq = S.presence.filter((u) => !seen.has(u.id) && seen.add(u.id));
  box.innerHTML = uniq.slice(0, 4).map((u) => avatar(u.name, 24, "", u.avatarUrl)).join("");
  box.title = uniq.map((u) => u.name).join(", ");
  updateConn(); renderMembers();
}

function renderColumns() {
  const wrap = $("cols"); if (!wrap) return;
  if (!S.board) { wrap.innerHTML = `<div class="skel" style="width:276px;height:280px"></div>`.repeat(3); return; }

  const filtering = activeFilter();
  let shown = 0, total = 0;

  const before = captureRects(wrap);
  wrap.innerHTML = "";
  S.board.columns.forEach((col) => {
    const el = document.createElement("div");
    const state = wipState(col);
    el.className = "col" + (state ? " " + state : ""); el.dataset.colId = col.id;
    el.innerHTML = `
      <div class="col-head">
        <span class="nm">${esc(col.name)}</span>${wipChip(col, state)}
        <div style="margin-left:auto"></div>
        ${canEdit() ? `<div class="col-menu"><button class="icon-btn" title="Kolon işlemleri">${I.dots}</button></div>` : ""}
      </div>
      ${state === "full" ? `<div class="wip-note">Bu kolon WIP limitine ulaştı. Yeni kart almadan önce buradaki bir işi tamamla.</div>` : ""}
      ${state === "over" ? `<div class="wip-note">Limitin üzerinde. Kolon boşalana kadar yeni kart kabul etmeyecek.</div>` : ""}
      <div class="col-cards" data-col-id="${col.id}"></div>
      <div class="col-foot"></div>`;

    el.querySelector(".chip.wip.editable")?.addEventListener("click", (e) => { e.stopPropagation(); openWipModal(col); });
    el.querySelector(".col-menu > .icon-btn")?.addEventListener("click", (e) => {
      e.stopPropagation(); openColumnMenu(el.querySelector(".col-menu"), col);
    });

    const cards = el.querySelector(".col-cards");
    let visible = 0;
    col.cards.forEach((c) => {
      total++;
      if (filtering && !cardMatches(c, col)) return;
      visible++; shown++;
      cards.appendChild(cardEl(c, col));
    });
    if (!visible) {
      cards.innerHTML = filtering
        ? `<div class="col-empty">Süzgece uyan kart yok</div>`
        : `<div class="col-empty">Henüz kart yok</div>`;
    }

    if (canEdit()) {
      const foot = el.querySelector(".col-foot");
      const btn = document.createElement("button");
      btn.className = "add-card"; btn.innerHTML = `${I.plus} Kart ekle`;
      btn.onclick = () => openComposer(foot, col.id);
      foot.appendChild(btn);
    }
    wrap.appendChild(el);
  });

  if (canEdit()) {
    const add = document.createElement("button");
    add.className = "add-col"; add.innerHTML = `${I.plus} Kolon ekle`;
    add.onclick = () => openAddColumn(add);
    wrap.appendChild(add);
  }

  if (!canEdit()) {
    const note = document.createElement("div");
    note.className = "viewer-note";
    note.innerHTML = `<b style="font-size:13px">İzleyici modundasın</b><div style="margin-top:5px">Panoyu görebilir ama değiştiremezsin. Değişiklikler canlı olarak sana da yansır.</div>`;
    wrap.appendChild(note);
  }

  const fc = $("fcount");
  if (fc) fc.textContent = filtering ? `${shown} / ${total} kart · sürükleme kapalı` : "";

  initSortables();
  playFlip(wrap, before);
  refreshRemoteDrags();
  renderBoardStats();
  const mc = $("memCount"); if (mc) mc.textContent = S.members.length;
}

/** Kolon işlemleri açılır menüsü: yeniden adlandır, WIP limiti, sil. */
function openColumnMenu(host, col) {
  document.querySelectorAll(".col-pop").forEach((n) => n.remove());
  const pop = document.createElement("div");
  pop.className = "col-pop";
  pop.innerHTML = `
    <button data-a="rename">Yeniden adlandır</button>
    <button data-a="wip">WIP limiti…</button>
    <button data-a="delete" class="danger">Kolonu sil</button>`;
  host.appendChild(pop);

  const close = () => { pop.remove(); document.removeEventListener("mousedown", onAway); };
  function onAway(e) { if (!pop.contains(e.target)) close(); }
  setTimeout(() => document.addEventListener("mousedown", onAway), 0);

  pop.onclick = (e) => {
    const a = e.target.dataset.a; if (!a) return;
    close();
    if (a === "rename") startRename(col);
    if (a === "wip") openWipModal(col);
    if (a === "delete") confirmDeleteColumn(col);
  };
}

/** Kolon adını yerinde düzenle — ayrı bir pencere açmaya değmez. */
function startRename(col) {
  const head = document.querySelector(`.col[data-col-id="${col.id}"] .col-head`);
  if (!head) return;
  const nm = head.querySelector(".nm");
  const input = document.createElement("input");
  input.className = "rename"; input.value = col.name; input.maxLength = 100;
  nm.replaceWith(input);
  input.focus(); input.select();

  let done = false;
  const finish = (commit) => {
    if (done) return; done = true;
    const name = input.value.trim();
    if (commit && name && name !== col.name) {
      sendOp({ type: "RENAME_COLUMN", columnId: col.id, name });
      col.name = name;
    }
    renderColumns();
  };
  input.addEventListener("blur", () => finish(true));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
}

/** Kolon silme onayı — kartlar da gittiği için geri alınamaz. */
function confirmDeleteColumn(col) {
  const n = col.cards.length;
  openModal(`<div class="modal">
    <div style="display:flex;gap:11px">
      <span class="warn-ico">${I.warnTri}</span>
      <div><h3>${esc(col.name)} kolonu silinsin mi?</h3>
        <p class="sub">${n ? `İçindeki <b>${n} kart</b> da kalıcı olarak silinecek.` : "Kolon boş."}
          Bu işlem geri alınamaz, ama panonun geçmişinde kayıtlı kalır.</p></div>
    </div>
    <div class="acts">
      <button class="btn btn-danger" id="ok">Sil</button>
      <button class="btn btn-ghost" id="close">Vazgeç</button>

    o.querySelector("#close").onclick = closeModal;
    o.querySelector("#ok").onclick = () => {
      sendOp({ type: "DELETE_COLUMN", columnId: col.id });
      S.board.columns = S.board.columns.filter((c) => c.id !== col.id);

/** Yeni kolon ekleme — düğme yerinde bir girdiye dönüşür. */
function openAddColumn(btn) {
  const box = document.createElement("div");
  box.className = "add-col"; box.style.display = "block";
  box.innerHTML = `<input class="rename" style="width:100%" maxlength="100" placeholder="Kolon adı…">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" style="padding:6px 11px;font-size:13px" data-a="ok">Ekle</button>
      <button class="btn btn-ghost" style="padding:6px 11px" data-a="no">Vazgeç</button></div>`;
  btn.replaceWith(box);

  const input = box.querySelector("input"); input.focus();
  const add = () => {
    const name = input.value.trim();
    if (!name) return renderColumns();
    sendOp({ type: "ADD_COLUMN", boardId: S.board.id, name });
    renderColumns();   // kolon, sunucudan gelen olayla belirecek
  };
  box.querySelector(`[data-a="ok"]`).onclick = add;
  box.querySelector(`[data-a="no"]`).onclick = () => renderColumns();
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); add(); }
    if (e.key === "Escape") renderColumns();
  });
}

function cardEl(card, col) {
  const el = document.createElement("div");
  el.className = "card"; el.dataset.cardId = card.id; el.dataset.version = card.version;
  el.innerHTML = `<div class="t">${esc(card.title)}</div>${cardMeta(card)}${canEdit() ? `<button class="icon-btn del" title="Sil">${I.trash}</button>` : ""}`;
  el.onclick = (e) => { if (!e.target.closest(".del")) openDetail(card, col); };
  el.querySelector(".del")?.addEventListener("click", (e) => { e.stopPropagation(); sendOp({ type: "DELETE_CARD", cardId: card.id }); removeCardLocal(card.id); });
  return el;
}

/**
 * Kolonun WIP durumu: "" (sınırsız ya da yer var), "full" (tam limitte),
 * "over" (limit sonradan düşürülmüş, fazlalık var).
 */
function wipState(col) {
  if (!col.wipLimit) return "";
  if (col.cards.length > col.wipLimit) return "over";
  if (col.cards.length >= col.wipLimit) return "full";
  return "";
}

function wipChip(col, state) {
  const editable = canEdit();
  const text = col.wipLimit ? `${col.cards.length} / ${col.wipLimit}` : String(col.cards.length);
  const title = col.wipLimit
    ? `WIP limiti: ${col.wipLimit}${editable ? " (değiştirmek için tıkla)" : ""}`
    : (editable ? "WIP limiti yok, ayarlamak için tıkla" : "WIP limiti yok");
  return `<span class="chip wip ${state} ${editable ? "editable" : ""}" title="${esc(title)}">${text}</span>`;
}

/** Kart üzerindeki küçük göstergeler: açıklama, son tarih, atanan kişi. */
function cardMeta(card) {
  const bits = [];
  if (card.description) {
    bits.push(`<span class="badge" title="Açıklaması var">☰</span>`);
  }
  if (card.dueDate) {
    const st = dueState(card.dueDate);
    bits.push(`<span class="badge ${st}" title="Son tarih: ${esc(card.dueDate)}">${esc(dueLabel(card.dueDate))}</span>`);
  }
  const m = card.assigneeId ? memberById(card.assigneeId) : null;
  if (m) bits.push(`<span class="sp">${avatar(memberName(m), 22, "", m.avatarUrl)}</span>`);
  return bits.length ? `<div class="cmeta">${bits.join("")}</div>` : "";
}

/** WIP limitini ayarlama kutusu. Boş bırakmak sınırı kaldırır. */
function openWipModal(col) {
  if (!canEdit()) return;
  openModal(`<div class="modal">
    <h3>${esc(col.name)} için WIP limiti</h3>
    <p class="sub">Bu kolonda aynı anda en fazla kaç kart bulunabilir? Limit dolduğunda
      kolon yeni kart kabul etmez; böylece yeni iş başlatmak yerine mevcut işi bitirirsin.</p>
    <div class="fld"><label>Limit</label>
      <input type="number" min="1" id="wl" value="${col.wipLimit ?? ""}" placeholder="Boş = sınırsız"
             style="width:100%;font:inherit;font-size:13.5px;border:1px solid var(--bd-2);border-radius:8px;padding:8px 10px;outline:none"></div>
    <div class="acts">
      <button class="btn btn-primary" id="ok">Kaydet</button>

    </div></div>`, (o) => {

function openDetail(card, col) {
  const pos = col.cards.findIndex((c) => c.id === card.id) + 1;
  const ro = !canEdit() ? "disabled" : "";
  const options = [`<option value="">Atanmamış</option>`]
    .concat(S.members.map((m) => `<option value="${m.id}" ${card.assigneeId === m.id ? "selected" : ""}>${esc(memberName(m))}</option>`))
    .join("");

  openModal(`<div class="modal wide">
    <div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)">${esc(col.name)}</div>
    <input class="detail-title" id="dt" value="${esc(card.title)}" ${ro}>

    <div class="fld"><label>Açıklama</label>
      <textarea id="dd" placeholder="Bu iş tam olarak ne? Nasıl bitmiş sayılır?" ${ro}>${esc(card.description || "")}</textarea></div>

    <div class="fld"><div class="row2">
      <div><label>Atanan</label><select id="da" ${ro}>${options}</select></div>
      <div><label>Son tarih</label><input type="date" id="du" value="${esc(card.dueDate || "")}" ${ro}></div>
    </div></div>

    <div class="meta">
      <div><div class="k">Kolon</div><div class="v">${esc(col.name)}</div></div>
      <div><div class="k">Konum</div><div class="v">${pos} / ${col.cards.length}</div></div>
      <div><div class="k">Sürüm</div><div class="v">v${card.version}</div></div>
    </div>
    <div class="acts">
      ${canEdit() ? `<button class="btn btn-primary" id="save">Kaydet</button>` : ""}
      <button class="btn btn-ghost" id="close">Kapat</button>
      <div class="spacer"></div>
      ${canEdit() ? `<button class="btn" id="del" style="background:none;color:var(--err)">Kartı sil</button>` : ""}
    </div></div>`, (o) => {
    o.querySelector("#close").onclick = closeModal;
    o.querySelector("#save")?.addEventListener("click", () => {
      const title = o.querySelector("#dt").value.trim();
      if (!title) return toast("Başlık boş olamaz", "", "err");

      const assigneeRaw = o.querySelector("#da").value;
      const next = {
        title,
        description: o.querySelector("#dd").value.trim() || null,
        assigneeId: assigneeRaw ? Number(assigneeRaw) : null,
        dueDate: o.querySelector("#du").value || null,
      };

      // Hiçbir şey değişmediyse operasyon gönderme: boş bir düzenleme kaydı
      // hem sürümü artırır hem hareket listesini kirletir.
      const same = next.title === card.title
        && (next.description || null) === (card.description || null)
        && (next.assigneeId || null) === (card.assigneeId || null)
        && (next.dueDate || null) === (card.dueDate || null);
      if (same) return closeModal();

      // EDIT_CARD alanların TAMAMINI taşır (bkz. EditCardOp): gönderilmeyen alan
      // temizlenir, baseVersion da araya başkasının girmediğini garanti eder.
      sendOp({ type: "EDIT_CARD", cardId: card.id, ...next, baseVersion: card.version });
      Object.assign(card, next); renderColumns();
      closeModal();
    });
    o.querySelector("#del")?.addEventListener("click", () => {
      sendOp({ type: "DELETE_CARD", cardId: card.id }); removeCardLocal(card.id); closeModal();
    });
  });
}

/* ── Sürükle-bırak ── */
function initSortables() {
  S.sortables.forEach((s) => { try { s.destroy(); } catch (_) {} });
  S.sortables = [];
  const wrap = $("cols"); if (!wrap) return;

  wrap.querySelectorAll(".col-cards").forEach((el) => {
    S.sortables.push(new Sortable(el, {
      group: "cards", ...DRAG, disabled: !canEdit() || activeFilter(),
      ghostClass: "card-ghost", dragClass: "card-drag", filter: ".del,.col-empty", preventOnFilter: false,
      onStart: (evt) => startDrag(Number(evt.item.dataset.cardId) || null),
      onEnd: (evt) => {
        try {
          const item = evt.item; if (!item.dataset.cardId) return;
          sendOp({
            type: "MOVE_CARD",
            cardId: Number(item.dataset.cardId),
            toColumnId: Number(evt.to.dataset.colId),
            position: evt.newIndex,
            baseVersion: Number(item.dataset.version),
          });
          syncLocalFromDom();
        } finally { endDrag(); }
      },
    }));
  });

  S.sortables.push(new Sortable(wrap, {
    group: "columns", ...DRAG, draggable: ".col", handle: ".col-head",
    filter: ".col-menu,.chip.wip.editable,input.rename", preventOnFilter: false,
    disabled: !canEdit() || activeFilter(), ghostClass: "card-ghost",
    onStart: () => startDrag(null),
    onEnd: (evt) => {
      try {
        if (evt.oldIndex === evt.newIndex) return;
        sendOp({ type: "MOVE_COLUMN", columnId: Number(evt.item.dataset.colId), position: evt.newIndex });
        syncLocalFromDom();
      } finally { endDrag(); }
    },
  }));
}

/**
 * Sürüklemenin ortak ayarları.
 *
 * forceFallback: tarayıcının kendi yarı saydam sürükleme resmi yerine SortableJS
 * kartın gerçek bir kopyasını farenin altında taşır — biçimlendirilebilir
 * (.sortable-fallback) ve her tarayıcıda aynı görünür.
 * delayOnTouchOnly: telefonda parmak önce sayfayı kaydırır; karta 150 ms basılı
 * tutunca sürükleme başlar. Yoksa panoyu kaydırmaya çalışan her dokunuş kart taşırdı.
 */
const DRAG = {
  animation: 220, easing: "cubic-bezier(.2,.8,.2,1)",
  forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4,
  delay: 150, delayOnTouchOnly: true,
};

/**
 * Sürükleme sürerken gelen canlı olaylar bekletilir.
 *
 * Her olay panoyu baştan çizer; sürüklenen kart da o çizimde yok olur ve
 * sürükleme elde kalırdı. Olaylar sırayla saklanır, bırakınca uygulanır.
 */
function startDrag(cardId) {
  S.dragging = true; S.dragCardId = cardId;
  if (lastCursorPos) queueCursor(lastCursorPos, true);   // karşı taraf hangi kartın taşındığını hemen görsün
}

function endDrag() {
  S.dragging = false; S.dragCardId = null;
  if (lastCursorPos) queueCursor(lastCursorPos, true);
  const queued = S.queuedEvents; S.queuedEvents = [];
  queued.forEach(applyEvent);
}

/** DOM'daki sırayı yerel duruma yansıt (iyimser arayüz). */
function syncLocalFromDom() {
  if (!S.board) return;
  const byId = new Map();
  S.board.columns.forEach((c) => c.cards.forEach((k) => byId.set(String(k.id), k)));
  const cols = [];
  $("cols").querySelectorAll(".col").forEach((colEl, i) => {
    const id = Number(colEl.dataset.colId);
    const old = S.board.columns.find((c) => c.id === id);
    const cards = [...colEl.querySelectorAll(".card")].map((el) => byId.get(el.dataset.cardId)).filter(Boolean);
    cols.push({ ...old, position: i, cards });
  });
  S.board.columns = cols;
}

function removeCardLocal(cardId) {
  if (!S.board) return;
  S.board.columns.forEach((c) => { c.cards = c.cards.filter((k) => k.id !== cardId); });
  renderColumns();
}

function sendOp(op) {
  if (!S.rt) return;
  S.opsSent++; updateConn();
  S.rt.send(op);
}

/* ── Canlı olaylar ── */
function applyEvent(ev) {
  if (!S.board) return;
  if (S.dragging) { S.queuedEvents.push(ev); return; }
  // İçeriksiz sinyaller: veri olayın içinde değil, yetki kontrollü REST ucundan çekilir.
  if (ev.type === "MEMBERS_CHANGED") { reloadMembers(); return; }
  if (ev.type === "INVITATIONS_CHANGED") { loadPending(); return; }
  const cols = S.board.columns;
  if (ev.type === "ADD_CARD") {
    const col = cols.find((c) => c.id === ev.columnId);
    if (col && !col.cards.some((k) => k.id === ev.card.id)) {
      col.cards.splice(ev.card.position, 0, ev.card);
      renderColumns(); flash(ev.card.id);
    }
  } else if (ev.type === "MOVE_CARD") {
    let card = null;
    cols.forEach((c) => { const i = c.cards.findIndex((k) => k.id === ev.cardId); if (i >= 0) card = c.cards.splice(i, 1)[0]; });
    const target = cols.find((c) => c.id === ev.toColumnId);
    if (card && target) { card.version = ev.version; target.cards.splice(ev.position, 0, card); renderColumns(); flash(ev.cardId); }
  } else if (ev.type === "EDIT_CARD") {
    cols.forEach((c) => c.cards.forEach((k) => {
      if (k.id === ev.cardId) {
        k.title = ev.title; k.description = ev.description;
        k.assigneeId = ev.assigneeId; k.dueDate = ev.dueDate; k.version = ev.version;
      }
    }));
    renderColumns(); flash(ev.cardId);
  } else if (ev.type === "DELETE_CARD") {
    cols.forEach((c) => { c.cards = c.cards.filter((k) => k.id !== ev.cardId); });
    renderColumns();
  } else if (ev.type === "ADD_COLUMN") {
    if (!cols.some((c) => c.id === ev.column.id)) { cols.push(ev.column); renderColumns(); }
  } else if (ev.type === "RENAME_COLUMN") {
    const col = cols.find((c) => c.id === ev.columnId);
    if (col) { col.name = ev.name; renderColumns(); }
  } else if (ev.type === "DELETE_COLUMN") {
    S.board.columns = cols.filter((c) => c.id !== ev.columnId);
    renderColumns();
  } else if (ev.type === "SET_WIP_LIMIT") {
    const col = cols.find((c) => c.id === ev.columnId);
    if (col) { col.wipLimit = ev.wipLimit; renderColumns(); }
  } else if (ev.type === "MOVE_COLUMN") {
    const i = cols.findIndex((c) => c.id === ev.columnId);
    if (i >= 0) { const [c] = cols.splice(i, 1); cols.splice(ev.position, 0, c); renderColumns(); }
  }
  loadActivity();
}

/* ── Akıcı yeniden çizim (FLIP) ──
 * Pano her değişiklikte baştan çiziliyor. Önceden bütün kartlar yeniden belirme
 * animasyonu oynuyor, taşınan kart da yeni yerine ışınlanıyordu. Şimdi çizmeden
 * önce her kartın ve kolonun ekrandaki yeri ölçülür (First), yeni yer bulunur
 * (Last), kart eski yerine geri itilir (Invert) ve oradan yenisine kaydırılır
 * (Play). Yalnızca gerçekten yeni olan kart belirme animasyonu oynar. */
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function captureRects(wrap) {
  const rects = new Map();
  wrap.querySelectorAll(".col[data-col-id]").forEach((el) => rects.set("k" + el.dataset.colId, el.getBoundingClientRect()));
  wrap.querySelectorAll(".card[data-card-id]").forEach((el) => rects.set("c" + el.dataset.cardId, el.getBoundingClientRect()));
  return rects;
}

function playFlip(wrap, before) {
  const still = reduceMotion();
  const slide = (el, dx, dy) => {
    if (still || Math.abs(dx) + Math.abs(dy) < 1) return;
    el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
      { duration: 300, easing: "cubic-bezier(.2,.8,.2,1)" });
  };
  // Kolon kayarsa içindeki kartlar da onunla birlikte kayar; kartın kendi
  // hareketinden kolonunkini düşmezsek kart iki kat yol alırdı.
  const colShift = new Map();
  wrap.querySelectorAll(".col[data-col-id]").forEach((el) => {
    const old = before.get("k" + el.dataset.colId); if (!old) return;
    const now = el.getBoundingClientRect();
    const d = { dx: old.left - now.left, dy: old.top - now.top };
    colShift.set(el.dataset.colId, d);
    slide(el, d.dx, d.dy);
  });
  wrap.querySelectorAll(".card[data-card-id]").forEach((el) => {
    const old = before.get("c" + el.dataset.cardId);
    if (!old) { if (!still) el.classList.add("fresh"); return; }
    const now = el.getBoundingClientRect();
    const parent = colShift.get(el.closest(".col")?.dataset.colId) || { dx: 0, dy: 0 };
    slide(el, old.left - now.left - parent.dx, old.top - now.top - parent.dy);
  });
}

/* ── Canlı imleçler ──
 * Konum kolonların kaydırılabilir alanına göre gönderilir: herkeste kolonlar
 * aynı sırada ve genişlikte olduğu için imleç karşıda da aynı karta denk gelir.
 * Saniyede en fazla 20 konum gider; aradaki hareketi CSS geçişi doldurur. */
const CURSOR_EVERY_MS = 50;
const CURSOR_IDLE_MS = 6000;   // hareketsiz imleç soluklaşır
let lastCursorPos = null, cursorPending = null, cursorTimer = null, cursorSentAt = 0;

function bindCursorTracking() {
  const cols = $("cols"); if (!cols) return;
  cols.addEventListener("pointermove", (e) => {
    const r = cols.getBoundingClientRect();
    queueCursor({ x: Math.round(e.clientX - r.left + cols.scrollLeft), y: Math.round(e.clientY - r.top + cols.scrollTop) });
  });
  cols.addEventListener("pointerleave", () => { if (!S.dragging) sendCursorGone(); });
  cols.addEventListener("scroll", () => S.cursors.forEach(placeCursor), { passive: true });
}

function queueCursor(pos, now = false) {
  lastCursorPos = pos; cursorPending = pos;
  const wait = CURSOR_EVERY_MS - (Date.now() - cursorSentAt);
  if (now || wait <= 0) flushCursor();
  else if (!cursorTimer) cursorTimer = setTimeout(flushCursor, wait);
}

function flushCursor() {
  clearTimeout(cursorTimer); cursorTimer = null;
  if (!cursorPending || !S.rt || !S.rt.cursor) return;
  S.rt.cursor({ x: cursorPending.x, y: cursorPending.y, cardId: S.dragCardId, gone: false });
  cursorSentAt = Date.now(); cursorPending = null;
}

function sendCursorGone() {
  clearTimeout(cursorTimer); cursorTimer = null; cursorPending = null; lastCursorPos = null;
  S.rt && S.rt.cursor && S.rt.cursor({ gone: true });
}

// Sekme arka plana geçince imlecimiz karşıda asılı kalmasın.
document.addEventListener("visibilitychange", () => { if (document.hidden && S.view === "board") sendCursorGone(); });

const CURSOR_ARROW = `<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M1.5 1.5 16 10.2 9.4 11.7 6.2 18.2Z" fill="var(--rc)" stroke="#0A0C10" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

function onRemoteCursor(ev) {
  // Kendi imlecim (başka sekmem) gösterilmez.
  if (!S.me || ev.userId === S.me.id) return;
  const layer = $("cursorLayer"); if (!layer) return;
  let c = S.cursors.get(ev.userId);
  if (ev.gone) {
    if (c) { clearTimeout(c.idle); c.el.remove(); S.cursors.delete(ev.userId); refreshRemoteDrags(); }
    return;
  }
  if (!c) {
    const el = document.createElement("div");
    el.className = "rcursor";
    el.innerHTML = `${CURSOR_ARROW}<span class="lbl"></span><span class="carry" hidden></span>`;
    c = { el, x: ev.x, y: ev.y, cardId: null, idle: null };
    placeCursor(c);              // ilk konumu geçişsiz ver: imleç köşeden süzülerek gelmesin
    layer.appendChild(el);
    S.cursors.set(ev.userId, c);
  }
  c.el.style.setProperty("--rc", ev.color);
  c.el.querySelector(".lbl").textContent = (ev.name || "").split(" ")[0];
  c.x = ev.x; c.y = ev.y;
  const wasCarrying = c.cardId;
  c.cardId = ev.cardId || null;
  const card = c.cardId ? findCard(c.cardId) : null;
  const carry = c.el.querySelector(".carry");
  carry.hidden = !card;
  if (card) carry.textContent = card.title;
  c.el.classList.remove("idle");
  clearTimeout(c.idle);
  c.idle = setTimeout(() => c.el.classList.add("idle"), CURSOR_IDLE_MS);
  placeCursor(c);
  if (wasCarrying !== c.cardId) refreshRemoteDrags();
}

function placeCursor(c) {
  const cols = $("cols"); if (!cols) return;
  c.el.style.transform = `translate3d(${c.x - cols.scrollLeft}px, ${c.y - cols.scrollTop}px, 0)`;
}

function findCard(cardId) {
  for (const col of S.board?.columns || []) {
    const card = col.cards.find((k) => k.id === cardId);
    if (card) return card;
  }
  return null;
}

/** Panodan ayrılan kişinin imleci de kalksın. */
function pruneCursors() {
  const here = new Set(S.presence.map((u) => u.id));
  S.cursors.forEach((c, id) => { if (!here.has(id)) { clearTimeout(c.idle); c.el.remove(); S.cursors.delete(id); } });
  refreshRemoteDrags();
}

/** Başkasının şu an taşıdığı kart: bizde soluk ve onun renginde kesik çerçeveli. */
function refreshRemoteDrags() {
  document.querySelectorAll(".card.remote-drag").forEach((el) => { el.classList.remove("remote-drag"); el.style.removeProperty("--rc"); });
  S.cursors.forEach((c) => {
    if (!c.cardId) return;
    const el = document.querySelector(`.card[data-card-id="${c.cardId}"]`);
    if (el) { el.classList.add("remote-drag"); el.style.setProperty("--rc", c.el.style.getPropertyValue("--rc")); }
  });
}

function flash(cardId) {
  const el = document.querySelector(`.card[data-card-id="${cardId}"]`);
  if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 950); }
}

let actTimer = null;
/**
 * Bir olay olduğunda hareket listesini ve akış ölçümünü tazeler.
 * Kısa bekleme (debounce), art arda gelen olaylarda tek istek atılmasını sağlar.
 * Geçmiş modundayken atlanır: orada pano şimdiki zamanı göstermiyor.
 */
function loadActivity() {
  clearTimeout(actTimer);
  actTimer = setTimeout(async () => {
    if (!S.board || S.history.active) return;
    try { S.activity = await api.activity(S.board.id); renderActivity(); } catch (_) {}
    loadFlow();
  }, 350);
}

/* ── Üyeler ── */
function renderMembers() {
  const box = $("memList"); if (!box) return;

  // Bu çizimde YENİ olan satırlar: yalnızca onlar belirme animasyonu alır. İlk
  // çizimde (hafıza boşken) hiçbiri animasyon almaz — pano açılışı sakin kalsın.
  const seen = S.memberRows, now = new Set();
  const fresh = (key) => { now.add(key); return seen.size && !seen.has(key) ? " fresh" : ""; };
  const here = new Set(S.presence.map((u) => u.id));   // yeşil nokta: şu an bu panoda

  box.innerHTML = "";
  S.members.forEach((m) => {
    const name = `${m.firstName || ""} ${m.lastName || ""}`.trim() || m.email;
    const isMe = m.email === S.me?.email;
    const row = document.createElement("div");
    row.className = "mem" + fresh("m" + m.id);
    const on = here.has(m.id);
    row.innerHTML = `<span class="av-dot${on ? " on" : ""}" title="${on ? "Şu an panoda" : "Panoda değil"}">${avatar(name, 28, "", m.avatarUrl)}</span>
      <div class="n"><b>${esc(name)}${isMe ? " (sen)" : ""}</b><small>${esc(m.email)}</small></div>
      <span class="badge ${m.role}">${roleLabel(m.role)}</span>
      ${isOwner() && !isMe ? `<button class="icon-btn rm" title="Çıkar">${I.close}</button>` : ""}`;
    row.querySelector(".rm")?.addEventListener("click", async () => {
      try {
        await api.removeMember(S.board.id, m.id);
        toast("Üye çıkarıldı", name, "ok");
        S.members = await api.members(S.board.id); renderMembers(); updateConn();
      } catch (e) { toast("Çıkarılamadı", e.message, "err"); }
    });
    box.appendChild(row);
  });

  // Bekleyen davetler — e-posta adresleri içerdiği için yalnızca yönetici görür.
  if (isOwner() && S.pending.length) {
    box.insertAdjacentHTML("beforeend", `<div class="pending-title">Bekleyen davetler · ${S.pending.length}</div>`);
    S.pending.forEach((p) => {
      const row = document.createElement("div");
      row.className = "mem" + fresh("p" + p.id);
      const label = p.inviteeName || p.email;
      row.innerHTML = `${avatar(label, 30, p.hasAccount ? "" : "opacity:.55", p.inviteeAvatarUrl)}
        <div class="n"><b>${esc(label)}</b><small>${p.hasAccount ? esc(p.email) : "Hesabı yok · kayıt olunca görecek"}</small></div>
        <div class="badges"><span class="badge ${p.role}">${roleLabel(p.role)}</span><span class="badge PENDING">BEKLİYOR</span></div>
        <button class="icon-btn rm" title="Daveti geri çek">${I.close}</button>`;
      row.querySelector(".rm").addEventListener("click", async () => {
        try {
          await api.cancelInvitation(S.board.id, p.id);
          toast("Davet geri çekildi", p.email);
          loadPending();
        } catch (e) { toast("Geri çekilemedi", e.message, "err"); }
      });
      box.appendChild(row);
    });
  }
  S.memberRows = now;
  const mc = $("memCount"); if (mc) mc.textContent = S.members.length;
}

async function loadPending() {
  if (!S.board || !isOwner()) { S.pending = []; return; }
  try { S.pending = await api.pendingInvitations(S.board.id); } catch (_) { S.pending = []; }
  renderMembers();
}

/**
 * Üye listesi değişti (biri katıldı, çıkarıldı, rolü değişti) — kendi rolümü de
 * yeniden hesaplarım: çıkarıldıysam panodan çıkarım, rolüm değiştiyse ekran
 * yeni yetkiyle yeniden çizilir.
 */
async function reloadMembers() {
  if (!S.board) return;
  const id = S.board.id;
  try {
    S.members = await api.members(id);
  } catch (e) {
    if (e.status === 403) { toast("Panodan çıkarıldın", S.board.name, "warn"); goHome(); }
    return;
  }
  const mine = S.members.find((m) => m.email === S.me?.email);
  if (mine && mine.role !== S.boardRole) {
    S.boardRole = mine.role;
    toast("Rolün değişti", `${S.board.name} panosunda artık ${ROLE_NAME[mine.role]}`);
    renderBoard(); loadPending();
  } else {
    renderMembers(); updateConn();
  }
  loadActivity();
}
