<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CollabBoard — Canlı Kanban</title>
    <style>
        :root {
            --accent: #f5871f; --accent-soft: #fff1e2; --accent-ink: #b8620f;
            --bg: #eef3f8; --col: #f1f4f8; --col-head: #e2e9f2;
            --ink: #1f2d3d; --muted: #6b7a90; --line: #e1e7ef;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; color: var(--ink); background: var(--bg); }

        header { display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: #fff; border-bottom: 1px solid var(--line); }
        header h1 { font-size: 17px; font-weight: 800; }
        header h1 .a { color: var(--accent); }
        header .board-name { color: var(--muted); font-weight: 500; font-size: 14px; }
        /* Presence: panoda çevrimiçi olanların avatarları */
        .presence { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .avatars { display: flex; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; border: 2px solid #fff;
            margin-left: -8px; box-shadow: 0 1px 3px rgba(31,45,61,.25);
            animation: pop .18s ease-out;
        }
        .avatar:first-child { margin-left: 0; }
        .presence-count { font-size: 13px; color: var(--muted); font-weight: 600; }

        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #e05b49; transition: background .3s; }
        .dot.connected { background: #35b37e; }

        .board { display: flex; gap: 14px; padding: 20px; overflow-x: auto; align-items: flex-start; }

        .column { width: 292px; flex-shrink: 0; background: var(--col); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; max-height: calc(100vh - 132px); }
        .column-header { padding: 12px 14px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: grab; user-select: none; }
        .column-header:active { cursor: grabbing; }
        .column-header .count { margin-left: auto; background: var(--col-head); color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 20px; padding: 1px 9px; }
        .column.col-ghost { opacity: .5; }

        .cards { padding: 4px 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; min-height: 20px; }

        .card { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 32px 11px 13px; font-size: 14px; cursor: grab; box-shadow: 0 1px 2px rgba(31,45,61,.06); transition: box-shadow .1s, border-color .1s; }
        .card:hover { box-shadow: 0 3px 10px rgba(31,45,61,.13); border-color: #cdd6e2; }
        .card-title { word-break: break-word; line-height: 1.4; }
        .card-del { position: absolute; top: 7px; right: 7px; background: transparent; border: none; cursor: pointer; color: var(--muted); padding: 3px; border-radius: 6px; display: inline-flex; opacity: 0; transition: opacity .1s, background .1s, color .1s; }
        .card:hover .card-del { opacity: 1; }
        .card-del:hover { background: #fdecec; color: #e05b49; }
        /* SortableJS: sürüklenen kartın bırakılacağı yerde beliren yer tutucu */
        .card-ghost { opacity: 1; background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
        .card-ghost * { visibility: hidden; }
        .card-drag { transform: rotate(2deg); box-shadow: 0 8px 20px rgba(31,45,61,.25); }

        .column-footer { padding: 8px; }
        .add-row { display: flex; gap: 8px; }
        .add-row input { flex: 1; background: #fff; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 9px 11px; font-size: 13px; outline: none; }
        .add-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .add-row button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; font-weight: 700; }
        .add-row button:hover { filter: brightness(.96); }

        /* Çakışma bildirimi (ADR 0003: reddedilen operasyon) */
        #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; }
        .toast {
            background: #2b3b4e; color: #fff; padding: 11px 16px; border-radius: 10px;
            font-size: 13px; box-shadow: 0 6px 20px rgba(31,45,61,.3);
            border-left: 4px solid var(--accent); animation: pop .18s ease-out;
        }
        @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
    <header>
        <h1>Collab<span class="a">Board</span> <span class="board-name" id="boardName"></span></h1>
        <div class="presence">
            <span class="presence-count" id="presenceCount"></span>
            <div class="avatars" id="avatars"></div>
        </div>
        <div class="status"><span id="statusText">bağlanıyor…</span><span class="dot" id="statusDot"></span></div>
    </header>

    <div class="board" id="board"></div>
    <div id="toasts"></div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script>
        const boardId = new URLSearchParams(location.search).get("board");
        if (!boardId) {
            fetch("/api/boards", { method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: "Demo Board" }) })
                .then(r => r.json()).then(b => { location.search = "?board=" + b.id; });
        }

        const boardEl = document.getElementById("board");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        let stompClient = null;

        // ═══ 1) BAŞLANGIÇ FOTOĞRAFI (REST) ═══
        async function loadBoard() {
            const board = await fetchBoard();
            if (!board) return;
            document.getElementById("boardName").textContent = "· " + board.name + " (#" + board.id + ")";
            renderBoard(board);
            connect();
        }

        async function fetchBoard() {
            const res = await fetch("/api/boards/" + boardId);
            if (!res.ok) { boardEl.textContent = "Pano bulunamadı: " + boardId; return null; }
            return res.json();
        }

        /**
         * SNAPSHOT RESYNC (ADR 0003): operasyonumuz reddedilince ekranı sunucudaki
         * gerçekle yeniden hizala — tam fotoğrafı çek, panoyu baştan çiz.
         * (Faz 3'te bağlantı koptuktan sonra da bunu kullanacağız.)
         */
        async function resync() {
            const board = await fetchBoard();
            if (board) renderBoard(board);
        }

        function renderBoard(board) {
            boardEl.innerHTML = "";
            board.columns.forEach(col => boardEl.appendChild(createColumnEl(col)));
            initSortables();
            updateCounts();
        }

        function createColumnEl(col) {
            const colEl = document.createElement("div");
            colEl.className = "column";
            colEl.dataset.columnId = col.id;
            colEl.innerHTML = `
                <div class="column-header"><span>${escapeHtml(col.name)}</span><span class="count" data-count></span></div>
                <div class="cards" data-column-id="${col.id}"></div>
                <div class="column-footer"><div class="add-row">
                    <input type="text" placeholder="+ Kart ekle…"/><button>Ekle</button>
                </div></div>`;

            const cardsEl = colEl.querySelector(".cards");
            col.cards.forEach(card => cardsEl.appendChild(createCardEl(card)));

            const input = colEl.querySelector(".add-row input");
            const addCard = () => {
                const title = input.value.trim();
                if (!title) return;
                sendOp({ type: "ADD_CARD", columnId: col.id, title });
                input.value = "";
            };
            colEl.querySelector(".add-row button").onclick = addCard;
            input.addEventListener("keydown", e => { if (e.key === "Enter") addCard(); });
            return colEl;
        }

        function createCardEl(card) {
            const el = document.createElement("div");
            el.className = "card";
            el.dataset.cardId = card.id;
            el.dataset.version = card.version;
            el.title = "Çift tıkla: düzenle";
            el.innerHTML = `
                <div class="card-title"></div>
                <button class="card-del" title="Sil">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>`;
            el.querySelector(".card-title").textContent = card.title;
            el.querySelector(".card-del").addEventListener("click", e => {
                e.stopPropagation();
                sendOp({ type: "DELETE_CARD", cardId: card.id });
            });
            el.addEventListener("dblclick", () => {
                const cur = el.querySelector(".card-title").textContent;
                const t = prompt("Kart başlığı:", cur);
                if (t && t.trim() && t.trim() !== cur) sendOp({
                    type: "EDIT_CARD", cardId: card.id, title: t.trim(),
                    baseVersion: Number(el.dataset.version)   // ADR 0003: gördüğüm sürüm
                });
            });
            return el;
        }

        // ═══ SÜRÜKLEME (SortableJS) — DOM'u kütüphane taşır (optimistic), biz op yollarız ═══
        function initSortables() {
            // Kartlar: kolonlar arası taşınabilir (aynı group)
            document.querySelectorAll(".cards").forEach(cardsEl => {
                new Sortable(cardsEl, {
                    group: "cards", animation: 150,
                    ghostClass: "card-ghost", dragClass: "card-drag",
                    filter: ".card-del", preventOnFilter: false,  // sil ikonu: sürükleme başlatma ama tıklamayı yut da ma
                    onEnd: evt => {
                        if (evt.from === evt.to && evt.oldIndex === evt.newIndex) return;
                        sendOp({
                            type: "MOVE_CARD",
                            cardId: Number(evt.item.dataset.cardId),
                            toColumnId: Number(evt.to.dataset.columnId),
                            position: evt.newIndex,
                            baseVersion: Number(evt.item.dataset.version)
                        });
                        updateCounts();
                    }
                });
            });
            // Kolonlar: başlıktan tutulup yeniden sıralanır
            new Sortable(boardEl, {
                group: "columns", animation: 150, draggable: ".column",
                handle: ".column-header", ghostClass: "col-ghost",
                onEnd: evt => {
                    if (evt.oldIndex === evt.newIndex) return;
                    sendOp({ type: "MOVE_COLUMN", columnId: Number(evt.item.dataset.columnId), position: evt.newIndex });
                }
            });
        }

        // ═══ 2) CANLI YAYIN (WebSocket/STOMP) ═══
        function connect() {
            stompClient = new StompJs.Client({
                brokerURL: "ws://" + location.host + "/ws", reconnectDelay: 3000,
                onConnect: () => {
                    setStatus(true);
                    // (a) Panonun canlı yayını — herkese giden olaylar.
                    stompClient.subscribe("/topic/board." + boardId, m => handleEvent(JSON.parse(m.body)));
                    // (b) KİŞİSEL kanal — sadece BANA gelen reddetmeler (ADR 0003).
                    stompClient.subscribe("/user/queue/errors", m => handleRejection(JSON.parse(m.body)));
                    // (c) PRESENCE kanalı — panoda kimler çevrimiçi.
                    stompClient.subscribe("/topic/board." + boardId + "/presence",
                        m => renderPresence(JSON.parse(m.body).users));
                    // Önce dinlemeye başla, SONRA "katıldım" de — yoksa kendi katılışımızın
                    // duyurusunu kaçırırdık (mesaj biz abone olmadan yayınlanır).
                    stompClient.publish({ destination: "/app/board/" + boardId + "/presence/join" });
                },
                onWebSocketClose: () => setStatus(false)
            });
            stompClient.activate();
        }
        function sendOp(op) {
            stompClient.publish({ destination: "/app/board/" + boardId + "/ops", headers: { "content-type": "application/json" }, body: JSON.stringify(op) });
        }

        // Sunucudan gelen event → DOM'a uygula (uzak kullanıcıların değişiklikleri;
        // kendi hareketimizde SortableJS zaten taşıdı, tekrar uygulamak idempotent).
        function handleEvent(ev) {
            if (ev.type === "ADD_CARD") {
                const c = document.querySelector(`.cards[data-column-id="${ev.columnId}"]`);
                if (c && !document.querySelector(`.card[data-card-id="${ev.card.id}"]`)) insertAt(c, ".card", createCardEl(ev.card), ev.card.position);
            } else if (ev.type === "MOVE_CARD") {
                const card = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                const target = document.querySelector(`.cards[data-column-id="${ev.toColumnId}"]`);
                if (card && target) { card.dataset.version = ev.version; insertAt(target, ".card", card, ev.position); }
            } else if (ev.type === "EDIT_CARD") {
                const card = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                if (card) { card.querySelector(".card-title").textContent = ev.title; card.dataset.version = ev.version; }
            } else if (ev.type === "DELETE_CARD") {
                const card = document.querySelector(`.card[data-card-id="${ev.cardId}"]`);
                if (card) card.remove();
            } else if (ev.type === "MOVE_COLUMN") {
                const col = document.querySelector(`.column[data-column-id="${ev.columnId}"]`);
                if (col) insertAt(boardEl, ".column", col, ev.position);
            }
            updateCounts();
        }

        /**
         * Operasyonum REDDEDİLDİ (ADR 0003). Ekranımda bayat veri var demektir:
         * kullanıcıyı bilgilendir + snapshot resync ile ekranı gerçeğe hizala.
         */
        function handleRejection(ev) {
            toast(ev.message || "İşlem reddedildi, ekran güncellendi.");
            resync();
        }

        /** Çevrimiçi listesini başlıktaki avatarlara çiz. */
        function renderPresence(users) {
            const box = document.getElementById("avatars");
            box.innerHTML = "";
            users.forEach(u => {
                const el = document.createElement("div");
                el.className = "avatar";
                el.style.background = u.color;
                el.textContent = u.name.slice(0, 2).toUpperCase();   // "Panda" → "PA"
                el.title = u.name;
                box.appendChild(el);
            });
            document.getElementById("presenceCount").textContent =
                users.length ? users.length + " kişi çevrimiçi" : "";
        }

        function toast(text) {
            const el = document.createElement("div");
            el.className = "toast";
            el.textContent = text;
            document.getElementById("toasts").appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        function insertAt(container, sel, el, index) {
            const items = [...container.querySelectorAll(sel)].filter(c => c !== el);
            if (index >= items.length) container.appendChild(el);
            else container.insertBefore(el, items[index]);
        }
        function updateCounts() {
            document.querySelectorAll(".column").forEach(col => col.querySelector("[data-count]").textContent = col.querySelectorAll(".card").length);
        }
        function setStatus(c) { statusDot.classList.toggle("connected", c); statusText.textContent = c ? "bağlı" : "bağlantı kesildi"; }
        function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

        if (boardId) loadBoard();
    </script>
</body>
</html>
