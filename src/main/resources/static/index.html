/** Son kolon "bitti" sayılır (özet ve akış ölçümüyle aynı kural): oradaki kart gecikmiş değildir. */
const isLastCol = (col) => !!S.board && S.board.columns[S.board.columns.length - 1]?.id === col.id;
const isLate = (card, col) => !!card.dueDate && dueState(card.dueDate) === "due-over" && !isLastCol(col);

/** Kart süzgeçten geçiyor mu? Ölçütler VE ile birleşir. */
function cardMatches(card, col) {
  const f = S.filter;
  const q = fold(f.q.trim());
  if (q) {
    const hay = fold(`${card.title} ${card.description || ""}`);
    if (!hay.includes(q) && parseCardKey(f.q) !== card.id) return false;   // "STR-42" de bulur
  }
  if (f.mine) {
    const me = S.members.find((m) => m.email === S.me?.email);
    if (!me || card.assigneeId !== me.id) return false;
  }
  if (f.assignee && String(card.assigneeId) !== String(f.assignee)) return false;
  if (f.overdue && !isLate(card, col)) return false;
  // Etiket: seçilenlerden herhangi biri kartta varsa geçer ("none": hiç etiketi olmayan kart).
  if (f.labels?.length) {
    const own = card.labelIds || [];
    if (!f.labels.some((id) => (id === "none" ? !own.length : own.includes(id)))) return false;
  }
  return true;
}

/** Araç çubuğunun sağındaki özet sayılar; kartlar ya da akış ölçümü değişince tazelenir. */
function renderBoardStats() {
  const b = S.board;
  const late = b ? b.columns.reduce((n, col) => n + col.cards.filter((c) => isLate(c, col)).length, 0) : 0;
  const fo = $("fover");
  if (fo) { fo.textContent = late ? t("filter.lateCount", { count: late }) : t("filter.late"); fo.classList.toggle("late", !!late && !S.filter.overdue); }
  const el = $("bstats"); if (!el) return;
  if (!b) { el.innerHTML = ""; return; }
  const total = b.columns.reduce((n, c) => n + c.cards.length, 0);
  const f = S.history.active ? null : S.flow;
  const bn = f?.bottleneckColumnId ? f.columns.find((c) => c.columnId === f.bottleneckColumnId) : null;
  el.innerHTML = [`<span>${t("stats.cards", { count: total })}</span>`,
    bn ? `<span title="${t("stats.bottleneckTitle")}">${t("stats.bottleneck")} <b class="bad">${esc(bn.name)}</b></span>` : "",
    f?.averageCycleTimeSeconds != null ? `<span title="${t("stats.cycleTitle")}">${t("stats.cycle")} <b>${humanDuration(f.averageCycleTimeSeconds)}</b></span>` : "",
  ].join("");
}

/** Panoda şu an kaç farklı kişi var (aynı kişinin iki sekmesi bir sayılır). */
const onlineHere = () => new Set(S.presence.map((u) => u.id)).size;

function updateConn() {
  const box = $("connBox");
  if (box) {
    const n = onlineHere();
    box.className = "online-pill" + (S.conn === "up" ? "" : S.conn === "down" ? " down" : " wait") + (n && S.conn === "up" ? "" : " solo");
    $("connLabel").textContent = S.conn === "up" ? (n ? t("conn.liveCount", { count: n }) : t("conn.live"))
      : S.conn === "down" ? t("conn.lost") : t("conn.connecting");
  }
  const pill = $("livePill");
  if (pill) pill.innerHTML = S.conn === "up"
    ? `<span class="live-pill"><i></i>${t("conn.pillLive")}</span>`
    : `<span class="live-pill off"><i></i>${t(S.conn === "down" ? "conn.pillOff" : "conn.pillConnecting")}</span>`;
}


function renderPresence() {
  const box = $("presence"); if (!box) return;
  const seen = new Set();
  const uniq = S.presence.filter((u) => !seen.has(u.id) && seen.add(u.id));
  box.innerHTML = uniq.slice(0, 4).map((u) => avatar(u.name, 24, "", u.avatarUrl)).join("");
  box.title = uniq.map((u) => u.name).join(", ");
  updateConn(); renderMembers();
}

function renderColumns() {
  const wrap = $("cols"); if (!wrap) return;
  if (!S.board) { wrap.innerHTML = `<div class="skel" style="width:276px;height:280px"></div>`.repeat(3); return; }

  const filtering = activeFilter();
  let shown = 0, total = 0;

  const before = captureRects(wrap);
  wrap.innerHTML = "";
  S.board.columns.forEach((col) => {
    const el = document.createElement("div");
    const state = wipState(col);
    el.className = "col" + (state ? " " + state : ""); el.dataset.colId = col.id;
    el.innerHTML = `
      <div class="col-head">
        <span class="nm">${esc(col.name)}</span>${wipChip(col, state)}
        <div style="margin-left:auto"></div>
        ${canEdit() ? `<div class="col-menu"><button class="icon-btn" title="${t("column.actions")}">${I.dots}</button></div>` : ""}
      </div>
      ${state === "full" ? `<div class="wip-note">${t("column.wipFull")}</div>` : ""}
      ${state === "over" ? `<div class="wip-note">${t("column.wipOver")}</div>` : ""}
      <div class="col-cards" data-col-id="${col.id}"></div>
      <div class="col-foot"></div>`;

    el.querySelector(".chip.wip.editable")?.addEventListener("click", (e) => { e.stopPropagation(); openWipModal(col); });
    el.querySelector(".col-menu > .icon-btn")?.addEventListener("click", (e) => {
      e.stopPropagation(); openColumnMenu(el.querySelector(".col-menu"), col);
    });

    const cards = el.querySelector(".col-cards");
    let visible = 0;
    col.cards.forEach((c) => {
      total++;
      if (filtering && !cardMatches(c, col)) return;
      visible++; shown++;
      cards.appendChild(cardEl(c, col));
    });
    if (!visible) {
      cards.innerHTML = `<div class="col-empty">${t(filtering ? "column.noMatch" : "column.empty")}</div>`;
    }

    if (canEdit()) {
      const foot = el.querySelector(".col-foot");
      const btn = document.createElement("button");
      btn.className = "add-card"; btn.innerHTML = `${I.plus} ${t("column.addCard")}`;
      btn.onclick = () => openComposer(foot, col.id);
      foot.appendChild(btn);
    }
    wrap.appendChild(el);
  });

  if (canEdit()) {
    const add = document.createElement("button");
    add.className = "add-col"; add.innerHTML = `${I.plus} ${t("column.addColumn")}`;
    add.onclick = () => openAddColumn(add);
    wrap.appendChild(add);
  }

  if (!canEdit()) {
    const note = document.createElement("div");
    note.className = "viewer-note";
    note.innerHTML = `<b style="font-size:13px">${t("board.viewerTitle")}</b><div style="margin-top:5px">${t("board.viewerBody")}</div>`;
    wrap.appendChild(note);
  }

  const fc = $("fcount");
  if (fc) fc.textContent = filtering ? t("board.filterCount", { shown, total }) : "";

  initSortables();
  playFlip(wrap, before);
  refreshRemoteDrags();
  renderBoardStats();
  const mc = $("memCount"); if (mc) mc.textContent = S.members.length;
}

/** Kolon işlemleri açılır menüsü: yeniden adlandır, WIP limiti, sil. */
function openColumnMenu(host, col) {
  document.querySelectorAll(".col-pop").forEach((n) => n.remove());
  const pop = document.createElement("div");
  pop.className = "col-pop";
  pop.innerHTML = `
    <button data-a="rename">${t("common.rename")}</button>
    <button data-a="wip">${t("column.wipLimit")}</button>
    <button data-a="delete" class="danger">${t("column.delete")}</button>`;
  host.appendChild(pop);

  const close = () => { pop.remove(); document.removeEventListener("mousedown", onAway); };
  function onAway(e) { if (!pop.contains(e.target)) close(); }
  setTimeout(() => document.addEventListener("mousedown", onAway), 0);

  pop.onclick = (e) => {
    const a = e.target.dataset.a; if (!a) return;
    close();
    if (a === "rename") startRename(col);
    if (a === "wip") openWipModal(col);
    if (a === "delete") confirmDeleteColumn(col);
  };
}

/** Kolon adını yerinde düzenle — ayrı bir pencere açmaya değmez. */
function startRename(col) {
  const head = document.querySelector(`.col[data-col-id="${col.id}"] .col-head`);
  if (!head) return;
  const nm = head.querySelector(".nm");
  const input = document.createElement("input");
  input.className = "rename"; input.value = col.name; input.maxLength = 100;
  nm.replaceWith(input);
  input.focus(); input.select();

  let done = false;
  const finish = (commit) => {
    if (done) return; done = true;
    const name = input.value.trim();
    if (commit && name && name !== col.name) {
      sendOp({ type: "RENAME_COLUMN", columnId: col.id, name });
      col.name = name;
    }
    renderColumns();
  };
  input.addEventListener("blur", () => finish(true));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
}

/** Kolon silme onayı — kartlar da gittiği için geri alınamaz. */
function confirmDeleteColumn(col) {
  const n = col.cards.length;
  openModal(`<div class="modal">
    <div style="display:flex;gap:11px">
      <span class="warn-ico">${I.warnTri}</span>
      <div><h3>${t("column.deleteTitle", { name: esc(col.name) })}</h3>
        <p class="sub">${n ? t("column.deleteCards", { count: n }) : t("column.isEmpty")}
          ${t("column.deleteNote")}</p></div>
    </div>
    <div class="acts">
      <button class="btn btn-danger" id="ok">${t("common.delete")}</button>
      <button class="btn btn-ghost" id="close">${t("common.cancel")}</button>
    </div></div>`, (o) => {
    o.querySelector("#close").onclick = closeModal;
    o.querySelector("#ok").onclick = () => {
      sendOp({ type: "DELETE_COLUMN", columnId: col.id });
      S.board.columns = S.board.columns.filter((c) => c.id !== col.id);
      renderColumns(); closeModal();
    };
  });
}

/** Yeni kolon ekleme — düğme yerinde bir girdiye dönüşür. */
function openAddColumn(btn) {
  const box = document.createElement("div");
  box.className = "add-col"; box.style.display = "block";
  box.innerHTML = `<input class="rename" style="width:100%" maxlength="100" placeholder="${t("column.namePh")}">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" style="padding:6px 11px;font-size:13px" data-a="ok">${t("common.add")}</button>
      <button class="btn btn-ghost" style="padding:6px 11px" data-a="no">${t("common.cancel")}</button></div>`;
  btn.replaceWith(box);

  const input = box.querySelector("input"); input.focus();
  const add = () => {
    const name = input.value.trim();
    if (!name) return renderColumns();
    sendOp({ type: "ADD_COLUMN", boardId: S.board.id, name });
    renderColumns();   // kolon, sunucudan gelen olayla belirecek
  };
  box.querySelector(`[data-a="ok"]`).onclick = add;
  box.querySelector(`[data-a="no"]`).onclick = () => renderColumns();
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); add(); }
    if (e.key === "Escape") renderColumns();
  });
}

function cardEl(card, col) {
  const el = document.createElement("div");
  el.className = "card"; el.dataset.cardId = card.id; el.dataset.version = card.version;
  el.innerHTML = `${cardLabels(card)}<div class="t">${esc(card.title)}</div>${cardMeta(card)}${canEdit() ? `<button class="icon-btn del" title="${t("common.delete")}">${I.trash}</button>` : ""}`;
  el.onclick = (e) => { if (!e.target.closest(".del")) openDetail(card, col); };
  el.querySelector(".del")?.addEventListener("click", (e) => { e.stopPropagation(); sendOp({ type: "DELETE_CARD", cardId: card.id }); removeCardLocal(card.id); });
  return el;
}

/**
 * Kolonun WIP durumu: "" (sınırsız ya da yer var), "full" (tam limitte),
 * "over" (limit sonradan düşürülmüş, fazlalık var).
 */
function wipState(col) {
  if (!col.wipLimit) return "";
  if (col.cards.length > col.wipLimit) return "over";
  if (col.cards.length >= col.wipLimit) return "full";
  return "";
}

function wipChip(col, state) {
  const editable = canEdit();
  const text = col.wipLimit ? `${col.cards.length} / ${col.wipLimit}` : String(col.cards.length);
  const title = col.wipLimit
    ? t("wip.label", { limit: col.wipLimit }) + (editable ? t("wip.clickToChange") : "")
    : t(editable ? "wip.noneEditable" : "wip.none");
  return `<span class="chip wip ${state} ${editable ? "editable" : ""}" title="${esc(title)}">${text}</span>`;
}

/** Kart üzerindeki küçük göstergeler: anahtar, açıklama, yorum sayısı, son tarih, atanan kişi. */
function cardMeta(card) {
  const bits = [`<span class="ckey">${cardKey(card.id)}</span>`];
  if (card.description) {
    bits.push(`<span class="badge" title="${t("card.hasDescription")}">☰</span>`);
  }
  if (card.commentCount > 0) {
    bits.push(`<span class="badge" title="${t("card.comments", { count: card.commentCount })}">${I.comment}${card.commentCount}</span>`);
  }
  const ck = checklistTotals(card);
  if (ck.total > 0) {
    const tip = esc(t("checklist.cardFace", ck));
    bits.push(`<span class="badge${ck.done === ck.total ? " ck-all" : ""}" title="${tip}" aria-label="${tip}">${IK.checkSq}${ck.done}/${ck.total}</span>`);
  }
  if (card.dueDate) {
    const st = dueState(card.dueDate);
    bits.push(`<span class="badge ${st}" title="${esc(t("card.due", { date: card.dueDate }))}">${esc(dueLabel(card.dueDate))}</span>`);
  }
  const m = card.assigneeId ? memberById(card.assigneeId) : null;
  if (m) bits.push(`<span class="sp">${avatar(memberName(m), 22, "", m.avatarUrl)}</span>`);
  return bits.length ? `<div class="cmeta">${bits.join("")}</div>` : "";
}

/** WIP limitini ayarlama kutusu. Boş bırakmak sınırı kaldırır. */
function openWipModal(col) {
  if (!canEdit()) return;
  openModal(`<div class="modal">
    <h3>${t("wip.title", { name: esc(col.name) })}</h3>
    <p class="sub">${t("wip.sub")}</p>
    <div class="fld"><label for="wl">${t("wip.limit")}</label>
      <input type="number" min="1" id="wl" value="${col.wipLimit ?? ""}" placeholder="${t("wip.placeholder")}"
             style="width:100%;font:inherit;font-size:13.5px;border:1px solid var(--bd-2);border-radius:8px;padding:8px 10px;outline:none"></div>
    <div class="acts">
      <button class="btn btn-primary" id="ok">${t("common.save")}</button>
      <button class="btn btn-ghost" id="close">${t("common.cancel")}</button>
      <div class="spacer"></div>
      ${col.wipLimit ? `<button class="btn" id="clear" style="background:none;color:var(--ink-2)">${t("wip.remove")}</button>` : ""}
    </div></div>`, (o) => {
    const input = o.querySelector("#wl"); input.focus(); input.select();
    const send = (limit) => { sendOp({ type: "SET_WIP_LIMIT", columnId: col.id, limit }); closeModal(); };
    o.querySelector("#close").onclick = closeModal;
    o.querySelector("#clear")?.addEventListener("click", () => send(null));
    o.querySelector("#ok").onclick = () => {
      const raw = input.value.trim();
      if (!raw) return send(null);
      const n = Number(raw);
      if (!Number.isInteger(n) || n < 1) return toast(t("wip.invalid"), t("wip.invalidBody"), "err");
      send(n);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") o.querySelector("#ok").click(); });
  });
}

function openComposer(foot, colId) {
  foot.innerHTML = `<div class="composer"><textarea placeholder="${t("card.composerPh")}"></textarea>
    <div class="r"><button class="btn btn-primary" style="padding:7px 12px;font-size:13px">${t("common.add")}</button>
      <button class="btn btn-ghost" style="padding:7px 12px">${t("common.cancel")}</button>
      <span class="k">${t("card.composerHint")}</span></div></div>`;
  const ta = foot.querySelector("textarea"); ta.focus();
  const close = () => { foot.innerHTML = ""; const b = document.createElement("button");
    b.className = "add-card"; b.innerHTML = `${I.plus} ${t("column.addCard")}`; b.onclick = () => openComposer(foot, colId); foot.appendChild(b); };
  const add = () => {
    const title = ta.value.trim(); if (!title) return close();
    sendOp({ type: "ADD_CARD", columnId: colId, title });
    ta.value = ""; ta.focus();

  foot.querySelector(".btn-primary").onclick = add;
  foot.querySelector(".btn-ghost").onclick = close;

/**
 * Kart penceresi: alanlar ve altında yorumlar.
 * toComments: bildirimden ya da postadaki bağlantıdan gelindi; yorumlara kaydırılır.
 */
function openDetail(card, col, { toComments = false } = {}) {
  const pos = col.cards.findIndex((c) => c.id === card.id) + 1;
  const ro = !canEdit() ? "disabled" : "";
  const options = [`<option value="">${t("detail.unassigned")}</option>`]
    .concat(S.members.map((m) => `<option value="${m.id}" ${card.assigneeId === m.id ? "selected" : ""}>${esc(memberName(m))}</option>`))
    .join("");
  // Kontrol listeleri de zaman yolculuğunda oynatılmaz (işaretlemeler kayda yazılmıyor, ADR 0022).
  const checklists = S.history.active ? "" : `
    <section class="cks" id="cks" aria-labelledby="cksH">
      <div class="cks-h"><span id="cksH">${t("checklist.title")}</span>
        ${canEdit() ? `<button class="btn-ghost btn-sm" id="ckNew" aria-label="${t("checklist.addTitle")}">${I.plus} ${t("checklist.add")}</button>` : ""}</div>
      <div id="ckBody"></div>
    </section>`;
  // Yorumlar zaman yolculuğunun parçası değil: geçmiş görünümünde gösterilmez.
  const comments = S.history.active ? "" : `
    <section class="cmts" id="cmts" aria-label="${t("comments.title")}">
      <div class="cmts-h">${t("comments.title")} <span class="cnt" id="cmtCount"></span></div>
      <div id="cmtList"></div>
      <div class="cmt-box">
        <textarea id="cmtIn" placeholder="${t("comments.placeholder")}" maxlength="5000" aria-label="${t("comments.write")}"></textarea>
        <div class="r"><button class="btn btn-primary btn-sm" id="cmtSend" disabled>${t("comments.send")}</button>
          <span class="k">${t("comments.hint", { mod: MOD })}</span></div>
        <div class="cmt-err hidden" id="cmtErr"></div>
      </div>
    </section>`;

  openModal(`<div class="modal wide detail">
    <div class="detail-head">
      <span class="dkey" title="${t("cardKey.title")}">${cardKey(card.id)}</span>
      <span class="dcol">${esc(col.name)}</span>
      <div class="key-menu"><button type="button" class="key-btn" id="keyBtn" aria-haspopup="menu" aria-expanded="false"
        title="${t("cardKey.copyLabel")}">${I.copy}${t("cardKey.copy")}${I.chevron}</button></div>
    </div>
    <input class="detail-title" id="dt" value="${esc(card.title)}" ${ro}>

    <div class="fld lbl-fld" id="lblFld" data-card-id="${card.id}">
      <div class="fld-l" id="lblFldL">${t("labels.title")}</div><div class="lbl-row" id="lblRow"></div></div>

    <div class="fld"><label for="dd">${t("detail.description")}</label>
      <textarea id="dd" placeholder="${t("detail.descriptionPh")}" ${ro}>${esc(card.description || "")}</textarea></div>

    <div class="fld"><div class="row2">
      <div><label for="da">${t("detail.assignee")}</label><select id="da" ${ro}>${options}</select></div>
      <div><label for="du">${t("detail.due")}</label><input type="date" id="du" value="${esc(card.dueDate || "")}" ${ro}></div>
    </div></div>

    <div class="meta">
      <div><div class="k">${t("detail.column")}</div><div class="v">${esc(col.name)}</div></div>
      <div><div class="k">${t("detail.position")}</div><div class="v">${pos} / ${col.cards.length}</div></div>
      <div><div class="k">${t("detail.version")}</div><div class="v">v${card.version}</div></div>
    </div>
    <div class="acts">
      ${canEdit() ? `<button class="btn btn-primary" id="save">${t("common.save")}</button>` : ""}
      <button class="btn btn-ghost" id="close">${t("common.close")}</button>
      <div class="spacer"></div>
      ${canEdit() ? `<button class="btn" id="del" style="background:none;color:var(--err)">${t("detail.deleteCard")}</button>` : ""}
    </div>${checklists}${comments}</div>`, (o) => {
    o.querySelector("#close").onclick = closeModal;
    S.ck = { cardId: card.id, boardId: S.board.id, lists: [], status: "loading", ui: new Map(), sortables: [], dragging: false };
    renderDetailLabels();
    if (checklists) mountChecklists();
    mountKeyMenu(o, card);
    if (comments) mountComments(o, card, toComments);
    o.querySelector("#save")?.addEventListener("click", () => {
      const title = o.querySelector("#dt").value.trim();
      if (!title) return toast(t("detail.titleRequired"), "", "err");

      const assigneeRaw = o.querySelector("#da").value;
      const next = {
        title,
        description: o.querySelector("#dd").value.trim() || null,
        assigneeId: assigneeRaw ? Number(assigneeRaw) : null,
        dueDate: o.querySelector("#du").value || null,
      };

      // Hiçbir şey değişmediyse operasyon gönderme: boş bir düzenleme kaydı
      // hem sürümü artırır hem hareket listesini kirletir.
      const same = next.title === card.title
        && (next.description || null) === (card.description || null)
        && (next.assigneeId || null) === (card.assigneeId || null)
        && (next.dueDate || null) === (card.dueDate || null);
      if (same) return closeModal();

      // EDIT_CARD alanların TAMAMINI taşır (bkz. EditCardOp): gönderilmeyen alan
      // temizlenir, baseVersion da araya başkasının girmediğini garanti eder.
      sendOp({ type: "EDIT_CARD", cardId: card.id, ...next, baseVersion: card.version });
      Object.assign(card, next); renderColumns();
      closeModal();
    });
    o.querySelector("#del")?.addEventListener("click", () => {
      sendOp({ type: "DELETE_CARD", cardId: card.id }); removeCardLocal(card.id); closeModal();
    });
  });
}

/**
 * Kart penceresindeki "Kopyala" menüsü: anahtar, dal adı, paylaşılabilir bağlantı.
 * Her satır kopyalanacak metni de gösterir; dal adı kartın o anki başlığından kurulur.
 * Klavye: Enter ya da ↓ açar, oklar gezer, Esc yalnızca menüyü kapatır (pencereyi değil).
 */
function mountKeyMenu(o, card) {
  const btn = o.querySelector("#keyBtn"), host = btn.parentElement;
  const items = [
    { icon: I.hash, label: t("cardKey.copyKey"), value: () => cardKey(card.id), done: "cardKey.keyCopied" },
    { icon: I.branch, label: t("cardKey.copyBranch"), value: () => branchName(card), done: "cardKey.branchCopied" },
    { icon: I.link, label: t("cardKey.copyLink"), value: () => cardLink(card.id), done: "cardKey.linkCopied" },
  ];
  let pop = null;
  function onAway(e) { if (!host.contains(e.target)) close(false); }
  function close(refocus) {
    if (!pop) return;
    pop.remove(); pop = null;
    btn.setAttribute("aria-expanded", "false");
    document.removeEventListener("mousedown", onAway, true);
    if (refocus) btn.focus();
  }
  function open() {
    pop = document.createElement("div");
    pop.className = "key-pop";
    pop.setAttribute("role", "menu");
    pop.setAttribute("aria-label", t("cardKey.copyLabel"));
    pop.innerHTML = items.map((it, i) => `<button type="button" role="menuitem" tabindex="-1" data-i="${i}">${it.icon}
      <span class="tx"><b>${it.label}</b><code>${esc(it.value())}</code></span></button>`).join("");
    host.appendChild(pop);
    btn.setAttribute("aria-expanded", "true");
    const rows = [...pop.querySelectorAll("[data-i]")];
    const go = (i) => rows[(i + rows.length) % rows.length].focus();
    go(0);
    pop.addEventListener("keydown", (e) => {
      const i = rows.indexOf(document.activeElement);
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(true); }
      else if (e.key === "ArrowDown") { e.preventDefault(); go(i + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); go(i - 1); }
      else if (e.key === "Home") { e.preventDefault(); go(0); }
      else if (e.key === "End") { e.preventDefault(); go(rows.length - 1); }
      else if (e.key === "Tab") close(false);
    });
    pop.addEventListener("click", (e) => {
      const row = e.target.closest("[data-i]"); if (!row) return;
      const it = items[Number(row.dataset.i)];
      close(true);
      copyAndConfirm(it.value(), it.done);
    });
    setTimeout(() => document.addEventListener("mousedown", onAway, true), 0);
  }
  btn.addEventListener("click", () => (pop ? close(true) : open()));
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowDown" && !pop) { e.preventDefault(); open(); } });
}

/* ── Kart yorumları ──
 * Liste açılışta REST'ten bir kez gelir, sonra pano kanalındaki COMMENT_* olaylarıyla
 * güncellenir (ADR 0019). Güncellemeler tek tek yapılır, liste baştan çizilmez:
 * başkasının yeni yorumu, yazılmakta olan yorumu ya da açık bir düzenlemeyi silmesin. */

/** Açık kart penceresinin yorum durumu. Pencere kapanınca (closeModal) null olur. */
function mountComments(o, card, toComments) {
  const d = S.detail = {
    boardId: S.board.id, cardId: card.id, comments: [], status: "loading", queued: [],
    picked: new Map(),   // @ listesinden seçilen kişiler: id → ad
    editing: null,       // düzenlenmekte olan yorumun id'si
    sending: false,
  };
  const input = o.querySelector("#cmtIn"), send = o.querySelector("#cmtSend");
  input.value = S.commentDrafts.get(card.id) || "";
  send.disabled = !input.value.trim();
  attachMentions(input, d.picked);
  input.addEventListener("input", () => {
    if (input.value) S.commentDrafts.set(card.id, input.value); else S.commentDrafts.delete(card.id);
    send.disabled = d.sending || !input.value.trim();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitComment(); }
  });
  send.onclick = submitComment;

  renderComments();
  loadComments(toComments);
  // "2 dk önce" pencere açık kaldıkça eskimesin.
  const timer = setInterval(() => {
    if (S.detail !== d) return clearInterval(timer);
    document.querySelectorAll("#cmtList time[datetime]").forEach((t) => { t.textContent = relTime(t.getAttribute("datetime")); });
  }, 30000);
}

async function loadComments(scroll = false) {
  const d = S.detail; if (!d) return;
  d.status = "loading"; renderComments();
  try {
    const list = await api.comments(d.boardId, d.cardId);
    if (S.detail !== d) return;
    d.comments = list; d.status = "ready";
    setCardCommentCount(d.cardId, list.length);
  } catch (e) {
    if (S.detail !== d) return;
    d.status = e.status === 404 ? "gone" : "error";
  }
  renderComments();
  // Yüklenirken gelen olaylar şimdi uygulanır; aynı yorum iki kez eklenmez (id ile).
  const queued = d.queued; d.queued = [];
  queued.forEach(applyCommentEvent);
  if (scroll) $("cmts")?.scrollIntoView({ block: "start" });
}

/** Listenin tamamı: yalnızca açılışta ve durum değişince (yükleniyor, hata, boş). */
function renderComments() {
  const d = S.detail, box = $("cmtList"); if (!d || !box) return;
  updateCommentHeader();
  if (d.status === "loading") { box.innerHTML = `<div class="cmt-note">${t("comments.loading")}</div>`; return; }
  if (d.status === "gone") { box.innerHTML = `<div class="cmt-note">${t("comments.cardDeleted")}</div>`; $("cmtIn")?.closest(".cmt-box")?.remove(); return; }
  if (d.status === "error") {
    box.innerHTML = `<div class="cmt-note">${t("comments.loadFailed")} <a id="cmtRetry">${t("common.retry")}</a></div>`;
    box.querySelector("#cmtRetry").onclick = () => loadComments();
    return;
  }
  if (!d.comments.length) { box.innerHTML = `<div class="cmt-note">${t("comments.empty")}</div>`; return; }
  box.innerHTML = "";
  d.comments.forEach((c) => box.appendChild(commentEl(c)));
}

function updateCommentHeader() {
  const d = S.detail, el = $("cmtCount"); if (!d || !el) return;
  el.textContent = d.status === "ready" && d.comments.length ? d.comments.length : "";
}

function commentEl(c, fresh = false) {
  const el = document.createElement("div");
  el.className = "cmt" + (fresh ? " fresh" : "");
  el.dataset.cid = c.id;
  fillComment(el, c);
  return el;
}

const exactTime = (v) => fmtDate(v, { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });

/** Bir yorumun görünümü. Düzenleme yalnızca yazana, silme yazana ve pano yöneticisine. */
function fillComment(el, c) {
  const name = c.author?.name || t("common.deletedUser");
  const mine = !!c.author && c.author.id === S.me?.id;
  const canDelete = mine || isOwner();
  el.innerHTML = `${avatar(name, 28, "", c.author?.avatarUrl)}
    <div class="main">
      <div class="hd"><b>${esc(name)}</b><time datetime="${esc(c.createdAt)}" title="${esc(exactTime(c.createdAt))}">${relTime(c.createdAt)}</time>
        ${c.editedAt ? `<span class="ed" title="${esc(exactTime(c.editedAt))}">${t("comments.edited")}</span>` : ""}</div>
      <div class="tx">${richText(c.body, c.mentions)}</div>
      ${mine || canDelete ? `<div class="cmt-acts">${mine ? `<button data-a="edit">${t("comments.edit")}</button>` : ""}${canDelete ? `<button data-a="del">${t("common.delete")}</button>` : ""}</div>` : ""}
    </div>`;
  el.querySelector('[data-a="edit"]')?.addEventListener("click", () => startEditComment(el, c.id));
  el.querySelector('[data-a="del"]')?.addEventListener("click", () => confirmDeleteComment(el, c.id));
}

const commentById = (id) => S.detail?.comments.find((c) => c.id === id) || null;

/** Silme onayı pencere açmadan, yorumun kendi satırında sorulur. */
function confirmDeleteComment(el, id) {
  const acts = el.querySelector(".cmt-acts"); if (!acts) return;
  acts.innerHTML = `<span class="q">${t("comments.confirmDelete")}</span><button class="danger" data-a="yes">${t("common.delete")}</button><button data-a="no">${t("common.cancel")}</button>`;
  acts.querySelector('[data-a="no"]').onclick = () => { const c = commentById(id); if (c) fillComment(el, c); };
  acts.querySelector('[data-a="yes"]').onclick = async (e) => {
    e.currentTarget.disabled = true;
    const d = S.detail; if (!d) return;
    try {
      await api.deleteComment(d.boardId, d.cardId, id);
      applyCommentEvent({ type: "COMMENT_DELETED", cardId: d.cardId, commentId: id });
    } catch (err) {
      toast(t("comments.deleteFailed"), err.message, "err");
      const c = commentById(id); if (c) fillComment(el, c);
    }
  };
}

/** Yorumu yerinde düzenleme: metin kutusu yorumun yerine geçer. */
function startEditComment(el, id) {
  const d = S.detail, c = commentById(id); if (!d || !c) return;
  d.editing = id;
  const picked = new Map((c.mentions || []).map((m) => [m.id, m.name]));
  const box = document.createElement("div");
  box.className = "cmt-box";
  box.innerHTML = `<textarea maxlength="5000" aria-label="${t("comments.editLabel")}"></textarea>
    <div class="r"><button class="btn btn-primary btn-sm" data-a="save">${t("common.save")}</button>
      <button class="btn-ghost btn-sm" data-a="cancel">${t("common.cancel")}</button><span class="k">${t("comments.saveHint", { mod: MOD })}</span></div>
    <div class="cmt-err hidden"></div>`;
  el.querySelector(".tx").replaceWith(box);
  el.querySelector(".cmt-acts")?.remove();
  const ta = box.querySelector("textarea"), err = box.querySelector(".cmt-err"), saveBtn = box.querySelector('[data-a="save"]');
  ta.value = c.body;
  attachMentions(ta, picked);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);

  const cancel = () => { d.editing = null; const now = commentById(id); if (now) fillComment(el, now); };
  const save = async () => {
    const body = ta.value.trim();
    if (!body) { err.textContent = t("comments.required"); err.classList.remove("hidden"); return; }
    saveBtn.disabled = true;
    try {
      const updated = await api.editComment(d.boardId, d.cardId, id, body, mentionIds(body, picked));
      d.editing = null;
      applyCommentEvent({ type: "COMMENT_EDITED", cardId: d.cardId, comment: updated });
      fillComment(el, updated);
    } catch (e) {
      saveBtn.disabled = false;
      err.textContent = e.message || t("comments.saveFailed"); err.classList.remove("hidden");
    }
  };
  saveBtn.onclick = save;
  box.querySelector('[data-a="cancel"]').onclick = cancel;
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
    // Esc düzenlemeyi bırakır, pencereyi kapatmaz.
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancel(); }
  });
}

async function submitComment() {
  const d = S.detail, input = $("cmtIn"), send = $("cmtSend"), err = $("cmtErr");
  if (!d || !input || d.sending) return;
  const body = input.value.trim(); if (!body) return;
  d.sending = true; send.disabled = true; err.classList.add("hidden");
  const cardId = d.cardId;
  try {
    const c = await api.addComment(d.boardId, cardId, body, mentionIds(body, d.picked));
    S.commentDrafts.delete(cardId);
    if (S.detail !== d) return;
    input.value = ""; d.picked.clear();
    applyCommentEvent({ type: "COMMENT_ADDED", cardId, comment: c, mine: true });
  } catch (e) {
    if (S.detail !== d) return;
    err.textContent = e.message || t("comments.sendFailed"); err.classList.remove("hidden");
  } finally {
    d.sending = false;
    if (S.detail === d) send.disabled = !input.value.trim();
  }
}

/**
 * Yorum olayı: pano kanalından (başkasının yorumu) ya da kendi isteğimizin yanıtından.
 * Karttaki sayı her durumda güncellenir; açık pencere o kartınsa liste de.
 */
function applyCommentEvent(ev) {
  if (ev.commentCount != null) setCardCommentCount(ev.cardId, ev.commentCount);
  const d = S.detail, box = $("cmtList");
  if (!d || d.cardId !== ev.cardId || !box) return;
  if (d.status === "loading") { d.queued.push(ev); return; }
  if (d.status !== "ready") return;

  const id = ev.comment?.id ?? ev.commentId;
  const i = d.comments.findIndex((c) => c.id === id);
  if (ev.type === "COMMENT_ADDED") {
    if (i >= 0) return;   // kendi yorumumuz: yanıtla zaten eklendi
    // Sıra id'ye göre: yanıtımız başkasının olayından sonra gelse de yerine oturur.
    const at = d.comments.findIndex((c) => c.id > id);
    if (!d.comments.length) box.innerHTML = "";
    const el = commentEl(ev.comment, true);
    if (at < 0) { d.comments.push(ev.comment); box.appendChild(el); }
    else { d.comments.splice(at, 0, ev.comment); box.querySelector(`[data-cid="${d.comments[at + 1].id}"]`)?.before(el); }
    if (ev.mine) el.scrollIntoView({ block: "nearest" });
  } else if (ev.type === "COMMENT_EDITED") {
    if (i < 0) return;
    d.comments[i] = ev.comment;
    // Açık düzenleme varsa bozulmasın; Vazgeç denince yeni hâli görünür.
    if (d.editing !== id) { const el = box.querySelector(`[data-cid="${id}"]`); if (el) fillComment(el, ev.comment); }
  } else if (ev.type === "COMMENT_DELETED") {
    if (i < 0) return;
    d.comments.splice(i, 1);
    if (d.editing === id) d.editing = null;
    box.querySelector(`[data-cid="${id}"]`)?.remove();
    if (!d.comments.length) renderComments();
  }
  if (ev.commentCount == null) setCardCommentCount(d.cardId, d.comments.length);
  updateCommentHeader();
}

/** Karttaki yorum sayısı: yalnızca o kartın göstergeleri yenilenir, pano baştan çizilmez. */
function setCardCommentCount(cardId, n) {
  if (!S.board || S.history.active) return;   // geçmiş görünümünde kartlar o anki hâliyle
  for (const col of S.board.columns) {
    const card = col.cards.find((k) => k.id === cardId);
    if (!card) continue;
    if (card.commentCount === n) return;
    card.commentCount = n;
    const el = document.querySelector(`.card[data-card-id="${cardId}"]`);
    if (el) { el.querySelector(".cmeta")?.remove(); el.querySelector(".t")?.insertAdjacentHTML("afterend", cardMeta(card)); }
    return;
  }
}

/**
 * Metindeki "@Ad Soyad" geçişleri. Her @'te en uzun eşleşen ad alınır: "Ali" ile
 * "Ali Veli" ikisi de üyeyse "@Ali Veli" ikincisidir. Önü harf olan @ (e-posta
 * adresi) ve arkası harfle süren ad sayılmaz.
 */
function scanMentions(text, people) {
  const sorted = people.filter((p) => p.name).sort((a, b) => b.name.length - a.name.length);
  const out = [];
  for (let i = text.indexOf("@"); i >= 0; i = text.indexOf("@", i + 1)) {
    if (i > 0 && /[\p{L}\p{N}_.]/u.test(text[i - 1])) continue;
    const p = sorted.find((x) => text.startsWith(x.name, i + 1) && !/[\p{L}\p{N}]/u.test(text[i + 1 + x.name.length] || ""));
    if (p) { out.push({ start: i, end: i + 1 + p.name.length, person: p }); i += p.name.length; }
  }
  return out;
}

/**
 * Gönderilecek anılanlar: metinde hâlâ duran "@Ad Soyad"lar. Listeden seçilen
 * kişi id'siyle gelir; elle yazılan ad da sayılır, ama aynı adlı iki üye varsa
 * yalnızca listeden seçilen (hangisi olduğu ancak öyle bilinir).
 */
function mentionIds(body, picked) {
  const people = [...picked].map(([id, name]) => ({ id, name }));
  const count = new Map();
  S.members.forEach((m) => count.set(memberName(m), (count.get(memberName(m)) || 0) + 1));
  S.members.forEach((m) => {
    const name = memberName(m);
    if (count.get(name) === 1 && m.id !== S.me?.id && !picked.has(m.id)) people.push({ id: m.id, name });
  });
  return [...new Set(scanMentions(body, people).map((x) => x.person.id))].slice(0, 20);
}

/**
 * Yorum metni: kaçışlanır, satır sonları korunur (CSS), bağlantılar tıklanır,
 * anılanlar vurgulanır. Bağlantı yalnızca http(s) olabilir; sondaki noktalama
 * bağlantıya katılmaz.
 */
function richText(body, mentions = []) {
  const marks = scanMentions(body, mentions).map((m) => ({ ...m, kind: "m" }));
  for (const u of body.matchAll(/https?:\/\/[^\s<>"']+/gi)) {
    let url = u[0].replace(/[.,;:!?]+$/, "");
    if (url.endsWith(")") && !url.includes("(")) url = url.slice(0, -1).replace(/[.,;:!?]+$/, "");
    marks.push({ start: u.index, end: u.index + url.length, kind: "u", url });
  }
  marks.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const m of marks) {
    if (m.start < pos) continue;   // bağlantının içindeki @ ayrıca işlenmez
    out += esc(body.slice(pos, m.start));
    const piece = esc(body.slice(m.start, m.end));
    out += m.kind === "u"
      ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${piece}</a>`
      : `<span class="mention${m.person.id === S.me?.id ? " me" : ""}">${piece}</span>`;
    pos = m.end;
  }
  return out + esc(body.slice(pos));
}

/**
 * Yazma kutusuna @ ile kişi seçme. "@" yazınca panonun üyeleri açılır, yazdıkça
 * süzülür; ↑/↓ gezer, Enter ya da Tab seçer, Esc kapatır. Seçilen kişi "@Ad Soyad"
 * olarak yazılır ve id'si picked'e eklenir.
 */
function attachMentions(ta, picked) {
  const host = ta.parentElement;
  let pop = null, items = [], idx = 0, at = -1, lastQ = null;
  const close = () => { pop?.remove(); pop = null; items = []; at = -1; lastQ = null; };

  // İmlecin hemen solundaki "@..." parçası; yoksa null.
  const current = () => {
    const pos = ta.selectionStart;
    if (pos !== ta.selectionEnd) return null;
    const before = ta.value.slice(0, pos);
    const i = before.lastIndexOf("@");
    if (i < 0 || (i > 0 && /[\p{L}\p{N}_.]/u.test(before[i - 1]))) return null;
    const q = before.slice(i + 1);
    if (q.length > 40 || /[\n@]/.test(q)) return null;
    return { i, q };
  };

  const update = () => {
    const m = current(); if (!m) return close();
    const q = fold(m.q);
    const list = S.members.filter((x) => x.id !== S.me?.id).filter((x) => {
      const n = fold(memberName(x));
      return !q || n.startsWith(q) || n.includes(" " + q);
    }).slice(0, 8);
    if (!list.length) return close();
    if (q !== lastQ) idx = 0;
    at = m.i; items = list; lastQ = q;
    render();
  };

  const render = () => {
    if (!pop) {
      pop = document.createElement("div");
      pop.className = "mention-pop"; pop.setAttribute("role", "listbox"); pop.setAttribute("aria-label", t("comments.mentionList"));
      // mousedown: tıklama kutudan odağı almasın, seçim yapılsın.
      pop.addEventListener("mousedown", (e) => { e.preventDefault(); const b = e.target.closest("[data-i]"); if (b) pick(Number(b.dataset.i)); });
      host.appendChild(pop);
    }
    pop.innerHTML = items.map((m, i) => `<button type="button" role="option" data-i="${i}" class="${i === idx ? "on" : ""}" aria-selected="${i === idx}">
      ${avatar(memberName(m), 22, "", m.avatarUrl)}<span class="nm">${esc(memberName(m))}</span></button>`).join("");
    pop.querySelector(".on")?.scrollIntoView({ block: "nearest" });
  };

  const pick = (i) => {
    const m = items[i]; if (!m) return;
    const name = memberName(m);
    ta.setRangeText("@" + name + " ", at, ta.selectionStart, "end");
    picked.set(m.id, name);
    close();
    ta.focus();
    ta.dispatchEvent(new Event("input"));   // taslak ve Gönder düğmesi güncellensin
  };

  ta.addEventListener("keydown", (e) => {
    if (!pop) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      idx = (idx + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      render();
    } else if ((e.key === "Enter" || e.key === "Tab") && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey) {
      e.preventDefault(); e.stopImmediatePropagation(); pick(idx);
    } else if (e.key === "Escape") {
      // Yalnızca liste kapanır; kart penceresi ve düzenleme açık kalır.
      e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation(); close();
    }
  });
  ta.addEventListener("input", update);
  ta.addEventListener("click", update);
  ta.addEventListener("keyup", (e) => { if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) update(); });
  ta.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== ta) close(); }, 150));
}

/* ══════════════════ Etiketler (ADR 0022) ══════════════════
 * Panonun etiket takımı panonun fotoğrafında gelir (S.board.labels); kart yalnızca
 * id'lerini taşır (card.labelIds). Değişiklik REST'ten gider, diğer ekranlara pano
 * kanalındaki LABEL_* / CARD_LABEL_* olaylarıyla yansır. Kartın sürümüne dokunulmaz. */

/** Palet: sunucudaki LabelColor ile aynı sıra. Renk kodları CSS'te (.lb-*). */
const LABEL_COLORS = ["GREEN", "YELLOW", "ORANGE", "RED", "PINK", "PURPLE", "BLUE", "SKY"];

/** Etiket ve kontrol listesi ikonları. */
const IK = {
  checkSq: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.4"/><path d="M5 8.2l2 2L11 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  tag: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 8.4V3.2a.7.7 0 01.7-.7h5.2l5.1 5.1a1 1 0 010 1.4l-4.3 4.3a1 1 0 01-1.4 0L2.5 8.4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="5.6" cy="5.6" r="1.1" fill="currentColor"/></svg>`,
  grip: `<svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><circle cx="4" cy="3" r="1.2"/><circle cx="8" cy="3" r="1.2"/><circle cx="4" cy="7" r="1.2"/><circle cx="8" cy="7" r="1.2"/><circle cx="4" cy="11" r="1.2"/><circle cx="8" cy="11" r="1.2"/></svg>`,
  up: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 10l4-4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  down: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

const labelById = (id) => S.board?.labels?.find((l) => l.id === id) || null;
const colorName = (c) => (has("labels.colors." + c) ? t("labels.colors." + c) : c);
/** Cümle içindeki renk: "yeşil", "sky blue". */
const colorWord = (c) => colorName(c).toLocaleLowerCase(locale());
/** Etiketin okunur adı; adsızsa rengi ("Yeşil etiket"). İpucu ve ekran okuyucu için. */
const labelText = (l) => l.name || t("labels.unnamed", { color: colorName(l.color) });
const cardLabelList = (card) => (card.labelIds || []).map(labelById).filter(Boolean);

/** Panodaki kart ve kolonu, id ile. */
function cardById(cardId) {
  for (const col of S.board?.columns || []) {
    const card = col.cards.find((k) => k.id === cardId);
    if (card) return { card, col };
  }
  return null;
}

/** Etiket çipi. Adsız etiket yalnızca renktir; adı ipucunda ve ekran okuyucuda. */
function labelChip(l) {
  const text = esc(labelText(l));
  return l.name
    ? `<span class="lb lb-${l.color}" title="${text}">${esc(l.name)}</span>`
    : `<span class="lb lb-${l.color} blank" title="${text}" role="img" aria-label="${text}"></span>`;
}

/** Kartın yüzündeki etiketler: adlı olan küçük çip, adsız olan kısa çubuk. */
function cardLabels(card) {
  const list = cardLabelList(card);
  return list.length ? `<div class="lbls">${list.map(labelChip).join("")}</div>` : "";
}

/** Kartın kontrol listelerinin toplamı (kartın üstündeki "3/5"). */
const checklistTotals = (card) => (card.checklists || [])
  .reduce((s, c) => ({ done: s.done + c.done, total: s.total + c.total }), { done: 0, total: 0 });

/** Tek kartı yeniden çizer; süzgeç açıksa kart görünürlüğü değişebileceği için bütün pano. */
function refreshCardFace(cardId) {
  if (!S.board) return;
  if (activeFilter()) return renderColumns();
  const hit = cardById(cardId), el = document.querySelector(`.card[data-card-id="${cardId}"]`);
  if (!hit || !el) return;
  el.replaceWith(cardEl(hit.card, hit.col));
  refreshRemoteDrags();
}

/** Yalnızca kartın alt satırı (yorum sayısı, liste ilerlemesi...). */
function refreshCardMeta(cardId) {
  const hit = cardById(cardId), el = document.querySelector(`.card[data-card-id="${cardId}"]`);
  if (!hit || !el) return;
  el.querySelector(".cmeta")?.remove();
  el.querySelector(".t")?.insertAdjacentHTML("afterend", cardMeta(hit.card));
}

/** Kart penceresindeki etiket satırı: çipler ve (düzenleyebilene) ekleme düğmesi. */
function renderDetailLabels() {
  const fld = $("lblFld"), row = $("lblRow"); if (!fld || !row) return;
  const hit = cardById(Number(fld.dataset.cardId));
  const list = hit ? cardLabelList(hit.card) : [];
  const edit = canEdit() && !!hit;
  const focused = document.activeElement?.id === "lblAdd";
  fld.hidden = !edit && !list.length;   // izleyiciye boş başlık gösterme
  row.innerHTML = list.map(labelChip).join("") + (edit
    ? `<button type="button" class="lbl-add" id="lblAdd" aria-haspopup="dialog" aria-expanded="${LP?.mode === "card"}"
        aria-label="${t("labels.add")}" title="${t("labels.add")}">${I.plus}${list.length ? "" : `<span>${t("labels.add")}</span>`}</button>`
    : "");
  const add = $("lblAdd");
  add?.addEventListener("click", (e) => { e.stopPropagation(); toggleCardLabelPicker(); });
  if (focused) add?.focus();
}

/* ── Etiket seçici ──
 * Kart penceresinde (karta tak / çıkar) ve süzgeç çubuğunda (süz) aynı açılır kutu:
 * arama, onay kutuları, düzenleyebilene "yeni etiket" ve her etiketin yanında düzenle.
 * Yeni etiket ve düzenleme kutunun içinde açılır; kart penceresi kapanmaz. */
let LP = null;   // { el, mode: "card" | "filter", cardId, anchorId, q, view: "list" | "form", editId, name, color, confirm, busy, err }

function toggleCardLabelPicker() {
  if (LP?.mode === "card" && LP.el.isConnected) return closeLabelPop(true);
  closeLabelPop();
  const fld = $("lblFld"); if (!fld) return;
  const el = document.createElement("div");
  el.className = "lpop";
  fld.appendChild(el);
  openLabelPop(el, "card", Number(fld.dataset.cardId), "lblAdd");
  // Kart penceresinin içinde: dışarı tıklanınca kapanır (pencere açık kalır).
  const away = (e) => {
    if (!LP || LP.el !== el) return document.removeEventListener("mousedown", away, true);
    if (!el.contains(e.target) && !$("lblAdd")?.contains(e.target)) closeLabelPop();
  };
  setTimeout(() => document.addEventListener("mousedown", away, true), 0);
  LP.cleanup = () => document.removeEventListener("mousedown", away, true);
}

function toggleLabelFilter(anchor) {
  if (LP?.mode === "filter" && LP.el.isConnected) return closeLabelPop(true);
  closeLabelPop();
  const el = openPop(anchor, "lpop", "", "left");
  // Dar ekranda sağdan taşmasın.
  const r = el.getBoundingClientRect();
  if (r.right > innerWidth - 12) el.style.left = Math.max(12, innerWidth - 12 - r.width) + "px";
  openLabelPop(el, "filter", null, "flabels");
}

function openLabelPop(el, mode, cardId, anchorId) {
  LP = { el, mode, cardId, anchorId, q: "", view: "list", editId: null, name: "", color: LABEL_COLORS[0],
         confirm: false, busy: false, err: "" };
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", t(mode === "card" ? "labels.title" : "filter.labelTitle"));
  $(anchorId)?.setAttribute("aria-expanded", "true");
  el.addEventListener("keydown", onLabelPopKey);
  el.addEventListener("input", onLabelPopInput);
  el.addEventListener("change", onLabelPopChange);
  el.addEventListener("click", onLabelPopClick);
  renderLabelPop();
  el.querySelector("#lpQ")?.focus();
}

function closeLabelPop(refocus = false) {
  if (!LP) return;
  const { el, mode, anchorId } = LP;
  LP.cleanup?.();
  LP = null;
  if (mode === "filter") closePops(); else el.remove();
  const anchor = $(anchorId);
  anchor?.setAttribute("aria-expanded", "false");
  if (refocus) anchor?.focus();
}

/** Kutu hâlâ ekranda mı? (Pencere kapandıysa ya da başka bir menü açıldıysa değil.) */
const labelPopAlive = () => {
  if (LP && !LP.el.isConnected) { LP.cleanup?.(); $(LP.anchorId)?.setAttribute("aria-expanded", "false"); LP = null; }
  return !!LP;
};

function renderLabelPop() {
  if (!labelPopAlive()) return;
  if (LP.view === "form") return renderLabelForm();
  LP.el.innerHTML = `<input class="field" id="lpQ" type="search" placeholder="${t("labels.search")}" aria-label="${t("labels.searchLabel")}"
      autocomplete="off" spellcheck="false" value="${esc(LP.q)}">
    <div class="lpop-list" id="lpList"></div>
    ${canEdit() ? `<div class="lpop-sep"></div><button type="button" class="lpop-act" id="lpNew"></button>` : ""}`;
  renderLabelList();
}

/** Listenin kendisi: aramada yazılanı bozmadan yeniden çizilir, odak yerinde kalır. */
function renderLabelList() {
  if (!labelPopAlive() || LP.view !== "list") return;
  const box = LP.el.querySelector("#lpList"); if (!box) return;
  const focusKey = LP.el.contains(document.activeElement) ? document.activeElement.dataset.key : null;
  const raw = LP.q.trim(), q = fold(raw);
  const labels = S.board?.labels || [];
  const shown = labels.filter((l) => !q || fold(labelText(l)).includes(q));
  const edit = canEdit();
  let checked;
  if (LP.mode === "card") {
    const hit = cardById(LP.cardId);
    if (!hit) return closeLabelPop();
    checked = new Set(hit.card.labelIds || []);
  } else {
    checked = new Set(S.filter.labels || []);
  }

  const rows = shown.map((l) => `<div class="lpop-row">
      <label><input type="checkbox" data-id="${l.id}" data-key="c${l.id}" ${checked.has(l.id) ? "checked" : ""}
        ${LP.mode === "card" && !edit ? "disabled" : ""} ${l.name ? "" : `aria-label="${esc(labelText(l))}"`}>${labelChip(l)}</label>
      ${edit ? `<button type="button" class="icon-btn" data-edit="${l.id}" data-key="e${l.id}"
          aria-label="${esc(t("labels.edit", { name: labelText(l) }))}" title="${esc(t("labels.edit", { name: labelText(l) }))}">${I.pencil}</button>` : ""}
    </div>`);
  // Süzgeçte: hiç etiketi olmayan kartlar.
  if (LP.mode === "filter" && (!q || fold(t("filter.noLabel")).includes(q))) {
    rows.push(`<div class="lpop-row"><label><input type="checkbox" data-id="none" data-key="cnone" ${checked.has("none") ? "checked" : ""}>
      <span class="lpop-plain">${t("filter.noLabel")}</span></label></div>`);
  }
  box.innerHTML = rows.join("") || `<div class="lpop-note">${t(labels.length ? "labels.noMatch" : "labels.empty")}</div>`;

  const exact = raw && labels.some((l) => l.name && fold(l.name) === q);
  const add = LP.el.querySelector("#lpNew");
  if (add) add.innerHTML = `${I.plus} <span>${raw && !exact ? esc(t("labels.createNamed", { name: raw })) : t("labels.new")}</span>`;
  if (focusKey) LP.el.querySelector(`[data-key="${focusKey}"]`)?.focus();
}

/** Yeni etiket ya da düzenleme: ad, sekiz renk, önizleme; düzenlemede silme (onaylı). */
function renderLabelForm() {
  const editing = LP.editId != null ? labelById(LP.editId) : null;
  if (LP.editId != null && !editing) { LP.view = "list"; return renderLabelPop(); }   // bu arada biri sildi
  const uses = editing ? (S.board?.columns || []).reduce((n, c) => n + c.cards.filter((k) => (k.labelIds || []).includes(editing.id)).length, 0) : 0;
  LP.el.innerHTML = `
    <div class="lpop-h"><button type="button" class="icon-btn" id="lpBack" aria-label="${t("labels.back")}" title="${t("labels.back")}">${I.back}</button>
      <span>${t(editing ? "labels.editTitle" : "labels.new")}</span></div>
    <div class="lpop-prev" id="lpPrev" aria-hidden="true">${labelChip({ name: LP.name.trim() || null, color: LP.color })}</div>
    <label class="label" for="lpName">${t("labels.name")}</label>
    <input class="field" id="lpName" maxlength="40" placeholder="${t("labels.namePh")}" value="${esc(LP.name)}" autocomplete="off">
    <fieldset><legend class="label">${t("labels.color")}</legend>
      <div class="sw-grid">${LABEL_COLORS.map((c) => `<label class="sw lb-${c}" title="${esc(colorName(c))}">
        <input type="radio" name="lpColor" value="${c}" ${c === LP.color ? "checked" : ""} aria-label="${esc(colorName(c))}"><span>${IK.check}</span></label>`).join("")}</div>
    </fieldset>
    ${LP.err ? `<div class="lpop-err" role="alert">${esc(LP.err)}</div>` : ""}
    ${LP.confirm
      ? `<div class="lpop-q" role="alert"><b>${t("labels.confirmDelete")}</b> ${uses ? t("labels.confirmDeleteCards", { count: uses }) : t("labels.confirmDeleteNone")}
          <div class="lpop-acts"><button type="button" class="btn btn-danger btn-sm" id="lpDelYes" ${LP.busy ? "disabled" : ""}>${t("common.delete")}</button>
            <button type="button" class="btn-ghost btn-sm" id="lpDelNo">${t("common.cancel")}</button></div></div>`
      : `<div class="lpop-acts"><button type="button" class="btn btn-primary btn-sm" id="lpSave" ${LP.busy ? "disabled" : ""}>${t(editing ? "common.save" : "labels.create")}</button>
          <button type="button" class="btn-ghost btn-sm" id="lpCancel">${t("common.cancel")}</button><span class="spacer"></span>
          ${editing ? `<button type="button" class="btn btn-sm" id="lpDel" style="background:none;color:var(--err);padding:6px 4px">${t("common.delete")}</button>` : ""}</div>`}`;
}

function openLabelForm(label) {
  const used = new Set((S.board?.labels || []).map((l) => l.color));
  LP.view = "form"; LP.confirm = false; LP.err = ""; LP.busy = false;
  LP.editId = label ? label.id : null;
  LP.name = label ? label.name || "" : LP.q.trim();
  LP.color = label ? label.color : LABEL_COLORS.find((c) => !used.has(c)) || LABEL_COLORS[0];
  renderLabelPop();
  const name = LP.el.querySelector("#lpName");
  name?.focus(); name?.setSelectionRange(name.value.length, name.value.length);
}

function backToLabelList() {
  LP.view = "list"; LP.confirm = false; LP.err = "";
  renderLabelPop();
  LP.el.querySelector("#lpQ")?.focus();
}

function onLabelPopKey(e) {
  if (!LP) return;
  if (e.key === "Escape") {
    // Yalnızca kutu kapanır (ya da forma geri dönülür); kart penceresi açık kalır.
    e.preventDefault(); e.stopPropagation();
    if (LP.view === "form") return backToLabelList();
    return closeLabelPop(true);
  }
  if (e.key !== "Enter" || e.target.tagName !== "INPUT" || e.target.type === "checkbox") return;
  e.preventDefault();
  if (e.target.id === "lpName") return saveLabelForm();
  if (e.target.id === "lpQ") {
    // Tek eşleşme varsa onu işaretle; hiç eşleşen ad yoksa bu adla yeni etiket aç.
    const boxes = LP.el.querySelectorAll("#lpList input[type=checkbox]:not(:disabled)");
    if (boxes.length === 1) { boxes[0].click(); return; }
    if (LP.q.trim() && canEdit() && !(S.board?.labels || []).some((l) => l.name && fold(l.name) === fold(LP.q.trim()))) openLabelForm(null);
  }
}

function onLabelPopInput(e) {
  if (!LP) return;
  if (e.target.id === "lpQ") { LP.q = e.target.value; renderLabelList(); }
  if (e.target.id === "lpName") {
    LP.name = e.target.value;
    LP.el.querySelector("#lpPrev").innerHTML = labelChip({ name: LP.name.trim() || null, color: LP.color });
  }
}

function onLabelPopChange(e) {
  if (!LP) return;
  if (e.target.name === "lpColor") {
    LP.color = e.target.value;
    LP.el.querySelector("#lpPrev").innerHTML = labelChip({ name: LP.name.trim() || null, color: LP.color });
    return;
  }
  const raw = e.target.dataset.id; if (!raw) return;
  const id = raw === "none" ? "none" : Number(raw);
  if (LP.mode === "card") setCardLabel(LP.cardId, id, e.target.checked);
  else setLabelFilter(id, e.target.checked);
}

function onLabelPopClick(e) {
  if (!LP) return;
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.edit) return openLabelForm(labelById(Number(b.dataset.edit)));
  switch (b.id) {
    case "lpNew": return openLabelForm(null);
    case "lpBack": case "lpCancel": return backToLabelList();
    case "lpSave": return saveLabelForm();
    case "lpDel": LP.confirm = true; renderLabelPop(); return LP.el.querySelector("#lpDelYes")?.focus();
    case "lpDelNo": LP.confirm = false; renderLabelPop(); return LP.el.querySelector("#lpDel")?.focus();
    case "lpDelYes": return deleteLabelForm();
  }
}

async function saveLabelForm() {
  if (!LP || LP.busy) return;
  const pop = LP, id = pop.editId, name = pop.name.trim(), color = pop.color;
  pop.busy = true; pop.err = ""; renderLabelPop();
  try {
    const saved = id == null ? await api.createLabel(S.board.id, name, color) : await api.updateLabel(S.board.id, id, name, color);
    upsertLabel(saved);
    if (LP !== pop) return;
    // Kart penceresinden açılan yeni etiket o karta da takılır.
    if (id == null && pop.mode === "card") setCardLabel(pop.cardId, saved.id, true);
    pop.busy = false; pop.q = "";
    backToLabelList();
  } catch (e) {
    if (LP !== pop) return;
    pop.busy = false; pop.err = e.message || t("labels.saveFailed");
    renderLabelPop();
    LP.el.querySelector("#lpName")?.focus();
  }
}

async function deleteLabelForm() {
  if (!LP || LP.busy) return;
  const pop = LP, id = pop.editId;
  pop.busy = true; renderLabelPop();
  try {
    await api.deleteLabel(S.board.id, id);
    removeLabelLocal(id);
    if (LP === pop) { pop.busy = false; backToLabelList(); }
  } catch (e) {
    toast(t("labels.deleteFailed"), e.message, "err");
    if (LP === pop) { pop.busy = false; pop.confirm = false; renderLabelPop(); }
  }
}

/** Etiketi karta takar ya da çıkarır: ekranda hemen, sunucu reddederse geri alınır. */
async function setCardLabel(cardId, labelId, on) {
  const hit = cardById(cardId); if (!hit) return;
  const before = [...(hit.card.labelIds || [])];
  hit.card.labelIds = on ? [...new Set([...before, labelId])].sort((a, b) => a - b) : before.filter((id) => id !== labelId);
  cardLabelsChanged(cardId);
  try {
    if (on) await api.addCardLabel(S.board.id, cardId, labelId);
    else await api.removeCardLabel(S.board.id, cardId, labelId);
  } catch (e) {
    const now = cardById(cardId);
    if (now) { now.card.labelIds = before; cardLabelsChanged(cardId); }
    toast(t("labels.toggleFailed"), e.message, "err");
  }
}

function cardLabelsChanged(cardId) {
  refreshCardFace(cardId);
  if (Number($("lblFld")?.dataset.cardId) === cardId) renderDetailLabels();
  renderLabelList();
}

/** Süzgeç: seçilen etiketlerden herhangi biri kartta olmalı. */
function setLabelFilter(id, on) {
  const cur = new Set(S.filter.labels || []);
  if (on) cur.add(id); else cur.delete(id);
  S.filter.labels = [...cur];
  updateLabelFilterChip();
  renderColumns();
}

/** Süzgeç çubuğundaki "Etiket" düğmesi ve "Temizle"nin görünürlüğü (çubuğu baştan çizmeden). */
function updateLabelFilterChip() {
  const b = $("flabels"); if (!b) return;
  const n = (S.filter.labels || []).length;
  b.classList.toggle("on", n > 0);
  b.innerHTML = `${IK.tag}<span>${n ? t("filter.labelCount", { count: n }) : t("filter.label")}</span>${I.chevron}`;
  const clear = $("fclear");
  if (activeFilter() && !clear) {
    const c = document.createElement("button");
    c.className = "fchip"; c.id = "fclear"; c.textContent = t("filter.clear");
    c.onclick = () => { S.filter = { q: "", mine: false, overdue: false, assignee: "", labels: [] }; renderFilters(); renderColumns(); };
    b.after(c);
  } else if (!activeFilter() && clear) clear.remove();
}

/** Etiket eklendi ya da adı/rengi değişti (kendi isteğimizden ya da canlı olaydan). */
function upsertLabel(label) {
  if (!S.board) return;
  const list = (S.board.labels ||= []);
  const i = list.findIndex((l) => l.id === label.id);
  if (i >= 0) list[i] = label; else { list.push(label); list.sort((a, b) => a.id - b.id); }
  if (i >= 0) renderColumns();   // yeni etiket henüz hiçbir kartta yok
  renderDetailLabels();
  if (LP?.view === "list") renderLabelList();
}

/** Etiket silindi: panodan, bütün kartlardan ve süzgeçten kalkar. */
function removeLabelLocal(id) {
  if (!S.board) return;
  S.board.labels = (S.board.labels || []).filter((l) => l.id !== id);
  S.board.columns.forEach((c) => c.cards.forEach((k) => { if (k.labelIds?.includes(id)) k.labelIds = k.labelIds.filter((x) => x !== id); }));
  if (S.filter.labels?.includes(id)) S.filter.labels = S.filter.labels.filter((x) => x !== id);
  updateLabelFilterChip();
  renderColumns();
  renderDetailLabels();
  if (LP?.view === "list") renderLabelList();
  else if (LP?.editId === id) backToLabelList();
}

/** Canlı etiket olayı. Geçmişe bakarken pano o anı gösterir; bugüne dönünce zaten tazelenir. */
function applyLabelEvent(ev) {
  if (!S.board || S.history.active) return;
  if (ev.type === "LABEL_CREATED" || ev.type === "LABEL_UPDATED") return upsertLabel(ev.label);
  if (ev.type === "LABEL_DELETED") { removeLabelLocal(ev.labelId); loadActivity(); return; }
  const hit = cardById(ev.cardId); if (!hit) return;
  const own = new Set(hit.card.labelIds || []);
  if (ev.type === "CARD_LABEL_ADDED") own.add(ev.labelId); else own.delete(ev.labelId);
  hit.card.labelIds = [...own].sort((a, b) => a - b);
  cardLabelsChanged(ev.cardId);
  loadActivity();
}

/* ══════════════════ Kontrol listeleri (ADR 0022) ══════════════════
 * Kart penceresi açılınca listeler REST'ten bir kez gelir, sonra CHECKLIST_* olaylarıyla
 * güncellenir. Her olay ve her yanıt listenin TAMAMINI revision ile taşır: elimizdekinden
 * eski olan atılır, geç gelen bir yayın yeni hâli ezemez. İşaretleme, sıralama ve silme
 * ekranda hemen görünür; sunucu yanıtı (aynı ya da daha yeni hâl) üstüne yazılır.
 * Ekran durumdan çizilir; yazılmakta olan kutu ve odak yeniden çizimde korunur. */
const CK_DELETED = new Set();   // silinen listeler: geç gelen bir olay onları geri getirmesin
const CK_HIDE = new Set();      // "tamamlananları gizle" denen listeler (bu oturumda)

function mountChecklists() {
  const ck = S.ck, body = $("ckBody"); if (!ck || !body) return;
  Object.assign(ck, { queued: [], inflight: new Map(), unrendered: new Set(), newOpen: false, newTitle: "" });
  $("ckNew")?.addEventListener("click", () => {
    ck.newOpen = true; ck.newTitle = t("checklist.defaultName");
    renderChecklists();
    const input = body.querySelector('[data-k="new"]'); input?.focus(); input?.select();
  });
  body.addEventListener("click", onChecklistClick);
  body.addEventListener("change", onChecklistChange);
  body.addEventListener("input", onChecklistInput);
  body.addEventListener("keydown", onChecklistKey);
  renderChecklists();
  loadChecklists();
}

async function loadChecklists() {
  const ck = S.ck; if (!ck || !$("ckBody")) return;
  ck.status = ck.status === "ready" ? "refreshing" : "loading";
  try {
    const lists = await api.checklists(ck.boardId, ck.cardId);
    if (S.ck !== ck) return;
    // Yükleme sürerken kendi yanıtımızla daha yeni bir hâl gelmiş olabilir: revision'ı büyük olan kalır.
    // Yanıttan sonra eklenen liste (id'si daha büyük) de kalır.
    const prev = new Map(ck.lists.map((l) => [l.id, l]));
    const maxId = Math.max(0, ...lists.map((l) => l.id));
    ck.lists = lists.map((l) => (prev.get(l.id)?.revision > l.revision ? prev.get(l.id) : l))
      .concat(ck.lists.filter((l) => l.id > maxId))
      .filter((l) => !CK_DELETED.has(l.id));
    ck.status = "ready";
    ck.lists.forEach((l) => syncChecklistSummary(l));
  } catch (e) {
    if (S.ck !== ck) return;
    ck.status = e.status === 404 ? "gone" : "error";
  }
  renderChecklists();
  // Yüklenirken gelen olaylar şimdi; revision'ı eski olan zaten atılır.
  const queued = ck.queued; ck.queued = [];
  queued.forEach(applyChecklistEvent);
}

const ckUi = (id) => {
  const ck = S.ck;
  if (!ck.ui.has(id)) ck.ui.set(id, { adding: false, addText: "", editId: null, editText: "", renaming: false, title: "", confirm: false });
  return ck.ui.get(id);
};
const ckList = (id) => S.ck?.lists.find((l) => l.id === id) || null;

/** Odaktaki öğe (liste, data-k, imleç) yeniden çizimden sonra yerine konabilsin diye. */
function captureCkFocus() {
  const a = document.activeElement, body = $("ckBody");
  if (!a || !body?.contains(a) || !a.dataset.k) return null;
  return { list: a.closest(".ck")?.dataset.ck || null, k: a.dataset.k,
           sel: typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null };
}
function restoreCkFocus(f) {
  if (!f) return;
  const scope = f.list ? $("ckBody")?.querySelector(`.ck[data-ck="${f.list}"]`) : $("ckBody");
  let el = scope?.querySelector(`[data-k="${f.k}"]`);
  // Taşınan madde en üste ya da en alta vardıysa düğmesi kapanır: odak maddenin kutusuna geçer.
  if (el?.disabled) el = scope.querySelector(`[data-k="cb-${f.k.split("-")[1]}"]`);
  // İşaretlenen madde gizlendiyse odak listede kalsın.
  if (!el && f.list) el = scope?.querySelector('[data-k^="cb-"]') || scope?.querySelector('[data-k="add-btn"]');
  if (!el) return;
  el.focus({ preventScroll: true });
  if (f.sel && el.setSelectionRange) try { el.setSelectionRange(f.sel[0], f.sel[1]); } catch (_) {}
}

/** Bütün listeler (açılışta, liste eklenince/silinince). */
function renderChecklists() {
  const ck = S.ck, body = $("ckBody"), section = $("cks"); if (!ck || !body) return;
  const focus = captureCkFocus();
  ck.sortables.forEach((s) => { try { s.destroy(); } catch (_) {} });
  ck.sortables = [];
  // İzleyiciye boş bölüm gösterme.
  section.hidden = !canEdit() && ck.status === "ready" && !ck.lists.length;
  let html = "";
  if (ck.status === "loading" && !ck.lists.length) html = `<div class="ck-note">${t("checklist.loading")}</div>`;
  else if (ck.status === "error") html = `<div class="ck-note">${t("checklist.loadFailed")} <a href="#" data-a="retry" style="color:var(--acc-ink);font-weight:600">${t("common.retry")}</a></div>`;
  else if (ck.status === "gone") html = `<div class="ck-note">${t("comments.cardDeleted")}</div>`;
  else html = ck.lists.map(checklistHtml).join("");
  if (ck.newOpen && canEdit()) {
    html += `<div class="ck-form"><input class="field" data-k="new" maxlength="100" value="${esc(ck.newTitle)}" aria-label="${t("checklist.nameLabel")}">
      <div class="r"><button type="button" class="btn btn-primary btn-sm" data-a="new-save">${t("common.add")}</button>
        <button type="button" class="btn-ghost btn-sm" data-a="new-cancel">${t("common.cancel")}</button></div></div>`;
  }
  body.innerHTML = html;
  body.querySelectorAll(".ck").forEach(initChecklistSortable);
  restoreCkFocus(focus);
}

/** Tek liste: başka bir listede yazılan şeye dokunmadan. */
function renderChecklistBlock(id) {
  const ck = S.ck, list = ckList(id);
  const old = $("ckBody")?.querySelector(`.ck[data-ck="${id}"]`);
  if (!ck || !list || !old) return renderChecklists();
  const focus = captureCkFocus();
  if (old._sortable) { try { old._sortable.destroy(); } catch (_) {} ck.sortables = ck.sortables.filter((s) => s !== old._sortable); }
  const tpl = document.createElement("template");
  tpl.innerHTML = checklistHtml(list).trim();
  const block = tpl.content.firstElementChild;
  old.replaceWith(block);
  initChecklistSortable(block);
  restoreCkFocus(focus);
}

function checklistHtml(list) {
  const edit = canEdit(), ui = ckUi(list.id);
  const total = list.items.length, done = list.items.filter((i) => i.done).length;
  const all = total > 0 && done === total, pct = total ? Math.round((done * 100) / total) : 0;
  const hide = CK_HIDE.has(list.id) && done > 0;
  const visible = hide ? list.items.filter((i) => !i.done) : list.items;
  const titleId = `ckT${list.id}`;

  const head = ui.renaming
    ? `<div class="ck-form" style="flex:1"><input class="field" id="${titleId}" data-k="title" maxlength="100" value="${esc(ui.title)}" aria-label="${t("checklist.nameLabel")}">
        <div class="r"><button type="button" class="btn btn-primary btn-sm" data-a="rename-save">${t("common.save")}</button>
          <button type="button" class="btn-ghost btn-sm" data-a="rename-cancel">${t("common.cancel")}</button></div></div>`
    : `${edit ? `<button type="button" class="ck-title" id="${titleId}" data-k="title-btn" data-a="rename" title="${t("checklist.rename")}">${esc(list.title)}</button>`
              : `<span class="ck-title" id="${titleId}">${esc(list.title)}</span>`}
       <span class="ck-n${all ? " all" : ""}">${done}/${total}</span>
       ${done ? `<button type="button" class="ck-tog" data-k="hide" data-a="hide" aria-pressed="${hide}">${hide ? t("checklist.showDone", { count: done }) : t("checklist.hideDone")}</button>` : ""}
       ${edit ? `<button type="button" class="icon-btn" data-k="del-list" data-a="delete" aria-label="${t("checklist.delete")}" title="${t("checklist.delete")}">${I.trash}</button>` : ""}`;

  const confirm = ui.confirm ? `<div class="ck-q" role="alert"><span class="sp"><b>${esc(t("checklist.confirmDelete", { name: list.title }))}</b>
      ${total ? t("checklist.confirmDeleteItems", { count: total }) : t("checklist.confirmDeleteEmpty")}</span>
      <button type="button" class="btn btn-danger btn-sm" data-k="del-yes" data-a="delete-yes">${t("common.delete")}</button>
      <button type="button" class="btn-ghost btn-sm" data-k="del-no" data-a="delete-no">${t("common.cancel")}</button></div>` : "";

  const items = visible.map((it, i) => {
    const editing = ui.editId === it.id;
    const text = editing
      ? `<div class="ck-form"><input class="field" data-k="edit" maxlength="300" value="${esc(ui.editText)}" aria-label="${t("checklist.editItem")}">
          <div class="r"><button type="button" class="btn btn-primary btn-sm" data-a="edit-save">${t("common.save")}</button>
            <button type="button" class="btn-ghost btn-sm" data-a="edit-cancel">${t("common.cancel")}</button></div></div>`
      : edit ? `<button type="button" class="ck-tx" data-k="tx-${it.id}" data-a="edit" title="${t("checklist.editItem")}">${esc(it.text)}</button>`
             : `<span class="ck-tx">${esc(it.text)}</span>`;
    const acts = edit && !editing ? `<span class="ck-acts">
        <button type="button" class="icon-btn" data-k="up-${it.id}" data-a="up" aria-label="${t("checklist.moveUp")}" title="${t("checklist.moveUp")}" ${i === 0 ? "disabled" : ""}>${IK.up}</button>
        <button type="button" class="icon-btn" data-k="down-${it.id}" data-a="down" aria-label="${t("checklist.moveDown")}" title="${t("checklist.moveDown")}" ${i === visible.length - 1 ? "disabled" : ""}>${IK.down}</button>
        <button type="button" class="icon-btn danger" data-k="del-${it.id}" data-a="del-item" aria-label="${t("checklist.deleteItem")}" title="${t("checklist.deleteItem")}">${I.trash}</button></span>` : "";
    return `<li class="ck-it${it.done ? " done" : ""}" data-item="${it.id}">
      ${edit && !hide && !editing ? `<span class="ck-grip" title="${t("checklist.drag")}">${IK.grip}</span>` : ""}
      <input type="checkbox" data-k="cb-${it.id}" ${it.done ? "checked" : ""} ${edit ? "" : "disabled"} aria-label="${esc(it.text)}">
      ${text}${acts}</li>`;
  }).join("");

  const note = !total ? `<div class="ck-note">${t("checklist.empty")}</div>`
    : hide && !visible.length ? `<div class="ck-note">${t("checklist.allHidden")}</div>` : "";
  const add = !edit ? "" : ui.adding
    ? `<div class="ck-form"><input class="field" data-k="add" maxlength="300" placeholder="${t("checklist.itemPh")}" aria-label="${t("checklist.itemLabel")}" value="${esc(ui.addText)}">
        <div class="r"><button type="button" class="btn btn-primary btn-sm" data-a="add-save">${t("common.add")}</button>
          <button type="button" class="btn-ghost btn-sm" data-a="add-cancel">${t("common.cancel")}</button></div></div>`
    : `<button type="button" class="ck-add" data-k="add-btn" data-a="add">${I.plus} ${t("checklist.addItem")}</button>`;

  return `<div class="ck" data-ck="${list.id}" role="group" aria-labelledby="${titleId}">
    <div class="ck-h">${head}</div>
    <div class="ck-bar${all ? " all" : ""}" role="progressbar" aria-label="${t("checklist.progress")}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
    ${confirm}<ul class="ck-items">${items}</ul>${note}${add}</div>`;
}

/** Maddeleri tutamaçtan sürükleyerek sıralama. "Tamamlananları gizle" açıkken kapalı: sıra eksik görünür. */
function initChecklistSortable(block) {
  const ck = S.ck, id = Number(block.dataset.ck), ul = block.querySelector(".ck-items");
  if (!ck || !ul || !canEdit() || (CK_HIDE.has(id) && ckList(id)?.items.some((i) => i.done))) return;
  const s = new Sortable(ul, {
    handle: ".ck-grip", animation: 150, ghostClass: "ck-ghost", forceFallback: true, fallbackOnBody: true,
    fallbackTolerance: 4, delay: 150, delayOnTouchOnly: true,
    onStart: () => { ck.dragging = true; },
    onEnd: (evt) => {
      ck.dragging = false;
      if (evt.oldIndex !== evt.newIndex) return moveChecklistItem(id, Number(evt.item.dataset.item), evt.newIndex);
      flushChecklist(id);
    },
  });
  block._sortable = s;
  ck.sortables.push(s);
}

function onChecklistClick(e) {
  const b = e.target.closest("[data-a]"); if (!b || !S.ck) return;
  const a = b.dataset.a;
  if (a === "retry") { e.preventDefault(); return loadChecklists(); }
  if (a === "new-save") return createChecklist();
  if (a === "new-cancel") { S.ck.newOpen = false; renderChecklists(); return $("ckNew")?.focus(); }
  const id = Number(b.closest(".ck")?.dataset.ck), list = ckList(id); if (!list) return;
  const ui = ckUi(id), itemId = Number(b.closest("[data-item]")?.dataset.item);
  const focusIn = (k) => { const el = $("ckBody").querySelector(`.ck[data-ck="${id}"] [data-k="${k}"]`); el?.focus(); return el; };
  switch (a) {
    case "rename": ui.renaming = true; ui.title = list.title; renderChecklistBlock(id); focusIn("title")?.select(); break;
    case "rename-save": return renameChecklist(list);
    case "rename-cancel": ui.renaming = false; renderChecklistBlock(id); focusIn("title-btn"); break;
    case "hide":
      if (CK_HIDE.has(id)) CK_HIDE.delete(id); else CK_HIDE.add(id);
      renderChecklistBlock(id); break;
    case "delete": ui.confirm = true; renderChecklistBlock(id); focusIn("del-yes"); break;
    case "delete-no": ui.confirm = false; renderChecklistBlock(id); focusIn("del-list"); break;
    case "delete-yes": return deleteChecklist(list);
    case "add": ui.adding = true; renderChecklistBlock(id); focusIn("add"); break;
    case "add-save": return addChecklistItem(list);
    case "add-cancel": ui.adding = false; ui.addText = ""; renderChecklistBlock(id); focusIn("add-btn"); break;
    case "edit": {
      const it = list.items.find((i) => i.id === itemId); if (!it) return;
      ui.editId = itemId; ui.editText = it.text; renderChecklistBlock(id);
      const input = focusIn("edit"); input?.setSelectionRange(input.value.length, input.value.length); break;
    }
    case "edit-save": return saveChecklistItemText(list);
    case "edit-cancel": { const was = ui.editId; ui.editId = null; renderChecklistBlock(id); focusIn("tx-" + was); break; }
    case "up": return stepChecklistItem(id, itemId, -1);
    case "down": return stepChecklistItem(id, itemId, 1);
    case "del-item": return deleteChecklistItem(list, itemId);
  }
}

/** İşaretleme: atamadır (yapıldı = true/false), aynı maddeye iki kişi birden tıklasa da bozulmaz. */
function onChecklistChange(e) {
  const box = e.target; if (box.type !== "checkbox" || !S.ck) return;
  const id = Number(box.closest(".ck")?.dataset.ck), itemId = Number(box.closest("[data-item]")?.dataset.item);
  const list = ckList(id), it = list?.items.find((i) => i.id === itemId); if (!it) return;
  it.done = box.checked;
  renderChecklistBlock(id);
  sendChecklist(id, () => api.updateChecklistItem(S.ck.boardId, S.ck.cardId, id, itemId, { done: box.checked }));
}

/** Yazılanlar durumda tutulur: canlı bir olay listeyi yeniden çizse de kaybolmaz. */
function onChecklistInput(e) {
  const k = e.target.dataset.k; if (!k || !S.ck) return;
  if (k === "new") { S.ck.newTitle = e.target.value; return; }
  const id = Number(e.target.closest(".ck")?.dataset.ck); if (!ckList(id)) return;
  const ui = ckUi(id);
  if (k === "title") ui.title = e.target.value;
  if (k === "add") ui.addText = e.target.value;
  if (k === "edit") ui.editText = e.target.value;
}

function onChecklistKey(e) {
  if (!S.ck) return;
  const k = e.target.dataset?.k || "";
  const block = e.target.closest(".ck"), id = Number(block?.dataset.ck);
  // Alt+↑ / Alt+↓: odaktaki maddeyi taşı (fare ve sürükleme olmadan sıralama).
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown") && canEdit()) {
    const itemId = Number(e.target.closest("[data-item]")?.dataset.item);
    if (itemId) { e.preventDefault(); stepChecklistItem(id, itemId, e.key === "ArrowUp" ? -1 : 1); }
    return;
  }
  if (e.target.tagName !== "INPUT" || e.target.type === "checkbox") return;
  const press = (a) => (block?.querySelector(`[data-a="${a}"]`) || $("ckBody").querySelector(`[data-a="${a}"]`))?.click();
  if (e.key === "Enter") {
    e.preventDefault();
    if (k === "new") return createChecklist();
    if (k === "title") return press("rename-save");
    if (k === "add") return press("add-save");
    if (k === "edit") return press("edit-save");
  }
  if (e.key === "Escape") {
    // Yalnızca yazma kutusu kapanır; kart penceresi açık kalır.
    e.preventDefault(); e.stopPropagation();
    if (k === "new") return press("new-cancel");
    if (k === "title") return press("rename-cancel");
    if (k === "add") return press("add-cancel");
    if (k === "edit") return press("edit-cancel");
  }
}

/**
 * Sunucuya giden bir liste değişikliği. Aynı listeye giden istekler sürerken ara
 * yanıtlar ekrana basılmaz (yoksa hızlı işaretlemede kutular bir an geri sıçrardı);
 * son yanıt gelince en yeni hâl çizilir.
 */
async function sendChecklist(id, request) {
  const ck = S.ck; if (!ck) return;
  ck.inflight.set(id, (ck.inflight.get(id) || 0) + 1);
  let snap;
  try {
    snap = await request();
  } catch (e) {
    toast(t("checklist.saveFailed"), e.message, "err");
    if (S.ck === ck) { ck.inflight.set(id, ck.inflight.get(id) - 1); loadChecklists(); }
    return;
  }
  if (S.ck === ck) ck.inflight.set(id, ck.inflight.get(id) - 1);
  mergeChecklist(snap);
}

/** Listenin sunucudaki hâli geldi (yanıt ya da canlı olay): daha yeniyse alınır. */
function mergeChecklist(snap) {
  syncChecklistSummary(snap);
  const ck = S.ck;
  if (!ck || ck.cardId !== snap.cardId || CK_DELETED.has(snap.id)) return;
  const i = ck.lists.findIndex((l) => l.id === snap.id);
  if (i < 0) { ck.lists.push(snap); ck.lists.sort((a, b) => a.id - b.id); ck.unrendered.add(snap.id); }
  else if (snap.revision > ck.lists[i].revision) { ck.lists[i] = snap; ck.unrendered.add(snap.id); }
  flushChecklist(snap.id, i < 0);
}

/** Bekleyen yeni hâli, sürükleme ya da istek sürmüyorsa çizer. */
function flushChecklist(id, isNew = false) {
  const ck = S.ck;
  if (!ck || !ck.unrendered.has(id) || ck.dragging || (ck.inflight.get(id) || 0) > 0) return;
  ck.unrendered.delete(id);
  if (isNew || !$("ckBody")?.querySelector(`.ck[data-ck="${id}"]`)) renderChecklists(); else renderChecklistBlock(id);
}

/** Kartın üstündeki "3/5": listenin özeti, revision'ı yeniyse güncellenir. */
