<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sekme başlığı i18n.js'teki BRAND sabitinden gelir: ürün adı arayüzde tek yerde. -->
<title></title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A0C10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
  // Tema, sayfa çizilmeden ÖNCE uygulanır; yoksa açık tema seçen kişi her
  // açılışta önce koyu bir an görür (yanıp sönme).
  try { if (localStorage.getItem("cb_theme") === "light") document.documentElement.dataset.theme = "light"; } catch (_) {}
</script>
<link rel="stylesheet" href="/landing.css">
<style>
  /* ── Tasarım tokenları (handoff README §Design Tokens) ───────────────── */
  /* Koyu tema varsayılan ("A · Gece"); eski açık renkler [data-theme=light] altında.
     Bileşenler yalnızca bu değişkenleri kullanır: tema değişince hiçbiri elden geçmez.
     Giriş ekranı tanıtım sayfasının devamı: açık temada da koyu tokenları kullanır. */
  :root, :root[data-theme="light"] #auth {
    color-scheme: dark;
    --bg: #0A0C10; --card: #11141A; --raised: #171B23; --input: #12161D;
    --col-bg: #0D1015; --col-bd: #1B212B;
    --panel: #0C0F14; --sidebar: #0A0C10; --hover: #161B23; --hover-2: #1C222C;
    --bd: #232937; --bd-2: #2A3140; --sep: #1A1F28; --line: #1E2430;
    --vio-soft: #15121F; --vio-bd: #2E2650;
    --ink: #E9EDF3; --ink-2: #A9B1C0; --ink-3: #8B93A3; --ink-4: #6B7385;
    --acc: #FF7A1A; --acc-hover: #FF8F3D; --acc-ink: #FFB37A; --acc-soft: #2A1C0E; --acc-bd: #5A3712; --on-acc: #0A0C10;
    --ok: #3DD68C; --ok-ink: #7EE8B5; --ok-soft: #10261B; --ok-bd: #1F3A2C;
    --err: #FF6B6B; --err-hover: #FF8585; --err-ink: #FF9B9B; --err-soft: #2A1416; --err-bd: #4A2226; --on-err: #0A0C10;
    --warn: #F4C152; --warn-ink: #FFD27A; --warn-soft: #2E2410;
    --blue: #4DABF7; --blue-2: #9EC3FF; --blue-ink: #9EC3FF; --blue-soft: #1D2533;
    --violet: #B197FC;
    --chip-bg: #1A1F29; --muted-bg: #161A22; --skel: #161A22; --unread: #15110C; --sel: #5A3712;
    --sh-rgb: 0, 0, 0;
    --dark: #0C0F14;
    /* Grafik çubuğu: vurgu rengi, kart zemininde 3:1 kontrastı ve okunur açıklığı tutturacak kadar koyu. */
    --chart-bar: #E8691A;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eef3f8; --card: #ffffff; --raised: #f7fafd; --input: #ffffff;
    --col-bg: #e7edf5; --col-bd: #dae2ec;
    --panel: #f2f6fb; --sidebar: #f7fafd; --hover: #f2f6fb; --hover-2: #e4ebf3;
    --bd: #e1e7ef; --bd-2: #cfd8e3; --sep: #f1f5fa; --line: #e1e7ef;
    --vio-soft: #f5f1ff; --vio-bd: #ddd0fd;
    --ink: #1f2d3d; --ink-2: #5d6b80; --ink-3: #6f7e92; --ink-4: #93a1b3;
    --acc: #f5871f; --acc-hover: #e07610; --acc-ink: #b35c0b; --acc-soft: #fff1e2; --acc-bd: #f5cfa4; --on-acc: #1a1206;
    --ok: #35b37e; --ok-ink: #1f7a56; --ok-soft: #e4f5ec; --ok-bd: #c4e7d6;
    --err: #e05b49; --err-hover: #c94b3a; --err-ink: #a8392b; --err-soft: #fdecea; --err-bd: #f6cdc7; --on-err: #ffffff;
    --warn: #e8a838; --warn-ink: #8a5a08; --warn-soft: #fdeacd;
    --blue: #3f7cc4; --blue-2: #6ba4e8; --blue-ink: #2f5d99; --blue-soft: #e8f0fb;
    --violet: #8b5cf6;
    --chip-bg: #d9e2ec; --muted-bg: #e3eaf2; --skel: #e6ecf4; --unread: #fffbf6; --sel: #ffe0bd;
    --sh-rgb: 31, 45, 61;
    --dark: #1f2d3d;
    --chart-bar: #e07610;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  input, button, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--sel); }
  .hidden { display: none !important; }
  .spacer { flex: 1; }

  @keyframes cbIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes cbFlash { 0% { background: var(--acc-soft); box-shadow: 0 0 0 2px var(--acc); } 100% { background: var(--raised); box-shadow: 0 1px 2px rgba(var(--sh-rgb),.06); } }
  @keyframes cbToast { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes cbSheet { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes cbSpin { to { transform: rotate(360deg); } }
  @keyframes cbPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ── Ortak bileşenler ────────────────────────────────────────────────── */
  .btn { border: none; border-radius: 8px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; }
  .btn-primary { background: var(--acc); color: var(--on-acc); box-shadow: 0 2px 6px rgba(245,135,31,.35); }
  .btn-primary:hover { background: var(--acc-hover); }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost { background: var(--card); border: 1px solid var(--bd); color: var(--ink); border-radius: 7px; padding: 8px 12px; font-size: 13px; font-weight: 550; }
  .btn-ghost:hover { border-color: var(--bd-2); }
  .btn-danger { background: var(--err); color: var(--on-err); }
  .btn-danger:hover { background: var(--err-hover); }
  .field { width: 100%; padding: 10px 12px; border: 1px solid var(--bd); border-radius: 8px; outline: none; background: var(--input); color: var(--ink); }
  .field:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
  /* Örnek yazı, girilmiş bir değerle karıştırılmasın diye belirgin biçimde açık. */
  .field::placeholder { color: var(--ink-4); }
  .label { display: block; font-size: 12.5px; font-weight: 550; color: var(--ink-2); margin: 12px 0 5px; }
  .badge { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 2px 7px; }
  .badge.OWNER { background: var(--acc-soft); color: var(--acc-ink); }
  .badge.ADMIN { background: var(--acc-soft); color: var(--acc-ink); }
  .badge.EDITOR { background: var(--blue-soft); color: var(--blue-ink); }
  .badge.MEMBER { background: var(--blue-soft); color: var(--blue-ink); }
  .badge.VIEWER, .badge.GUEST { background: var(--chip-bg); color: var(--ink-2); }
  .chip { font-size: 10.5px; font-weight: 650; background: var(--chip-bg); color: var(--ink-2); border-radius: 20px; padding: 1px 8px; }
  .avatar { border-radius: 50%; color: #0A0C10; display: flex; align-items: center; justify-content: center;
            font-weight: 700; box-shadow: 0 1px 3px rgba(var(--sh-rgb),.15); flex: none; }
  .icon-btn { background: none; border: none; color: var(--ink-4); border-radius: 6px; display: inline-flex;
              align-items: center; justify-content: center; padding: 4px; }
  .spin { width: 14px; height: 14px; border: 2px solid rgba(10,12,16,.3); border-top-color: var(--on-acc);
          border-radius: 50%; animation: cbSpin .7s linear infinite; display: inline-block; }

  /* ── 1) Giriş / Kayıt ────────────────────────────────────────────────── */
  /* Tek sütun: sabit ışıklı koyu sahnenin ortasında giriş kartı. Hiçbir şey
     hareket etmez; ışık yalnızca degrade, zayıf makinede de yük yok. */
  html:has(#auth) { background: #07090D; }
  #auth { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; display: flex; flex-direction: column;
          background: #07090D; color: var(--ink); }
  /* Üstten kartın üzerine düşen sıcak ışık, köşelerde soğuk kenar ışığı. */
  .auth-light { position: absolute; inset: 0; z-index: -1; pointer-events: none;
                background: radial-gradient(52% 46% at 50% -10%, rgba(255,122,26,.20), transparent 70%),
                            radial-gradient(42% 42% at 100% 100%, rgba(77,171,247,.10), transparent 72%),
                            radial-gradient(38% 36% at 0% 100%, rgba(177,151,252,.06), transparent 70%); }
  .auth-vignette { position: absolute; inset: 0; z-index: -1; pointer-events: none;
                   background: radial-gradient(110% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .auth-grain { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .045;
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .auth-top { display: flex; align-items: center; gap: 8px; padding: 20px 28px; }
  .auth-top .lang-sw { margin-left: auto; }
  .auth-back { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--bd);
               border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
  .auth-back:hover { color: var(--ink); border-color: var(--bd-2); }
  .auth-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 8px 16px 56px; }
  .auth-logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .auth-logo .mark { width: 32px; height: 32px; border-radius: 9px; }
  .auth-card { width: 412px; max-width: 100%; padding: 30px 32px 28px; border-radius: 16px; background: #0E1116;
               border: 1px solid #1E2430; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 30px 80px rgba(0,0,0,.5); }
  /* Telefon: form ilk ekranda, kenarda 16px boşluk. */
  @media (max-width: 640px) {
    .auth-top { padding: 14px 16px; }
    .auth-main { justify-content: flex-start; gap: 18px; padding: 8px 16px 40px; }
    .auth-card { padding: 24px 20px; }
  }
  .auth-form { width: 100%; }
  .auth-form h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
  .auth-form p.sub { font-size: 13.5px; color: var(--ink-2); margin: 0 0 8px; }
  .auth-err { display: flex; gap: 8px; align-items: flex-start; background: var(--err-soft); border: 1px solid var(--err-bd);
              color: var(--err-ink); font-size: 13px; border-radius: 8px; padding: 9px 11px; margin-top: 14px; }
  .auth-submit { width: 100%; margin-top: 18px; padding: 11px 14px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  /* Google ile giriş: Google'ın düğme kuralına uygun (logo + "Google ile devam et") */
  .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; padding: 10px 14px;
                border-radius: 8px; border: 1px solid var(--bd-2); background: var(--raised); color: var(--ink); font-size: 14px; font-weight: 600; }
  .btn-google:hover { border-color: var(--ink-4); background: var(--hover-2); }
  .btn-google:disabled { opacity: .7; cursor: default; }
  .auth-or { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; font-size: 12px; color: var(--ink-3); }
  .auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--bd); }
  .auth-switch { margin-top: 14px; text-align: center; font-size: 13px; color: var(--ink-2); }
  .auth-switch a { color: var(--acc-ink); font-weight: 700; cursor: pointer; }
  .auth-switch a:hover { color: var(--acc); }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .hint { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }

  /* ── Üst çubuk (ana ekran, profil ve pano ortak) ────────────────────── */
  .topbar { min-height: 57px; background: var(--panel); border-bottom: 1px solid var(--sep); display: flex; align-items: center;
            gap: 14px; padding: 10px 20px; flex: none; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; color: var(--ink);
           background: none; border: none; padding: 0; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--acc); display: flex; align-items: center; justify-content: center; flex: none; }
  .mark svg { display: block; width: 78%; height: 78%; }   /* kuş karonun içinde, simge dosyasıyla aynı oranda */
  .mark-btn { padding: 0; border: none; background: none; border-radius: 8px; flex: none; }
  .mark-btn .mark { width: 30px; height: 30px; border-radius: 8px; }
  .mark-btn:hover .mark { background: var(--acc-hover); }
  .tb-sel { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: transparent; border: 1px solid var(--bd);
            border-radius: 8px; color: var(--ink); font-size: 13px; font-weight: 500; max-width: 230px; min-width: 0; }
  .tb-sel:hover { border-color: var(--bd-2); background: var(--hover); }
  .tb-sel .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-sel > svg { color: var(--ink-3); flex: none; }
  .ws-ini { width: 18px; height: 18px; border-radius: 5px; font-size: 10px; font-weight: 800; display: flex; align-items: center;
            justify-content: center; flex: none; background: var(--acc-soft); color: var(--acc-ink); }
  .ws-ini.all { background: var(--chip-bg); color: var(--ink-2); }
  .ws-ini.shared { background: var(--vio-soft); color: var(--violet); }
  .gsearch { flex: 1 1 260px; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-width: 0;
             padding: 8px 9px 8px 12px; background: var(--input); border: 1px solid var(--bd); border-radius: 9px;
             color: var(--ink-3); font-size: 13.5px; text-align: left; }
  .gsearch:hover { border-color: var(--bd-2); }
  .gsearch:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  .gsearch .ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kbd { font: 500 11px var(--mono); color: var(--ink-2); border: 1px solid var(--bd-2); border-radius: 5px; padding: 1px 6px;
         white-space: nowrap; flex: none; background: transparent; }
  .tb-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .btn-new { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--acc); border: none; border-radius: 8px;
             color: var(--on-acc); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .btn-new:hover { background: var(--acc-hover); }
  .btn-new svg { flex: none; }
  .online-pill { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; border: 1px solid var(--ok-bd); border-radius: 999px;
                 font-size: 12px; font-weight: 600; color: var(--ok); white-space: nowrap; }
  .online-pill.solo { padding-left: 10px; }
  .online-pill.off { border-color: var(--bd); color: var(--ink-3); }
  .online-pill.wait { border-color: var(--acc-bd); color: var(--acc-ink); }
  .online-pill.down { border-color: var(--err-bd); color: var(--err-ink); animation: cbPulse 1.4s ease-in-out infinite; }
  .av-stack { display: flex; }
  .av-stack:empty { display: none; }
  .av-stack > * { margin-left: -7px; box-shadow: 0 0 0 2px var(--panel); border-radius: 50%; }
  .av-stack > *:first-child { margin-left: 0; }
  .av-stack.on-card > * { box-shadow: 0 0 0 2px var(--card); }

  /* ── 2) Ana ekran: kenar menüsü + özet + panolar + ekip ─────────────── */
  #home { height: 100vh; display: flex; flex-direction: column; }
  .home-body { flex: 1; display: flex; min-height: 0; }
  .side-nav { width: 248px; flex: none; padding: 18px 14px; border-right: 1px solid var(--muted-bg); overflow-y: auto;
              display: flex; flex-direction: column; gap: 22px; }
  .nav-a { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: none; border: none;
           font-size: 14px; color: var(--ink-2); text-align: left; min-width: 0; }
  .nav-a:hover { background: var(--hover); color: var(--ink); }
  .nav-a > svg { color: var(--ink-3); flex: none; }
  .nav-a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-a.rec { font-size: 13.5px; padding: 7px 10px; }
  .side-h { margin: 0 10px 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .sq { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .live-n { margin-left: auto; font-size: 11.5px; color: var(--ok); white-space: nowrap; }
  .ws-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
  .ws-row:hover { background: var(--hover); color: var(--ink); }
  .ws-row.active { background: var(--hover); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--acc); }
  .ws-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-count { font: 500 11px var(--mono); color: var(--ink-3); }
  .ws-actions { display: none; gap: 2px; }
  .ws-row:hover .ws-actions, .ws-row:focus-within .ws-actions { display: flex; }
  .ws-row:hover .ws-actions ~ .ws-count { display: none; }
  .ws-actions .icon-btn { width: 22px; height: 22px; }
  .ws-actions .edit:hover { background: var(--acc-soft); color: var(--acc-ink); }
  .ws-actions .del:hover { background: var(--err-soft); color: var(--err); }
  .ws-new { width: 100%; margin-top: 6px; text-align: left; padding: 7px 10px; background: transparent; border: 1px dashed var(--bd-2);
            border-radius: 8px; color: var(--ink-2); font-size: 13px; }
  .ws-new:hover { border-color: var(--acc); color: var(--acc-ink); }

  .home-main { flex: 1; min-width: 0; padding: 26px 32px 48px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  .ov { display: flex; flex-direction: column; gap: 20px; }
  .ov-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .ov-head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
  .ov-head .sub { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
  .ov-head .sub .late { color: var(--err-ink); }
  .ov-head .sub .soon { color: var(--warn-ink); }
  .btn-line { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; background: transparent; border: 1px solid var(--bd-2);
              border-radius: 9px; color: var(--ink); font-size: 13.5px; font-weight: 600; }
  .btn-line:hover { background: var(--hover); }
  .inv-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 16px; background: var(--vio-soft);
                border: 1px solid var(--vio-bd); border-radius: 12px; }
  .inv-banner p { margin: 0; flex: 1 1 300px; font-size: 14px; color: var(--ink-2); }
  .inv-banner strong { color: var(--ink); }
  .inv-banner .more { color: var(--violet); font-weight: 600; cursor: pointer; margin-left: 4px; }
  .inv-banner .acts { display: flex; gap: 8px; }
  .ov-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .ov-stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ov-stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .ov-stat .k { margin: 0; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-stat .row { display: flex; align-items: flex-end; gap: 12px; margin-top: 8px; }
  .ov-stat .n { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ov-stat .n.word { font-size: 22px; letter-spacing: -.02em; padding-bottom: 3px; }
  .ov-stat .hn { margin: 4px 0 0; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-stat .ico { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; }

  .ag-row:last-child { border-bottom: none; }

  .ag-row .age { font: 500 12px var(--mono); color: var(--ink-2); flex: none; }

  /* Çevrimiçi noktası: avatarın sağ altında; yeşil = şu an bir panoda */

  /* Yalnızca iskeletin yerini veri aldığında belirir; alan değiştirince kıpırdamaz. */

  /* Tablet/telefon: kenar menüsü üstte yatay bir alan şeridine dönüşür, sayfa tek sütunda kayar. */

  /* ── 3) Pano ekranı ─────────────────────────────────────────────────── */
  #board { height: 100vh; display: flex; flex-direction: column; }
  .board-body { flex: 1; display: flex; min-height: 0; }
  .cols { flex: 1; overflow-x: auto; padding: 18px; display: flex; align-items: flex-start; gap: 14px; }
  /* Kolon, panonun görünen yüksekliğini aşmaz; kartlar kolonun içinde kayar. */
  .col { width: 276px; flex: none; background: var(--col-bg); border: 1px solid var(--col-bd); border-radius: 12px;
         display: flex; flex-direction: column; max-height: 100%; }
  .col.drop { border-color: var(--acc); }
  .col-head { padding: 11px 12px 9px; display: flex; align-items: center; gap: 8px; cursor: grab; user-select: none; }
  .col-head:active { cursor: grabbing; }
  .col-head .nm { font-size: 13px; font-weight: 660; }
  .col-cards { padding: 0 8px 4px; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; min-height: 8px; }
  .col-foot { padding: 8px; }
  .add-card { width: 100%; background: none; border: none; border-radius: 8px; padding: 8px; text-align: left;
              font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .add-card:hover { background: var(--hover); }
  .composer { background: var(--raised); border: 1px solid var(--acc-bd); border-radius: 9px; padding: 8px; }
  .composer textarea { width: 100%; border: none; outline: none; resize: vertical; min-height: 46px; font-size: 13.5px; background: transparent; color: var(--ink); }
  .composer .r { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .composer .k { font-size: 11px; color: var(--ink-3); margin-left: auto; }
  .card {
    position: relative; background: var(--raised); border: 1px solid var(--bd); border-radius: 9px; padding: 9px 30px 9px 11px;
    font-size: 13.5px; line-height: 1.4; box-shadow: 0 1px 2px rgba(var(--sh-rgb),.06); cursor: pointer;
    text-wrap: pretty;
  }
  .card:hover { border-color: var(--bd-2); }
  /* Belirme animasyonu yalnızca gerçekten YENİ karta: önceden her yeniden
     çizimde bütün kartlar birlikte yeniden beliriyordu. */
  .card.fresh { animation: cbIn 220ms ease; }
  .card.flash { animation: cbFlash 900ms ease; }
  .card .del { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; opacity: .55; }
  .card .del:hover { background: var(--err-soft); color: var(--err); opacity: 1; }
  .card-ghost { opacity: .4; }
  .card-drag { box-shadow: 0 8px 20px rgba(var(--sh-rgb),.25); }
  /* Sürüklenen kartın elde taşınan kopyası: hafif eğik, gölgeli, tam opak. */
  .sortable-fallback { rotate: 2deg; opacity: 1 !important; box-shadow: 0 16px 34px rgba(var(--sh-rgb),.26) !important; cursor: grabbing; }
  /* Bırakılacak yer: soluk kart yerine net, kesik çizgili bir boşluk. */
  .card-ghost { opacity: 1 !important; background: var(--acc-soft) !important; border: 1.5px dashed var(--acc) !important; box-shadow: none !important; }
  .card-ghost > * { visibility: hidden; }

  /* Canlı imleçler: panodaki diğer kişilerin fareleri */
  .cols-wrap { flex: 1; min-width: 0; position: relative; display: flex; }
  .cursor-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  .rcursor { position: absolute; left: 0; top: 0; will-change: transform; transition: transform 110ms linear, opacity .35s ease; }
  .rcursor.idle { opacity: 0; }
  .rcursor svg { display: block; filter: drop-shadow(0 1px 2px rgba(var(--sh-rgb),.35)); }
  .rcursor .lbl { position: absolute; left: 13px; top: 16px; padding: 2px 8px; border-radius: 9px; background: var(--rc);
                  color: #0A0C10; font-size: 11.5px; font-weight: 650; white-space: nowrap; box-shadow: 0 2px 6px rgba(var(--sh-rgb),.2); }
  .rcursor .carry { position: absolute; left: 13px; top: 40px; max-width: 210px; padding: 6px 9px; border-radius: 8px;
                    background: var(--raised); border: 1.5px solid var(--rc); font-size: 12px; color: var(--ink); white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; box-shadow: 0 8px 20px rgba(var(--sh-rgb),.18); rotate: 2deg; }
  .card.remote-drag { outline: 2px dashed var(--rc); outline-offset: 2px; opacity: .55; }
  @media (prefers-reduced-motion: reduce) { .rcursor { transition: opacity .2s; } }

  /* WIP limiti: kolon başlığındaki doluluk rozeti */
  .chip.wip { cursor: default; }
  .chip.wip.editable { cursor: pointer; }
  .chip.wip.editable:hover { background: var(--acc-bd); color: var(--acc-ink); }
  .chip.wip.full { background: var(--warn-soft); color: var(--warn-ink); }
  .chip.wip.over { background: var(--err-soft); color: var(--err-ink); }
  .col.full .col-head { box-shadow: inset 0 2px 0 var(--warn); }
  .col.over .col-head { box-shadow: inset 0 2px 0 var(--err); }
  .wip-note { font-size: 11.5px; color: var(--warn-ink); background: var(--warn-soft); border-radius: 7px;
              padding: 5px 8px; margin: 0 8px 8px; line-height: 1.35; }

  /* Kart üzerindeki detay göstergeleri */
  .card .cmeta { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .card .cmeta:empty { display: none; }
  .card .cmeta .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px;

                        background: var(--muted-bg); color: var(--ink-2); }
  .card .cmeta .badge.due-soon { background: var(--warn-soft); color: var(--warn-ink); }
  .card .cmeta .badge.due-over { background: var(--err-soft); color: var(--err-ink); }
  .card .cmeta .sp { margin-left: auto; }
  /* Kartın anahtarı (STR-42): göstergelerin başında, geri planda kalan eş aralıklı yazı. */
  .card .ckey { font: 500 10.5px/1.6 var(--mono); color: var(--ink-3); letter-spacing: .02em; white-space: nowrap; }

  /* Kart detay formu */
  .fld { margin-top: 14px; }

                 text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .fld textarea, .fld select, .fld input[type=date] {
    width: 100%; font: inherit; font-size: 13.5px; color: var(--ink);
    border: 1px solid var(--bd-2); border-radius: 8px; padding: 8px 10px; background: var(--input); outline: none;
  }
  .fld textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
  .fld textarea:focus, .fld select:focus, .fld input[type=date]:focus { border-color: var(--acc); }
  .fld .row2 { display: flex; gap: 10px; }
  .fld .row2 > div { flex: 1; }
  .col-empty { border: 1px dashed var(--bd-2); border-radius: 8px; padding: 14px 10px; text-align: center;
               font-size: 12.5px; color: var(--ink-3); }
  .viewer-note { width: 232px; flex: none; background: var(--card); border: 1px solid var(--bd); border-radius: 12px;
                 padding: 14px; font-size: 12.5px; color: var(--ink-2); }
  /* ── 4) Yan panel ───────────────────────────────────────────────────── */
  .side { width: 340px; flex: none; background: var(--bg); border-left: 1px solid var(--muted-bg);
          overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pcard { flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pcard > .h { padding: 12px 14px; border-bottom: 1px solid var(--sep); display: flex; align-items: center; gap: 8px; }
  .pcard .h .t { font-size: 14px; font-weight: 700; }
  .live-pill { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
               border-radius: 20px; padding: 2px 8px; background: var(--ok-soft); color: var(--ok-ink); }
  .live-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: cbPulse 2.4s ease-in-out infinite; }
  .live-pill.off { background: var(--err-soft); color: var(--err-ink); } .live-pill.off i { background: var(--err); animation: none; }
  .mem { display: flex; align-items: center; gap: 9px; padding: 7px 14px; }
  .mem:first-child { padding-top: 10px; }
  .mem:hover { background: var(--hover); }
  .mem .n { flex: 1; min-width: 0; }
  .mem .n b { display: block; font-size: 13.5px; font-weight: 570; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem .n small { display: block; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem .rm { width: 24px; height: 24px; }
  .mem .rm:hover { background: var(--err-soft); color: var(--err); }
  #actList { padding: 4px 14px 8px; }
  .act { display: flex; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--sep); }
  .act:last-child { border-bottom: none; }
  .act .b { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
  .act .b b { color: var(--ink); }
  .act .t { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .side-empty { text-align: center; padding: 22px 14px; color: var(--ink-3); font-size: 12.5px; }
  .act-toggle { flex: none; align-self: flex-start; background: var(--raised); border: 1px solid var(--bd);
                color: var(--ink-2); border-radius: 20px; padding: 2px 9px; font-size: 10.5px; font-weight: 700; }
  .act-toggle:hover { border-color: var(--acc); color: var(--acc-ink); background: var(--acc-soft); }
  .act-detail { margin-top: 7px; border-left: 2px solid var(--bd); padding-left: 9px;
                display: flex; flex-direction: column; gap: 5px; }
  .act-detail > div { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--ink-2); }
  .act-detail i { margin-left: auto; font-style: normal; font-size: 11px; color: var(--ink-4); white-space: nowrap; }

  /* ── Zaman yolculuğu çubuğu ─────────────────────────────────────────── */
  .timebar { flex: none; background: var(--panel); border-top: 1px solid var(--bd); padding: 10px 18px;
             display: flex; align-items: center; gap: 14px; box-shadow: 0 -2px 10px rgba(var(--sh-rgb),.05); }
  .timebar.on { border-top-color: var(--acc-bd); background: var(--acc-soft); }
  .timebar input[type=range] { flex: 1; accent-color: var(--acc); }
  .timebar .moment { min-width: 260px; font-size: 12.5px; color: var(--ink-2); }
  .timebar .moment b { color: var(--ink); }
  .timebar .when { font-size: 11.5px; color: var(--ink-3); }
  .hist-pill { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
               letter-spacing: .04em; background: var(--acc-soft); color: var(--acc-ink);
               border: 1px solid var(--acc-bd); border-radius: 20px; padding: 3px 10px; }
  /* Geçmişe bakarken kolonlar kesik çizgili: ekrandaki "şimdi" değil. */
  #board.past .col { border-style: dashed; }

  /* ── Akış sağlığı paneli: kolon başına ortalama bekleme çubuğu ───────── */
  .flow-rows { padding: 8px 0 4px; }
  .flow-row { display: flex; align-items: center; gap: 10px; padding: 5px 14px; font-size: 12.5px; }
  .flow-row .nm { width: 96px; flex: none; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flow-row .fbar { flex: 1; height: 6px; border-radius: 3px; background: var(--sep); overflow: hidden; display: flex; }
  .flow-row .fbar i { display: block; height: 100%; border-radius: 3px; }
  .flow-row .val { width: 62px; flex: none; text-align: right; font: 500 11px var(--mono); color: var(--ink-2); }
  .flow-row.bottleneck .nm, .flow-row.bottleneck .val { color: var(--err-ink); }
  .flow-sum { padding: 9px 14px 11px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
  .flow-sum b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Yaşlanan iş: hangi kart ne kadardır bekliyor (satır tıklanınca kart gösterilir) */
  .age-row { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 12.5px; background: none; border: none;
             text-align: left; color: var(--ink); }
  .age-row:hover { background: var(--hover); }
  .age-row + .age-row { border-top: 1px solid var(--sep); }
  .age-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* "col" değil: panodaki kolon kutusunun sınıfıyla çakışıp 276 px genişliğinde gri bir kutuya dönüşüyordu. */
  .age-row .age-col { font-size: 11px; color: var(--ink-3); flex: none; }
  .age-row .val { font-weight: 650; font-variant-numeric: tabular-nums; flex: none; }
  .age-row .bar { height: 3px; border-radius: 2px; background: var(--acc); flex: none; min-width: 3px; }
  .age-row.warm .val { color: var(--warn-ink); } .age-row.warm .bar { background: var(--warn); }
  .age-row.hot  .val { color: var(--err-ink); } .age-row.hot .bar { background: var(--err); }
  .age-row .est { font-size: 10px; color: var(--ink-3); }
  .age-empty { padding: 10px 14px; font-size: 12.5px; color: var(--ink-3); }

  /* Arama, süzgeçler ve panonun özet sayıları */
  .filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 18px;
             border-bottom: 1px solid var(--muted-bg); background: var(--bg); flex: none; }
  .fsearch { position: relative; flex: 0 1 260px; min-width: 160px; }
  .fsearch > svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
  .filters input[type=search] { width: 100%; font: inherit; font-size: 13px; padding: 7px 10px 7px 32px;
             border: 1px solid var(--bd); border-radius: 8px; outline: none; background: var(--input); }
  .filters input[type=search]:focus { border-color: var(--acc); }
  .fchip { font-size: 12.5px; font-weight: 500; border: 1px solid var(--bd); background: transparent;
           border-radius: 999px; padding: 6px 11px; color: var(--ink-2); white-space: nowrap; }
  .fchip:hover { border-color: var(--bd-2); color: var(--ink); }
  .fchip.on { background: var(--acc-soft); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
  .fchip.late { background: var(--err-soft); border-color: var(--err-bd); color: var(--err-ink); font-weight: 600; }
  .fsel { position: relative; display: flex; align-items: center; gap: 4px; padding: 0 9px 0 11px; border: 1px solid var(--bd);
          border-radius: 999px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .fsel:hover { border-color: var(--bd-2); }
  .fsel select { appearance: none; -webkit-appearance: none; border: none; background: transparent; color: var(--ink); font: inherit;
                 font-weight: 500; padding: 6px 2px; outline: none; max-width: 150px; cursor: pointer; }
  .fsel select option { background: var(--raised); color: var(--ink); }
  .fsel > svg { color: var(--ink-3); pointer-events: none; }
  .fcount { font-size: 12px; color: var(--ink-3); }
  .bstats { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .bstats b { color: var(--ink); font-weight: 700; }
  .bstats b.bad { color: var(--err-ink); }
  .tb-btn.sm { width: 32px; height: 32px; }
  .tb-btn[aria-pressed="false"] { color: var(--ink-3); }

  /* Kolon başlığı menüsü */
  .col-menu { position: relative; }
  .col-menu > .icon-btn { width: 22px; height: 22px; opacity: .5; }
  .col-menu > .icon-btn:hover { opacity: 1; }
  .col-pop { position: absolute; top: 26px; right: 0; z-index: 40; background: var(--raised);
             border: 1px solid var(--bd-2); border-radius: 9px; box-shadow: 0 8px 24px rgba(var(--sh-rgb),.18);
             padding: 4px; min-width: 170px; }
  .col-pop button { display: block; width: 100%; text-align: left; background: none; border: none;
             border-radius: 6px; padding: 7px 9px; font-size: 13px; color: var(--ink); }
  .col-pop button:hover { background: var(--hover-2); }
  .col-pop button.danger { color: var(--err); }
  .col-pop button.danger:hover { background: var(--err-soft); }
  .col-head input.rename { flex: 1; min-width: 0; font: inherit; font-size: 13px; font-weight: 660;
             border: 1px solid var(--acc); border-radius: 6px; padding: 2px 6px; outline: none; background: var(--input); }
  .add-col { width: 232px; flex: none; align-self: flex-start; background: transparent;
             border: 1px dashed var(--bd-2); border-radius: 12px; padding: 11px; font-size: 13px;
             color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .add-col:hover { background: var(--hover); border-color: var(--acc); color: var(--acc-ink); }

  /* ── Pano üst çubuğu: konum, görünüm sekmeleri, canlılık ───────────── */
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 13.5px; min-width: 0; }
  .crumb a { color: var(--ink-2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .crumb a:hover { color: var(--ink); }
  .crumb .sl { color: var(--ink-4); }
  .board-switch { display: flex; align-items: center; gap: 7px; padding: 6px 9px; background: var(--input); border: 1px solid var(--bd);
                  border-radius: 8px; color: var(--ink); font-size: 14px; font-weight: 700; min-width: 0; max-width: 300px; }
  .board-switch:hover { border-color: var(--bd-2); }
  .board-switch .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-switch > svg { color: var(--ink-3); flex: none; }
  .tabs { margin: 0 auto; display: flex; gap: 2px; padding: 3px; background: var(--input); border: 1px solid var(--line); border-radius: 10px; flex: none; }
  .tabs button { padding: 6px 14px; background: transparent; border: none; border-radius: 7px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--line); color: var(--ink); }
  .tabs button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }

  /* Alt durum çubuğu: bağlantı, gönderilen işlem, çevrimiçi, son değişiklik */

  /* Akış sekmesi: panonun akış ölçümünün geniş hâli */
  .flow-view { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 24px 32px; display: flex; flex-direction: column; gap: 16px; }
  .fv-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .fv-head p { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 70ch; line-height: 1.5; }
  .fv-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .fv-row { display: grid; grid-template-columns: minmax(90px, 150px) 64px minmax(0, 1fr) 70px; align-items: center; gap: 12px;
            padding: 9px 0; border-bottom: 1px solid var(--muted-bg); font-size: 13px; }
  .fv-row:last-of-type { border-bottom: none; }
  .fv-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fv-row .c { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .fv-row .bar { height: 10px; border-radius: 5px; background: var(--sep); overflow: hidden; display: flex; }
  .fv-row .bar i { display: block; height: 100%; border-radius: 5px; }
  .fv-row .v { text-align: right; font: 500 12px var(--mono); color: var(--ink-2); }
  .fv-row.bottleneck .nm, .fv-row.bottleneck .v { color: var(--err-ink); }
  @media (max-width: 900px) { .fv-grid { grid-template-columns: minmax(0, 1fr); } .flow-view { padding: 18px 16px 28px; } }

  /* ── Komut paleti (Ctrl K): her yerden pano, kart ve komut arama ────── */
  .pal-ov { position: fixed; inset: 0; z-index: 80; background: rgba(var(--sh-rgb),.5); display: flex; justify-content: center;
            align-items: flex-start; padding: 12vh 16px 16px; }
  .pal { width: 620px; max-width: 100%; max-height: 72vh; display: flex; flex-direction: column; overflow: hidden; background: var(--raised);
         border: 1px solid var(--bd-2); border-radius: 14px; box-shadow: 0 24px 60px rgba(var(--sh-rgb),.45); animation: cbIn 160ms ease; }
  .pal-in { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--sep); color: var(--ink-3); }
  .pal-in input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 15px; color: var(--ink); }
  .pal-in input::placeholder { color: var(--ink-4); }
  .pal-list { overflow-y: auto; padding: 6px; }
  .pal-sec { padding: 9px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .pal-it { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; background: none; border: none;
            text-align: left; color: var(--ink); font-size: 13.5px; }
  .pal-it.on { background: var(--hover-2); }
  .pal-it > svg { color: var(--ink-3); flex: none; }
  .pal-it .tx { flex: 1; min-width: 0; }
  .pal-it .tt { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal-it small { display: block; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal-it mark { background: none; color: var(--acc-ink); font-weight: 700; }
  .pal-it .pal-key { flex: none; font: 500 11px var(--mono); color: var(--ink-3); }
  .pal-it .pal-key.hit { color: var(--acc-ink); }
  .pal-empty { padding: 22px 16px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .pal-foot { display: flex; flex-wrap: wrap; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--sep); font-size: 11.5px; color: var(--ink-3); }

  .menu-item .mi-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item .mi-n { margin-left: auto; font: 500 11px var(--mono); color: var(--ink-3); }
  .menu-item.on { background: var(--hover-2); font-weight: 600; }
  .menu-item .kbd { margin-left: auto; }
  .menu-pop { max-height: min(440px, 72vh); overflow-y: auto; }

  @media (max-width: 760px) {
    .btop .crumb a, .btop .crumb .sl, .btop .user-btn .nm { display: none; }
    .btop .tabs { order: 10; margin: 0; }
    .btop #inviteBtn .lbl { display: none; }
    .filters .bstats { display: none; }
  }

  /* ── 5-6) Modallar ──────────────────────────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(var(--sh-rgb),.42); display: flex; align-items: center;
             justify-content: center; z-index: 60; padding: 20px; }
  .modal { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; box-shadow: 0 24px 60px rgba(var(--sh-rgb),.28); width: 400px;
           max-width: 100%; padding: 20px; animation: cbIn 180ms ease; }
  .modal.wide { width: 520px; }
  .modal h3 { font-size: 16.5px; font-weight: 640; margin: 0 0 4px; }
  .modal p.sub { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; }
  .modal .acts { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
  .modal .warn-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--err-soft); display: flex;
                     align-items: center; justify-content: center; margin-bottom: 12px; }
  .meta { display: flex; gap: 10px; margin: 14px 0; }
  .meta > div { flex: 1; background: var(--raised); border: 1px solid var(--bd); border-radius: 8px; padding: 8px 10px; }
  .meta .k { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
  .meta .v { font-size: 13px; margin-top: 2px; }
  .detail-title { width: 100%; font-size: 17px; font-weight: 620; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; outline: none; background: transparent; }
  .detail-title:focus { border-color: var(--acc); background: var(--input); }
  /* Kart penceresi yorumlarla uzayabilir: ekranı aşarsa kendi içinde kayar. */
  .modal.detail { max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); overflow-y: auto; }

  /* Kart penceresinin başı: anahtar, kolon ve "Kopyala" menüsü (anahtar, dal adı, bağlantı) */
  .detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .dkey { flex: none; font: 600 12px/1 var(--mono); color: var(--ink-2); background: var(--chip-bg); border-radius: 6px;
          padding: 5px 7px; letter-spacing: .02em; }
  .dcol { min-width: 0; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .key-menu { position: relative; margin-left: auto; flex: none; }
  .key-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--bd); border-radius: 7px;
             background: transparent; color: var(--ink-2); font-size: 12.5px; font-weight: 550; }
  .key-btn:hover, .key-btn[aria-expanded="true"] { border-color: var(--bd-2); color: var(--ink); background: var(--hover); }
  .key-btn:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  .key-btn svg { flex: none; color: var(--ink-3); }
  .key-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; width: 300px; max-width: calc(100vw - 72px); padding: 4px;
             background: var(--raised); border: 1px solid var(--bd-2); border-radius: 10px; box-shadow: 0 10px 28px rgba(var(--sh-rgb),.22);
             animation: cbIn 140ms ease; }
  .key-pop button { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 8px 9px; border: none; border-radius: 7px;
                    background: none; color: var(--ink); text-align: left; }
  .key-pop button:hover, .key-pop button:focus-visible { background: var(--hover-2); outline: none; }
  .key-pop button > svg { flex: none; margin-top: 2px; color: var(--ink-3); }
  .key-pop .tx { flex: 1; min-width: 0; }
  .key-pop b { display: block; font-size: 13px; font-weight: 550; }
  .key-pop code { display: block; margin-top: 2px; font: 500 11.5px var(--mono); color: var(--ink-3);
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Yeni pano: şablon seçimi, her şablonun kolonlarının küçük önizlemesiyle */
  .modal.create { max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); overflow-y: auto; }
  .tpl-list { display: flex; flex-direction: column; gap: 6px; }
  .tpl { display: flex; align-items: flex-start; gap: 10px; padding: 9px 11px; border: 1px solid var(--bd); border-radius: 9px; cursor: pointer; }
  .tpl:hover { border-color: var(--bd-2); }
  .tpl:has(input:checked) { border-color: var(--acc); background: var(--hover); }
  .tpl input { flex: none; margin: 2px 0 0; accent-color: var(--acc); }
  .tpl .tx { flex: 1; min-width: 0; }
  .tpl b { display: block; font-size: 13.5px; font-weight: 600; }
  .tpl-cols { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tpl-cols i { font-style: normal; font-size: 11.5px; color: var(--ink-2); background: var(--chip-bg); border-radius: 5px;
                padding: 2px 7px; white-space: nowrap; }
  .tpl-cols i em { margin-left: 5px; font: normal 500 10.5px var(--mono); color: var(--ink-3); }
  .tpl-cols.none { font-size: 12px; color: var(--ink-3); }
  .tpl-skel { height: 54px; border-radius: 9px; background: var(--skel); animation: cbPulse 1.2s ease-in-out infinite; }
  .tpl-note { font-size: 12.5px; color: var(--ink-3); }

  /* Kart yorumları */
  .cmts { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--sep); }
  .cmts-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
            text-transform: uppercase; color: var(--ink-3); }
  .cmt { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--sep); }
  .cmt:last-child { border-bottom: none; }
  .cmt.fresh { animation: cbIn 220ms ease; }
  .cmt .main { flex: 1; min-width: 0; }
  .cmt .hd { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; font-size: 12.5px; }
  .cmt .hd b { font-weight: 620; color: var(--ink); }
  .cmt .hd time, .cmt .hd .ed { font-size: 11.5px; color: var(--ink-3); }
  .cmt .tx { margin-top: 3px; font-size: 13.5px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmt .tx a { color: var(--blue-ink); text-decoration: underline; text-underline-offset: 2px; }
  .mention { color: var(--acc-ink); font-weight: 600; }
  .mention.me { background: var(--acc-soft); border-radius: 4px; padding: 0 3px; }
  .cmt-acts { display: flex; align-items: center; gap: 12px; margin-top: 5px; font-size: 12px; }
  .cmt-acts button { background: none; border: none; padding: 0; color: var(--ink-3); font-size: 12px; font-weight: 550; }
  .cmt-acts button:hover { color: var(--ink); }
  .cmt-acts button.danger { color: var(--err-ink); }
  .cmt-acts button:disabled { opacity: .6; cursor: default; }
  .cmt-acts .q { color: var(--ink-2); }
  .cmt-note { font-size: 12.5px; color: var(--ink-3); padding: 10px 0 4px; }
  .cmt-note a { color: var(--acc-ink); font-weight: 600; cursor: pointer; }
  .cmt-box { position: relative; margin-top: 10px; }
  .cmt .cmt-box { margin-top: 5px; }
  .cmt-box textarea { display: block; width: 100%; min-height: 62px; resize: vertical; font: inherit; font-size: 13.5px; line-height: 1.45;
                      color: var(--ink); border: 1px solid var(--bd-2); border-radius: 8px; padding: 8px 10px; background: var(--input); outline: none; }
  .cmt-box textarea:focus { border-color: var(--acc); }
  .cmt-box textarea::placeholder { color: var(--ink-4); }
  .cmt-box .r { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .cmt-box .k { margin-left: auto; font-size: 11px; color: var(--ink-3); text-align: right; }
  .cmt-err { margin-top: 6px; font-size: 12px; color: var(--err-ink); }
  /* @ ile kişi seçme listesi: yazma kutusunun hemen üstünde açılır */
  .mention-pop { position: absolute; left: 0; bottom: calc(100% + 4px); z-index: 5; width: 260px; max-width: 100%; max-height: 228px;
                 overflow-y: auto; padding: 4px; background: var(--raised); border: 1px solid var(--bd-2); border-radius: 9px;
                 box-shadow: 0 8px 24px rgba(var(--sh-rgb),.18); }
  .mention-pop button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: none; border-radius: 6px;
                        background: none; color: var(--ink); font-size: 13px; text-align: left; }
  .mention-pop button.on { background: var(--hover-2); }
  .mention-pop .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 640px) {
    .modal.detail { padding: 16px; }
    .cmt-box .k { display: none; }   /* telefonda klavye kısayolu yok, Gönder düğmesi yeter */
  }

  /* ── Etiketler (ADR 0022) ──
     Sekiz renk, iki temada da aynı: bir renk her ekranda aynı anlama gelir.
     Renkler yalnızca tonla değil açıklıkla da ayrılır (L* 30 → 88, adımlar 7-10):
     renk ayırt edemeyen biri de iki etiketi gri tonundan ayırır. Her rengin yazısı
     en az 4.5:1 kontrastlı (koyu yazı açık renklerde, beyaz yazı koyularda).
     İnce halka (--lb-ring), açık rengin açık zeminde, koyu rengin koyu zeminde
     kaybolmaması için. */
  :root { --lb-ring: rgba(255,255,255,.16); }
  :root[data-theme="light"] { --lb-ring: rgba(31,45,61,.24); }
  .lb-YELLOW { --lb: #F7DC5C; --lb-ink: #0A0C10; }   /* L* 88 · 14.3:1 */
  .lb-SKY    { --lb: #8AD3F2; --lb-ink: #0A0C10; }   /* L* 81 · 11.8:1 */
  .lb-GREEN  { --lb: #5CC88A; --lb-ink: #0A0C10; }   /* L* 73 ·  9.4:1 */
  .lb-ORANGE { --lb: #E6852F; --lb-ink: #0A0C10; }   /* L* 65 ·  7.2:1 */
  .lb-PINK   { --lb: #D25A92; --lb-ink: #0A0C10; }   /* L* 55 ·  5.2:1 */
  .lb-RED    { --lb: #C83A34; --lb-ink: #FFFFFF; }   /* L* 46 ·  5.1:1 */
  .lb-PURPLE { --lb: #673BBA; --lb-ink: #FFFFFF; }   /* L* 37 ·  7.2:1 */
  .lb-BLUE   { --lb: #1D438C; --lb-ink: #FFFFFF; }   /* L* 30 ·  9.4:1 */
  .lb { display: inline-flex; align-items: center; flex: none; min-width: 0; max-width: 100%; height: 22px; padding: 0 9px;
        border-radius: 5px; background: var(--lb); color: var(--lb-ink); box-shadow: inset 0 0 0 1px var(--lb-ring);
        font-size: 12px; font-weight: 650; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb.blank { width: 40px; padding: 0; }
  /* Kartın yüzü sıkışık kalsın: adlı etiket küçük bir çip, adsız etiket kısa bir çubuk. */
  .card .lbls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 6px; }
  .card .lbls .lb { height: 16px; padding: 0 6px; font-size: 10.5px; border-radius: 4px; max-width: 132px; }
  .card .lbls .lb.blank { width: 28px; height: 7px; padding: 0; border-radius: 4px; }
  .card .cmeta .badge.ck-all { background: var(--ok-soft); color: var(--ok-ink); }

  /* Kart penceresindeki etiket satırı ve seçici */
  .fld > .fld-l { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
                  color: var(--ink-3); margin-bottom: 5px; }
  .lbl-fld { position: relative; }
  .lbl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 26px; }
  .lbl-row .lb { height: 24px; font-size: 12.5px; border-radius: 6px; max-width: 220px; }
  .lbl-row .lb.blank { width: 44px; }
  .lbl-add { height: 24px; min-width: 26px; padding: 0 8px; border-radius: 6px; border: 1px dashed var(--bd-2); background: transparent;
             color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 550; }
  .lbl-add:hover, .lbl-add[aria-expanded="true"] { border-color: var(--acc); color: var(--acc-ink); }
  .lbl-add:focus-visible, .lpop button:focus-visible, .ck button:focus-visible, .cks button:focus-visible {
    outline: 2px solid var(--acc); outline-offset: 1px; }
  .lpop { width: 300px; max-width: calc(100vw - 32px); padding: 8px; }
  .lbl-fld > .lpop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 8; background: var(--raised); border: 1px solid var(--bd-2);
                     border-radius: 12px; box-shadow: 0 12px 34px rgba(var(--sh-rgb),.22); animation: cbIn 160ms ease; }
  .lpop .field { padding: 7px 10px; font-size: 13px; }
  .lpop-list { max-height: 264px; overflow-y: auto; margin-top: 6px; }
  .lpop-row { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 7px; }
  .lpop-row:hover { background: var(--hover-2); }
  .lpop-row label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .lpop-row input[type=checkbox] { width: 15px; height: 15px; margin: 0; flex: none; accent-color: var(--acc); cursor: pointer; }
  .lpop-row .lb { flex: 1; height: 28px; font-size: 12.5px; border-radius: 6px; }
  .lpop-row .lb.blank { width: auto; }
  .lpop-row .icon-btn { width: 28px; height: 28px; flex: none; }
  .lpop-row .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .lpop-sep { height: 1px; background: var(--sep); margin: 6px 2px; }
  .lpop-act { width: 100%; display: flex; align-items: center; gap: 7px; padding: 8px 6px; border: none; border-radius: 7px; background: none;
              color: var(--ink-2); font-size: 13px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lpop-act:hover { background: var(--hover-2); color: var(--ink); }
  .lpop-note { padding: 10px 6px 4px; font-size: 12.5px; color: var(--ink-3); }
  .lpop-h { display: flex; align-items: center; gap: 6px; padding: 0 0 8px; font-size: 13px; font-weight: 650; }
  .lpop-h .icon-btn { width: 26px; height: 26px; }
  .lpop-h .icon-btn:hover { background: var(--hover-2); color: var(--ink); }
  .lpop-prev { display: flex; padding: 12px 10px; border-radius: 8px; background: var(--input); border: 1px solid var(--bd); }
  .lpop-prev .lb { height: 26px; max-width: 100%; }
  .lpop .label { margin: 10px 0 5px; }
  .lpop fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
  .sw-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .sw { position: relative; display: block; }
  .sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .sw span { display: flex; align-items: center; justify-content: center; height: 30px; border-radius: 6px; background: var(--lb);
             color: var(--lb-ink); box-shadow: inset 0 0 0 1px var(--lb-ring); }
  .sw span svg { visibility: hidden; }
  .sw input:checked + span { box-shadow: 0 0 0 2px var(--raised), 0 0 0 4px var(--acc); }
  .sw input:checked + span svg { visibility: visible; }   /* seçili renk yalnızca halkayla değil işaretle de belli */
  .sw input:focus-visible + span { outline: 2px solid var(--acc); outline-offset: 4px; }
  .lpop-acts { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .lpop-q { margin-top: 10px; padding: 9px 10px; border-radius: 8px; background: var(--err-soft); border: 1px solid var(--err-bd);
            font-size: 12.5px; color: var(--err-ink); }
  .lpop-q .lpop-acts { margin-top: 8px; }
  .lpop-err { margin-top: 8px; font-size: 12px; color: var(--err-ink); }
  .lpop-plain { flex: 1; padding: 6px 0; font-size: 13px; color: var(--ink); }
  #flabels { display: inline-flex; align-items: center; gap: 5px; }
  #flabels svg { flex: none; }

  /* ── Kontrol listeleri ── */
  .cks { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--sep); }
  .cks-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
           text-transform: uppercase; color: var(--ink-3); min-height: 28px; }
  .cks-h .btn-ghost { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
  .ck { margin-top: 12px; }
  .ck + .ck { margin-top: 20px; }
  .ck-h { display: flex; align-items: center; gap: 6px; min-height: 30px; }
  .ck-title { flex: 1; min-width: 0; margin-left: -6px; padding: 3px 6px; border: 1px solid transparent; border-radius: 6px; background: none;
              color: var(--ink); font-size: 14px; font-weight: 650; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.ck-title:hover { background: var(--hover); }
  .ck-n { font: 500 11.5px var(--mono); color: var(--ink-3); flex: none; }
  .ck-n.all { color: var(--ok-ink); }
  .ck-tog { flex: none; padding: 3px 7px; border: none; border-radius: 6px; background: none; color: var(--ink-3); font-size: 12px; font-weight: 550; }
  .ck-tog:hover { background: var(--hover); color: var(--ink); }
  .ck-h .icon-btn { width: 26px; height: 26px; }
  .ck-h .icon-btn:hover { background: var(--err-soft); color: var(--err); }
  .ck-bar { height: 6px; margin: 4px 0 6px; border-radius: 3px; background: var(--sep); overflow: hidden; }
  .ck-bar i { display: block; height: 100%; border-radius: 3px; background: var(--acc); transition: width .25s ease; }
  .ck-bar.all i { background: var(--ok); }
  .ck-items { list-style: none; margin: 0; padding: 0; }
  .ck-it { display: flex; align-items: flex-start; gap: 8px; margin: 0 -6px; padding: 4px 6px; border-radius: 7px; }
  .ck-it:hover, .ck-it:focus-within { background: var(--hover); }
  .ck-it input[type=checkbox] { width: 16px; height: 16px; margin: 2px 0 0; flex: none; accent-color: var(--ok); cursor: pointer; }
  .ck-it input[type=checkbox]:disabled { cursor: default; }
  .ck-grip { flex: none; width: 12px; margin-top: 3px; color: var(--ink-4); cursor: grab; display: inline-flex; }
  .ck-tx { flex: 1; min-width: 0; padding: 0; border: none; background: none; color: var(--ink); font-size: 13.5px; line-height: 1.45;
           text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
  button.ck-tx { cursor: text; }
  .ck-it.done .ck-tx { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-4); }
  .ck-acts { display: flex; gap: 2px; flex: none; opacity: 0; }
  .ck-it:hover .ck-acts, .ck-it:focus-within .ck-acts { opacity: 1; }
  @media (hover: none) { .ck-acts { opacity: 1; } }
  .ck-acts .icon-btn { width: 24px; height: 24px; }
  .ck-acts .icon-btn:hover { background: var(--hover-2); color: var(--ink); }
  .ck-acts .icon-btn.danger:hover { background: var(--err-soft); color: var(--err); }
  .ck-acts .icon-btn:disabled { opacity: .35; cursor: default; background: none; }
  .ck-it.ck-ghost { background: var(--acc-soft); outline: 1.5px dashed var(--acc); }
  .ck-it.ck-ghost > * { visibility: hidden; }
  .ck-it.sortable-fallback { rotate: 0deg; background: var(--raised); border: 1px solid var(--bd-2); }
  .ck-note { padding: 4px 0 2px; font-size: 12.5px; color: var(--ink-3); }
  .ck-form { margin-top: 6px; }
  .ck-form .field { padding: 7px 10px; font-size: 13.5px; }
  .ck-it .ck-form { flex: 1; min-width: 0; margin-top: 0; }
  .ck-form .r { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .ck-add { margin: 2px 0 0 -6px; padding: 6px; border: none; border-radius: 7px; background: none; color: var(--ink-2); font-size: 13px;
            display: inline-flex; align-items: center; gap: 6px; }
  .ck-add:hover { background: var(--hover); color: var(--ink); }
  .ck-q { margin-top: 8px; padding: 9px 11px; border-radius: 8px; background: var(--err-soft); border: 1px solid var(--err-bd);
          font-size: 12.5px; color: var(--err-ink); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ck-q .sp { flex: 1; min-width: 160px; }

  /* ── Kanal bildirimleri (Slack, Teams, Discord; ADR 0023) ─────────── */
  .modal.hk { width: 600px; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); overflow-y: auto; }
  .hk-warn { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 14px; padding: 8px 11px; border-radius: 8px;
             background: var(--warn-soft); color: var(--warn-ink); font-size: 12.5px; line-height: 1.45; }
  .hk-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--bd); border-radius: 11px; }
  .hk-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid var(--sep); }
  .hk-row:last-child { border-bottom: none; }
  .hk-row.editing { background: var(--hover); }
  .hk-ico { width: 30px; height: 30px; border-radius: 8px; flex: none; display: inline-flex; align-items: center; justify-content: center;
            color: #fff; font: 800 14px/1 var(--font); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .hk-ico.sm { width: 20px; height: 20px; border-radius: 6px; font-size: 11px; }
  .hk-ico.SLACK { background: #4A154B; }
  .hk-ico.TEAMS { background: #5B5FC7; }
  .hk-ico.DISCORD { background: #5865F2; }
  .hk-main { flex: 1; min-width: 0; }
  .hk-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hk-top b { font-size: 13.5px; font-weight: 640; overflow-wrap: anywhere; }
  .hk-hint { font: 500 11.5px var(--mono); color: var(--ink-3); }
  .hk-st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; }
  .hk-st i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .hk-st.on { color: var(--ok-ink); }
  .hk-st.warn { color: var(--warn-ink); }
  .hk-st.off { color: var(--err-ink); }
  .hk-ev { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .hk-meta { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
  .hk-why { margin-top: 6px; font-size: 12.5px; line-height: 1.45; color: var(--err-ink); }
  .hk-reopen { margin-top: 8px; }
  .hk-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; max-width: 236px; }
  .hk-acts .q { font-size: 12.5px; color: var(--ink-2); }
  .hk-empty { padding: 18px 12px; border: 1px dashed var(--bd-2); border-radius: 11px; text-align: center; font-size: 13px; color: var(--ink-3); }
  .hk-off { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--bd); border-radius: 11px;
            background: var(--raised); font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .hk-off b { display: block; margin-bottom: 2px; color: var(--ink); font-weight: 650; }
  .hk-off .btn-ghost { margin-top: 8px; }
  .hk-add { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .hk-full { margin: 12px 0 0; }
  .hk-form { margin-top: 14px; padding: 14px 16px 16px; border: 1px solid var(--bd); border-radius: 11px; background: var(--raised); }
  .hk-form h4 { margin: 0 0 2px; font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
  .hk-seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .hk-seg label { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px 6px 7px; border: 1px solid var(--bd);
                  border-radius: 9px; background: var(--card); font-size: 13px; font-weight: 550; cursor: pointer; }
  .hk-seg label:hover { border-color: var(--bd-2); }
  .hk-seg label.on { border-color: var(--acc); background: var(--acc-soft); }
  .hk-seg label:focus-within { outline: 2px solid var(--acc); outline-offset: 1px; }
  .hk-seg label:has(input:disabled) { cursor: default; }
  .hk-seg label:has(input:disabled):not(.on) { opacity: .45; }
  .hk-seg input { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
  .hk-url { font-family: var(--mono); font-size: 12.5px; }
  .hk-guide { margin-top: 10px; font-size: 13px; }
  .hk-guide summary { width: fit-content; cursor: pointer; color: var(--acc-ink); font-weight: 600; }
  .hk-guide summary:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
  .hk-guide ol { margin: 8px 0 2px; padding-left: 20px; line-height: 1.6; color: var(--ink-2); }
  .hk-guide b { color: var(--ink); font-weight: 600; }
  .hk-two { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 0 12px; }
  .hk-checks { margin: 0; padding: 0; border: none; min-width: 0; }
  .hk-checks legend { padding: 0; }
  .hk-check { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 13px; cursor: pointer; }
  .hk-check input { width: 15px; height: 15px; margin: 0; flex: none; accent-color: var(--acc); }
  .hk-check small { font-size: 12px; color: var(--ink-3); }
  .hk-note { margin-top: 12px; padding: 8px 11px; border-radius: 8px; font-size: 12.5px; line-height: 1.45; }
  .hk-note:empty { display: none; }
  .hk-note.ok { background: var(--ok-soft); color: var(--ok-ink); border: 1px solid var(--ok-bd); }
  .hk-note.err { background: var(--err-soft); color: var(--err-ink); border: 1px solid var(--err-bd); }
  .hk-note small { margin-left: 6px; font: 500 11px var(--mono); opacity: .85; }
  .hk-form .acts { flex-wrap: wrap; margin-top: 14px; }
  .notif-sys { width: 32px; height: 32px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
               background: var(--warn-soft); color: var(--warn-ink); }
  @media (max-width: 640px) {
    .modal.hk { padding: 16px; }
    .hk-row { flex-wrap: wrap; padding: 12px; }
    .hk-acts { max-width: none; width: 100%; justify-content: flex-start; padding-left: 42px; }
    .hk-form { padding: 12px; }
    .hk-two { grid-template-columns: minmax(0, 1fr); }
  }

  /* ── 7) Bildirimler ─────────────────────────────────────────────────── */
  #toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 9px; z-index: 70; }
  .toast { display: flex; gap: 9px; max-width: 360px; background: var(--raised); border: 1px solid var(--bd); border-radius: 10px; padding: 11px 12px;
           box-shadow: 0 8px 26px rgba(var(--sh-rgb),.16); animation: cbToast 200ms ease; border-left: 3px solid var(--acc); }
  .toast i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); flex: none; margin-top: 5px; }
  .toast.err { border-left-color: var(--err); } .toast.err i.dot { background: var(--err); }
  .toast.ok { border-left-color: var(--ok); } .toast.ok i.dot { background: var(--ok); }
  .toast.warn { border-left-color: var(--warn); } .toast.warn i.dot { background: var(--warn); }

  /* E-posta doğrulama ekranı */
  .verify-ico { width: 46px; height: 46px; border-radius: 13px; background: var(--acc-soft);
                display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .verify-mail { font-weight: 650; color: var(--ink); word-break: break-all; }
  .verify-steps { margin: 18px 0 0; padding: 0 0 0 18px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .auth-ok { display: flex; gap: 8px; align-items: flex-start; background: var(--ok-soft);
             border: 1px solid var(--ok-bd); color: var(--ok-ink); border-radius: 9px;
             padding: 9px 11px; font-size: 12.5px; line-height: 1.45; margin-bottom: 14px; }
  .toast b { display: block; font-size: 13px; font-weight: 620; }
  .toast span { font-size: 12.5px; color: var(--ink-2); }
  .toast span.mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

  /* ── Profil fotoğrafı: görsel yüklenemezse alttaki baş harfler görünür ── */
  .av-wrap { position: relative; display: inline-flex; flex: none; border-radius: 50%; }
  .av-wrap > img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  /* ── Üst çubuk: zil, tema, kullanıcı menüsü ────────────────────────── */
  .tb-btn { position: relative; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--bd); background: transparent;
            color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .tb-btn:hover { border-color: var(--bd-2); color: var(--ink); background: var(--hover); }
  .bell-count { position: absolute; top: -6px; right: -7px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
                background: var(--acc); color: var(--on-acc); font-size: 10.5px; font-weight: 800; display: flex;
                align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--panel); }
  .user-btn { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--bd); border-radius: 999px;
              padding: 3px 9px 3px 3px; color: var(--ink); font-size: 13px; font-weight: 600; max-width: 180px; }
  .user-btn:hover { background: var(--hover); border-color: var(--bd-2); }
  .user-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-btn > svg { color: var(--ink-3); flex: none; }
  .pop { position: fixed; z-index: 60; background: var(--raised); border: 1px solid var(--bd); border-radius: 12px;
         box-shadow: 0 12px 34px rgba(var(--sh-rgb),.18); animation: cbIn 160ms ease; }
  .menu-pop { width: 248px; padding: 6px; }
  .menu-id { display: flex; gap: 10px; align-items: center; padding: 9px 9px 11px; border-bottom: 1px solid var(--sep); margin-bottom: 5px; }
  .menu-id b { display: block; font-size: 13.5px; font-weight: 620; }
  .menu-id small { display: block; font-size: 11.5px; color: var(--ink-3); word-break: break-all; }
  .menu-item { width: 100%; display: flex; align-items: center; gap: 9px; background: none; border: none; border-radius: 7px;
               padding: 8px 9px; font-size: 13px; color: var(--ink); text-align: left; }

/* ── Kart anahtarı (ADR 0021) ──
 * STR-42: kartın kimliğinden türer, kart taşınsa da değişmez. Sunucudaki karşılığı
 * CardKey.java; dal adının kuralı ikisinde aynı, aynı örneklerle sınanıyor. */
const CARD_KEY_PREFIX = "STR";
const cardKey = (id) => `${CARD_KEY_PREFIX}-${id}`;
/** "STR-42", "str-42", "STR 42", "#42", "42" → 42; anahtar değilse null. */
const CARD_KEY_RE = new RegExp(`^(?:${CARD_KEY_PREFIX}\\s*-?\\s*|#)?0*(\\d{1,15})$`, "i");
function parseCardKey(text) {
  const m = CARD_KEY_RE.exec(String(text ?? "").trim());
  const id = m ? Number(m[1]) : 0;
  return id > 0 ? id : null;
}
const TR_LATIN = { ç: "c", Ç: "c", ğ: "g", Ğ: "g", ı: "i", İ: "i", ö: "o", Ö: "o", ş: "s", Ş: "s", ü: "u", Ü: "u" };
/** Başlığın dal adına uygun hâli: Türkçe harfler Latin, diğer aksanlar atılır, en fazla 40 karakter, kelime ortasından kesilmez. */
function cardSlug(title) {
  let s = String(title ?? "").replace(/[çÇğĞıİöÖşŞüÜ]/g, (c) => TR_LATIN[c])
    .normalize("NFD").replace(/\p{M}+/gu, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  if (s.length > 40) {
    const cut = s.lastIndexOf("-", 40);
    s = s.slice(0, cut > 0 ? cut : 40).replace(/-+$/, "");
  }
  return s;
}
/** "str-42-odeme-sayfasi"; başlıktan slug çıkmazsa yalnızca "str-42". */

/** Metni kopyalar (clipboard). Clipboard API yoksa (http) eski yoldan; odak yerinde kalır. */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) { /* aşağıdaki yol */ }
  const back = document.activeElement;
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:-9999px;opacity:0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
  ta.remove(); back?.focus?.();
  return ok;
}
/** Kopyalar ve kopyalananı bildirimde gösterir. */
async function copyAndConfirm(text, titleKey) {
  if (await copyText(text)) toast(t(titleKey), text, "ok").querySelector("span")?.classList.add("mono");

}

/**
 * Son tarihin aciliyeti. Gün farkı üzerinden: geçmişse "over", bugün/yarınsa
 * "soon". Saat bilgisi olmadığı için karşılaştırma gün başına normalize edilir.
 */
function dueState(iso) {
  if (!iso) return "";
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(iso + "T00:00:00");
  const days = Math.round((due - today) / 86400000);
  if (days < 0) return "due-over";
  if (days <= 1) return "due-soon";
  return "";
}
function dueLabel(iso) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(iso + "T00:00:00");
  const days = Math.round((due - today) / 86400000);
  if (days === 0) return t("time.today");
  if (days === 1) return t("time.tomorrow");
  if (days === -1) return t("time.yesterday");
  if (days < 0) return t("time.daysLate", { count: -days });
  return fmtDate(due, { day: "numeric", month: "short" });
}

function avatar(name, size = 26, extra = "", url = null) {
  const box = url ? "width:100%;height:100%" : `width:${size}px;height:${size}px`;
  const letters = `<div class="avatar" style="${box};font-size:${Math.round(size * .38)}px;background:${colorOf(name)};${url ? "" : extra}">${esc(initials(name))}</div>`;
  if (!url) return letters;
  // Baş harfler altta durur: fotoğraf yüklenemezse (silinmiş, ağ hatası) img kendini kaldırır.
  return `<span class="av-wrap" style="width:${size}px;height:${size}px;${extra}">${letters}<img src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
}

      <input class="field" id="pw" type="password" autocomplete="${reg ? "new-password" : "current-password"}" placeholder="${t(reg ? "common.minPassword" : "auth.passwordPh")}" value="${esc(S.form.pw)}">
      ${reg ? `<div class="hint">${t("common.minPassword")}</div>`
            : `<div class="hint" style="text-align:right;margin-top:8px"><a id="forgotLink" style="color:var(--acc-ink);cursor:pointer;font-weight:600">${t("auth.forgot")}</a></div>`}
      ${S.authOk ? `<div class="auth-ok">${I.warnCircle}<span>${esc(msg(S.authOk))}</span></div>` : ""}
      ${S.authError ? `<div class="auth-err">${I.warnCircle}<span>${esc(msg(S.authError))}</span></div>` : ""}
      ${S.showResend ? `<div class="hint" style="margin:-6px 0 12px">${t("auth.resendPrompt")} <a id="resendLink" style="color:var(--acc-ink);cursor:pointer;font-weight:600">${t("auth.resendLink")}</a></div>` : ""}
      <button class="btn btn-primary auth-submit" id="go" ${S.busy ? "disabled" : ""}>
        ${S.busy ? `<span class="spin"></span>` : ""}${t(reg ? "common.signUp" : "common.signIn")}
      </button>
      <div class="auth-switch">${t(reg ? "auth.haveAccount" : "auth.noAccount")} <a id="sw">${t(reg ? "common.signIn" : "common.signUp")}</a></div>
    </div>`}</div>
    </main>
  </div>`;
  $("toLanding").onclick = showLanding;

  if (S.authMode === "forgot") {
    const go = () => submitForgot();
    $("fgo").onclick = go;
    $("fem").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    $("toLogin").onclick = backToLogin;
    $("fem").focus();
    return;
  }
  if (S.authMode === "forgot-sent") {
    $("toLogin").onclick = backToLogin;
    return;
  }
  if (S.authMode === "reset") {
    const go = () => submitReset();
    $("rgo").onclick = go;
    ["np", "np2"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") go(); }));
    $("toLogin").onclick = () => { S.resetToken = ""; backToLogin(); };
    $("np").focus();
    return;
  }

  if (S.authMode === "sent") {
    $("resend").onclick = resendVerification;
    $("toLogin").onclick = () => { S.authMode = "login"; S.authError = ""; renderAuth(); };
    return;
  }

  $("googleBtn")?.addEventListener("click", (e) => {
    e.currentTarget.disabled = true;
    // Analitik açıksa: Google düğmesine basıldı (kayıt mı giriş mi ekranı). Kişiye ait bir şey gitmez.
    track("signup-google", { screen: reg ? "register" : "login" });
    // Tam sayfa yönlendirme: Google'ın onay ekranı açılır, dönüşte start() karşılar.
    location.href = "/oauth2/authorization/google";
  });
  $("sw").onclick = () => { S.authMode = reg ? "login" : "register"; S.authError = ""; S.authOk = ""; S.showResend = false; renderAuth(); };
  $("go").onclick = submitAuth;
  $("resendLink")?.addEventListener("click", resendVerification);
  $("forgotLink")?.addEventListener("click", () => {
    S.pendingEmail = $("em").value.trim();   // yazdığı adresi kaybetmesin
    S.authMode = "forgot"; S.authError = ""; S.authOk = ""; S.showResend = false;
    renderAuth();
  });
  ["em", "pw", "fn", "ln"].forEach((id) => {
    const el = $(id); if (!el) return;
    el.addEventListener("input", () => { S.form[id] = el.value; });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); });
  });
  ($("fn") || $("em")).focus();
}

function backToLogin() {

async function submitForgot() {
  const email = $("fem").value.trim();
  if (!email) { S.authError = msgKey("auth.err.emailRequired"); return renderAuth(); }
  S.busy = true; S.authError = ""; S.pendingEmail = email; renderAuth();
  try {
    await api.forgotPassword(email);
    S.authMode = "forgot-sent";
  } catch (e) {
    S.authError = e.message || msgKey("auth.err.sendFailed");
  }
  S.busy = false;
  renderAuth();
}

async function submitReset() {
  const pw = $("np").value, pw2 = $("np2").value;
  // İki alan: şifre gizli yazıldığı için tek alanda yapılan yazım hatası
  // kullanıcıyı kendi hesabının dışında bırakırdı.
  if (pw.length < 8) { S.authError = msgKey("auth.err.passwordShortDot"); return renderAuth(); }
  if (pw !== pw2) { S.authError = msgKey("auth.err.passwordMismatch"); return renderAuth(); }

  S.busy = true; S.authError = ""; renderAuth();
  try {
    const r = await api.resetPassword(S.resetToken, pw);
    S.resetToken = ""; S.authMode = "login"; S.authOk = r.message;
  } catch (e) {
    S.authError = e.message || msgKey("auth.err.resetFailed");
  }
  S.busy = false;
  renderAuth();
}
