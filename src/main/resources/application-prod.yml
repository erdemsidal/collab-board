# ═══════════════════════════════════════════════════════════
# PROD Profile — Production ortamı
# ═══════════════════════════════════════════════════════════

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    clean-disabled: true   # ASLA production'da clean yapma

logging:
  level:
    root: WARN
    com.collabboard: INFO
    # Hangi migration'ın canlı veritabanına uygulandığı görünsün — bir yayın
    # bozulduğunda ilk sorulan soru bu.
    org.flywaydb: INFO
    org.springframework.security: WARN

# Dışarıya yalnızca sağlık kontrolü açık. Metrikler sunucunun iç yapısını
# (bellek, istek sayıları, sürümler) anlatır; herkese açık durmamalı. Yerelde
# (dev) açık kalır — geliştirirken işe yarar.
management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger kapalı — production'da API docs expose etme
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Sentry production'da tam performans
sentry:
  traces-sample-rate: 0.2   # Production'da %20 sampling yeterli
