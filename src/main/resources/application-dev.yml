# ═══════════════════════════════════════════════════════════
# DEV Profile — Geliştirme ortamı
# ═══════════════════════════════════════════════════════════

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    clean-disabled: false   # Dev'de clean kullanılabilir

logging:
  level:
    root: INFO
    com.collabboard: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Yerelde metrikler tarayıcıdan bakılabilsin. Ortak ayar (application.yml)
# dışarıya yalnızca /actuator/health'i açar; profil unutulsa da kapalı kalsın diye.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches

# Swagger yalnızca bu profilde açık (ortak ayarda kapalı).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
