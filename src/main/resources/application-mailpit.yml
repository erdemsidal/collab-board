# ═══════════════════════════════════════════════════════════
# MAILPIT Profile — yerel posta yakalayıcı
#
# GERÇEK POSTA GÖNDERMEZ. Uygulamanın yolladığı her postayı yakalar ve
# Mailpit'in web arayüzünde (varsayılan http://localhost:8025) gösterir.
#
# Bu profil uygulamayı Docker DIŞINDA, kendi makinende çalıştırırken
# kullanılır:
#   .\scripts\dev.ps1 up -InfraOnly     (Postgres, Redis, Mailpit; komutu yazar)
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,mailpit
#
# Uygulama Docker'da çalışırken bu profil gerekmez; aynı işi
# docker/posta-mailpit.env yapar. Ayrıntı: docs/GELISTIRME-ORTAMI.md
# ═══════════════════════════════════════════════════════════

spring:
  mail:
    host: ${MAILPIT_HOST:localhost}
    # -InfraOnly ikinci bir kopya için farklı bir kapı açabilir; betik söyler.
    port: ${MAILPIT_SMTP_PORT:1025}
    # Mailpit kimlik sormaz. Ad yalnızca açılıştaki posta denetimi
    # "ayar eksik" uyarısı vermesin diye dolu.
    username: dev@sturnio.local
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false

app:
  mail:
    # .env'de MAIL_PROVIDER=brevo yazsa bile bu profilde posta Mailpit'e gider.
    provider: smtp
    from: Sturnio <dev@sturnio.local>
