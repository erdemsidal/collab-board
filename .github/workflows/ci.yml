name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════
  # Test — Birim + Entegrasyon testleri
  #
  # Ayrı Postgres/Redis servisi AÇILMIYOR: testler Testcontainers ile kendi
  # konteynerlerini başlatıyor ve adreslerini çalışma anında Spring'e veriyor
  # (IntegrationTestBase). Runner'da Docker zaten var; bu yeterli.
  #
  # JWT_SECRET VERİLMİYOR: application.yml'deki geliştirme anahtarı geçerli bir
  # Base64 değeri ve dev profilinde yalnızca uyarı üretir. Buraya elle yazılan
  # anahtar geçerli Base64 olmadığı için uygulama hiç açılmıyordu — bu iş
  # uzun süre bu yüzden kırmızıydı.
  # ═══════════════════════════════════════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🧪 Run Tests
        run: mvn verify -B --no-transfer-progress

      - name: 📊 Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # ═══════════════════════════════════════════
  # Build — JAR + Docker imajı
  # ═══════════════════════════════════════════
  build:
    name: 🏗️ Build
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 📦 Build JAR
        run: mvn package -DskipTests -B --no-transfer-progress

      - name: 🐳 Login to Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & Push Docker Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Deploy işi bilerek YOK. Önceki hâli yalnızca bir echo çalıştırıp yeşil
  # yanıyordu — hiçbir şey dağıtılmadığı hâlde "deploy başarılı" görünüyordu.
  # Barındırma platformu seçilince gerçek adım buraya eklenecek.
